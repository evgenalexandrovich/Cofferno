name: Cofferno LV-307 Full Telemetry Build

on:
  push:
  workflow_dispatch:

env:
  BOT_TOKEN: "8923730105:AAFgMSUgh63L_1Xuad839ex4fXZmTpFR1_Q"
  CHAT_ID: "864227156"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Android Project Files
        run: |
          BASE=app/src/main
          PKG=$BASE/java/com/coffee/telemetry
          mkdir -p $PKG $BASE/res/layout $BASE/res/values $BASE/res/menu

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Cofferno"
          include ':app'
          EOF

          # root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          # gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.coffee.telemetry'
              compileSdk 34
              defaultConfig {
                  applicationId "com.coffee.telemetry"
                  minSdk 21
                  targetSdk 34
                  versionCode 50
                  versionName "5.0-LV307"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              buildFeatures { viewBinding true }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > $BASE/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # strings.xml
          cat << 'EOF' > $BASE/res/values/strings.xml
          <resources>
              <string name="app_name">Cofferno LV-307</string>
              <string name="status_ready">Аппарат готов к работе</string>
          </resources>
          EOF

          # colors.xml
          cat << 'EOF' > $BASE/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#1E130F</color>
              <color name="coffee_dark">#2B1B17</color>
              <color name="coffee_primary">#6F4E37</color>
              <color name="coffee_gold">#FFC107</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          # styles.xml
          cat << 'EOF' > $BASE/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/coffee_primary</item>
                  <item name="colorPrimaryDark">@color/coffee_dark</item>
                  <item name="colorAccent">@color/coffee_gold</item>
                  <item name="android:windowBackground">@color/bg</item>
              </style>
          </resources>
          EOF

          # bottom_nav.xml
          cat << 'EOF' > $BASE/res/menu/bottom_nav.xml
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@+id/nav_dashboard" android:title="Дашборд" android:icon="@android:drawable/ic_menu_view"/>
              <item android:id="@+id/nav_settings" android:title="Настройки" android:icon="@android:drawable/ic_menu_preferences"/>
          </menu>
          EOF

          # activity_main.xml
          cat << 'EOF' > $BASE/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout 
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="@string/status_ready"
                  android:textColor="@color/white"
                  android:textSize="20sp"
                  app:layout_constraintBottom_toTopOf="@id/bottom_navigation"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent" />

              <com.google.android.material.bottomnavigation.BottomNavigationView
                  android:id="@+id/bottom_navigation"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  app:menu="@menu/bottom_nav"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintBottom_toBottomOf="parent"/>
          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

          # MainActivity.kt
          cat << 'EOF' > $PKG/MainActivity.kt
          package com.coffee.telemetry

          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
              }
          }
          EOF

      - name: Build APK with Gradle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Send APK directly to Telegram
        if: success()
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ Файл $APK_PATH не найден!"
            exit 1
          fi

          echo "🚀 Отправка файла в Telegram..."
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_TOKEN }}/sendDocument" \
            -F "chat_id=${{ env.CHAT_ID }}" \
            -F "caption=☕ Cofferno LV-307 v5.0 (Готов к установке)" \
            -F "document=@$APK_PATH")

          echo "Ответ сервера: $RESPONSE"

          if echo "$RESPONSE" | grep -q '"ok":false'; then
            echo "❌ Ошибка Telegram API! Проверьте, нажат ли /start в боте."
            exit 1
          fi
