name: Build Cofferno App

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Start
        run: |
          curl -s -X POST "https://api.telegram.org/bot8923730105:AAGxhDICR3BtkaKeDOo2WiZE3OrdS_qiYk4/sendMessage" \
            -d "chat_id=864227156" \
            -d "text=☕ Собираю обновленный Cofferno с новой иконкой! Ожидайте около 1.5-2 минут..."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/coffee/telemetry
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # 1. Settings
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Cofferno"
          include ':app'
          EOF

          # 2. Build scripts
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.coffee.telemetry'
              compileSdk 34

              defaultConfig {
                  applicationId "com.coffee.telemetry"
                  minSdk 21
                  targetSdk 34
                  versionCode 4
                  versionName "4.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.google.code.gson:gson:2.10.1'
              implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
          }
          EOF

          # 3. Resources (Strings & Colors)
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Cofferno</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="coffee_dark">#3E2723</color>
              <color name="coffee_gold">#FFC107</color>
              <color name="coffee_primary">#6F4E37</color>
          </resources>
          EOF

          # 4. Premium Icon Foreground Vector
          cat << 'EOF' > app/src/main/res/drawable/ic_cofferno_fg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFC107"
                  android:pathData="M34,46 v22 c0,8 8,14 16,14 h8 c8,0 16,-6 16,-14 V46 H34 z" />
              <path
                  android:strokeColor="#FFC107"
                  android:strokeWidth="4"
                  android:fillColor="#00000000"
                  android:pathData="M74,52 h6 c4,0 7,3 7,7 c0,4 -3,7 -7,7 h-6" />
              <path
                  android:strokeColor="#FFF8E1"
                  android:strokeWidth="3"
                  android:strokeLineCap="round"
                  android:fillColor="#00000000"
                  android:pathData="M44,38 c-2,-4 2,-8 0,-12" />
              <path
                  android:strokeColor="#FFF8E1"
                  android:strokeWidth="3"
                  android:strokeLineCap="round"
                  android:fillColor="#00000000"
                  android:pathData="M54,36 c-2,-4 2,-8 0,-12" />
              <path
                  android:strokeColor="#FFF8E1"
                  android:strokeWidth="3"
                  android:strokeLineCap="round"
                  android:fillColor="#00000000"
                  android:pathData="M64,38 c-2,-4 2,-8 0,-12" />
          </vector>
          EOF

          # 5. Adaptive Icon Configs
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/coffee_dark"/>
              <foreground android:drawable="@drawable/ic_cofferno_fg"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/coffee_dark"/>
              <foreground android:drawable="@drawable/ic_cofferno_fg"/>
          </adaptive-icon>
          EOF

          # 6. AndroidManifest
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. MainActivity
          cat << 'EOF' > app/src/main/java/com/coffee/telemetry/MainActivity.kt
          package com.coffee.telemetry

          import android.graphics.Color
          import android.graphics.Typeface
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(60, 100, 60, 60)
                      setBackgroundColor(Color.parseColor("#F5F0EB"))
                  }

                  val title = TextView(this).apply {
                      text = "☕ Cofferno"
                      textSize = 32f
                      setTextColor(Color.parseColor("#3E2723"))
                      gravity = Gravity.CENTER
                      setTypeface(null, Typeface.BOLD)
                  }

                  val subtitle = TextView(this).apply {
                      text = "\nСистема телеметрии & управления кофемашинами LV307\n\nВерсия 4.0 (Cofferno)"
                      textSize = 15f
                      setTextColor(Color.DKGRAY)
                      gravity = Gravity.CENTER
                  }

                  val btn = Button(this).apply {
                      text = "ОТКРЫТЬ ПУЛЬТ ОПЕРАТОРА"
                      setBackgroundColor(Color.parseColor("#6F4E37"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          Toast.makeText(this@MainActivity, "Cofferno подключено!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  root.addView(title)
                  root.addView(subtitle)
                  root.addView(btn)

                  setContentView(root)
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt

      - name: Send APK to Telegram
        if: success()
        run: |
          curl -F chat_id="864227156" \
               -F document=@app/build/outputs/apk/debug/app-debug.apk \
               -F caption="☕ Cofferno v4.0 с новой премиум-иконкой готова к установке!" \
               https://api.telegram.org/bot8923730105:AAGxhDICR3BtkaKeDOo2WiZE3OrdS_qiYk4/sendDocument

      - name: Send Error Telegram
        if: failure()
        run: |
          ERR_LINE=$(grep -i -E "error|failure|e:" build_log.txt | head -n 5 | tr '\n' ' ' | tr -d '"')
          curl -s -X POST "https://api.telegram.org/bot8923730105:AAGxhDICR3BtkaKeDOo2WiZE3OrdS_qiYk4/sendMessage" \
            -d "chat_id=864227156" \
            -d "text=❌ Ошибка сборки: $ERR_LINE"
