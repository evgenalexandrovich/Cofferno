          import com.google.gson.reflect.TypeToken
          import org.eclipse.paho.client.mqttv3.*
          import org.eclipse.paho.client.mqttv3.persist.MemoryPersistence
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.util.UUID
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit
          class AgentService : Service() {
              private var client: MqttClient? = null
              private var brokerIdx = 0
              private val brokers = arrayOf(Constants.MQTT_BROKER, Constants.MQTT_BROKER_FALLBACK)
              private val gson = Gson()
              private var wakeLock: PowerManager.WakeLock? = null
              private var sched: java.util.concurrent.ScheduledExecutorService? = null
              private val loopExecutor = Executors.newSingleThreadExecutor()
              private val logcatExecutor = Executors.newSingleThreadExecutor()
              private val commandExecutor = Executors.newCachedThreadPool()
              private var lastSaleTs = 0L
              private var pendingName = ""
              private var pendingPrice = 0
              private var pendingMetaTs = 0L
              private var lastLiveHintTs = 0L
              private val maxSaleAgeMs = 12 * 60 * 1000L
              override fun onBind(intent: Intent?): IBinder? = null
              override fun onCreate() {
                  super.onCreate()
                  val ch = "cofferno_agent"
                  if (Build.VERSION.SDK_INT >= 26)
                      getSystemService(NotificationManager::class.java)
                          ?.createNotificationChannel(NotificationChannel(ch, "Agent", NotificationManager.IMPORTANCE_LOW))
                  val n = NotificationCompat.Builder(this, ch)
                      .setContentTitle("Cofferno Agent").setContentText("MQTT+TG")
                      .setSmallIcon(R.drawable.ic_app_icon).setOngoing(true).build()
                  if (Build.VERSION.SDK_INT >= 29) startForeground(101, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  else startForeground(101, n)
                  wakeLock = (getSystemService(POWER_SERVICE) as PowerManager)
                      .newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Cofferno:W")
                  wakeLock?.acquire(86400000L)
                  migrateIds()
                  val id = LeVendingProbe.findDeviceId(this)
                  if (id.isNotBlank() && prefs().getString("custom_serial", "").isNullOrBlank())
                      prefs().edit().putString("custom_serial", id).apply()
                  if (BuildConfig.IS_AGENT || prefs().getBoolean("agent_active", false)) {
                      startSaleInterceptor(); startAgentLoop()
                  }
              }
              private fun prefs() = getSharedPreferences("cofferno_agent", MODE_PRIVATE)
              private fun migrateIds() {
                  val p = prefs()
                  val c = IdUtil.normalize(p.getString("custom_serial", ""))
                  val d = IdUtil.normalize(p.getString("levending_device_id", ""))
                  p.edit().apply {
                      if (c.isNotBlank()) putString("custom_serial", c)
                      if (d.isNotBlank()) putString("levending_device_id", d)
                  }.apply()
              }
              private fun getMachineSerial(): String {
                  IdUtil.normalize(prefs().getString("custom_serial", "")).takeIf { it.isNotBlank() }?.let { return it }
                  IdUtil.normalize(prefs().getString("levending_device_id", "")).takeIf { it.isNotBlank() }?.let { return it }
                  return IdUtil.normalize(Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID)).ifBlank { "lv307" }
              }
              private fun knownOrders() =
                  (prefs().getString("known_order_ids", "") ?: "").split(",").filter { it.isNotBlank() }.toMutableSet()
              private fun rememberOrder(id: String) {
                  if (id.isBlank()) return
                  val s = knownOrders().apply { add(id) }.toList().takeLast(500)
                  prefs().edit().putString("known_order_ids", s.joinToString(",")).apply()
              }
              private fun loadDrinks(): MutableList<DrinkItem> {
                  val j = prefs().getString("drinks_json", "") ?: return mutableListOf()
                  if (j.isEmpty()) return mutableListOf()
                  return try {
                      gson.fromJson(j, object : TypeToken<MutableList<DrinkItem>>() {}.type) ?: mutableListOf()
                  } catch (_: Exception) { mutableListOf() }
              }
              private fun saveDrinks(list: List<DrinkItem>) {
                  prefs().edit().putString("drinks_json", gson.toJson(list)).apply()
              }
              private fun registerDrinkSale(name: String, price: Int) {
                  val drinks = loadDrinks()
                  val nm = LeVendingProbe.normalizeDrinkName(name)
                  val found = drinks.firstOrNull { it.name.equals(nm, true) }
                  val fp = if (price > 0) price else (found?.price ?: 0)
                  if (found != null) { found.count++; if (fp > 0) found.price = fp }
                  else drinks.add(DrinkItem(drinks.size, nm, 1, fp, 0))
                  saveDrinks(drinks)
                  prefs().edit().putString("last_sale_name", nm).putInt("last_sale_price", fp)
                      .putLong("last_sale_at", System.currentTimeMillis()).apply()
                  sendHeartbeat()
                  val sn = getMachineSerial()
                  Thread { Telegram.send("Продажа [$sn]\n$nm — ${if (fp > 0) "$fp RUB" else "?"}") }.start()
              }
              private fun startSaleInterceptor() {
                  logcatExecutor.execute {
                      try {
                          val r = BufferedReader(InputStreamReader(Runtime.getRuntime().exec(arrayOf("logcat", "-v", "time")).inputStream))
                          while (wakeLock?.isHeld == true) {
                              val line = r.readLine() ?: break
                              val now = System.currentTimeMillis()
                              LeVendingProbe.findDeviceIdFromLogLine(line)?.let { dev ->
                                  val p = prefs()
                                  if (p.getString("levending_device_id", "") != dev)
                                      p.edit().putString("levending_device_id", dev).apply {
                                          if (IdUtil.normalize(p.getString("custom_serial", "")).isBlank()) putString("custom_serial", dev)
                                      }.apply()
                              }
                              if (LeVendingProbe.isLiveSaleHint(line)) lastLiveHintTs = now
                              if (line.contains("ZJHTTP", true) || line.contains("ylapi", true)) {
                                  val q = LeVendingProbe.parseSaleQuery(line)
                                  q.name?.let { pendingName = it; pendingMetaTs = now }
                                  q.price?.let { pendingPrice = it; pendingMetaTs = now }
                              }
                              if (!LeVendingProbe.isApiSaleSuccess(line)) continue
                              val q = LeVendingProbe.parseSaleQuery(line)
                              val oid = q.orderId ?: ""
                              if (oid.isNotBlank() && knownOrders().contains(oid)) continue
                              if (now - lastSaleTs < 8000L) continue
                              val recentLive = now - lastLiveHintTs < 90_000L
                              val dd = q.deviceDateMs
                              if (dd != null) {
                                  val age = now - dd
                                  if (age > maxSaleAgeMs && !recentLive) continue
                                  if (age < -3_600_000L) continue
                              } else if (!recentLive) continue
                              lastSaleTs = now
                              if (oid.isNotBlank()) rememberOrder(oid)
                              registerDrinkSale(q.name ?: pendingName.ifBlank { "Напиток" }, q.price ?: pendingPrice)
                          }
                      } catch (_: Exception) {}
                  }
              }
              private fun startAgentLoop() {
                  loopExecutor.execute {
                      while (wakeLock?.isHeld == true) {
                          try {
                              if (client?.isConnected != true) {
                                  try { client?.disconnect(); client?.close() } catch (_: Exception) {}
                                  val sn = getMachineSerial()
                                  val br = brokers[brokerIdx++ % brokers.size]
                                  client = MqttClient(br, "Ag" + UUID.randomUUID().toString().take(10), MemoryPersistence())
                                  client!!.connect(MqttConnectOptions().apply {
                                      isAutomaticReconnect = true; connectionTimeout = 20; keepAliveInterval = 30
                                  })
                                  client!!.subscribe("cofferno/$sn/cmd", 1)
                                  client!!.setCallback(object : MqttCallback {
                                      override fun connectionLost(c: Throwable?) {}
                                      override fun messageArrived(t: String?, m: MqttMessage?) {
                                          when (m?.toString()?.trim()) {
                                              "REQUEST_UPDATE" -> sendHeartbeat()
                                              "RESET_COUNTERS" -> {
                                                  saveDrinks(emptyList())
                                                  prefs().edit().remove("last_sale_name").remove("last_sale_price")
                                                      .remove("last_sale_at").remove("known_order_ids").apply()
                                                  sendHeartbeat()
                                                  Thread { Telegram.send("Reset counters [$sn]") }.start()
                                              }
                                              "SCAN_LOGS" -> commandExecutor.execute {
                                                  val report = LeVendingProbe.fullScan(this@AgentService)
                                                  Telegram.send("Report [$sn]\n\n$report")
                                                  try {
                                                      client?.publish("cofferno/$sn/logs",
                                                          MqttMessage(("TG ok\n" + report.take(800)).toByteArray(Charsets.UTF_8)).apply { qos = 1 })
                                                  } catch (_: Exception) {}
                                              }
                                          }
                                      }
                                      override fun deliveryComplete(t: IMqttDeliveryToken?) {}
                                  })
                                  sched?.shutdownNow()
                                  sched = Executors.newSingleThreadScheduledExecutor()
                                  sched!!.scheduleAtFixedRate({ sendHeartbeat() }, 0, 5, TimeUnit.SECONDS)
                                  Thread { Telegram.send("Agent online [$sn]") }.start()
                              }
                          } catch (_: Exception) {}
                          Thread.sleep(4000)
                      }
                  }
              }
              private fun sendHeartbeat() {
                  try {
                      val c = client ?: return
                      if (!c.isConnected) return
                      val sn = getMachineSerial()
                      val p = prefs()
                      val pkt = TelemetryPacket(
                          sn, status = "agent", drinks = loadDrinks(),
                          deviceId = IdUtil.normalize(p.getString("levending_device_id", "")),
                          lastSaleName = p.getString("last_sale_name", "") ?: "",
                          lastSalePrice = p.getInt("last_sale_price", 0),
                          lastSaleAt = p.getLong("last_sale_at", 0L)
                      )
                      c.publish("cofferno/$sn/data",
                          MqttMessage(gson.toJson(pkt).toByteArray(Charsets.UTF_8)).apply { qos = 1; isRetained = false })
                  } catch (_: Exception) {}
              }
              override fun onDestroy() {
                  sched?.shutdownNow()
                  try { client?.disconnect(); client?.close() } catch (_: Exception) {}
                  wakeLock?.release(); super.onDestroy()
              }
          }
