          package com.coffee.telemetry
          import android.content.Context
          import android.net.Uri
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.net.URLDecoder
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.regex.Pattern
          object LeVendingProbe {
              private val devicePatterns = arrayOf(
                  Pattern.compile("deviceid=([0-9]{6,18})", Pattern.CASE_INSENSITIVE),
                  Pattern.compile("deviceId=([0-9]{6,18})", Pattern.CASE_INSENSITIVE)
              )
              private val drinkPatterns = listOf(
                  Pattern.compile("(?i)двойн\\w*\\s*эспрессо") to "Двойной Эспрессо",
                  Pattern.compile("(?i)двойн\\w*\\s*американо") to "Двойной Американо",
                  Pattern.compile("(?i)флэт\\s*уайт|flat\\s*white") to "Флэт Уайт",
                  Pattern.compile("(?i)капуч+ино|cappuccino") to "Капучино",
                  Pattern.compile("(?i)латте|latte") to "Латте",
                  Pattern.compile("(?i)американо|americano") to "Американо",
                  Pattern.compile("(?i)эспрессо|espresso") to "Эспрессо",
                  Pattern.compile("(?i)флэт|флет") to "Флэт Уайт",
                  Pattern.compile("(?i)двойн") to "Двойной"
              )
              data class SaleQuery(val orderId: String?, val name: String?, val price: Int?, val deviceDateMs: Long?)
              fun findDeviceIdFromLogLine(line: String): String? {
                  for (p in devicePatterns) {
                      val m = p.matcher(line)
                      if (m.find()) return IdUtil.normalize(m.group(1))
                  }
                  return null
              }
              fun findDeviceId(context: Context): String {
                  val prefs = context.getSharedPreferences("cofferno_agent", Context.MODE_PRIVATE)
                  val saved = IdUtil.normalize(prefs.getString("levending_device_id", ""))
                  if (saved.isNotBlank()) { prefs.edit().putString("levending_device_id", saved).apply(); return saved }
                  try {
                      val p = Runtime.getRuntime().exec(arrayOf("logcat", "-d", "-t", "1000"))
                      val r = BufferedReader(InputStreamReader(p.inputStream))
                      while (true) {
                          val line = r.readLine() ?: break
                          val id = findDeviceIdFromLogLine(line) ?: continue
                          prefs.edit().putString("levending_device_id", id).apply(); return id
                      }
                  } catch (_: Exception) {}
                  return ""
              }
              fun isApiSaleSuccess(line: String): Boolean {
                  val l = line.lowercase()
                  return l.contains("vmsalesuccess") || l.contains("sendoutgoodssuccess")
              }
              fun isLiveSaleHint(line: String): Boolean {
                  val l = line.lowercase()
                  return l.contains("makedrink") || l.contains("alonedropcup") || l.contains("payactivity") || l.contains("dropcup")
              }
              fun parseSaleQuery(line: String): SaleQuery {
                  val blob = when {
                      line.contains("-->") -> line.substringAfter("-->")
                      line.contains('?') -> line.substringAfter('?')
                      else -> line
                  }
                  val map = linkedMapOf<String, String>()
                  for (part in blob.split("&")) {
                      val i = part.indexOf('=')
                      if (i <= 0) continue
                      val k = part.substring(0, i).trim().lowercase()
                      var v = part.substring(i + 1).trim()
                      try { v = URLDecoder.decode(v.replace("+", " "), "UTF-8") } catch (_: Exception) {
                          try { v = Uri.decode(v) } catch (_: Exception) {}
                      }
                      if (k.isNotEmpty() && v.isNotEmpty()) map[k] = v
                  }
                  val orderId = map["orderid"] ?: map["ordercode"]
                  val nameRaw = map["goodsname"] ?: map["productname"] ?: map["coffeename"]
                  val name = nameRaw?.let { normalizeDrinkName(it) }
                  val price = listOf("goodsprice", "saleprice", "payamount", "price", "money", "amount")
                      .firstNotNullOfOrNull { map[it]?.toDoubleOrNull()?.toInt()?.takeIf { p -> p in 10..2000 } }
                  val dd = parseDeviceDate(map["devicedate"])
                  return SaleQuery(orderId, name, price, dd)
              }
              fun parseDeviceDate(raw: String?): Long? {
                  if (raw.isNullOrBlank()) return null
                  val d = raw.filter { it.isDigit() }
                  if (d.length < 14) return null
                  return try {
                      SimpleDateFormat("yyyyMMddHHmmss", Locale.US).apply { isLenient = false }.parse(d.take(14))?.time
                  } catch (_: Exception) { null }
              }
              fun normalizeDrinkName(raw: String): String {
                  val t = raw.trim(); if (t.isEmpty()) return "Напиток"
                  for ((pat, ru) in drinkPatterns) if (pat.matcher(t).find()) return ru
                  return t.take(48)
              }
              fun fullScan(context: Context): String {
                  val t = SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.getDefault()).format(Date())
                  val sb = StringBuilder("COFFERNO 7.5.5 $t\nID: ${findDeviceId(context)}\n\n")
                  var n = 0
                  try {
                      val p = Runtime.getRuntime().exec(arrayOf("logcat", "-d", "-t", "2000", "-v", "time"))
                      val r = BufferedReader(InputStreamReader(p.inputStream))
                      while (true) {
                          val line = r.readLine() ?: break
                          if (!isApiSaleSuccess(line) && !line.contains("ZJHTTP", true)) continue
                          if (isApiSaleSuccess(line)) {
                              val q = parseSaleQuery(line)
                              sb.append("SALE ${q.name} ${q.price} order=${q.orderId}\n")
                          } else sb.append(line.take(160)).append('\n')
                          if (++n >= 30) break
                      }
                  } catch (e: Exception) { sb.append(e.message) }
                  return sb.toString()
              }
          }
