name: Build APK Diagnostic

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notify start
        run: |
          curl -s -X POST "https://api.telegram.org/bot8923730105:AAFuh0THsvEYvzQCXXtpD_e715WfIZoTaaU/sendMessage" \
            -d chat_id=864227156 \
            -d text="🚀 Диагностика: сборка запущена"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/coffee/telemetry
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LV307Telemetry"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.coffee.telemetry'
              compileSdk 34
              defaultConfig {
                  applicationId "com.coffee.telemetry"
                  minSdk 21
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_dialog_info"
                  android:label="LV307 Telemetry"
                  android:theme="@style/Theme.MaterialComponents.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".LV307Service" android:exported="false" />
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">LV307 Telemetry</string>
          </resources>
          EOF

          cat > app/src/main/java/com/coffee/telemetry/MainActivity.kt << 'EOF'
          package com.coffee.telemetry

          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.os.IBinder
          import android.text.InputType
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.*
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import org.eclipse.paho.client.mqttv3.*
          import org.eclipse.paho.client.mqttv3.persist.MemoryPersistence
          import java.text.SimpleDateFormat
          import java.util.*

          data class DrinkConfig(var name: String = "", var sellPrice: Int = 0, var costPrice: Int = 0)
          data class SaleRecord(var drink: String = "", var sellPrice: Int = 0, var costPrice: Int = 0, var ts: Long = 0L)
          data class MachineInfo(
              var serial: String = "",
              var isOnline: Boolean = false,
              var errorCode: String = "0",
              var errorMsg: String = "OK",
              var lastDrink: String = "—",
              var lastUpdate: String = "—"
          )
          data class RemoteCommand(val action: String = "", val value: Int = 0, val stringValue: String = "")

          class Storage(ctx: Context) {
              private val sp: SharedPreferences = ctx.getSharedPreferences("lv307_data", Context.MODE_PRIVATE)
              private val gson = Gson()

              fun saveUser(login: String, pass: String) {
                  sp.edit().putString("user_login", login).putString("user_pass", pass).apply()
              }
              fun getLogin(): String = sp.getString("user_login", "") ?: ""
              fun getPass(): String = sp.getString("user_pass", "") ?: ""
              fun isLoggedIn(): Boolean = getLogin().isNotEmpty()

              fun addMachine(serial: String) {
                  val list = getMachines().toMutableList()
                  if (!list.contains(serial)) {
                      list.add(serial)
                      sp.edit().putString("machines", gson.toJson(list)).apply()
                  }
              }
              fun removeMachine(serial: String) {
                  val list = getMachines().toMutableList()
                  list.remove(serial)
                  sp.edit().putString("machines", gson.toJson(list)).apply()
              }
              fun getMachines(): List<String> {
                  val json = sp.getString("machines", "[]") ?: "[]"
                  val type = object : TypeToken<ArrayList<String>>() {}.type
                  return gson.fromJson(json, type) ?: emptyList()
              }

              fun saveDrinks(serial: String, drinks: List<DrinkConfig>) {
                  sp.edit().putString("drinks_$serial", gson.toJson(drinks)).apply()
              }
              fun getDrinks(serial: String): List<DrinkConfig> {
                  val json = sp.getString("drinks_$serial", "") ?: ""
                  if (json.isEmpty()) {
                      return listOf(
                          DrinkConfig("Эспрессо", 120, 25),
                          DrinkConfig("Американо", 130, 28),
                          DrinkConfig("Капучино", 160, 35),
                          DrinkConfig("Латте", 170, 38)
                      )
                  }
                  val type = object : TypeToken<ArrayList<DrinkConfig>>() {}.type
                  return gson.fromJson(json, type) ?: emptyList()
              }

              fun addSale(serial: String, sale: SaleRecord) {
                  val list = getSales(serial).toMutableList()
                  list.add(sale)
                  sp.edit().putString("sales_$serial", gson.toJson(list)).apply()
              }
              fun getSales(serial: String): List<SaleRecord> {
                  val json = sp.getString("sales_$serial", "[]") ?: "[]"
                  val type = object : TypeToken<ArrayList<SaleRecord>>() {}.type
                  return gson.fromJson(json, type) ?: emptyList()
              }

              fun saveMachineInfo(serial: String, info: MachineInfo) {
                  sp.edit().putString("info_$serial", gson.toJson(info)).apply()
              }
              fun getMachineInfo(serial: String): MachineInfo {
                  val json = sp.getString("info_$serial", "") ?: ""
                  return if (json.isEmpty()) MachineInfo(serial = serial)
                  else gson.fromJson(json, MachineInfo::class.java)
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(ctx: Context?, intent: Intent?) {
                  if (intent?.action == Intent.ACTION_BOOT_COMPLETED) {
                      ctx?.startService(Intent(ctx, LV307Service::class.java))
                  }
              }
          }

          class LV307Service : Service() {
              private var mqtt: MqttClient? = null
              private val gson = Gson()
              private var serial = "LV307_001"
              private var data = MachineInfo()

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  serial = intent?.getStringExtra("serial") ?: "LV307_001"
                  data.serial = serial
                  connectMqtt()
                  return START_STICKY
              }

              override fun onBind(intent: Intent?): IBinder? = null

              private fun connectMqtt() {
                  Thread {
                      try {
                          val clientId = "SVC_" + serial + "_" + UUID.randomUUID().toString().take(5)
                          mqtt = MqttClient("tcp://broker.hivemq.com:1883", clientId, MemoryPersistence())
                          mqtt?.setCallback(object : MqttCallbackExtended {
                              override fun connectComplete(reconnect: Boolean, serverURI: String?) {
                                  mqtt?.subscribe("vending/$serial/commands", 1)
                                  sendTelemetry()
                              }
                              override fun connectionLost(cause: Throwable?) {}
                              override fun deliveryComplete(token: IMqttDeliveryToken?) {}
                              override fun messageArrived(topic: String?, message: MqttMessage?) {
                                  val json = String(message?.payload ?: byteArrayOf())
                                  val cmd = gson.fromJson(json, RemoteCommand::class.java)
                                  when (cmd.action) {
                                      "RESET_ERRORS" -> { data.errorCode = "0"; data.errorMsg = "OK" }
                                      "SIM_SALE" -> data.lastDrink = if (cmd.stringValue.isNotEmpty()) cmd.stringValue else "Капучино"
                                      "SIM_ERR" -> { data.errorCode = cmd.stringValue; data.errorMsg = "Ошибка " + cmd.stringValue }
                                  }
                                  sendTelemetry()
                              }
                          })
                          mqtt?.connect(MqttConnectOptions().apply {
                              isAutomaticReconnect = true
                              isCleanSession = true
                          })
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }.start()
              }

              private fun sendTelemetry() {
                  data.isOnline = true
                  data.lastUpdate = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                  Thread {
                      try {
                          val msg = MqttMessage(gson.toJson(data).toByteArray())
                          msg.qos = 1
                          mqtt?.publish("vending/$serial/telemetry", msg)
                      } catch (e: Exception) {}
                  }.start()
              }
          }

          class MainActivity : AppCompatActivity() {
              private lateinit var db: Storage
              private var mqtt: MqttClient? = null
              private val gson = Gson()
              private val colPrimary = Color.parseColor("#6F4E37")
              private val colDark = Color.parseColor("#3E2723")
              private val colAccent = Color.parseColor("#FF8F00")
              private val colGreen = Color.parseColor("#2E7D32")
              private val colRed = Color.parseColor("#D32F2F")
              private val colBg = Color.parseColor("#F5F0EB")
              private val colSec = Color.parseColor("#757575")

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  db = Storage(this)
                  if (db.isLoggedIn()) showHome() else showLogin()
              }

              private fun mkBtn(text: String, color: Int, click: () -> Unit): Button {
                  return Button(this).apply {
                      this.text = text
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply {
                          setColor(color)
                          cornerRadius = 16f
                      }
                      setOnClickListener { click() }
                  }
              }

              private fun showLogin() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 80, 40, 40)
                      setBackgroundColor(colBg)
                  }
                  val title = TextView(this).apply {
                      text = "☕ LV307 TELEMETRY"
                      textSize = 24f
                      setTextColor(colDark)
                      gravity = Gravity.CENTER
                      setTypeface(null, Typeface.BOLD)
                  }
                  val login = EditText(this).apply { hint = "Логин" }
                  val pass = EditText(this).apply {
                      hint = "Пароль"
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  }
                  root.addView(title)
                  root.addView(login)
                  root.addView(pass)
                  root.addView(mkBtn("РЕГИСТРАЦИЯ / ВХОД", colPrimary) {
                      if (login.text.isNotEmpty() && pass.text.isNotEmpty()) {
                          db.saveUser(login.text.toString(), pass.text.toString())
                          showHome()
                      } else {
                          Toast.makeText(this@MainActivity, "Введите логин и пароль", Toast.LENGTH_SHORT).show()
                      }
                  })
                  setContentView(root)
              }

              private fun showHome() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 60, 40, 40)
                      setBackgroundColor(colBg)
                  }
                  root.addView(TextView(this).apply {
                      text = "Добро пожаловать, ${db.getLogin()}"
                      textSize = 18f
                      setTextColor(colDark)
                      setTypeface(null, Typeface.BOLD)
                  })
                  root.addView(mkBtn("ПУЛЬТ ОПЕРАТОРА", colGreen) { showDashboard() })
                  root.addView(mkBtn("УСТАНОВИТЬ НА КОФЕМАШИНУ", colDark) { showMachineSetup() })
                  root.addView(mkBtn("ВЫЙТИ", colSec) {
                      db.saveUser("", "")
                      showLogin()
                  })
                  setContentView(root)
              }

              private fun showMachineSetup() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 60, 40, 40)
                      setBackgroundColor(colBg)
                  }
                  val input = EditText(this).apply { hint = "Серийный номер, например LV307-001" }
                  root.addView(input)
                  root.addView(mkBtn("ЗАПУСТИТЬ СЕРВИС", colPrimary) {
                      val s = input.text.toString().trim()
                      if (s.isNotEmpty()) {
                          db.addMachine(s)
                          startService(Intent(this, LV307Service::class.java).putExtra("serial", s))
                          Toast.makeText(this, "Сервис запущен: $s", Toast.LENGTH_LONG).show()
                          finish()
                      }
                  })
                  root.addView(mkBtn("НАЗАД", colSec) { showHome() })
                  setContentView(root)
              }

              private fun showDashboard() {
                  val scroll = ScrollView(this)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(30, 50, 30, 30)
                      setBackgroundColor(colBg)
                  }
                  scroll.addView(root)
                  root.addView(TextView(this).apply {
                      text = "☕ Мои автоматы"
                      textSize = 22f
                      setTextColor(colDark)
                      setTypeface(null, Typeface.BOLD)
                  })

                  val machines = db.getMachines()
                  if (machines.isEmpty()) {
                      root.addView(TextView(this).apply {
                          text = "Автоматов пока нет"
                          setTextColor(colSec)
                      })
                  } else {
                      machines.forEach { serial ->
                          val info = db.getMachineInfo(serial)
                          val sales = db.getSales(serial)
                          val today = sales.filter { isToday(it.ts) }
                          val rev = today.sumOf { it.sellPrice }
                          val profit = today.sumOf { it.sellPrice - it.costPrice }
                          val btn = Button(this).apply {
                              text = "$serial\nСегодня: ${today.size} чашек | $rev ₽ | +$profit ₽\n${if (info.errorCode != "0") info.errorMsg else if (info.isOnline) "Онлайн" else "Офлайн"}"
                              setOnClickListener { showDetail(serial) }
                          }
                          root.addView(btn)
                      }
                  }

                  root.addView(mkBtn("+ ДОБАВИТЬ АВТОМАТ", colAccent) {
                      val input = EditText(this).apply { hint = "Серийный номер" }
                      AlertDialog.Builder(this)
                          .setTitle("Новый автомат")
                          .setView(input)
                          .setPositiveButton("Добавить") { _, _ ->
                              val s = input.text.toString().trim()
                              if (s.isNotEmpty()) {
                                  db.addMachine(s)
                                  showDashboard()
                              }
                          }
                          .setNegativeButton("Отмена", null)
                          .show()
                  })
                  root.addView(mkBtn("НАЗАД", colSec) { showHome() })
                  setContentView(scroll)
                  connectMqtt(machines)
              }

              private fun showDetail(serial: String) {
                  val scroll = ScrollView(this)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(30, 50, 30, 30)
                      setBackgroundColor(colBg)
                  }
                  scroll.addView(root)

                  val info = db.getMachineInfo(serial)
                  val drinks = db.getDrinks(serial)
                  val sales = db.getSales(serial)
                  val today = sales.filter { isToday(it.ts) }
                  val week = sales.filter { isThisWeek(it.ts) }
                  val month = sales.filter { isThisMonth(it.ts) }

                  fun block(title: String, list: List<SaleRecord>) {
                      val rev = list.sumOf { it.sellPrice }
                      val profit = list.sumOf { it.sellPrice - it.costPrice }
                      root.addView(TextView(this).apply {
                          text = "$title\nЧашек: ${list.size} | Выручка: $rev ₽ | Прибыль: $profit ₽"
                          setTextColor(colDark)
                          setPadding(0, 0, 0, 16)
                      })
                  }

                  root.addView(TextView(this).apply {
                      text = serial
                      textSize = 20f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(colDark)
                  })
                  root.addView(TextView(this).apply {
                      text = if (info.errorCode != "0") "⚠ ${info.errorMsg}" else "● ${if (info.isOnline) "Онлайн" else "Офлайн"}"
                      setTextColor(if (info.errorCode != "0") colRed else colGreen)
                      setPadding(0, 0, 0, 20)
                  })

                  block("СЕГОДНЯ", today)
                  block("НЕДЕЛЯ", week)
                  block("МЕСЯЦ", month)

                  root.addView(mkBtn("СБРОСИТЬ ОШИБКИ", colPrimary) {
                      sendCmd(serial, RemoteCommand("RESET_ERRORS"))
                      Toast.makeText(this, "Команда отправлена", Toast.LENGTH_SHORT).show()
                  })
                  root.addView(mkBtn("ИМИТИРОВАТЬ ПРОДАЖУ", colGreen) {
                      val d = drinks.random()
                      db.addSale(serial, SaleRecord(d.name, d.sellPrice, d.costPrice, System.currentTimeMillis()))
                      sendCmd(serial, RemoteCommand("SIM_SALE", stringValue = d.name))
                      showDetail(serial)
                  })
                  root.addView(mkBtn("НАСТРОЙКА ЦЕН", colAccent) { showPrices(serial) })
                  root.addView(mkBtn("УДАЛИТЬ АВТОМАТ", Color.GRAY) {
                      db.removeMachine(serial)
                      showDashboard()
                  })
                  root.addView(mkBtn("НАЗАД", colSec) { showDashboard() })
                  setContentView(scroll)
              }

              private fun showPrices(serial: String) {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(30, 50, 30, 30)
                      setBackgroundColor(colBg)
                  }
                  val drinks = db.getDrinks(serial).toMutableList()
                  val priceInputs = mutableListOf<EditText>()
                  val costInputs = mutableListOf<EditText>()
                  drinks.forEach { d ->
                      root.addView(TextView(this).apply { text = d.name; setTextColor(colDark) })
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      val p = EditText(this).apply {
                          setText(d.sellPrice.toString())
                          inputType = InputType.TYPE_CLASS_NUMBER
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      }
                      val c = EditText(this).apply {
                          setText(d.costPrice.toString())
                          inputType = InputType.TYPE_CLASS_NUMBER
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      }
                      row.addView(p); row.addView(c)
                      root.addView(row)
                      priceInputs.add(p); costInputs.add(c)
                  }
                  root.addView(mkBtn("СОХРАНИТЬ", colGreen) {
                      drinks.forEachIndexed { i, d ->
                          d.sellPrice = priceInputs[i].text.toString().toIntOrNull() ?: d.sellPrice
                          d.costPrice = costInputs[i].text.toString().toIntOrNull() ?: d.costPrice
                      }
                      db.saveDrinks(serial, drinks)
                      showDetail(serial)
                  })
                  root.addView(mkBtn("НАЗАД", colSec) { showDetail(serial) })
                  setContentView(ScrollView(this).apply { addView(root) })
              }

              private fun connectMqtt(machines: List<String>) {
                  Thread {
                      try {
                          mqtt = MqttClient(
                              "tcp://broker.hivemq.com:1883",
                              "OP_" + UUID.randomUUID().toString().take(6),
                              MemoryPersistence()
                          )
                          mqtt?.setCallback(object : MqttCallbackExtended {
                              override fun connectComplete(r: Boolean, s: String?) {
                                  machines.forEach { mqtt?.subscribe("vending/$it/telemetry", 1) }
                              }
                              override fun connectionLost(c: Throwable?) {}
                              override fun deliveryComplete(t: IMqttDeliveryToken?) {}
                              override fun messageArrived(topic: String?, msg: MqttMessage?) {
                                  try {
                                      val serial = topic?.split("/")?.getOrNull(1) ?: return
                                      val info = gson.fromJson(String(msg!!.payload), MachineInfo::class.java)
                                      info.serial = serial
                                      db.saveMachineInfo(serial, info)
                                  } catch (e: Exception) {}
                              }
                          })
                          mqtt?.connect(MqttConnectOptions().apply {
                              isAutomaticReconnect = true
                              isCleanSession = true
                          })
                      } catch (e: Exception) {}
                  }.start()
              }

              private fun sendCmd(serial: String, cmd: RemoteCommand) {
                  Thread {
                      try {
                          if (mqtt?.isConnected != true) return@Thread
                          val msg = MqttMessage(gson.toJson(cmd).toByteArray())
                          msg.qos = 1
                          mqtt?.publish("vending/$serial/commands", msg)
                      } catch (e: Exception) {}
                  }.start()
              }

              private fun isToday(ts: Long): Boolean {
                  val a = Calendar.getInstance()
                  val b = Calendar.getInstance().apply { timeInMillis = ts }
                  return a.get(Calendar.YEAR) == b.get(Calendar.YEAR) && a.get(Calendar.DAY_OF_YEAR) == b.get(Calendar.DAY_OF_YEAR)
              }
              private fun isThisWeek(ts: Long): Boolean {
                  val a = Calendar.getInstance()
                  val b = Calendar.getInstance().apply { timeInMillis = ts }
                  return a.get(Calendar.YEAR) == b.get(Calendar.YEAR) && a.get(Calendar.WEEK_OF_YEAR) == b.get(Calendar.WEEK_OF_YEAR)
              }
              private fun isThisMonth(ts: Long): Boolean {
                  val a = Calendar.getInstance()
                  val b = Calendar.getInstance().apply { timeInMillis = ts }
                  return a.get(Calendar.YEAR) == b.get(Calendar.YEAR) && a.get(Calendar.MONTH) == b.get(Calendar.MONTH)
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK
        id: build
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Send APK
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot8923730105:AAFuh0THsvEYvzQCXXtpD_e715WfIZoTaaU/sendMessage" \
            -d chat_id=864227156 \
            -d text="✅ Сборка успешна. Отправляю APK..."
          curl -F chat_id="864227156" \
               -F document=@app/build/outputs/apk/debug/app-debug.apk \
               -F caption="☕ LV307 Telemetry v3.0" \
               https://api.telegram.org/bot8923730105:AAFuh0THsvEYvzQCXXtpD_e715WfIZoTaaU/sendDocument

      - name: Send error text
        if: failure()
        run: |
          ERR=$(tail -n 40 build.log | sed 's/"/\\"/g' | tr '\n' ' ' | cut -c1-1500)
          curl -s -X POST "https://api.telegram.org/bot8923730105:AAFuh0THsvEYvzQCXXtpD_e715WfIZoTaaU/sendMessage" \
            -d chat_id=864227156 \
            -d text="❌ Ошибка сборки:%0A$ERR"
