name: Cofferno LV-307 Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      # ============================================================
      #  ГЕНЕРАЦИЯ ПРОЕКТА
      # ============================================================
      - name: Generate Project
        run: |
          set -e
          B=app/src/main
          P=$B/java/com/coffee/telemetry
          mkdir -p $P $B/res/layout $B/res/values $B/res/menu $B/res/drawable

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Cofferno"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=false
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.coffee.telemetry'
              compileSdk 34
              defaultConfig {
                  applicationId "com.coffee.telemetry"
                  minSdk 23
                  targetSdk 34
                  versionCode 79
                  versionName "7.2.7"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              lint { abortOnError false; checkReleaseBuilds false }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          EOF

          cat > $B/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_LOGS"/>
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_app_icon"
                  android:label="Cofferno LV-307"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:requestLegacyExternalStorage="true">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".AgentService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="dataSync"/>
                  <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > $B/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">Cofferno LV-307</string></resources>
          EOF

          cat > $B/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#110B09</color>
              <color name="card">#1F1613</color>
              <color name="accent">#D4A373</color>
              <color name="dark">#0A0605</color>
              <color name="white">#FFFFFF</color>
              <color name="muted">#A3928B</color>
              <color name="green">#4CAF50</color>
              <color name="yellow">#FFC107</color>
              <color name="red">#E53935</color>
              <color name="orange">#FF9800</color>
              <color name="blue">#42A5F5</color>
          </resources>
          EOF

          cat > $B/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/accent</item>
                  <item name="colorPrimaryDark">@color/dark</item>
                  <item name="colorAccent">@color/accent</item>
                  <item name="android:windowBackground">@color/bg</item>
              </style>
          </resources>
          EOF

          cat > $B/res/drawable/ic_app_icon.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp" android:height="48dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#D4A373" android:pathData="M20,3H4v10c0,2.21 1.79,4 4,4h6c2.21,0 4,-1.79 4,-4v-3h2c1.1,0 2,-0.9 2,-2V5c0,-1.1 -0.9,-2 -2,-2zm0,5h-2V5h2v3zM4,19h16v2H4z"/>
          </vector>
          EOF

          cat > $B/res/drawable/ic_nav_sales.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M19,3H5c-1.1,0 -2,0.9 -2,2v14c0,1.1 0.9,2 2,2h14c1.1,0 2,-0.9 2,-2V5c0,-1.1 -0.9,-2 -2,-2zm-7,14H6v-2h6v2zm4,-4H6v-2h10v2zm0,-4H6V7h10v2z"/>
          </vector>
          EOF

          cat > $B/res/drawable/ic_nav_manage.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M3,13h8V3H3v10zm0,8h8v-6H3v6zm10,0h8V11h-8v10zm0,-18v6h8V3h-8z"/>
          </vector>
          EOF

          cat > $B/res/drawable/ic_nav_agent.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M12,1L3,5v6c0,5.55 3.84,10.74 9,12 5.16,-1.26 9,-6.45 9,-12V5l-9,-4zm0,10.99h7c-0.53,4.12 -3.28,7.79 -7,8.94V12H5V6.3l7,-3.11v8.8z"/>
          </vector>
          EOF

          cat > $B/res/menu/bottom_nav.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@+id/nav_sales" android:title="Продажи" android:icon="@drawable/ic_nav_sales"/>
              <item android:id="@+id/nav_manage" android:title="Управление" android:icon="@drawable/ic_nav_manage"/>
              <item android:id="@+id/nav_agent" android:title="Агент" android:icon="@drawable/ic_nav_agent"/>
          </menu>
          EOF

          cat > $B/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg">
              <LinearLayout
                  android:id="@+id/header"
                  android:layout_width="0dp" android:layout_height="wrap_content"
                  android:background="@color/card" android:gravity="center_vertical"
                  android:orientation="horizontal" android:padding="12dp"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent">
                  <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1" android:orientation="vertical">
                      <TextView android:id="@+id/tv_header_title"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="Cofferno LV-307" android:textColor="@color/white"
                          android:textSize="17sp" android:textStyle="bold"/>
                      <TextView android:id="@+id/tv_status"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="Подключение..." android:textColor="@color/yellow" android:textSize="11sp"/>
                      <TextView android:id="@+id/tv_active_machine"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="Все автоматы" android:textColor="@color/accent" android:textSize="11sp"/>
                  </LinearLayout>
                  <Button android:id="@+id/btn_refresh_top"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:backgroundTint="@color/card" android:text="Обновить"
                      android:textColor="@color/accent" android:textSize="12sp"
                      app:strokeColor="@color/accent" app:strokeWidth="1dp"/>
              </LinearLayout>
              <ScrollView android:id="@+id/main_scroll"
                  android:layout_width="0dp" android:layout_height="0dp" android:fillViewport="true"
                  app:layout_constraintBottom_toTopOf="@id/bottom_nav"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toBottomOf="@id/header">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:orientation="vertical" android:padding="12dp">
                      <!-- ВКЛАДКА: ПРОДАЖИ -->
                      <LinearLayout android:id="@+id/tab_sales"
                          android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:orientation="vertical">
                          <HorizontalScrollView android:layout_width="match_parent"
                              android:layout_height="wrap_content" android:layout_marginBottom="12dp"
                              android:scrollbars="none">
                              <LinearLayout android:id="@+id/ll_filter_chips"
                                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                                  android:orientation="horizontal"/>
                          </HorizontalScrollView>
                          <com.google.android.material.card.MaterialCardView
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:layout_marginBottom="12dp"
                              app:cardBackgroundColor="@color/card" app:cardCornerRadius="12dp">
                              <LinearLayout android:layout_width="match_parent"
                                  android:layout_height="wrap_content" android:orientation="vertical"
                                  android:padding="16dp">
                                  <TextView android:id="@+id/tv_summary_title"
                                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="Общая выручка" android:textColor="@color/white"
                                      android:textSize="15sp" android:textStyle="bold"/>
                                  <TextView android:id="@+id/tv_total_revenue"
                                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="0 ₽" android:textColor="@color/accent"
                                      android:textSize="20sp" android:textStyle="bold"/>
                                  <TextView android:id="@+id/tv_total_profit"
                                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="0 ₽" android:textColor="@color/green"
                                      android:textSize="18sp" android:textStyle="bold"/>
                                  <TextView android:id="@+id/tv_total_cups"
                                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="Стаканов: 0 шт." android:textColor="@color/muted" android:textSize="12sp"/>
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>
                          <LinearLayout android:id="@+id/ll_drinks_container"
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:orientation="vertical"/>
                      </LinearLayout>
                      <!-- ВКЛАДКА: УПРАВЛЕНИЕ -->
                      <LinearLayout android:id="@+id/tab_manage"
                          android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:orientation="vertical" android:visibility="gone">
                          <com.google.android.material.card.MaterialCardView
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:layout_marginBottom="12dp"
                              app:cardBackgroundColor="@color/card" app:cardCornerRadius="12dp">
                              <LinearLayout android:layout_width="match_parent"
                                  android:layout_height="wrap_content" android:orientation="vertical"
                                  android:padding="16dp">
                                  <LinearLayout android:layout_width="match_parent"
                                      android:layout_height="wrap_content" android:orientation="horizontal">
                                      <EditText android:id="@+id/et_new_serial"
                                          android:layout_width="0dp" android:layout_height="wrap_content"
                                          android:layout_weight="1" android:hint="Device ID (ID автомата)"
                                          android:inputType="text" android:textColor="@color/white"
                                          android:textColorHint="@color/muted" android:textSize="13sp"/>
                                      <Button android:id="@+id/btn_add_machine"
                                          android:layout_width="wrap_content" android:layout_height="wrap_content"
                                          android:layout_marginStart="8dp" android:backgroundTint="@color/accent"
                                          android:text="Добавить" android:textColor="@color/dark"/>
                                  </LinearLayout>
                                  <LinearLayout android:id="@+id/ll_machine_selector"
                                      android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:layout_marginTop="8dp" android:orientation="vertical"/>
                                  <LinearLayout android:layout_width="match_parent"
                                      android:layout_height="wrap_content" android:layout_marginTop="12dp"
                                      android:orientation="horizontal">
                                      <EditText android:id="@+id/et_custom_name"
                                          android:layout_width="0dp" android:layout_height="wrap_content"
                                          android:layout_weight="1" android:hint="Название (напр. ТЦ Центр)"
                                          android:textColor="@color/white"
                                          android:textColorHint="@color/muted" android:textSize="13sp"/>
                                      <Button android:id="@+id/btn_save_name"
                                          android:layout_width="wrap_content" android:layout_height="wrap_content"
                                          android:layout_marginStart="8dp" android:backgroundTint="@color/card"
                                          android:text="Сохранить имя" android:textColor="@color/white"
                                          app:strokeColor="@color/accent" app:strokeWidth="1dp"/>
                                  </LinearLayout>
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>
                          <com.google.android.material.card.MaterialCardView
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:layout_marginBottom="12dp"
                              app:cardBackgroundColor="@color/card" app:cardCornerRadius="12dp">
                              <LinearLayout android:layout_width="match_parent"
                                  android:layout_height="wrap_content" android:orientation="vertical"
                                  android:padding="16dp">
                                  <TextView
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:text="Себестоимость напитков (₽)"
                                      android:textColor="@color/accent"
                                      android:textSize="13sp"
                                      android:textStyle="bold"
                                      android:layout_marginBottom="8dp"/>
                                  <LinearLayout android:id="@+id/ll_costs_container"
                                      android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:orientation="vertical"/>
                                  <Button android:id="@+id/btn_save_all_costs"
                                      android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:layout_marginTop="10dp" android:backgroundTint="@color/accent"
                                      android:text="Сохранить себестоимость" android:textColor="@color/dark"/>
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>
                          <com.google.android.material.card.MaterialCardView
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              app:cardBackgroundColor="@color/card" app:cardCornerRadius="12dp">
                              <LinearLayout android:layout_width="match_parent"
                                  android:layout_height="wrap_content" android:orientation="vertical"
                                  android:padding="16dp">
                                  <Button android:id="@+id/btn_reset_counters"
                                      android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:layout_marginBottom="8dp" android:backgroundTint="@color/yellow"
                                      android:text="Сброс счётчиков" android:textColor="@color/dark"/>
                                  <Button android:id="@+id/btn_remote_reboot"
                                      android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:layout_marginBottom="8dp" android:backgroundTint="@color/orange"
                                      android:text="Перезагрузка" android:textColor="@color/white"/>
                                  <Button android:id="@+id/btn_remote_flush"
                                      android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:layout_marginBottom="8dp" android:backgroundTint="@color/blue"
                                      android:text="Промывка" android:textColor="@color/white"/>
                                  <Button android:id="@+id/btn_remote_lock"
                                      android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:backgroundTint="@color/red"
                                      android:text="Блокировка" android:textColor="@color/white"/>
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>
                      </LinearLayout>
                      <!-- ВКЛАДКА: АГЕНТ -->
                      <LinearLayout android:id="@+id/tab_agent"
                          android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:orientation="vertical" android:visibility="gone">
                          <com.google.android.material.card.MaterialCardView
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:layout_marginBottom="12dp"
                              app:cardBackgroundColor="@color/card" app:cardCornerRadius="12dp">
                              <LinearLayout android:layout_width="match_parent"
                                  android:layout_height="wrap_content" android:orientation="vertical"
                                  android:padding="16dp">
                                  <TextView android:layout_width="match_parent"
                                      android:layout_height="wrap_content" text="ID устройства (Device ID)"
                                      android:textColor="@color/muted" android:textSize="12sp"/>
                                  <TextView android:id="@+id/tv_detected_device_id"
                                      android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:layout_marginBottom="8dp" android:text="не найден"
                                      android:textColor="@color/accent" android:textSize="18sp"
                                      android:textStyle="bold"/>
                                  <Button android:id="@+id/btn_detect_device_id"
                                      android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:layout_marginBottom="8dp" android:backgroundTint="@color/blue"
                                      android:text="Определить Device ID" android:textColor="@color/white"/>
                                  <Button android:id="@+id/btn_use_device_id"
                                      android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:layout_marginBottom="12dp" android:backgroundTint="@color/green"
                                      android:text="Использовать Device ID как S/N" android:textColor="@color/white"/>
                                  <EditText android:id="@+id/et_agent_serial"
                                      android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:hint="Серийный номер (S/N)" android:textColor="@color/white"
                                      android:textColorHint="@color/muted" android:textSize="13sp"/>
                                  <Button android:id="@+id/btn_save_agent_serial"
                                      android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:layout_marginTop="8dp" android:backgroundTint="@color/accent"
                                      android:text="Сохранить S/N" android:textColor="@color/dark"/>
                                  <com.google.android.material.switchmaterial.SwitchMaterial
                                      android:id="@+id/switch_agent"
                                      android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:layout_marginTop="16dp"
                                      android:text="Фоновая служба А+Б" android:textColor="@color/white"/>
                                  <TextView android:id="@+id/tv_agent_status"
                                      android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:layout_marginTop="4dp" android:text="Остановлена"
                                      android:textColor="@color/yellow" android:textSize="12sp"/>
                                  <TextView android:id="@+id/tv_last_sale"
                                      android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:layout_marginTop="6dp" android:text="Посл. продажа: -"
                                      android:textColor="@color/muted" android:textSize="12sp"/>
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>
                          <com.google.android.material.card.MaterialCardView
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:layout_marginBottom="20dp"
                              app:cardBackgroundColor="@color/card" app:cardCornerRadius="12dp">
                              <LinearLayout android:layout_width="match_parent"
                                  android:layout_height="wrap_content" android:orientation="vertical"
                                  android:padding="16dp">
                                  <Button android:id="@+id/btn_scan_coffeenet"
                                      android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:backgroundTint="@color/blue"
                                      android:text="Сканировать логи автомата" android:textColor="@color/white"/>
                                  <TextView android:id="@+id/tv_coffeenet_logs"
                                      android:layout_width="match_parent" android:layout_height="480dp"
                                      android:layout_marginTop="12dp" android:background="#000000"
                                      android:fadeScrollbars="false" android:gravity="top|start"
                                      android:overScrollMode="always" android:padding="12dp"
                                      android:scrollbars="vertical" android:text="Нажмите кнопку для сканирования..."
                                      android:textColor="#00FF66" android:textIsSelectable="true"
                                      android:textSize="12sp"/>
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>
                      </LinearLayout>
                  </LinearLayout>
              </ScrollView>
              <com.google.android.material.bottomnavigation.BottomNavigationView
                  android:id="@+id/bottom_nav"
                  android:layout_width="0dp" android:layout_height="wrap_content"
                  android:background="@color/card"
                  app:itemIconTint="@color/accent" app:itemTextColor="@color/white"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:menu="@menu/bottom_nav"/>
          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

          # ---------- Models.kt ----------
          cat > $P/Models.kt << 'EOF'
          package com.coffee.telemetry

          data class DrinkItem(
              val id: Int,
              var name: String,
              var count: Int,
              var price: Int,
              var cost: Int = 40
          )

          data class TelemetryPacket(
              val serial: String,
              val temp: Double,
              val pressure: Double,
              val status: String,
              val drinks: MutableList<DrinkItem>,
              val deviceId: String = "",
              val lastSaleName: String = "",
              val lastSalePrice: Int = 0,
              val lastSaleAt: Long = 0L,
              val timestamp: Long = System.currentTimeMillis()
          )

          data class MergedDrink(
              val name: String,
              var count: Int,
              val price: Int,
              val cost: Int
          )
          EOF

          # ---------- LeVendingProbe.kt ----------
          cat > $P/LeVendingProbe.kt << 'EOF'
          package com.coffee.telemetry

          import android.content.Context
          import android.os.Environment
          import java.io.BufferedReader
          import java.io.File
          import java.io.InputStreamReader
          import java.util.regex.Pattern

          object LeVendingProbe {

              private val devicePatterns = arrayOf(
                  Pattern.compile("deviceid=([0-9]{6,18})", Pattern.CASE_INSENSITIVE),
                  Pattern.compile("deviceId=([0-9]{6,18})", Pattern.CASE_INSENSITIVE),
                  Pattern.compile("device_id[=:]([0-9]{6,18})", Pattern.CASE_INSENSITIVE)
              )

              private val pricePattern = Pattern.compile(
                  "(?i)(?:price|amount|money|pay|sum|total|цена|стоимость)[^0-9]{0,12}([0-9]{2,5})"
              )

              private val drinkMap = mapOf(
                  "Espresso" to "Эспрессо",
                  "Americano" to "Американо",
                  "Cappuccino" to "Капучино",
                  "Latte" to "Латте",
                  "Macchiato" to "Макиато",
                  "Flat White" to "Флэт Уайт",
                  "Mocha" to "Моккачино",
                  "Chocolate" to "Горячий шоколад",
                  "Cocoa" to "Какао",
                  "Tea" to "Чай",
                  "Ristretto" to "Ристретто",
                  "Lungo" to "Лунго"
              )

              fun findDeviceIdFromLogLine(line: String): String? {
                  for (p in devicePatterns) {
                      val m = p.matcher(line)
                      if (m.find()) return m.group(1)
                  }
                  return null
              }

              fun findDeviceId(context: Context): String {
                  val prefs = context.getSharedPreferences("cofferno_agent", Context.MODE_PRIVATE)
                  val saved = prefs.getString("levending_device_id", "") ?: ""
                  if (saved.isNotBlank()) return saved
                  val fromLog = scrapeDeviceIdFromLogcat()
                  if (fromLog != null) {
                      prefs.edit().putString("levending_device_id", fromLog).apply()
                      return fromLog
                  }
                  return ""
              }

              fun scrapeDeviceIdFromLogcat(): String? {
                  try {
                      val process = Runtime.getRuntime().exec(arrayOf("logcat", "-d", "-t", "800"))
                      val reader = BufferedReader(InputStreamReader(process.inputStream))
                      while (true) {
                          val line = reader.readLine() ?: break
                          val id = findDeviceIdFromLogLine(line)
                          if (id != null) return id
                      }
                  } catch (_: Exception) {}
                  return null
              }

              fun isPrimarySaleMarker(line: String): Boolean {
                  if (!line.contains("MakeDrinkVideoActivity")) return false
                  return line.contains("START") || line.contains("Displayed") || line.contains("cmp=")
              }

              fun isDropCupMarker(line: String): Boolean =
                  line.contains("AloneDropCupActivity") && line.contains("Displayed")

              fun isSaleMarker(line: String): Boolean =
                  line.contains("MakeDrinkVideoActivity") ||
                  line.contains("AloneDropCupActivity") ||
                  line.contains("MakeDrinkPresenter") ||
                  line.contains("PayActivity")

              fun extractDrinkName(line: String): String? {
                  for ((en, ru) in drinkMap) {
                      if (line.contains(en, ignoreCase = true) || line.contains(ru, ignoreCase = true)) {
                          return ru
                      }
                  }
                  return null
              }

              fun extractPrice(line: String): Int? {
                  val m = pricePattern.matcher(line)
                  if (m.find()) {
                      val v = m.group(1)?.toIntOrNull() ?: return null
                      if (v in 10..2000) return v
                  }
                  return null
              }

              fun fullScan(context: Context): String {
                  val sb = StringBuilder("=== ДИАГНОСТИКА COFFERNO 7.2.7 ===\n")
                  val dev = findDeviceId(context)
                  sb.append("ID устройства: ").append(if (dev.isBlank()) "НЕ НАЙДЕН" else dev).append("\n\n")
                  try {
                      val pkgs = context.packageManager.getInstalledPackages(0)
                      sb.append("--- ПРИЛОЖЕНИЯ АВТОМАТА ---\n")
                      for (p in pkgs) {
                          val n = p.packageName.lowercase()
                          if (n.contains("le.") || n.contains("vending") || n.contains("coffee") || n.contains("ylpush"))
                              sb.append(" * ").append(p.packageName).append("\n")
                      }
                  } catch (e: Exception) { sb.append(e.message).append("\n") }
                  sb.append("\n--- ПАПКИ НА SD КАРТЕ ---\n")
                  val root = Environment.getExternalStorageDirectory()
                  for (rel in arrayOf("Download",
                      "Android/data/com.le.vmcoffeestandard",
                      "Android/data/com.le.vmcoffeestandard/files",
                      "Android/data/com.levending.ylpush",
                      "Android/data/com.levending.ylpush/files")) {
                      val f = File(root, rel)
                      if (f.exists()) {
                          sb.append("ПАПКА ").append(f.absolutePath).append("\n")
                          f.listFiles()?.take(30)?.forEach { c ->
                              sb.append("  - ").append(c.name).append(" (").append(c.length()).append(" байт)\n")
                          }
                      }
                  }
                  sb.append("\n--- ЛОГИ LOGCAT ---\n")
                  var saleHits = 0; var shown = 0
                  try {
                      val process = Runtime.getRuntime().exec(arrayOf("logcat", "-d", "-t", "500"))
                      val reader = BufferedReader(InputStreamReader(process.inputStream))
                      while (true) {
                          val line = reader.readLine() ?: break
                          if (isSaleMarker(line) || findDeviceIdFromLogLine(line) != null ||
                              line.contains("ylapi.levending") || line.contains("vmcoffee", ignoreCase = true) ||
                              extractDrinkName(line) != null || extractPrice(line) != null) {
                              if (isSaleMarker(line)) saleHits++
                              sb.append(if (line.length > 200) line.substring(0, 200) else line).append("\n")
                              if (++shown >= 90) break
                          }
                      }
                  } catch (e: Exception) { sb.append("logcat: ").append(e.message).append("\n") }
                  sb.append("\nСобытий приготовления: ").append(saleHits).append("\n=== КОНЕЦ ОТЧЁТА ===\n")
                  return sb.toString()
              }
          }
