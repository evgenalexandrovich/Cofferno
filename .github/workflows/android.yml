name: Cofferno LV-307 Full Telemetry Build

on:
  push:
  workflow_dispatch:

env:
  BOT_TOKEN: "8923730105:AAFgMSUgh63L_1Xuad839ex4fXZmTpFR1_Q"
  CHAT_ID: "864227156"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Requests
        run: pip install requests

      - name: Notify Start
        run: |
          python3 - << 'EOF'
          import os, requests
          requests.post(
              f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage",
              json={"chat_id": os.environ["CHAT_ID"],
                    "text": "☕ Cofferno LV-307 v5.0 FULL: компиляция запущена..."}
          )
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Full Project Source
        run: |
          BASE=app/src/main
          PKG=$BASE/java/com/coffee/telemetry
          mkdir -p $PKG/db $PKG/ui $PKG/hw $PKG/net $PKG/model
          mkdir -p $BASE/res/layout $BASE/res/values $BASE/res/menu $BASE/res/drawable

          # === settings.gradle ===
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Cofferno"
          include ':app'
          EOF

          # === build.gradle (root) ===
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
              id 'com.google.devtools.ksp' version '1.9.20-1.0.14' apply false
          }
          EOF

          # === gradle.properties ===
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF

          # === app/build.gradle ===
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'com.google.devtools.ksp'
          }
          android {
              namespace 'com.coffee.telemetry'
              compileSdk 34
              defaultConfig {
                  applicationId "com.coffee.telemetry"
                  minSdk 21
                  targetSdk 34
                  versionCode 50
                  versionName "5.0-LV307"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              buildFeatures { viewBinding true }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.cardview:cardview:1.0.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

              implementation 'androidx.room:room-runtime:2.6.1'
              implementation 'androidx.room:room-ktx:2.6.1'
              ksp 'androidx.room:room-compiler:2.6.1'

              implementation 'com.google.code.gson:gson:2.10.1'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          # === strings.xml ===
          cat << 'EOF' > $BASE/res/values/strings.xml
          <resources>
              <string name="app_name">Cofferno LV-307</string>
          </resources>
          EOF

          # === colors.xml ===
          cat << 'EOF' > $BASE/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#1E130F</color>
              <color name="coffee_dark">#2B1B17</color>
              <color name="coffee_card">#3E2723</color>
              <color name="coffee_gold">#FFC107</color>
              <color name="coffee_primary">#6F4E37</color>
              <color name="coffee_green">#4CAF50</color>
              <color name="coffee_red">#D32F2F</color>
              <color name="coffee_blue">#2196F3</color>
              <color name="white">#FFFFFF</color>
              <color name="text_secondary">#D7CCC8</color>
              <color name="divider">#5D4037</color>
          </resources>
          EOF

          # === styles.xml ===
          cat << 'EOF' > $BASE/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="colorPrimary">@color/coffee_primary</item>
                  <item name="colorPrimaryDark">@color/coffee_dark</item>
                  <item name="colorAccent">@color/coffee_gold</item>
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@color/coffee_dark</item>
              </style>
          </resources>
          EOF

          # === Bottom Nav Menu ===
          cat << 'EOF' > $BASE/res/menu/bottom_nav.xml
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@+id/nav_dashboard" android:title="Дашборд" android:icon="@android:drawable/ic_menu_view"/>
              
