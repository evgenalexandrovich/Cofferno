name: Cofferno Business Suite v5.0

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Start
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=☕ Cofferno v5.0 Business Suite — сборка запущена..."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Project Structure
        run: |
          mkdir -p app/src/main/java/com/coffee/telemetry/{data,ui,util,service}
          mkdir -p app/src/main/res/{layout,values,drawable,menu}

          # ═══════════════════════════════════════
          # GRADLE CONFIG
          # ═══════════════════════════════════════
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Cofferno"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.coffee.telemetry'
              compileSdk 34

              defaultConfig {
                  applicationId "com.coffee.telemetry"
                  minSdk 21
                  targetSdk 34
                  versionCode 50
                  versionName "5.0-Business"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              buildFeatures { viewBinding true }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.cardview:cardview:1.0.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          EOF

          # ═══════════════════════════════════════
          # RESOURCES
          # ═══════════════════════════════════════
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Cofferno</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#1E130F</color>
              <color name="coffee_dark">#2B1B17</color>
              <color name="coffee_card">#3E2723</color>
              <color name="coffee_gold">#FFC107</color>
              <color name="coffee_primary">#6F4E37</color>
              <color name="coffee_green">#4CAF50</color>
              <color name="coffee_red">#D32F2F</color>
              <color name="coffee_blue">#2196F3</color>
              <color name="white">#FFFFFF</color>
              <color name="text_secondary">#D7CCC8</color>
              <color name="divider">#5D4037</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="colorPrimary">@color/coffee_primary</item>
                  <item name="colorPrimaryDark">@color/coffee_dark</item>
                  <item name="colorAccent">@color/coffee_gold</item>
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@color/coffee_dark</item>
              </style>
              <style name="CardStat">
                  <item name="android:layout_width">0dp</item>
                  <item name="android:layout_height">wrap_content</item>
                  <item name="android:layout_weight">1</item>
                  <item name="android:layout_margin">4dp</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/btn_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/coffee_primary"/>
              <corners android:radius="12dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/edit_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/coffee_dark"/>
              <corners android:radius="8dp"/>
              <stroke android:width="1dp" android:color="@color/divider"/>
          </shape>
          EOF

          # ═══════════════════════════════════════
          # LAYOUTS
          # ═══════════════════════════════════════

          # --- Login ---
          cat << 'EOF' > app/src/main/res/layout/activity_login.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp"
              android:gravity="center"
              android:background="@color/bg">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="☕ COFFERNO"
                  android:textSize="34sp"
                  android:textStyle="bold"
                  android:textColor="@color/coffee_gold"/>

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Business Suite v5.0"
                  android:textColor="@color/text_secondary"
                  android:layout_marginBottom="40dp"/>

              <EditText
                  android:id="@+id/etAccount"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:hint="Email / ID кабинета"
                  android:textColor="@color/white"
                  android:textColorHint="@color/text_secondary"
                  android:background="@drawable/edit_bg"
                  android:padding="16dp"
                  android:inputType="textEmailAddress"
                  android:layout_marginBottom="12dp"/>

              <EditText
                  android:id="@+id/etMachineId"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:hint="Серийный номер машины"
                  android:textColor="@color/white"
                  android:textColorHint="@color/text_secondary"
                  android:background="@drawable/edit_bg"
                  android:padding="16dp"
                  android:layout_marginBottom="24dp"/>

              <Button
                  android:id="@+id/btnBind"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:text="ПРИВЯЗАТЬ МАШИНУ"
                  android:textColor="@color/coffee_dark"
                  android:textStyle="bold"
                  android:backgroundTint="@color/coffee_gold"/>

              <TextView
                  android:id="@+id/tvDeviceId"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:textColor="@color/text_secondary"
                  android:textSize="11sp"
                  android:layout_marginTop="24dp"/>
          </LinearLayout>
          EOF

          # --- Main Dashboard ---
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="16dp">

                  <!-- Header -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center_vertical"
                      android:layout_marginBottom="16dp">

                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:orientation="vertical">
                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="☕ Cofferno"
                              android:textSize="22sp"
                              android:textStyle="bold"
                              android:textColor="@color/coffee_gold"/>
                          <TextView
                              android:id="@+id/tvMachineInfo"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:textColor="@color/text_secondary"
                              android:textSize="12sp"/>
                      </LinearLayout>

                      <View
                          android:id="@+id/statusDot"
                          android:layout_width="12dp"
                          android:layout_height="12dp"
                          android:background="@color/coffee_green"
                          android:layout_marginEnd="6dp"/>
                      <TextView
                          android:id="@+id/tvOnline"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="ONLINE"
                          android:textColor="@color/coffee_green"
                          android:textStyle="bold"
                          android:textSize="12sp"/>
                  </LinearLayout>

                  <!-- Stat cards row -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal">

                      <androidx.cardview.widget.CardView
                          style="@style/CardStat"
                          app:cardCornerRadius="12dp"
                          app:cardBackgroundColor="@color/coffee_card">
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical"
                              android:padding="12dp">
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Выручка"
                                  android:textColor="@color/text_secondary"
                                  android:textSize="12sp"/>
                              <TextView
                                  android:id="@+id/tvRevenue"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="0 ₽"
                                  android:textColor="@color/coffee_gold"
                                  android:textStyle="bold"
                                  android:textSize="18sp"/>
                          </LinearLayout>
                      </androidx.cardview.widget.CardView>

                      <androidx.cardview.widget.CardView
                          style="@style/CardStat"
                          app:cardCornerRadius="12dp"
                          app:cardBackgroundColor="@color/coffee_card">
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical"
                              android:padding="12dp">
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Прибыль"
                                  android:textColor="@color/text_secondary"
                                  android:textSize="12sp"/>
                              <TextView
                                  android:id="@+id/tvProfit"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="0 ₽"
                                  android:textColor="@color/coffee_green"
                                  android:textStyle="bold"
                                  android:textSize="18sp"/>
                          </LinearLayout>
                      </androidx.cardview.widget.CardView>
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:layout_marginBottom="16dp">

                      <androidx.cardview.widget.CardView
                          style="@style/CardStat"
                          app:cardCornerRadius="12dp"
                          app:cardBackgroundColor="@color/coffee_card">
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical"
                              android:padding="12dp">
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Продаж сегодня"
                                  android:textColor="@color/text_secondary"
                                  android:textSize="12sp"/>
                              <TextView
                                  android:id="@+id/tvSalesCount"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="0"
                                  android:textColor="@color/white"
                                  android:textStyle="bold"
                                  android:textSize="18sp"/>
                          </LinearLayout>
                      </androidx.cardview.widget.CardView>

                      <androidx.cardview.widget.CardView
                          style="@style/CardStat"
                          app:cardCornerRadius="12dp"
                          app:cardBackgroundColor="@color/coffee_card">
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical"
                              android:padding="12dp">
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Средний чек"
                                  android:textColor="@color/text_secondary"
                                  android:textSize="12sp"/>
                              <TextView
                                  android:id="@+id/tvAvgCheck"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="0 ₽"
                                  android:textColor="@color/white"
                                  android:textStyle="bold"
                                  android:textSize="18sp"/>
                          </LinearLayout>
                      </androidx.cardview.widget.CardView>
                  </LinearLayout>

                  <!-- Actions grid -->
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="УПРАВЛЕНИЕ"
                      android:textColor="@color/text_secondary"
                      android:textSize="12sp"
                      android:letterSpacing="0.1"
                      android:layout_marginBottom="8dp"/>

                  <Button
                      android:id="@+id/btnSales"
                      android:layout_width="match_parent"
                      android:layout_height="56dp"
                      android:text="📊  ЖУРНАЛ ПРОДАЖ"
                      android:textColor="@color/white"
                      android:gravity="start|center_vertical"
                      android:paddingStart="20dp"
                      android:background="@drawable/btn_bg"
                      android:layout_marginBottom="8dp"/>

                  <Button
                      android:id="@+id/btnPrices"
                      android:layout_width="match_parent"
                      android:layout_height="56dp"
                      android:text="💰  КОРРЕКЦИЯ ЦЕН"
                      android:textColor="@color/white"
                      android:gravity="start|center_vertical"
                      android:paddingStart="20dp"
                      android:background="@drawable/btn_bg"
                      android:layout_marginBottom="8dp"/>

                  <Button
                      android:id="@+id/btnCost"
                      android:layout_width="match_parent"
                      android:layout_height="56dp"
                      android:text="🧾  СЕБЕСТОИМОСТЬ"
                      android:textColor="@color/white"
                      android:gravity="start|center_vertical"
                      android:paddingStart="20dp"
                      android:background="@drawable/btn_bg"
                      android:layout_marginBottom="8dp"/>

                  <Button
                      android:id="@+id/btnErrors"
                      android:layout_width="match_parent"
                      android:layout_height="56dp"
                      android:text="⚠️  ОШИБКИ МАШИНЫ"
                      android:textColor="@color/white"
                      android:gravity="start|center_vertical"
                      android:paddingStart="20dp"
                      android:background="@drawable/btn_bg"
                      android:layout_marginBottom="16dp"/>

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="СИСТЕМА"
                      android:textColor="@color/text_secondary"
                      android:textSize="12sp"
                      android:letterSpacing="0.1"
                      android:layout_marginBottom="8dp"/>

                  <Button
                      android:id="@+id/btnPingNow"
                      android:layout_width="match_parent"
                      android:layout_height="56dp"
                      android:text="📡 ОТПРАВИТЬ HEARTBEAT"
                      android:textColor="@color/coffee_dark"
                      android:textStyle="bold"
                      android:backgroundTint="@color/coffee_gold"
                      android:layout_marginBottom="8dp"/>

                  <Button
                      android:id="@+id/btnReboot"
                      android:layout_width="match_parent"
                      android:layout_height="56dp"
                      android:text="⚡ ПЕРЕЗАГРУЗИТЬ МАШИНУ"
                      android:textColor="@color/white"
                      android:textStyle="bold"
                      android:backgroundTint="@color/coffee_red"
                      android:layout_marginBottom="8dp"/>

                  <Button
                      android:id="@+id/btnLogout"
                      android:layout_width="match_parent"
                      android:layout_height="48dp"
                      android:text="Выйти / Отвязать"
                      android:textColor="@color/text_secondary"
                      android:backgroundTint="@color/coffee_dark"/>

              </LinearLayout>
          </ScrollView>
          EOF

          # --- Sales list ---
          cat << 'EOF' > app/src/main/res/layout/activity_sales.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="@color/bg"
              android:padding="16dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="📊 Журнал продаж"
                  android:textSize="22sp"
                  android:textStyle="bold"
                  android:textColor="@color/coffee_gold"
                  android:layout_marginBottom="12dp"/>

              <TextView
                  android:id="@+id/tvSummary"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:textColor="@color/text_secondary"
                  android:textSize="14sp"
                  android:layout_marginBottom="12dp"/>

              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/rvSales"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"/>

              <Button
                  android:id="@+id/btnAddSale"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:text="+ Добавить тестовую продажу"
                  android:textColor="@color/coffee_dark"
                  android:textStyle="bold"
                  android:backgroundTint="@color/coffee_gold"
                  android:layout_marginTop="8dp"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_sale.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.cardview.widget.CardView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:layout_marginBottom="8dp"
              app:cardCornerRadius="10dp"
              app:cardBackgroundColor="@color/coffee_card">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:padding="14dp"
                  android:gravity="center_vertical">

                  <LinearLayout
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:orientation="vertical">

                      <TextView
                          android:id="@+id/tvProductName"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:textColor="@color/white"
                          android:textStyle="bold"
                          android:textSize="16sp"/>

                      <TextView
                          android:id="@+id/tvTime"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:textColor="@color/text_secondary"
                          android:textSize="12sp"/>
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:gravity="end">

                      <TextView
                          android:id="@+id/tvPrice"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:textColor="@color/coffee_gold"
                          android:textStyle="bold"
                          android:textSize="16sp"/>

                      <TextView
                          android:id="@+id/tvProfit"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:textColor="@color/coffee_green"
                          android:textSize="12sp"/>
                  </LinearLayout>
              </LinearLayout>
          </androidx.cardview.widget.CardView>
          EOF

          # --- Products (Prices/Cost) ---
          cat << 'EOF' > app/src/main/res/layout/activity_products.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="@color/bg"
              android:padding="16dp">

              <TextView
                  android:id="@+id/tvTitle"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:textSize="22sp"
                  android:textStyle="bold"
                  android:textColor="@color/coffee_gold"
                  android:layout_marginBottom="12dp"/>

              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/rvProducts"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_product.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.cardview.widget.CardView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:layout_marginBottom="8dp"
              app:cardCornerRadius="10dp"
              app:cardBackgroundColor="@color/coffee_card">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="14dp">

                  <TextView
                      android:id="@+id/tvName"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:textColor="@color/white"
                      android:textStyle="bold"
                      android:textSize="16sp"
                      android:layout_marginBottom="8dp"/>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal">

                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:orientation="vertical"
                          android:layout_marginEnd="8dp">
                          <TextView
                              android:id="@+id/tvLabel1"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:textColor="@color/text_secondary"
                              android:textSize="11sp"/>
                          <EditText
                              android:id="@+id/etValue"
                              android:layout_width="match_parent"
                              android:layout_height="48dp"
                              android:background="@drawable/edit_bg"
                              android:textColor="@color/white"
                              android:inputType="numberDecimal"
                              android:padding="12dp"
                              android:textSize="15sp"/>
                      </LinearLayout>

                      <Button
                          android:id="@+id/btnSave"
                          android:layout_width="wrap_content"
                          android:layout_height="48dp"
                          android:layout_gravity="bottom"
                          android:text="OK"
                          android:textColor="@color/coffee_dark"
                          android:textStyle="bold"
                          android:backgroundTint="@color/coffee_gold"
                          android:minWidth="72dp"/>
                  </LinearLayout>

                  <TextView
                      android:id="@+id/tvMargin"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:textColor="@color/coffee_green"
                      android:textSize="12sp"
                      android:layout_marginTop="6dp"/>
              </LinearLayout>
          </androidx.cardview.widget.CardView>
          EOF

          # --- Errors ---
          cat << 'EOF' > app/src/main/res/layout/activity_errors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="@color/bg"
