          # MainActivity.kt
          cat << 'EOF' > $PKG/MainActivity.kt
          package com.coffee.telemetry

          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import com.google.android.material.bottomnavigation.BottomNavigationView
          import com.google.android.material.switchmaterial.SwitchMaterial
          import com.google.gson.Gson
          import org.eclipse.paho.client.mqttv3.*
          import org.eclipse.paho.client.mqttv3.persist.MemoryPersistence
          import java.util.UUID

          data class TelemetryData(
              val temp: Double,
              val pressure: Double,
              val coffee: Int,
              val water: Int,
              val cups: Int,
              val totalCups: Int,
              val totalMoney: Int,
              val status: String
          )

          class MainActivity : AppCompatActivity() {

              private val brokerUrl = "tcp://broker.hivemq.com:1883"
              private val topicTelemetry = "cofferno/lv307/telemetry"
              private val topicCommands = "cofferno/lv307/commands"
              
              private var mqttClient: MqttClient? = null
              private val gson = Gson()
              private val mainHandler = Handler(Looper.getMainLooper())
              
              private var isAgentRunning = false
              private val agentRunnable = object : Runnable {
                  override fun run() {
                      if (isAgentRunning) {
                          sendTelemetryHeartbeat()
                          mainHandler.postDelayed(this, 3000) // каждые 3 секунды
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val layoutDashboard = findViewById<LinearLayout>(R.id.layout_dashboard)
                  val layoutControl = findViewById<LinearLayout>(R.id.layout_control)
                  val layoutAgent = findViewById<LinearLayout>(R.id.layout_agent)
                  val bottomNav = findViewById<BottomNavigationView>(R.id.bottom_navigation)

                  val tvMqttStatus = findViewById<TextView>(R.id.tv_mqtt_status)
                  val switchAgent = findViewById<SwitchMaterial>(R.id.switch_agent)
                  val tvAgentLogs = findViewById<TextView>(R.id.tv_agent_logs)

                  val btnFlush = findViewById<Button>(R.id.btn_send_flush)
                  val btnTest = findViewById<Button>(R.id.btn_send_test)
                  val btnLock = findViewById<Button>(R.id.btn_send_lock)

                  // Навигация
                  bottomNav.setOnItemSelectedListener { item ->
                      layoutDashboard.visibility = if (item.itemId == R.id.nav_dashboard) View.VISIBLE else View.GONE
                      layoutControl.visibility = if (item.itemId == R.id.nav_control) View.VISIBLE else View.GONE
                      layoutAgent.visibility = if (item.itemId == R.id.nav_agent) View.VISIBLE else View.GONE
                      true
                  }

                  // Инициализация MQTT
                  connectMqtt(tvMqttStatus, tvAgentLogs)

                  // Отправка команд с телефона
                  btnFlush.setOnClickListener { publishCommand("FLUSH") }
                  btnTest.setOnClickListener { publishCommand("TEST_CUP") }
                  btnLock.setOnClickListener { publishCommand("TOGGLE_LOCK") }

                  // Включение режима агента на аппарате
                  switchAgent.setOnCheckedChangeListener { _, isChecked ->
                      isAgentRunning = isChecked
                      if (isChecked) {
                          tvAgentLogs.append("\n[Агент] Запущен. Трансляция телеметрии в облако...")
                          mainHandler.post(agentRunnable)
                      } else {
                          tvAgentLogs.append("\n[Агент] Остановлен.")
                          mainHandler.removeCallbacks(agentRunnable)
                      }
                  }
              }

              private fun connectMqtt(tvStatus: TextView, tvLogs: TextView) {
                  try {
                      val clientId = "Cofferno_" + UUID.randomUUID().toString().substring(0, 8)
                      mqttClient = MqttClient(brokerUrl, clientId, MemoryPersistence())
                      val options = MqttConnectOptions().apply {
                          isAutomaticReconnect = true
                          isCleanSession = true
                          connectionTimeout = 10
                      }

                      mqttClient?.setCallback(object : MqttCallback {
                          override fun connectionLost(cause: Throwable?) {
                              runOnUiThread {
                                  tvStatus.text = "✖ MQTT Отключен"
                                  tvStatus.setTextColor(getColor(R.color.status_red))
                              }
                          }

                          override fun messageArrived(topic: String?, message: MqttMessage?) {
                              val payload = message?.toString() ?: return
                              runOnUiThread {
                                  if (topic == topicTelemetry) {
                                      updateDashboard(payload)
                                  } else if (topic == topicCommands) {
                                      tvLogs.append("\n📥 Получена команда: $payload")
                                      Toast.makeText(this@MainActivity, "Команда аппарату: $payload", Toast.LENGTH_SHORT).show()
                                  }
                              }
                          }

                          override fun deliveryComplete(token: IMqttDeliveryToken?) {}
                      })

                      mqttClient?.connect(options)
                      mqttClient?.subscribe(topicTelemetry)
                      mqttClient?.subscribe(topicCommands)

                      tvStatus.text = "● MQTT Онлайн (HiveMQ Cloud)"
                      tvStatus.setTextColor(getColor(R.color.status_green))

                  } catch (e: Exception) {
                      tvStatus.text = "Ошибка подключения к MQTT"
                      tvStatus.setTextColor(getColor(R.color.status_red))
                  }
              }

              private fun publishCommand(cmd: String) {
                  try {
                      val msg = MqttMessage(cmd.toByteArray())
                      msg.qos = 1
                      mqttClient?.publish(topicCommands, msg)
                      Toast.makeText(this, "Команда '$cmd' отправлена в аппарат", Toast.LENGTH_SHORT).show()
                  } catch (e: Exception) {
                      Toast.makeText(this, "Ошибка отправки: ${e.message}", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun sendTelemetryHeartbeat() {
                  try {
                      val data = TelemetryData(
                          temp = 92.5,
                          pressure = 9.1,
                          coffee = 82,
                          water = 90,
                          cups = 75,
                          totalCups = 142,
                          totalMoney = 25560,
                          status = "Готов к работе"
                      )
                      val json = gson.toJson(data)
                      val msg = MqttMessage(json.toByteArray())
                      mqttClient?.publish(topicTelemetry, msg)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun updateDashboard(json: String) {
                  try {
                      val data = gson.fromJson(json, TelemetryData::class.java)
                      findViewById<TextView>(R.id.tv_temp).text = "${data.temp}°C"
                      findViewById<TextView>(R.id.tv_pressure).text = "${data.pressure} Bar"
                      findViewById<TextView>(R.id.tv_status_mode).text = data.status

                      findViewById<TextView>(R.id.lbl_coffee).text = "Зерновой кофе: ${data.coffee}%"
                      findViewById<ProgressBar>(R.id.pb_coffee).progress = data.coffee

                      findViewById<TextView>(R.id.lbl_water).text = "Вода в баке: ${data.water}%"
                      findViewById<ProgressBar>(R.id.pb_water).progress = data.water

                      findViewById<TextView>(R.id.lbl_cups).text = "Стаканы: ${data.cups} шт"
                      findViewById<ProgressBar>(R.id.pb_cups).progress = data.cups

                      findViewById<TextView>(R.id.tv_sales_cups).text = "${data.totalCups} чашек"
                      findViewById<TextView>(R.id.tv_sales_money).text = "${data.totalMoney} ₽"
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try {
                      mqttClient?.disconnect()
                  } catch (e: Exception) { }
              }
          }
          EOF

