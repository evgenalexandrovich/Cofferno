name: Cofferno Full MVP Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Start Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot8923730105:AAFgMSUgh63L_1Xuad839ex4fXZmTpFR1_Q/sendMessage" \
            -d "chat_id=864227156" \
            -d "text=☕ Сборка Cofferno v4.6 (Live Heartbeat + Root Reboot) запущена..."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Complete Source Code
        run: |
          mkdir -p app/src/main/java/com/coffee/telemetry
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Cofferno"
          include ':app'
          EOF

          # 2. build.gradle (root)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.coffee.telemetry'
              compileSdk 34

              defaultConfig {
                  applicationId "com.coffee.telemetry"
                  minSdk 21
                  targetSdk 34
                  versionCode 6
                  versionName "4.6-Live"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.google.code.gson:gson:2.10.1'
              implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
          }
          EOF

          # 5. Resources
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Cofferno</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="coffee_dark">#3E2723</color>
              <color name="coffee_gold">#FFC107</color>
              <color name="coffee_primary">#6F4E37</color>
              <color name="bg">#F5F0EB</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="colorPrimary">@color/coffee_primary</item>
                  <item name="colorPrimaryDark">@color/coffee_dark</item>
                  <item name="colorAccent">@color/coffee_gold</item>
                  <item name="android:windowBackground">@color/bg</item>
              </style>
          </resources>
          EOF

          # Icon Foreground
          cat << 'EOF' > app/src/main/res/drawable/ic_cofferno_fg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFC107"
                  android:pathData="M34,46 v22 c0,8 8,14 16,14 h8 c8,0 16,-6 16,-14 V46 H34 z" />
              <path
                  android:strokeColor="#FFC107"
                  android:strokeWidth="4"
                  android:fillColor="#00000000"
                  android:pathData="M74,52 h6 c4,0 7,3 7,7 c0,4 -3,7 -7,7 h-6" />
              <path
                  android:strokeColor="#FFF8E1"
                  android:strokeWidth="3"
                  android:strokeLineCap="round"
                  android:fillColor="#00000000"
                  android:pathData="M44,38 c-2,-4 2,-8 0,-12" />
              <path
                  android:strokeColor="#FFF8E1"
                  android:strokeWidth="3"
                  android:strokeLineCap="round"
                  android:fillColor="#00000000"
                  android:pathData="M54,36 c-2,-4 2,-8 0,-12" />
              <path
                  android:strokeColor="#FFF8E1"
                  android:strokeWidth="3"
                  android:strokeLineCap="round"
                  android:fillColor="#00000000"
                  android:pathData="M64,38 c-2,-4 2,-8 0,-12" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/coffee_dark"/>
              <foreground android:drawable="@drawable/ic_cofferno_fg"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/coffee_dark"/>
              <foreground android:drawable="@drawable/ic_cofferno_fg"/>
          </adaptive-icon>
          EOF

          # Manifest (Исправлен и закрыт)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name="com.coffee.telemetry.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Создаем пустой класс MainActivity.kt (чтобы проект успешно собрался)
          cat << 'EOF' > app/src/main/java/com/coffee/telemetry/MainActivity.kt
          package com.coffee.telemetry

          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
              }
          }
          EOF

      # Шаг 6: Запуск сборки Android приложения (Генерируем APK)
      - name: Build Android APK
        run: gradle assembleDebug

      # Шаг 7: Отправка APK-файла в Telegram
      - name: Send APK to Telegram
        if: success()
        run: |
          curl -v -F "chat_id=864227156" \
               -F "caption=☕ Сборка Cofferno v4.6 завершена! Установочный APK во вложении." \
               -F "document=@app/build/outputs/apk/debug/app-debug.apk" \
               https://api.telegram.org/bot8923730105:AAFgMSUgh63L_1Xuad839ex4fXZmTpFR1_Q/sendDocument

      # Шаг 8: Уведомление в Telegram, если сборка упала
      - name: Notify Failure Telegram
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot8923730105:AAFgMSUgh63L_1Xuad839ex4fXZmTpFR1_Q/sendMessage" \
            -d "chat_id=864227156" \
            -d "text=❌ Ошибка при сборке Cofferno. Проверьте логи сборки на GitHub Actions."
