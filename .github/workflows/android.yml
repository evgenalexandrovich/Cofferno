                  renderFilterChips()
                  renderMachineSelectorList()

                  val tvLogs = findViewById<TextView>(R.id.tv_coffeenet_logs)
                  tvLogs.movementMethod = ScrollingMovementMethod.getInstance()
                  tvLogs.setOnTouchListener { v, event ->
                      v.parent.requestDisallowInterceptTouchEvent(true)
                      if (event.action == MotionEvent.ACTION_UP || event.action == MotionEvent.ACTION_CANCEL) {
                          v.parent.requestDisallowInterceptTouchEvent(false)
                      }
                      false
                  }

                  // Device ID UI
                  refreshDeviceIdUi()
                  findViewById<Button>(R.id.btn_detect_device_id).setOnClickListener {
                      Toast.makeText(this, "Ищу device id в logcat/файлах...", Toast.LENGTH_SHORT).show()
                      Executors.newSingleThreadExecutor().execute {
                          // сброс кэша чтобы пересканировать
                          getSharedPreferences("cofferno_agent", MODE_PRIVATE).edit()
                              .remove("levending_device_id").apply()
                          val id = LeVendingProbe.findDeviceId(this)
                          runOnUiThread {
                              refreshDeviceIdUi()
                              if (id.isBlank()) {
                                  Toast.makeText(this, "Не найден. Откройте настройки LE или сделайте продажу, затем ещё раз", Toast.LENGTH_LONG).show()
                              } else {
                                  Toast.makeText(this, "Device ID: $id", Toast.LENGTH_LONG).show()
                              }
                          }
                      }
                  }
                  findViewById<Button>(R.id.btn_use_device_id).setOnClickListener {
                      val id = getSharedPreferences("cofferno_agent", MODE_PRIVATE)
                          .getString("levending_device_id", "") ?: ""
                      if (id.isBlank()) {
                          Toast.makeText(this, "Сначала определите Device ID", Toast.LENGTH_SHORT).show()
                      } else {
                          getSharedPreferences("cofferno_agent", MODE_PRIVATE).edit()
                              .putString("custom_serial", id).apply()
                          findViewById<EditText>(R.id.et_agent_serial).setText(id)
                          // авто-добавить в список машин кабинета
                          val list = getSavedMachines().toMutableList()
                          if (!list.contains(id)) {
                              list.add(id)
                              saveMachines(list)
                          }
                          currentSelectedSerial = id
                          renderFilterChips()
                          renderMachineSelectorList()
                          reconnectMqtt()
                          Toast.makeText(this, "S/N = $id (добавлен в сеть)", Toast.LENGTH_LONG).show()
                      }
                  }

                  findViewById<Button>(R.id.btn_refresh_top).setOnClickListener {
                      if (selectedFilterSerial == "ALL") getSavedMachines().forEach { sendMachineCmd(it, "REQUEST_UPDATE") }
                      else sendMachineCmd(selectedFilterSerial, "REQUEST_UPDATE")
                      Toast.makeText(this, "🔄 Запрос данных...", Toast.LENGTH_SHORT).show()
                  }

                  findViewById<Button>(R.id.btn_add_machine).setOnClickListener {
                      val sn = findViewById<EditText>(R.id.et_new_serial).text.toString().trim().lowercase()
                      if (sn.isNotEmpty()) {
                          val list = getSavedMachines().toMutableList()
                          if (!list.contains(sn)) {
                              list.add(sn)
                              saveMachines(list)
                              currentSelectedSerial = sn
                              renderFilterChips()
                              renderMachineSelectorList()
                              reconnectMqtt()
                              Toast.makeText(this, "Аппарат $sn добавлен", Toast.LENGTH_SHORT).show()
                          }
                          findViewById<EditText>(R.id.et_new_serial).text.clear()
                      }
                  }

                  findViewById<Button>(R.id.btn_save_name).setOnClickListener {
                      val newName = findViewById<EditText>(R.id.et_custom_name).text.toString().trim()
                      if (currentSelectedSerial.isNotEmpty() && newName.isNotEmpty()) {
                          saveMachineName(currentSelectedSerial, newName)
                          updateHeaderActiveMachine(); renderFilterChips(); renderMachineSelectorList()
                          findViewById<EditText>(R.id.et_custom_name).text.clear()
                          Toast.makeText(this, "Имя сохранено", Toast.LENGTH_SHORT).show()
                      }
                  }

                  findViewById<Button>(R.id.btn_save_all_costs).setOnClickListener {
                      saveAllCostsFromInputs()
                      Toast.makeText(this, "Себестоимость сохранена", Toast.LENGTH_SHORT).show()
                      renderSalesUi()
                  }

                  findViewById<Button>(R.id.btn_reset_counters).setOnClickListener {
                      if (currentSelectedSerial.isEmpty()) Toast.makeText(this, "Выберите аппарат", Toast.LENGTH_SHORT).show()
                      else {
                          sendMachineCmd(currentSelectedSerial, "RESET_COUNTERS")
                          Toast.makeText(this, "Сброс отправлен", Toast.LENGTH_SHORT).show()
                      }
                  }
                  findViewById<Button>(R.id.btn_remote_reboot).setOnClickListener {
                      if (currentSelectedSerial.isEmpty()) Toast.makeText(this, "Выберите аппарат", Toast.LENGTH_SHORT).show()
                      else sendMachineCmd(currentSelectedSerial, "REBOOT_MACHINE")
                  }
                  findViewById<Button>(R.id.btn_remote_flush).setOnClickListener {
                      sendMachineCmd(currentSelectedSerial, "FLUSH")
                  }
                  findViewById<Button>(R.id.btn_remote_lock).setOnClickListener {
                      sendMachineCmd(currentSelectedSerial, "TOGGLE_LOCK")
                  }

                  val agentPrefs = getSharedPreferences("cofferno_agent", MODE_PRIVATE)
                  val etAgentSn = findViewById<EditText>(R.id.et_agent_serial)
                  val saved = agentPrefs.getString("custom_serial", "") ?: ""
                  val dev = agentPrefs.getString("levending_device_id", "") ?: ""
                  val fallback = Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: "unit_1"
                  etAgentSn.setText(when {
                      saved.isNotEmpty() -> saved
                      dev.isNotEmpty() -> dev
                      else -> fallback
                  })

                  findViewById<Button>(R.id.btn_save_agent_serial).setOnClickListener {
                      val sn = etAgentSn.text.toString().trim().lowercase()
                      if (sn.isNotEmpty()) {
                          agentPrefs.edit().putString("custom_serial", sn).apply()
                          Toast.makeText(this, "S/N сохранён: $sn", Toast.LENGTH_LONG).show()
                      }
                  }

                  val sw = findViewById<SwitchMaterial>(R.id.switch_agent)
                  val tvSt = findViewById<TextView>(R.id.tv_agent_status)
                  sw.isChecked = agentPrefs.getBoolean("agent_active", false)
                  tvSt.text = if (sw.isChecked) "🟢 Служба активна (A+B)" else "Остановлена"
                  sw.setOnCheckedChangeListener { _, on ->
                      agentPrefs.edit().putBoolean("agent_active", on).apply()
                      if (on) {
                          tvSt.text = "🟢 Запуск..."
                          val i = Intent(this, AgentService::class.java)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i) else startService(i)
                          mainHandler.postDelayed({ moveTaskToBack(true) }, 800L)
                      } else {
                          stopService(Intent(this, AgentService::class.java))
                          tvSt.text = "Остановлена"
                      }
                  }

                  findViewById<Button>(R.id.btn_scan_coffeenet).setOnClickListener {
                      tvLogs.text = "⏳ Сканирование..."
                      tvLogs.scrollTo(0, 0)
                      Executors.newSingleThreadExecutor().execute {
                          val result = LeVendingProbe.fullScan(this)
                          runOnUiThread {
                              tvLogs.text = result
                              tvLogs.scrollTo(0, 0)
                              refreshDeviceIdUi()
                              Toast.makeText(this, "Готово", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }

                  // авто-детект device id при открытии
                  Executors.newSingleThreadExecutor().execute {
                      LeVendingProbe.findDeviceId(this)
                      runOnUiThread { refreshDeviceIdUi() }
                  }

                  reconnectMqtt()
                  mainHandler.post(watchdog)
              }

              private fun refreshDeviceIdUi() {
                  val id = getSharedPreferences("cofferno_agent", MODE_PRIVATE)
                      .getString("levending_device_id", "") ?: ""
                  findViewById<TextView>(R.id.tv_detected_device_id).text =
                      if (id.isBlank()) "не найден — нажмите «Определить» или сделайте продажу" else id
              }

              private fun refreshAgentSaleInfo() {
                  val p = getSharedPreferences("cofferno_agent", MODE_PRIVATE)
                  val name = p.getString("last_sale_name", "") ?: ""
                  val price = p.getInt("last_sale_price", 0)
                  val at = p.getLong("last_sale_at", 0L)
                  val tv = findViewById<TextView>(R.id.tv_last_sale) ?: return
                  if (at == 0L) {
                      tv.text = "Последняя продажа: —"
                  } else {
                      val t = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date(at))
                      tv.text = "Последняя продажа: $name · ${price}₽ · $t"
                  }
              }

              private fun updateHeaderActiveMachine() {
                  val tv = findViewById<TextView>(R.id.tv_active_machine)
                  tv.text = if (selectedFilterSerial == "ALL") "Режим: 🌐 Вся сеть"
                  else "Режим: ☕ ${getMachineName(selectedFilterSerial)} ($selectedFilterSerial)"
              }

              private fun renderFilterChips() {
                  val container = findViewById<LinearLayout>(R.id.ll_filter_chips)
                  container.removeAllViews()
                  fun addChip(label: String, serial: String) {
                      val isSel = selectedFilterSerial == serial
                      val btn = Button(this).apply {
                          text = label
                          textSize = 12f
                          setBackgroundColor(if (isSel) c(R.color.accent) else c(R.color.card))
                          setTextColor(if (isSel) c(R.color.dark) else c(R.color.white))
                          setOnClickListener {
                              selectedFilterSerial = serial
                              if (serial != "ALL") currentSelectedSerial = serial
                              updateHeaderActiveMachine(); renderFilterChips(); renderMachineSelectorList(); renderSalesUi()
                          }
                      }
                      val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      lp.setMargins(0, 0, 12, 0)
                      container.addView(btn, lp)
                  }
                  addChip("🌐 Все", "ALL")
                  getSavedMachines().forEach { addChip("☕ ${getMachineName(it)}", it) }
              }

              private fun renderMachineSelectorList() {
                  val container = findViewById<LinearLayout>(R.id.ll_machine_selector)
                  container.removeAllViews()
                  val machines = getSavedMachines()
                  if (machines.isEmpty()) {
                      container.addView(TextView(this).apply {
                          text = "Добавьте Device ID (00000010546) или нажмите «Использовать Device ID» на вкладке Аппарат"
                          setTextColor(c(R.color.muted)); textSize = 12f
                      })
                      return
                  }
                  for (sn in machines) {
                      val sel = sn == currentSelectedSerial
                      val btn = Button(this).apply {
                          text = if (sel) "✅ ${getMachineName(sn)} [$sn]" else "• ${getMachineName(sn)} [$sn]"
                          setBackgroundColor(if (sel) c(R.color.accent) else c(R.color.card))
                          setTextColor(if (sel) c(R.color.dark) else c(R.color.white))
                          textSize = 12f
                          setOnClickListener {
                              currentSelectedSerial = sn
                              renderMachineSelectorList()
                          }
                      }
                      val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      lp.setMargins(0, 4, 0, 4)
                      container.addView(btn, lp)
                  }
              }

              private fun reconnectMqtt() {
                  Executors.newSingleThreadExecutor().execute {
                      while (true) {
                          try {
                              if (mqttClient == null || mqttClient?.isConnected == false) {
                                  mqttClient = MqttClient(broker, "Phone_${System.currentTimeMillis() % 100000L}", MemoryPersistence())
                                  mqttClient?.connect(MqttConnectOptions().apply {
                                      isAutomaticReconnect = true
                                      connectionTimeout = 15
                                      keepAliveInterval = 30
                                  })
                                  mqttClient?.setCallback(object : MqttCallback {
                                      override fun connectionLost(cause: Throwable?) { isMqttConnected = false }
                                      override fun messageArrived(topic: String?, message: MqttMessage?) {
                                          try {
                                              val packet = gson.fromJson(message?.toString() ?: return, TelemetryPacket::class.java)
                                              machinePackets[packet.serial] = packet
                                              lastMsgTime = System.currentTimeMillis()
                                              // если пришёл deviceId — запомним
                                              if (packet.deviceId.isNotBlank()) {
                                                  getSharedPreferences("cofferno_agent", MODE_PRIVATE).edit()
                                                      .putString("levending_device_id", packet.deviceId).apply()
                                              }
                                              runOnUiThread {
                                                  renderSalesUi()
                                                  renderCostInputs(packet)
                                                  refreshDeviceIdUi()
                                              }
                                          } catch (_: Exception) {}
                                      }
                                      override fun deliveryComplete(token: IMqttDeliveryToken?) {}
                                  })
                                  mqttClient?.subscribe("cofferno/+/data", 1)
                                  isMqttConnected = true
                              }
                          } catch (_: Exception) { isMqttConnected = false }
                          try { Thread.sleep(5000L) } catch (_: Exception) {}
                      }
                  }
              }

              private fun sendMachineCmd(serial: String, cmd: String) {
                  Executors.newSingleThreadExecutor().execute {
                      try {
                          if (serial.isNotEmpty() && mqttClient?.isConnected == true) {
                              mqttClient?.publish("cofferno/$serial/cmd", MqttMessage(cmd.toByteArray()).apply { qos = 1 })
                          }
                      } catch (_: Exception) {}
                  }
              }

              private fun renderSalesUi() {
                  val drinksContainer = findViewById<LinearLayout>(R.id.ll_drinks_container)
                  val tvSummaryTitle = findViewById<TextView>(R.id.tv_summary_title)
                  drinksContainer.removeAllViews()
                  val packets = if (selectedFilterSerial == "ALL") {
                      tvSummaryTitle.text = "💰 Выручка (все)"
                      machinePackets.values.toList()
                  } else {
                      tvSummaryTitle.text = "💰 ${getMachineName(selectedFilterSerial)}"
                      listOfNotNull(machinePackets[selectedFilterSerial])
                  }
                  if (packets.isEmpty()) {
                      drinksContainer.addView(TextView(this).apply {
                          text = "Нет данных. На автомате включите службу и сделайте продажу."
                          setTextColor(c(R.color.muted)); setPadding(16, 24, 16, 24)
                      })
                      findViewById<TextView>(R.id.tv_total_revenue).text = "0 ₽"
                      findViewById<TextView>(R.id.tv_total_profit).text = "0 ₽"
                      findViewById<TextView>(R.id.tv_total_cups).text = "Всего: 0"
                      return
                  }
                  val map = LinkedHashMap<String, MergedDrink>()
                  var rev = 0; var prof = 0; var cups = 0
                  for (p in packets) for (d in p.drinks) {
                      val cost = getDrinkCost(d.name)
                      val e = map[d.name]
                      if (e == null) map[d.name] = MergedDrink(d.name, d.count, d.price, cost)
                      else e.count += d.count
                  }
                  for ((_, d) in map) {
                      val r = d.count * d.price
                      val pr = d.count * (d.price - d.cost)
                      rev += r; prof += pr; cups += d.count
                      val card = MaterialCardView(this).apply {
                          setCardBackgroundColor(c(R.color.card)); radius = 16f
                          layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).also { it.setMargins(0,0,0,12) }
                          addView(LinearLayout(this@MainActivity).apply {
                              orientation = LinearLayout.VERTICAL; setPadding(24, 20, 24, 20)
                              addView(TextView(this@MainActivity).apply {
                                  text = "☕ ${d.name} × ${d.count}"
                                  setTextColor(c(R.color.white)); textSize = 15f; setTypeface(null, android.graphics.Typeface.BOLD)
                              })
                              addView(TextView(this@MainActivity).apply {
                                  text = "Цена ${d.price}₽ · себес ${d.cost}₽ · выручка $r₽ · +$pr₽"
                                  setTextColor(c(R.color.muted)); textSize = 12f
                              })
                          })
                      }
                      drinksContainer.addView(card)
                  }
                  findViewById<TextView>(R.id.tv_total_revenue).text = "$rev ₽"
                  findViewById<TextView>(R.id.tv_total_profit).text = "$prof ₽"
                  findViewById<TextView>(R.id.tv_total_cups).text = "Всего напитков: $cups"
              }

              private fun renderCostInputs(packet: TelemetryPacket) {
                  val box = findViewById<LinearLayout>(R.id.ll_costs_container)
                  if (box.childCount > 0) return
                  for (d in packet.drinks) {
                      box.addView(LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          setPadding(0, 6, 0, 6)
                          addView(TextView(this@MainActivity).apply {
                              text = d.name; setTextColor(c(R.color.white)); textSize = 13f
                              layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                          })
                          addView(EditText(this@MainActivity).apply {
                              setText(getDrinkCost(d.name).toString())
                              setTextColor(c(R.color.accent)); inputType = android.text.InputType.TYPE_CLASS_NUMBER
                              tag = d.name
                              layoutParams = LinearLayout.LayoutParams(160, LinearLayout.LayoutParams.WRAP_CONTENT)
                          })
                      })
                  }
              }

              private fun saveAllCostsFromInputs() {
                  val box = findViewById<LinearLayout>(R.id.ll_costs_container)
                  val ed = getSharedPreferences("cofferno_costs", MODE_PRIVATE).edit()
                  for (i in 0 until box.childCount) {
                      val row = box.getChildAt(i) as? LinearLayout ?: continue
                      val et = row.getChildAt(1) as? EditText ?: continue
                      val name = et.tag as? String ?: continue
                      ed.putInt("cost_$name", et.text.toString().toIntOrNull() ?: 40)
                  }
                  ed.apply()
              }

              private fun getDrinkCost(n: String) =
                  getSharedPreferences("cofferno_costs", MODE_PRIVATE).getInt("cost_$n", 40)

              private fun getSavedMachines(): List<String> {
                  val raw = getSharedPreferences("cofferno_app", MODE_PRIVATE).getString("machines_list", "") ?: ""
                  return if (raw.isBlank()) emptyList() else raw.split(",").filter { it.isNotBlank() }
              }
              private fun saveMachines(list: List<String>) {
                  getSharedPreferences("cofferno_app", MODE_PRIVATE).edit()
                      .putString("machines_list", list.distinct().joinToString(",")).apply()
              }
              private fun getMachineName(serial: String): String {
                  val n = getSharedPreferences("cofferno_names", MODE_PRIVATE).getString("name_$serial", "") ?: ""
                  return if (n.isNotBlank()) n else "LE $serial"
              }
              private fun saveMachineName(serial: String, name: String) {
                  getSharedPreferences("cofferno_names", MODE_PRIVATE).edit().putString("name_$serial", name).apply()
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Send APK to Telegram
        if: success()
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          curl -F chat_id="${{ env.CHAT_ID }}" \
               -F document=@"$APK" \
               -F caption="☕ <b>Cofferno 7.2</b>%0AA: продажи MakeDrink%0AB: имя/цена%0ADevice ID auto" \
               -F parse_mode=HTML \
               "https://api.telegram.org/bot${{ env.BOT_TOKEN }}/sendDocument"

      - name: Fail alert
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ env.CHAT_ID }}" \
            -d text="❌ Сборка 7.2 упала" \
            -d parse_mode=HTML
