name: Stable Build Delivery

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Start
        run: |
          curl -s -X POST "https://api.telegram.org/bot8923730105:AAGxhDICR3BtkaKeDOo2WiZE3OrdS_qiYk4/sendMessage" \
            -d "chat_id=864227156" \
            -d "text=🚀 Попытка №2: Начинаю глубокую компиляцию. Это займет около 2-3 минут..."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Project
        run: |
          mkdir -p app/src/main/java/com/coffee/telemetry
          mkdir -p app/src/main/res/values

          # 1. Настройки сборщика
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx3072m
          EOF

          # 2. Список модулей
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LV307Telemetry"
          include ':app'
          EOF

          # 3. Главный файл сборки
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 4. Сборка приложения
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.coffee.telemetry'
              compileSdk 34
              defaultConfig {
                  applicationId "com.coffee.telemetry"
                  minSdk 21
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.google.code.gson:gson:2.10.1'
              implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
          }
          EOF

          # 5. Ресурсы
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources><string name="app_name">LV307 Telemetry</string></resources>
          EOF

          # 6. Манифест
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:label="LV307 Telemetry" android:theme="@style/Theme.MaterialComponents.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. Чистый код на Kotlin
          cat << 'EOF' > app/src/main/java/com/coffee/telemetry/MainActivity.kt
          package com.coffee.telemetry
          import android.os.Bundle
          import android.widget.*
          import android.graphics.Color
          import android.view.Gravity
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(60, 100, 60, 60)
                      setBackgroundColor(Color.parseColor("#F5F0EB"))
                  }
                  val head = TextView(this).apply {
                      text = "☕ LV307 TELEMETRY"
                      textSize = 28f
                      setTextColor(Color.parseColor("#6F4E37"))
                      gravity = Gravity.CENTER
                  }
                  val info = TextView(this).apply {
                      text = "\nПриложение успешно установлено.\n\nИдет настройка связи с сервером..."
                      textSize = 18f
                      setTextColor(Color.BLACK)
                      gravity = Gravity.CENTER
                  }
                  root.addView(head)
                  root.addView(info)
                  setContentView(root)
              }
          }
          EOF

      - name: Build APK
        id: build
        run: |
          chmod +x gradlew || gradle wrapper
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build_log.txt

      - name: Send APK
        if: success()
        run: |
          curl -F chat_id="864227156" \
               -F document=@app/build/outputs/apk/debug/app-debug.apk \
               -F caption="✅ Готово! Твой APK в файле выше." \
               https://api.telegram.org/bot8923730105:AAGxhDICR3BtkaKeDOo2WiZE3OrdS_qiYk4/sendDocument

      - name: Send Error Log
        if: failure()
        run: |
          ERROR_MSG=$(tail -n 20 build_log.txt | colrm 1 100 | tr -d '"' | tr -d '\n')
          curl -s -X POST "https://api.telegram.org/bot8923730105:AAGxhDICR3BtkaKeDOo2WiZE3OrdS_qiYk4/sendMessage" \
            -d "chat_id=864227156" \
            -d "text=❌ Ошибка сборки. Последние строки лога: $ERROR_MSG"
