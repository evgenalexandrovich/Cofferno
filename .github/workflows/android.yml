          package com.coffee.telemetry

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED || intent.action == "android.intent.action.QUICKBOOT_POWERON") {
                      val prefs = context.getSharedPreferences("cofferno_prefs", Context.MODE_PRIVATE)
                      val isAgentEnabled = prefs.getBoolean("agent_enabled", false)

                      if (isAgentEnabled) {
                          val serviceIntent = Intent(context, TelemetryAgentService::class.java)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              context.startForegroundService(serviceIntent)
                          } else {
                              context.startService(serviceIntent)
                          }
                      }
                  }
              }
          }
