name: Cofferno Full MVP Build

on:
  push:
  workflow_dispatch:

env:
  BOT_TOKEN: "8923730105:AAFgMSUgh63L_1Xuad839ex4fXZmTpFR1_Q"
  CHAT_ID: "864227156"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python for reliable Telegram upload
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Requests
        run: pip install requests

      # 1. Проверка Telegram-бота перед началом сборки
      - name: Check Telegram Bot & Send Start Notification
        run: |
          python3 - << 'EOF'
          import os, sys, requests

          token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          payload = {
              "chat_id": chat_id,
              "text": "☕ *Сборка Cofferno v4.6 запущена!*\nКомпилирую APK...",
              "parse_mode": "Markdown"
          }

          try:
              res = requests.post(url, json=payload, timeout=15)
              data = res.json()
              if not data.get("ok"):
                  print(f"❌ ОШИБКА TELEGRAM: {data.get('description')}")
                  print("👉 УБЕДИТЕСЬ, ЧТО ВЫ НАЖАЛИ /start В ДИАЛОГЕ С БОТОМ!")
                  sys.exit(1)
              print("✅ Связь с Telegram установлена успешно.")
          except Exception as e:
              print(f"❌ Сетевая ошибка при связи с Telegram: {e}")
              sys.exit(1)
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      # 2. Создание структуры исходников
      - name: Generate Complete Source Code
        run: |
          mkdir -p app/src/main/java/com/coffee/telemetry
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Cofferno"
          include ':app'
          EOF

          # build.gradle (Root)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          # gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.coffee.telemetry'
              compileSdk 34

              defaultConfig {
                  applicationId "com.coffee.telemetry"
                  minSdk 21
                  targetSdk 34
                  versionCode 6
                  versionName "4.6-Live"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.cardview:cardview:1.0.0'
          }
          EOF

          # Strings
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Cofferno Telemetry</string>
          </resources>
          EOF

          # Colors
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="coffee_dark">#2B1B17</color>
              <color name="coffee_card">#3E2723</color>
              <color name="coffee_gold">#FFC107</color>
              <color name="coffee_primary">#6F4E37</color>
              <color name="coffee_green">#4CAF50</color>
              <color name="coffee_red">#D32F2F</color>
              <color name="white">#FFFFFF</color>
              <color name="text_secondary">#D7CCC8</color>
              <color name="bg">#1E130F</color>
          </resources>
          EOF

          # Styles
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="colorPrimary">@color/coffee_primary</item>
                  <item name="colorPrimaryDark">@color/coffee_dark</item>
                  <item name="colorAccent">@color/coffee_gold</item>
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@color/coffee_dark</item>
              </style>
          </resources>
          EOF

          # Layout UI
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="@color/bg"
              android:padding="20dp"
              android:gravity="center_horizontal">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="☕ COFFERNO"
                  android:textSize="28sp"
                  android:textStyle="bold"
                  android:textColor="@color/coffee_gold"
                  android:layout_marginTop="20dp" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Telemetry &amp; Live Monitor v4.6"
                  android:textSize="14sp"
                  android:textColor="@color/text_secondary"
                  android:layout_marginBottom="24dp" />

              <androidx.cardview.widget.CardView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  app:cardCornerRadius="16dp"
                  app:cardElevation="6dp"
                  app:cardBackgroundColor="@color/coffee_card"
                  android:layout_marginBottom="16dp">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:padding="20dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:gravity="center_vertical">

                          <View
                              android:layout_width="12dp"
                              android:layout_height="12dp"
                              android:background="@color/coffee_green"
                              android:layout_marginEnd="8dp" />

                          <TextView
                              android:id="@+id/tvStatus"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Служба активна (ONLINE)"
                              android:textColor="@color/white"
                              android:textStyle="bold"
                              android:textSize="16sp" />
                      </LinearLayout>

                      <View
                          android:layout_width="match_parent"
                          android:layout_height="1dp"
                          android:background="#5D4037"
                          android:layout_marginTop="12dp"
                          android:layout_marginBottom="12dp" />

                      <TextView
                          android:id="@+id/tvHeartbeat"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="💓 Heartbeat: #0"
                          android:textColor="@color/coffee_gold"
                          android:textSize="15sp" />

                      <TextView
                          android:id="@+id/tvTime"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="🕒 Последний пинг: --:--:--"
                          android:textColor="@color/text_secondary"
                          android:textSize="14sp"
                          android:layout_marginTop="6dp" />
                  </LinearLayout>
              </androidx.cardview.widget.CardView>

              <Button
                  android:id="@+id/btnPing"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:text="ОТПРАВИТЬ ПИНГ"
                  android:textColor="@color/coffee_dark"
                  android:textStyle="bold"
                  android:backgroundTint="@color/coffee_gold"
                  android:layout_marginBottom="12dp" />

              <Button
                  android:id="@+id/btnReboot"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:text="⚡ ROOT REBOOT"
                  android:textColor="@color/white"
                  android:textStyle="bold"
                  android:backgroundTint="@color/coffee_red" />
          </LinearLayout>
          EOF

          # MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/coffee/telemetry/MainActivity.kt
          package com.coffee.telemetry

          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.widget.Button
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import java.io.DataOutputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.concurrent.thread

          class MainActivity : AppCompatActivity() {

              private var heartbeatCount = 0
              private val handler = Handler(Looper.getMainLooper())
              
              private lateinit var tvHeartbeat: TextView
              private lateinit var tvTime: TextView
              private lateinit var btnPing: Button
              private lateinit var btnReboot: Button

              private val heartbeatRunnable = object : Runnable {
                  override fun run() {
                      heartbeatCount++
                      val currentTime = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                      tvHeartbeat.text = "💓 Heartbeat: #$heartbeatCount (OK)"
                      tvTime.text = "🕒 Последний пинг: $currentTime"
                      handler.postDelayed(this, 2000)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  tvHeartbeat = findViewById(R.id.tvHeartbeat)
                  tvTime = findViewById(R.id.tvTime)
                  btnPing = findViewById(R.id.btnPing)
                  btnReboot = findViewById(R.id.btnReboot)

                  handler.post(heartbeatRunnable)

                  btnPing.setOnClickListener {
                      heartbeatCount++
                      val currentTime = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                      tvHeartbeat.text = "💓 Heartbeat: #$heartbeatCount (Ручной)"
                      tvTime.text = "🕒 Последний пинг: $currentTime"
                      Toast.makeText(this, "Heartbeat отправлен!", Toast.LENGTH_SHORT).show()
                  }

                  btnReboot.setOnClickListener {
                      executeRootReboot()
                  }
              }

              private fun executeRootReboot() {
                  thread {
                      try {
                          val process = Runtime.getRuntime().exec("su")
                          val os = DataOutputStream(process.outputStream)
                          os.writeBytes("reboot\n")
                          os.flush()
                          os.close()
                          handler.post {
                              Toast.makeText(this@MainActivity, "Команда Root Reboot отправлена", Toast.LENGTH_SHORT).show()
                          }
                      } catch (e: Exception) {
                          handler.post {
                              Toast.makeText(this@MainActivity, "Ошибка Root: ${e.message}", Toast.LENGTH_LONG).show()
                          }
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacks(heartbeatRunnable)
              }
          }
          EOF

          # Manifest
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name="com.coffee.telemetry.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      # 3. Сборка APK
      - name: Build Android APK
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 4. Отправка APK через Python со 100% гарантией доставки
      - name: Send APK Document to Telegram
        run: |
          python3 - << 'EOF'
          import os, sys, glob, requests

          token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]

          # Ищем скомпилированный APK
          apks = glob.glob("app/build/outputs/apk/debug/*.apk")
          if not apks:
              print("❌ ОШИБКА: Файл APK не найден в app/build/outputs/apk/debug/")
              sys.exit(1)

          apk_path = apks[0]
          apk_name = "Cofferno-v4.6.apk"
          size_mb = os.path.getsize(apk_path) / (1024 * 1024)

          print(f"📦 Найден файл: {apk_path} ({size_mb:.2f} MB)")
          print("🚀 Начинаю загрузку в Telegram...")

          url = f"https://api.telegram.org/bot{token}/sendDocument"

          with open(apk_path, "rb") as f:
              files = {
                  "document": (apk_name, f, "application/vnd.android.package-archive")
              }
              data = {
                  "chat_id": chat_id,
                  "caption": "☕ *Cofferno v4.6 готов!*\n\n📱 Статус: Собрано успешно\n⚡ Встроен Root Reboot и Telemetry UI",
                  "parse_mode": "Markdown"
              }

              res = requests.post(url, data=data, files=files, timeout=120)

          resp_json = res.json()
          print("Ответ сервера Telegram:", resp_json)

          if not resp_json.get("ok"):
              print("❌ Telegram отклонил файл!")
              sys.exit(1)

          print("🎉 APK успешно доставлен в ваш Telegram!")
          EOF

      # 5. Уведомление в случае сбоя
      - name: Notify On Failure
        if: failure()
        run: |
          python3 - << 'EOF'
          import os, requests
          token = os.environ.get("BOT_TOKEN")
          chat_id = os.environ.get("CHAT_ID")
          if token and chat_id:
              requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={"chat_id": chat_id, "text": "❌ Ошибка при сборке Cofferno! Посмотрите логи в GitHub Actions."}
              )
          EOF
