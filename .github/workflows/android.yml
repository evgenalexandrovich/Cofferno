                  findViewById<Button>(R.id.btn_reset_counters).setOnClickListener { if (currentSerial.isNotEmpty()) cmd(currentSerial, "RESET_COUNTERS") }
                  findViewById<Button>(R.id.btn_remote_reboot).setOnClickListener { if (currentSerial.isNotEmpty()) cmd(currentSerial, "REBOOT_MACHINE") }
                  findViewById<Button>(R.id.btn_remote_flush).setOnClickListener { cmd(currentSerial, "FLUSH") }
                  findViewById<Button>(R.id.btn_remote_lock).setOnClickListener { cmd(currentSerial, "TOGGLE_LOCK") }

                  val ap = getSharedPreferences("cofferno_agent", Context.MODE_PRIVATE)
                  val et = findViewById<EditText>(R.id.et_agent_serial)
                  val s = ap.getString("custom_serial", "") ?: ""
                  val d = ap.getString("levending_device_id", "") ?: ""
                  val fb = Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: "unit_1"
                  et.setText(if (s.isNotEmpty()) s else if (d.isNotEmpty()) d else fb)

                  findViewById<Button>(R.id.btn_save_agent_serial).setOnClickListener {
                      val sn = et.text.toString().trim().lowercase()
                      if (sn.isNotEmpty()) { ap.edit().putString("custom_serial", sn).apply(); Toast.makeText(this, "S/N сохранён", Toast.LENGTH_SHORT).show() }
                  }

                  val sw = findViewById<SwitchMaterial>(R.id.switch_agent)
                  val tvSt = findViewById<TextView>(R.id.tv_agent_status)
                  sw.isChecked = ap.getBoolean("agent_active", false)
                  tvSt.text = if (sw.isChecked) "Служба запущена" else "Остановлена"
                  sw.setOnCheckedChangeListener { _, on ->
                      ap.edit().putBoolean("agent_active", on).apply()
                      if (on) {
                          tvSt.text = "Запуск службы..."
                          val i = Intent(this, AgentService::class.java)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i) else startService(i)
                          handler.postDelayed({ moveTaskToBack(true) }, 800)
                      } else { stopService(Intent(this, AgentService::class.java)); tvSt.text = "Остановлена" }
                  }

                  findViewById<Button>(R.id.btn_scan_coffeenet).setOnClickListener {
                      tvL.text = "Идет сканирование логов..."; tvL.scrollTo(0, 0)
                      Executors.newSingleThreadExecutor().execute {
                          val r = LeVendingProbe.fullScan(this@MainActivity)
                          runOnUiThread { tvL.text = r; tvL.scrollTo(0, 0); refreshDevUi() }
                      }
                  }

                  Executors.newSingleThreadExecutor().execute { LeVendingProbe.findDeviceId(this@MainActivity); runOnUiThread { refreshDevUi() } }
                  reconnectMqtt()
                  handler.post(object : Runnable {
                      override fun run() {
                          val tv = findViewById<TextView>(R.id.tv_status)
                          when {
                              !isMqttConnected -> { tv.text = "MQTT: подключение..."; tv.setTextColor(col(R.color.yellow)) }
                              System.currentTimeMillis() - lastMsgTime > 9000 -> { tv.text = "Автоматы офлайн"; tv.setTextColor(col(R.color.red)) }
                              else -> { tv.text = "В сети | ${packets.size} авт."; tv.setTextColor(col(R.color.green)) }
                          }
                          val p = getSharedPreferences("cofferno_agent", Context.MODE_PRIVATE)
                          val at = p.getLong("last_sale_at", 0L)
                          findViewById<TextView>(R.id.tv_last_sale).text = if (at == 0L) "Посл. продажа: -"
                          else "Посл. продажа: ${p.getString("last_sale_name", "")} | ${p.getInt("last_sale_price", 0)} ₽ | ${SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date(at))}"
                          handler.postDelayed(this, 2000)
                      }
                  })
              }

              private fun refreshDevUi() {
                  val id = getSharedPreferences("cofferno_agent", Context.MODE_PRIVATE).getString("levending_device_id", "") ?: ""
                  findViewById<TextView>(R.id.tv_detected_device_id).text = if (id.isBlank()) "не найден" else id
              }

              private fun updateHeader() {
                  findViewById<TextView>(R.id.tv_active_machine).text =
                      if (selectedFilter == "ALL") "Все автоматы" else "${getName(selectedFilter)} ($selectedFilter)"
              }

              private fun renderChips() {
                  val c = findViewById<LinearLayout>(R.id.ll_filter_chips); c.removeAllViews()
                  chip(c, "ВСЕ", "ALL")
                  getSavedMachines().forEach { chip(c, getName(it), it) }
              }

              private fun chip(c: LinearLayout, label: String, sn: String) {
                  val b = Button(this).apply {
                      text = label; textSize = 12f
                      setBackgroundColor(if (selectedFilter == sn) col(R.color.accent) else col(R.color.card))
                      setTextColor(if (selectedFilter == sn) col(R.color.dark) else col(R.color.white))
                      setOnClickListener { selectedFilter = sn; if (sn != "ALL") currentSerial = sn; updateHeader(); renderChips(); renderSelector(); renderSales() }
                  }
                  c.addView(b, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { setMargins(0, 0, 12, 0) })
              }

              private fun renderSelector() {
                  val c = findViewById<LinearLayout>(R.id.ll_machine_selector); c.removeAllViews()
                  val m = getSavedMachines()
                  if (m.isEmpty()) { c.addView(TextView(this).apply { text = "Добавьте Device ID автомата"; setTextColor(col(R.color.muted)) }); return }
                  m.forEach { sn ->
                      val b = Button(this).apply {
                          text = "${getName(sn)} [$sn]"; textSize = 12f
                          setBackgroundColor(if (sn == currentSerial) col(R.color.accent) else col(R.color.card))
                          setTextColor(if (sn == currentSerial) col(R.color.dark) else col(R.color.white))
                          setOnClickListener { currentSerial = sn; renderSelector() }
                      }
                      c.addView(b, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { setMargins(0, 4, 0, 4) })
                  }
              }

              private fun reconnectMqtt() {
                  Executors.newSingleThreadExecutor().execute {
                      while (true) {
                          try {
                              if (mqttClient?.isConnected != true) {
                                  mqttClient = MqttClient(broker, "Phone_${System.currentTimeMillis() % 100000}", MemoryPersistence())
                                  mqttClient!!.setCallback(object : MqttCallback {
                                      override fun connectionLost(c: Throwable?) { isMqttConnected = false }
                                      override fun messageArrived(t: String?, m: MqttMessage?) {
                                          try {
                                              val p = gson.fromJson(m?.toString() ?: return, TelemetryPacket::class.java)
                                              packets[p.serial] = p; lastMsgTime = System.currentTimeMillis()
                                              runOnUiThread { renderSales(); renderCosts(p); refreshDevUi() }
                                          } catch (_: Exception) {}
                                      }
                                      override fun deliveryComplete(t: IMqttDeliveryToken?) {}
                                  })
                                  mqttClient!!.connect(MqttConnectOptions().apply { isAutomaticReconnect = true; connectionTimeout = 15; keepAliveInterval = 30 })
                                  mqttClient!!.subscribe("cofferno/+/data", 1)
                                  isMqttConnected = true
                              }
                          } catch (_: Exception) { isMqttConnected = false }
                          Thread.sleep(5000)
                      }
                  }
              }

              private fun cmd(sn: String, c: String) {
                  Executors.newSingleThreadExecutor().execute {
                      try { if (sn.isNotEmpty() && mqttClient?.isConnected == true) mqttClient!!.publish("cofferno/$sn/cmd", MqttMessage(c.toByteArray()).apply { qos = 1 }) } catch (_: Exception) {}
                  }
              }

              private fun renderSales() {
                  val dc = findViewById<LinearLayout>(R.id.ll_drinks_container); dc.removeAllViews()
                  val pk = if (selectedFilter == "ALL") { findViewById<TextView>(R.id.tv_summary_title).text = "Выручка: ВСЕ АВТОМАТЫ"; packets.values.toList() }
                  else { findViewById<TextView>(R.id.tv_summary_title).text = "Выручка: ${getName(selectedFilter)}"; packets[selectedFilter]?.let { listOf(it) } ?: emptyList() }
                  if (pk.isEmpty()) {
                      dc.addView(TextView(this).apply { text = "Нет данных. Включите службу агента и приготовьте напиток."; setTextColor(col(R.color.muted)) })
                      findViewById<TextView>(R.id.tv_total_revenue).text = "0 ₽"
                      findViewById<TextView>(R.id.tv_total_profit).text = "0 ₽"
                      findViewById<TextView>(R.id.tv_total_cups).text = "Стаканов: 0 шт."; return
                  }
                  val map = linkedMapOf<String, MergedDrink>(); var rev = 0; var prof = 0; var cups = 0
                  pk.forEach { p -> p.drinks.forEach { d ->
                      val cost = getCost(d.name); val e = map[d.name]
                      if (e == null) map[d.name] = MergedDrink(d.name, d.count, d.price, cost) else e.count += d.count
                  } }
                  map.values.forEach { d ->
                      val r = d.count * d.price; val pr = d.count * (d.price - d.cost)
                      rev += r; prof += pr; cups += d.count
                      val card = MaterialCardView(this).apply { setCardBackgroundColor(col(R.color.card)); radius = 16f; layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { setMargins(0, 0, 12, 12) } }
                      val ll = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(24, 20, 24, 20) }
                      ll.addView(TextView(this).apply { text = "${d.name} — ${d.count} шт."; setTextColor(col(R.color.white)); textSize = 15f; setTypeface(null, android.graphics.Typeface.BOLD) })
                      ll.addView(TextView(this).apply { text = "Цена: ${d.price} ₽ • Себ.: ${d.cost} ₽ • Выр.: $r ₽ • Приб.: $pr ₽"; setTextColor(col(R.color.muted)); textSize = 12f; setPadding(0, 4, 0, 0) })
                      card.addView(ll); dc.addView(card)
                  }
                  findViewById<TextView>(R.id.tv_total_revenue).text = "$rev ₽"
                  findViewById<TextView>(R.id.tv_total_profit).text = "$prof ₽ (прибыль)"
                  findViewById<TextView>(R.id.tv_total_cups).text = "Стаканов: $cups шт."
              }

              private fun renderCosts(p: TelemetryPacket) {
                  val b = findViewById<LinearLayout>(R.id.ll_costs_container); if (b.childCount > 0) return
                  p.drinks.forEach { d ->
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(0, 6, 0, 6) }
                      row.addView(TextView(this).apply { text = d.name; setTextColor(col(R.color.white)); layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f) })
                      row.addView(EditText(this).apply { setText("${getCost(d.name)}"); setTextColor(col(R.color.accent)); inputType = android.text.InputType.TYPE_CLASS_NUMBER; tag = d.name; layoutParams = LinearLayout.LayoutParams(160, LinearLayout.LayoutParams.WRAP_CONTENT) })
                      b.addView(row)
                  }
              }

              private fun saveCosts() {
                  val b = findViewById<LinearLayout>(R.id.ll_costs_container)
                  val ed = getSharedPreferences("cofferno_costs", Context.MODE_PRIVATE).edit()
                  for (i in 0 until b.childCount) {
                      val row = b.getChildAt(i) as? LinearLayout ?: continue
                      val et = row.getChildAt(1) as? EditText ?: continue
                      val n = et.tag as? String ?: continue
                      ed.putInt("cost_$n", et.text.toString().toIntOrNull() ?: 40)
                  }; ed.apply()
              }

              private fun getCost(n: String) = getSharedPreferences("cofferno_costs", Context.MODE_PRIVATE).getInt("cost_$n", 40)
              private fun getSavedMachines() = (getSharedPreferences("cofferno_app", Context.MODE_PRIVATE).getString("machines_list", "") ?: "").split(",").filter { it.isNotBlank() }
              private fun saveMachines(l: List<String>) { getSharedPreferences("cofferno_app", Context.MODE_PRIVATE).edit().putString("machines_list", l.distinct().joinToString(",")).apply() }
              private fun getName(s: String): String { val n = getSharedPreferences("cofferno_names", Context.MODE_PRIVATE).getString("name_$s", "") ?: ""; return if (n.isNotBlank()) n else "Автомат $s" }
              private fun saveName(s: String, n: String) { getSharedPreferences("cofferno_names", Context.MODE_PRIVATE).edit().putString("name_$s", n).apply() }
          }
          EOF

          echo "Project generated OK"

      # ============================================================
      #  СБОРКА APK
      # ============================================================
      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      # ============================================================
      #  СОХРАНЕНИЕ APK В GITHUB ARTIFACTS
      # ============================================================
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cofferno-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ============================================================
      #  ОТПРАВКА APK В TELEGRAM
      # ============================================================
      - name: Send APK to Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::warning::BOT_TOKEN or CHAT_ID secrets are not set! Skipping Telegram upload."
            echo "You can download the APK from the GitHub Actions Artifacts section above."
            exit 0
          fi

          echo "Sending APK to Telegram..."
          RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
            -F chat_id="$CHAT_ID" \
            -F document=@"$APK" \
            -F caption="☕ Cofferno LV-307 v7.2.7 (Сборка $(date +'%d.%m %H:%M'))" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument")

          echo "Telegram Response: $RESPONSE"

          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "✅ Successfully sent to Telegram!"
          else
            echo "::error::Telegram rejected document upload."
            exit 1
          fi

      # ============================================================
      #  ОТПРАВКА ОШИБОК СБОРКИ В TELEGRAM
      # ============================================================
      - name: Send errors to Telegram
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python3 - << 'PY'
          import urllib.parse, urllib.request, os

          log = ""
          if os.path.exists("build.log"):
              with open("build.log", "r", errors="ignore") as f:
                  lines = f.readlines()
              err = [l for l in lines if any(k in l for k in ["e: ", "FAILURE:", "What went wrong", "error:"])]
              log = "".join(err[-50:] if err else lines[-60:])

          text = f"❌ Сборка Cofferno завершилась ошибкой\n\n{log}"[:4000]
          token = os.environ.get("BOT_TOKEN", "")
          chat = os.environ.get("CHAT_ID", "")
          if token and chat:
              data = urllib.parse.urlencode({"chat_id": chat, "text": text}).encode()
              try:
                  urllib.request.urlopen(f"https://api.telegram.org/bot{token}/sendMessage", data=data)
              except Exception as e:
                  print(f"Telegram error: {e}")
          PY
