                      </LinearLayout>

                      <!-- TAB 2: УПРАВЛЕНИЕ -->
                      <LinearLayout android:id="@+id/tab_manage" android:layout_width="match_parent"
                          android:layout_height="wrap_content" android:orientation="vertical" android:visibility="gone">

                          <!-- Machine Selection & Renaming Card -->
                          <com.google.android.material.card.MaterialCardView
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              app:cardBackgroundColor="@color/card" app:cardCornerRadius="12dp"
                              android:layout_marginBottom="12dp">
                              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:orientation="vertical" android:padding="16dp">
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="☕ Мои кофемашины" android:textColor="@color/white"
                                      android:textSize="15sp" android:textStyle="bold" android:layout_marginBottom="8dp"/>
                                  
                                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:orientation="horizontal">
                                      <EditText android:id="@+id/et_new_serial" android:layout_width="0dp"
                                          android:layout_height="wrap_content" android:layout_weight="1"
