name: Build and Upload Direct Link

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Full Project
        run: |
          cat << 'ENDFILE' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          ENDFILE

          cat << 'ENDFILE' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LV307Telemetry"
          include ':app'
          ENDFILE

          cat << 'ENDFILE' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          ENDFILE

          mkdir -p app/src/main/java/com/coffee/telemetry
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat << 'ENDFILE' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.coffee.telemetry'
              compileSdk 34
              defaultConfig {
                  applicationId "com.coffee.telemetry"
                  minSdk 21
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          ENDFILE

          cat << 'ENDFILE' > app/src/main/res/values/colors.xml
          <resources>
              <color name="coffee_primary">#6F4E37</color>
              <color name="coffee_dark">#3E2723</color>
              <color name="coffee_accent">#FF8F00</color>
              <color name="bg">#F5F0EB</color>
          </resources>
          ENDFILE

          cat << 'ENDFILE' > app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="colorPrimary">@color/coffee_primary</item>
                  <item name="colorPrimaryDark">@color/coffee_dark</item>
                  <item name="colorAccent">@color/coffee_accent</item>
                  <item name="android:windowBackground">@color/bg</item>
              </style>
          </resources>
          ENDFILE

          cat << 'ENDFILE' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">LV307 Telemetry</string>
          </resources>
          ENDFILE

          cat << 'ENDFILE' > app/src/main/res/drawable/ic_app_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp"
              android:height="96dp"
              android:viewportWidth="96"
              android:viewportHeight="96">
              <path
                  android:fillColor="#6F4E37"
                  android:pathData="M24,36 h48 v32 c0,8 -8,14 -16,14 h-16 c-8,0 -16,-6 -16,-14 z"/>
              <path
                  android:strokeColor="#6F4E37"
                  android:strokeWidth="5"
                  android:pathData="M72,44 h8 c6,0 10,4 10,8 c0,4 -4,8 -10,8 h-8"/>
          </vector>
          ENDFILE

          cat << 'ENDFILE' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_app_logo"
                  android:roundIcon="@drawable/ic_app_logo"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".LV307Service" android:enabled="true" android:exported="false"/>
                  <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter>
                  </receiver>
              </application>
          </manifest>
          ENDFILE

          cat << 'ENDFILE' > app/src/main/java/com/coffee/telemetry/DataLayer.kt
          package com.coffee.telemetry

          import android.content.Context
          import android.content.SharedPreferences
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken

          data class DrinkConfig(var name: String = "", var sellPrice: Int = 0, var costPrice: Int = 0)
          data class SaleRecord(var drink: String = "", var sellPrice: Int = 0, var costPrice: Int = 0, var ts: Long = 0L)
          data class MachineInfo(var serial: String = "", var isOnline: Boolean = false, var errorCode: String = "0", var errorMsg: String = "OK", var lastDrink: String = "—", var lastUpdate: String = "—")
          data class RemoteCommand(val action: String = "", val value: Int = 0, val stringValue: String = "")

          class Storage(ctx: Context) {
              private val sp: SharedPreferences = ctx.getSharedPreferences("lv307_data", Context.MODE_PRIVATE)
              private val gson = Gson()

              fun saveUser(login: String, pass: String) { sp.edit().putString("user_login", login).putString("user_pass", pass).apply() }
              fun getLogin(): String = sp.getString("user_login", "") ?: ""
              fun getPass(): String = sp.getString("user_pass", "") ?: ""
              fun isLoggedIn(): Boolean = getLogin().isNotEmpty()

              fun addMachine(serial: String) {
                  val list = getMachines().toMutableList()
                  if (!list.contains(serial)) { list.add(serial); sp.edit().putString("machines", gson.toJson(list)).apply() }
              }
              fun removeMachine(serial: String) {
                  val list = getMachines().toMutableList(); list.remove(serial)
                  sp.edit().putString("machines", gson.toJson(list)).apply()
              }
              fun getMachines(): List<String> {
                  val json = sp.getString("machines", "[]") ?: "[]"
                  return gson.fromJson(json, object : TypeToken<List<String>>(){}.type) ?: emptyList()
              }

              fun saveDrinks(serial: String, drinks: List<DrinkConfig>) { sp.edit().putString("drinks_$serial", gson.toJson(drinks)).apply() }
              fun getDrinks(serial: String): List<DrinkConfig> {
                  val json = sp.getString("drinks_$serial", "") ?: ""
                  if (json.isEmpty()) return defaultDrinks()
                  return gson.fromJson(json, object : TypeToken<List<DrinkConfig>>(){}.type) ?: defaultDrinks()
              }
              fun defaultDrinks(): List<DrinkConfig> = listOf(
                  DrinkConfig("Эспрессо", 120, 25), DrinkConfig("Американо", 130, 28),
                  DrinkConfig("Капучино", 160, 35), DrinkConfig("Латте", 170, 38),
                  DrinkConfig("Горячий шоколад", 150, 30), DrinkConfig("Чай", 100, 15)
              )

              fun addSale(serial: String, sale: SaleRecord) {
                  val list = getSales(serial).toMutableList(); list.add(sale)
                  sp.edit().putString("sales_$serial", gson.toJson(list)).apply()
              }
              fun getSales(serial: String): List<SaleRecord> {
                  val json = sp.getString("sales_$serial", "[]") ?: "[]"
                  return gson.fromJson(json, object : TypeToken<List<SaleRecord>>(){}.type) ?: emptyList()
              }

              fun saveMachineInfo(serial: String, info: MachineInfo) { sp.edit().putString("info_$serial", gson.toJson(info)).apply() }
              fun getMachineInfo(serial: String): MachineInfo {
                  val json = sp.getString("info_$serial", "") ?: ""
                  return if (json.isEmpty()) MachineInfo(serial = serial) else gson.fromJson(json, MachineInfo::class.java)
              }
          }
          ENDFILE

          cat << 'ENDFILE' > app/src/main/java/com/coffee/telemetry/LV307Service.kt
          package com.coffee.telemetry

          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.IBinder
          import com.google.gson.Gson
          import org.eclipse.paho.client.mqttv3.*
          import org.eclipse.paho.client.mqttv3.persist.MemoryPersistence
          import java.text.SimpleDateFormat
          import java.util.*

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(ctx: Context?, intent: Intent?) {
                  if (intent?.action == Intent.ACTION_BOOT_COMPLETED) {
                      ctx?.startService(Intent(ctx, LV307Service::class.java))
                  }
              }
          }

          class LV307Service : Service() {
              private var mqtt: MqttClient? = null
              private val gson = Gson()
              private var serial = "LV307_001"
              private var data = MachineInfo()

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  serial = intent?.getStringExtra("serial") ?: "LV307_001"
                  data.serial = serial
                  connectMqtt()
                  return START_STICKY
              }
              override fun onBind(i: Intent?): IBinder? = null

              private fun connectMqtt() {
                  Thread {
                      try {
                          mqtt = MqttClient("tcp://broker.hivemq.com:1883", "SVC_${serial}_${UUID.randomUUID().toString().take(5)}", MemoryPersistence())
                          mqtt?.setCallback(object : MqttCallbackExtended {
                              override fun connectComplete(r: Boolean, s: String?) {
                                  mqtt?.subscribe("vending/$serial/commands", 1)
                                  sendTelemetry()
                              }
                              override fun connectionLost(c: Throwable?) {}
                              override fun deliveryComplete(t: IMqttDeliveryToken?) {}
                              override fun messageArrived(topic: String?, msg: MqttMessage?) {
                                  val cmd = gson.fromJson(String(msg?.payload ?: byteArrayOf()), RemoteCommand::class.java)
                                  handleCmd(cmd)
                              }
                          })
                          mqtt?.connect(MqttConnectOptions().apply { isAutomaticReconnect = true; isCleanSession = true })
                      } catch (e: Exception) { e.printStackTrace() }
                  }.start()
              }

              private fun handleCmd(cmd: RemoteCommand) {
                  when (cmd.action) {
                      "RESET_ERRORS" -> { data.errorCode = "0"; data.errorMsg = "OK" }
                      "REBOOT" -> try { Runtime.getRuntime().exec("reboot") } catch (e: Exception) {}
                      "SIM_SALE" -> { data.lastDrink = cmd.stringValue.ifEmpty { "Капучино" } }
                      "SIM_ERR" -> { data.errorCode = cmd.stringValue; data.errorMsg = "Ошибка ${cmd.stringValue}" }
                  }
                  sendTelemetry()
              }

              private fun sendTelemetry() {
                  data.isOnline = true
                  data.lastUpdate = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                  Thread {
                      try {
                          mqtt?.publish("vending/$serial/telemetry", MqttMessage(gson.toJson(data).toByteArray()).apply { qos = 1 })
                      } catch (e: Exception) {}
                  }.start()
              }
          }
          ENDFILE

          cat << 'ENDFILE' > app/src/main/java/com/coffee/telemetry/MainActivity.kt
          package com.coffee.telemetry

          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import com.google.gson.Gson
          import org.eclipse.paho.client.mqttv3.*
          import org.eclipse.paho.client.mqttv3.persist.MemoryPersistence
          import java.util.*

          class MainActivity : AppCompatActivity() {

              private lateinit var db: Storage
              private var mqtt: MqttClient? = null
              private val gson = Gson()
              private val C = object {
                  val primary = Color.parseColor("#6F4E37")
                  val dark = Color.parseColor("#3E2723")
                  val accent = Color.parseColor("#FF8F00")
                  val green = Color.parseColor("#2E7D32")
                  val red = Color.parseColor("#D32F2F")
                  val bg = Color.parseColor("#F5F0EB")
                  val card = Color.WHITE
                  val text = Color.parseColor("#212121")
                  val sec = Color.parseColor("#757575")
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  db = Storage(this)
                  if (db.isLoggedIn()) showRoleSelection() else showLogin()
              }

              private fun mkBtn(text: String, color: Int, onClick: () -> Unit): Button {
                  return Button(this).apply {
                      this.text = text; setTextColor(Color.WHITE)
                      background = GradientDrawable().apply { setColor(color); cornerRadius = 16f }
                      setPadding(32, 24, 32, 24); textSize = 15f
                      setOnClickListener { onClick() }
                  }
              }
              private fun mkCard(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(28, 24, 28, 24)
                      background = GradientDrawable().apply { setColor(C.card); cornerRadius = 20f }
                      elevation = 4f
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setMargins(0, 0, 0, 16) }
                  }
              }
              private fun mkLabel(text: String, size: Float = 13f, color: Int = C.sec, bold: Boolean = false): TextView {
                  return TextView(this).apply {
                      this.text = text; textSize = size; setTextColor(color)
                      if (bold) setTypeface(null, Typeface.BOLD)
                  }
              }
              private fun mkInput(hint: String, isPass: Boolean = false): EditText {
                  return EditText(this).apply {
                      this.hint = hint; setPadding(24, 20, 24, 20); textSize = 15f
                      background = GradientDrawable().apply { setColor(Color.parseColor("#EEEEEE")); cornerRadius = 12f }
                      if (isPass) inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setMargins(0, 0, 0, 16) }
                  }
              }
              private fun rootLayout(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(36, 48, 36, 36)
                      setBackgroundColor(C.bg)
                  }
              }

              private fun showLogin() {
                  val root = rootLayout()
                  root.addView(mkLabel("☕ LV307 TELEMETRY", 26f, C.dark, true).apply { gravity = Gravity.CENTER })
                  root.addView(mkLabel("Система мониторинга кофемашин", 14f, C.sec).apply { gravity = Gravity.CENTER; setPadding(0, 0, 0, 48) })
                  val login = mkInput("Логин")
                  val pass = mkInput("Пароль", true)
                  root.addView(login); root.addView(pass)
                  root.addView(mkBtn("ВОЙТИ", C.primary) {
                      if (login.text.toString() == db.getLogin() && pass.text.toString() == db.getPass()) showRoleSelection()
                      else Toast.makeText(this, "Неверный логин или пароль", Toast.LENGTH_SHORT).show()
                  })
                  root.addView(mkBtn("РЕГИСТРАЦИЯ", C.accent) {
                      if (login.text.isNotEmpty() && pass.text.isNotEmpty()) {
                          db.saveUser(login.text.toString(), pass.text.toString())
                          Toast.makeText(this, "Аккаунт создан!", Toast.LENGTH_SHORT).show()
                          showRoleSelection()
                      }
                  })
                  setContentView(root)
              }

              private fun showRoleSelection() {
                  val root = rootLayout()
                  root.addView(mkLabel("☕ LV307", 24f, C.dark, true).apply { gravity = Gravity.CENTER })
                  root.addView(mkLabel("Добро пожаловать, ${db.getLogin()}", 14f, C.sec).apply { gravity = Gravity.CENTER; setPadding(0, 0, 0, 40) })
                  root.addView(mkBtn("УСТАНОВИТЬ НА КОФЕМАШИНУ", C.dark) { showMachineSetup() })
                  root.addView(mkBtn("ОТКРЫТЬ ПУЛЬТ ОПЕРАТОРА", C.green) { showDashboard() })
                  root.addView(mkBtn("ВЫЙТИ", C.sec) { db.saveUser("", ""); showLogin() })
                  setContentView(root)
              }

              private fun showMachineSetup() {
                  val root = rootLayout()
                  root.addView(mkLabel("Установка на кофемашину", 20f, C.dark, 
