          # AgentService.kt
          cat << 'EOF' > $P/AgentService.kt
          package com.coffee.telemetry

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import android.provider.Settings
          import androidx.core.app.NotificationCompat
          import com.google.gson.Gson
          import org.eclipse.paho.client.mqttv3.IMqttDeliveryToken
          import org.eclipse.paho.client.mqttv3.MqttCallback
          import org.eclipse.paho.client.mqttv3.MqttClient
          import org.eclipse.paho.client.mqttv3.MqttConnectOptions
          import org.eclipse.paho.client.mqttv3.MqttMessage
          import org.eclipse.paho.client.mqttv3.persist.MemoryPersistence
          import java.util.concurrent.Executors
          import java.util.concurrent.ScheduledExecutorService
          import java.util.concurrent.TimeUnit

          class AgentService : Service() {
              private val broker = "tcp://broker.hivemq.com:1883"
              private var client: MqttClient? = null
              private val gson = Gson()
              private var wake: PowerManager.WakeLock? = null
              private var sched: ScheduledExecutorService? = null
              private val exec = Executors.newSingleThreadExecutor()
              private var drinkCounts = intArrayOf(45, 38, 29, 30)
              private val drinkNames = listOf("Эспрессо", "Капучино", "Латте", "Американо")
              private val drinkPrices = listOf(120, 180, 200, 130)

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  val ch = "cofferno_agent"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val mgr = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      mgr.createNotificationChannel(
                          NotificationChannel(ch, "Agent", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
                  val notif = NotificationCompat.Builder(this, ch)
                      .setContentTitle("☕ Cofferno Agent")
                      .setContentText("Телеметрия активна")
                      .setSmallIcon(android.R.drawable.stat_notify_sync)
                      .setOngoing(true)
                      .build()
                  startForeground(1, notif)

                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wake = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Cofferno:Wake")
                  wake?.acquire(86400000L)
                  startLoop()
              }

              private fun getSerial(): String {
                  return try {
                      Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: "UNKNOWN"
                  } catch (e: Exception) {
                      "UNKNOWN"
                  }
              }

              private fun startLoop() {
                  exec.execute {
                      while (wake?.isHeld == true) {
                          try {
                              if (client == null || client?.isConnected == false) {
                                  val sn = getSerial()
                                  client = MqttClient(broker, "AGT_$sn", MemoryPersistence())
                                  val opts = MqttConnectOptions().apply {
                                      isAutomaticReconnect = true
                                      connectionTimeout = 15
                                      keepAliveInterval = 30
                                  }
                                  client?.setCallback(object : MqttCallback {
                                      override fun connectionLost(cause: Throwable?) {}
                                      override fun messageArrived(topic: String?, message: MqttMessage?) {
                                          val cmd = message?.toString() ?: return
                                          when (cmd) {
                                              "RESET_COUNTERS" -> drinkCounts = intArrayOf(0, 0, 0, 0)
                                              "FLUSH" -> {}
                                              "TOGGLE_LOCK" -> {}
                                          }
                                      }
                                      override fun deliveryComplete(token: IMqttDeliveryToken?) {}
                                  })
                                  client?.connect(opts)
                                  client?.subscribe("cofferno/$sn/commands", 1)

                                  sched?.shutdownNow()
                                  sched = Executors.newSingleThreadScheduledExecutor()
                                  sched?.scheduleAtFixedRate({ send() }, 0, 3, TimeUnit.SECONDS)
                              }
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                          try { Thread.sleep(5000) } catch (e: Exception) {}
                      }
                  }
              }

              private fun send() {
                  try {
                      if (client?.isConnected != true) return
                      val drinks = drinkNames.indices.map {
                          DrinkData(drinkNames[it], drinkCounts[it], drinkPrices[it])
                      }
                      val pkt = TelemetryPacket(getSerial(), 93.2, 9.1, "Готов к выдаче", drinks)
                      val msg = MqttMessage(gson.toJson(pkt).toByteArray()).apply {
                          qos = 1
                          isRetained = true
                      }
                      client?.publish("cofferno/${getSerial()}/telemetry", msg)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              override fun onDestroy() {
                  sched?.shutdownNow()
                  exec.execute {
                      try { client?.disconnect() } catch (e: Exception) {}
                  }
                  wake?.release()
                  super.onDestroy()
              }
          }
          EOF

          # BootReceiver.kt
          cat << 'EOF' > $P/BootReceiver.kt
          package com.coffee.telemetry

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(ctx: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED ||
                      intent.action == "android.intent.action.QUICKBOOT_POWERON") {
                      val p = ctx.getSharedPreferences("cofferno", Context.MODE_PRIVATE)
                      if (p.getBoolean("agent_on", false)) {
                          val i = Intent(ctx, AgentService::class.java)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ctx.startForegroundService(i)
                          else ctx.startService(i)
                      }
                  }
              }
          }
          EOF

          # MainActivity.kt
          cat << 'EOF' > $P/MainActivity.kt
          package com.coffee.telemetry

          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import com.google.android.material.bottomnavigation.BottomNavigationView
          import com.google.android.material.switchmaterial.SwitchMaterial
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import org.eclipse.paho.client.mqttv3.IMqttDeliveryToken
          import org.eclipse.paho.client.mqttv3.MqttCallback
          import org.eclipse.paho.client.mqttv3.MqttClient
          import org.eclipse.paho.client.mqttv3.MqttConnectOptions
          import org.eclipse.paho.client.mqttv3.MqttMessage
          import org.eclipse.paho.client.mqttv3.persist.MemoryPersistence
          import java.util.concurrent.Executors

          class MainActivity : AppCompatActivity() {
              private val broker = "tcp://broker.hivemq.com:1883"
              private var client: MqttClient? = null
              private val gson = Gson()
              private var lastMsg = 0L
              private var isConnected = false
              private var currentSerial = ""
              private val handler = Handler(Looper.getMainLooper())
              private val executor = Executors.newSingleThreadExecutor()

              private val watchdog = object : Runnable {
                  override fun run() {
                      val tv = findViewById<TextView>(R.id.tv_status)
                      when {
                          !isConnected -> {
                              tv.text = "● Подключение к MQTT..."
                              tv.setTextColor(ContextCompat.getColor(this@MainActivity, R.color.yellow))
                          }
                          System.currentTimeMillis() - lastMsg > 9000 -> {
                              tv.text = "🔴 Аппарат оффлайн"
                              tv.setTextColor(ContextCompat.getColor(this@MainActivity, R.color.red))
                          }
                          else -> {
                              tv.text = "🟢 Аппарат онлайн"
                              tv.setTextColor(ContextCompat.getColor(this@MainActivity, R.color.green))
                          }
                      }
                      handler.postDelayed(this, 2000)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val prefs = getSharedPreferences("cofferno", Context.MODE_PRIVATE)

                  val tabSales = findViewById<LinearLayout>(R.id.tab_sales)
                  val tabManage = findViewById<LinearLayout>(R.id.tab_manage)
                  val tabAgent = findViewById<LinearLayout>(R.id.tab_agent)

                  findViewById<BottomNavigationView>(R.id.bottom_nav).setOnItemSelectedListener { item ->
                      tabSales.visibility = if (item.itemId == R.id.nav_sales) View.VISIBLE else View.GONE
                      tabManage.visibility = if (item.itemId == R.id.nav_manage) View.VISIBLE else View.GONE
                      tabAgent.visibility = if (item.itemId == R.id.nav_agent) View.VISIBLE else View.GONE
                      true
                  }

                  val mySerial = Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: "N/A"
                  findViewById<TextView>(R.id.tv_my_serial).text = "S/N этого устройства: $mySerial"

                  val machines = loadMachines()
                  if (machines.isNotEmpty()) {
                      currentSerial = machines[0]
                      findViewById<TextView>(R.id.tv_serial).text = "S/N: $currentSerial"
                  }
                  refreshMachineList()

                  findViewById<Button>(R.id.btn_add).setOnClickListener {
                      val sn = findViewById<EditText>(R.id.et_serial).text.toString().trim()
                      if (sn.isNotEmpty()) {
                          val list = loadMachines().toMutableList()
                          if (!list.contains(sn)) {
                              list.add(sn)
                              saveMachines(list)
                              if (currentSerial.isEmpty()) {
                                  currentSerial = sn
                                  findViewById<TextView>(R.id.tv_serial).text = "S/N: $sn"
                              }
                              refreshMachineList()
                              subscribeToMachine(sn)
                              Toast.makeText(this, "Аппарат $sn добавлен", Toast.LENGTH_SHORT).show()
                          }
                          findViewById<EditText>(R.id.et_serial).text.clear()
                      }
                  }

                  findViewById<Button>(R.id.btn_save_cost).setOnClickListener {
                      prefs.edit().apply {
                          putInt("cost_0", findViewById<EditText>(R.id.et_cost1).text.toString().toIntOrNull() ?: 35)
                          putInt("cost_1", findViewById<EditText>(R.id.et_cost2).text.toString().toIntOrNull() ?: 55)
                          putInt("cost_2", findViewById<EditText>(R.id.et_cost3).text.toString().toIntOrNull() ?: 60)
                          putInt("cost_3", findViewById<EditText>(R.id.et_cost4).text.toString().toIntOrNull() ?: 30)
                          apply()
                      }
                      Toast.makeText(this, "Себестоимость сохранена", Toast.LENGTH_SHORT).show()
                  }

                  findViewById<EditText>(R.id.et_cost1).setText(prefs.getInt("cost_0", 35).toString())
                  findViewById<EditText>(R.id.et_cost2).setText(prefs.getInt("cost_1", 55).toString())
                  findViewById<EditText>(R.id.et_cost3).setText(prefs.getInt("cost_2", 60).toString())
                  findViewById<EditText>(R.id.et_cost4).setText(prefs.getInt("cost_3", 30).toString())

                  findViewById<Button>(R.id.btn_reset).setOnClickListener {
                      sendCmd("RESET_COUNTERS")
                      Toast.makeText(this, "Счётчики обнулены", Toast.LENGTH_SHORT).show()
                  }
                  findViewById<Button>(R.id.btn_flush).setOnClickListener {
                      sendCmd("FLUSH")
                      Toast.makeText(this, "Промывка запущена", Toast.LENGTH_SHORT).show()
                  }
                  findViewById<Button>(R.id.btn_lock).setOnClickListener {
                      sendCmd("TOGGLE_LOCK")
                      Toast.makeText(this, "Команда блокировки отправлена", Toast.LENGTH_SHORT).show()
                  }

                  val sw = findViewById<SwitchMaterial>(R.id.switch_agent)
                  val tvAg = findViewById<TextView>(R.id.tv_agent_status)
                  sw.isChecked = prefs.getBoolean("agent_on", false)
                  tvAg.text = if (sw.isChecked) "🟢 Работает в фоне" else "Остановлена"

                  sw.setOnCheckedChangeListener { _, on ->
                      prefs.edit().putBoolean("agent_on", on).apply()
                      val serviceIntent = Intent(this, AgentService::class.java)
                      if (on) {
                          tvAg.text = "🟢 Запуск..."
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              startForegroundService(serviceIntent)
                          } else {
                              startService(serviceIntent)
                          }
                          handler.postDelayed({ moveTaskToBack(true) }, 1000)
                      } else {
                          stopService(serviceIntent)
                          tvAg.text = "Остановлена"
                      }
                  }

                  connectMqtt()
                  handler.post(watchdog)
              }

              private fun loadMachines(): List<String> {
                  val s = getSharedPreferences("cofferno", Context.MODE_PRIVATE).getString("machines", "[]")
                  return try {
                      gson.fromJson(s, object : TypeToken<List<String>>() {}.type) ?: emptyList()
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              private fun saveMachines(list: List<String>) {
                  getSharedPreferences("cofferno", Context.MODE_PRIVATE).edit()
                      .putString("machines", gson.toJson(list)).apply()
              }

              private fun refreshMachineList() {
                  val machines = loadMachines()
                  val tv = findViewById<TextView>(R.id.tv_machines)
                  if (machines.isEmpty()) {
                      tv.text = "Нет добавленных машин"
                  } else {
                      tv.text = machines.joinToString("\n") { sn ->
                          val mark = if (sn == currentSerial) " (Активен)" else ""
                          "• $sn$mark"
                      }
                  }
              }

              private fun connectMqtt() {
                  executor.execute {
                      try {
                          val clientId = "Phone_${System.currentTimeMillis() % 100000}"
                          client = MqttClient(broker, clientId, MemoryPersistence())
                          val opts = MqttConnectOptions().apply {
                              isAutomaticReconnect = true
                              connectionTimeout = 15
                              keepAliveInterval = 30
                          }
                          client?.setCallback(object : MqttCallback {
                              override fun connectionLost(cause: Throwable?) {
                                  isConnected = false
                              }
                              override fun messageArrived(topic: String?, message: MqttMessage?) {
                                  val json = message?.toString() ?: return
                                  lastMsg = System.currentTimeMillis()
                                  runOnUiThread { updateSales(json) }
                              }
                              override fun deliveryComplete(token: IMqttDeliveryToken?) {}
                          })
                          client?.connect(opts)
                          isConnected = true

                          val 
