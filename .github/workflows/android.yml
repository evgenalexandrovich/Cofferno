          package com.coffee.telemetry

          import android.content.Context
          import android.net.Uri
          import android.os.Environment
          import java.io.BufferedReader
          import java.io.File
          import java.io.InputStreamReader
          import java.net.URLDecoder
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.regex.Pattern

          object LeVendingProbe {

              private val devicePatterns = arrayOf(
                  Pattern.compile("deviceid=([0-9]{6,18})", Pattern.CASE_INSENSITIVE),
                  Pattern.compile("deviceId=([0-9]{6,18})", Pattern.CASE_INSENSITIVE),
                  Pattern.compile("device_id[=:]([0-9]{6,18})", Pattern.CASE_INSENSITIVE)
              )

              private val drinkPatterns = listOf(
                  Pattern.compile("""(?i)двойн\w*\s*эспрессо""") to "Двойной Эспрессо",
                  Pattern.compile("""(?i)двойн\w*\s*американо""") to "Двойной Американо",
                  Pattern.compile("""(?i)американо\s*с\s*молоком""") to "Американо с молоком",
                  Pattern.compile("""(?i)кофе\s*с\s*шоколадом""") to "Кофе с шоколадом",
                  Pattern.compile("""(?i)банан\s*в\s*шоколаде""") to "Банан в шоколаде",
                  Pattern.compile("""(?i)горячий\s*шоколад""") to "Горячий шоколад",
                  Pattern.compile("""(?i)флэт\s*уайт|флет\s*уайт""") to "Флэт Уайт",
                  Pattern.compile("""(?i)мокачино|моккачино""") to "Мокачино",
                  Pattern.compile("""(?i)капуч+ино""") to "Капучино",
                  Pattern.compile("""(?i)латте""") to "Латте",
                  Pattern.compile("""(?i)американо""") to "Американо",
                  Pattern.compile("""(?i)какао""") to "Какао",
                  Pattern.compile("""(?i)(?<![a-zа-я])раф(?![a-zа-я])""") to "Раф",
                  Pattern.compile("""(?i)эспрессо""") to "Эспрессо",
                  Pattern.compile("""(?i)double\s*espresso|doppio""") to "Двойной Эспрессо",
                  Pattern.compile("""(?i)double\s*americano""") to "Двойной Американо",
                  Pattern.compile("""(?i)americano\s*with\s*milk""") to "Американо с молоком",
                  Pattern.compile("""(?i)coffee\s*with\s*chocolate""") to "Кофе с шоколадом",
                  Pattern.compile("""(?i)banana\s*chocolate""") to "Банан в шоколаде",
                  Pattern.compile("""(?i)hot\s*chocolate""") to "Горячий шоколад",
                  Pattern.compile("""(?i)flat\s*white""") to "Флэт Уайт",
                  Pattern.compile("""(?i)cappuccino""") to "Капучино",
                  Pattern.compile("""(?i)latte""") to "Латте",
                  Pattern.compile("""(?i)americano""") to "Американо",
                  Pattern.compile("""(?i)cocoa""") to "Какао",
                  Pattern.compile("""(?i)raf""") to "Раф",
                  Pattern.compile("""(?i)espresso""") to "Эспрессо"
              )

              private val pricePatterns = arrayOf(
                  Pattern.compile("""(?i)(?:goodsPrice|salePrice|payAmount|price|amount|money|pay|sum|total|cost|fee|цена|сумма|стоимость)[=:\s]+([0-9]{2,5})(?:\.[0-9]+)?"""),
                  Pattern.compile("""(?i)["'](?:goodsPrice|salePrice|payAmount|price|amount)["']\s*:\s*([0-9]{2,5})(?:\.[0-9]+)?""")
              )

              private val goodsNamePatterns = arrayOf(
                  Pattern.compile("""(?i)(?:goodsName|productName|drinkName|drink|goods|product|title|name)=([^&\s]{2,80})"""),
                  Pattern.compile("""(?i)["'](?:goodsName|productName|drinkName|name)["']\s*:\s*["']([^"']{2,80})["']""")
              )

              fun findDeviceIdFromLogLine(line: String): String? {
                  for (p in devicePatterns) {
                      val m = p.matcher(line)
                      if (m.find()) return m.group(1)
                  }
                  return null
              }

              fun findDeviceId(context: Context): String {
                  val prefs = context.getSharedPreferences("cofferno_agent", Context.MODE_PRIVATE)
                  val saved = prefs.getString("levending_device_id", "") ?: ""
                  if (saved.isNotBlank()) return saved
                  val fromLog = scrapeDeviceIdFromLogcat()
                  if (fromLog != null) {
                      prefs.edit().putString("levending_device_id", fromLog).apply()
                      return fromLog
                  }
                  return ""
              }

              fun scrapeDeviceIdFromLogcat(): String? {
                  try {
                      val process = Runtime.getRuntime().exec(arrayOf("logcat", "-d", "-t", "500"))
                      val reader = BufferedReader(InputStreamReader(process.inputStream))
                      while (true) {
                          val line = reader.readLine() ?: break
                          val id = findDeviceIdFromLogLine(line)
                          if (id != null) return id
                      }
                  } catch (_: Exception) {}
                  return null
              }

              fun isApiSaleSuccess(line: String): Boolean {
                  val l = line.lowercase()
                  return l.contains("vmsalesuccess") ||
                      l.contains("sendoutgoodssuccess") ||
                      (l.contains("ylapi.levending") && (l.contains("sale") || l.contains("shipment") || l.contains("outgoods")))
              }

              fun isPrimarySaleMarker(line: String): Boolean {
                  if (isApiSaleSuccess(line)) return true
                  val l = line.lowercase()
                  if (l.contains("makedrink") || l.contains("makecoffee") || l.contains("alonedropcup")) {
                      return line.contains("START") || line.contains("Displayed") || line.contains("cmp=")
                  }
                  return false
              }

              fun isDropCupMarker(line: String): Boolean =
                  line.contains("AloneDropCupActivity") && (line.contains("Displayed") || line.contains("START"))

              fun isSaleMarker(line: String): Boolean {
                  val l = line.lowercase()
                  if (isApiSaleSuccess(line)) return true

                  if (l.contains("vmcoffeen") || l.contains("vmcoffeestandard") || l.contains("levending")) {
                      if (l.contains("makedrink") || l.contains("makecoffee") || l.contains("dropcup") ||
                          l.contains("payactivity") || l.contains("orderactivity") || l.contains("goodsdetail") ||
                          l.contains("dispense") || l.contains("shipment") || l.contains("outgoods")) {
                          return true
                      }
                  }
                  if (l.contains("zjhttp") && (l.contains("sale") || l.contains("order") || l.contains("goods") || l.contains("pay") || l.contains("shipment"))) {
                      return true
                  }
                  return false
              }

              fun isSystemNoise(line: String): Boolean {
                  val l = line.lowercase()
                  return l.contains("bufferqueueproducer") ||
                      l.contains("sf_frame_dur") ||
                      l.contains("inputdispatcher") ||
                      l.contains("win death") ||
                      l.contains("am_finish_activity") ||
                      l.contains("am_pause_activity") ||
                      l.contains("am_destroy_activity") ||
                      l.contains("am_focused_activity")
              }

              fun extractDrinkName(line: String): String? {
                  for (p in goodsNamePatterns) {
                      val m = p.matcher(line)
                      if (m.find()) {
                          var raw = m.group(1) ?: continue
                          try { raw = URLDecoder.decode(raw.replace("+", " "), "UTF-8") } catch (_: Exception) { raw = Uri.decode(raw).replace("+", " ") }
                          raw = raw.trim()
                          if (raw.isNotBlank() && raw.length in 2..60) {
                              for ((pat, ru) in drinkPatterns) {
                                  if (pat.matcher(raw).find()) return ru
                              }
                              return raw
                          }
                      }
                  }
                  for ((pat, ru) in drinkPatterns) {
                      if (pat.matcher(line).find()) return ru
                  }
                  return null
              }

              fun extractPrice(line: String): Int? {
                  for (p in pricePatterns) {
                      val m = p.matcher(line)
                      if (m.find()) {
                          val v = m.group(1)?.toDoubleOrNull()?.toInt() ?: continue
                          if (v in 10..2000) return v
                      }
                  }
                  return null
              }

              fun extractOrderId(line: String): String? {
                  val m = Pattern.compile("""(?i)orderid=([0-9]{6,32})""").matcher(line)
                  return if (m.find()) m.group(1) else null
              }

              fun fullScan(context: Context): String {
                  val timeStr = SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.getDefault()).format(Date())
                  val sb = StringBuilder("=== COFFERNO ОТЧЕТ [$timeStr] ===\n")
                  val dev = findDeviceId(context)
                  sb.append("ID автомата: ").append(if (dev.isBlank()) "НЕ ОПРЕДЕЛЕН" else dev).append("\n\n")

                  try {
                      val pkgs = context.packageManager.getInstalledPackages(0)
                      sb.append("--- ПРИЛОЖЕНИЯ АВТОМАТА ---\n")
                      for (p in pkgs) {
                          val n = p.packageName.lowercase()
                          if (n.contains("le.vm") || n.contains("vending") || n.contains("coffee") || n.contains("ylpush") || n.contains("zj"))
                              sb.append(" • ").append(p.packageName).append("\n")
                      }
                  } catch (e: Exception) { sb.append("Пакеты: ").append(e.message).append("\n") }

                  sb.append("\n--- ПОИСК ФАЙЛОВ ЛОГОВ ---\n")
                  val root = Environment.getExternalStorageDirectory()
                  val logDirs = arrayOf(
                      File(root, "vm_log"),
                      File(root, "levending"),
                      File(root, "Download"),
                      File("/sdcard/vm_log"),
                      File("/sdcard/Download"),
                      File(root, "Android/data/com.le.vmcoffeestandard/files")
                  )

                  val foundFiles = mutableListOf<File>()
                  for (dir in logDirs) {
                      if (dir.exists() && dir.isDirectory) {
                          dir.listFiles()?.forEach { file ->
                              if (file.isFile && (file.name.endsWith(".txt") || file.name.endsWith(".log") || file.name.contains("log", ignoreCase = true))) {
                                  foundFiles.add(file)
                              }
                          }
                      }
                  }

                  foundFiles.sortByDescending { it.lastModified() }
                  val newestLogFile = foundFiles.firstOrNull()

                  if (newestLogFile != null) {
                      sb.append("📄 Извлечено из файла: ${newestLogFile.name} (${newestLogFile.length() / 1024} KB)\n\n")
                      try {
                          val lines = newestLogFile.readLines()
                          val tail = lines.takeLast(35).joinToString("\n")
                          sb.append(tail).append("\n")
                      } catch (e: Exception) {
                          sb.append("Ошибка чтения файла: ").append(e.message).append("\n")
                      }
                  } else {
                      sb.append("Файлы логов .txt/.log на SD-карте не обнаружены.\n")
                  }

                  sb.append("\n--- СИСТЕМНЫЙ LOGCAT ---\n")
                  var reader: BufferedReader? = null
                  try {
                      val p = Runtime.getRuntime().exec(arrayOf("logcat", "-d", "-t", "800"))
                      reader = BufferedReader(InputStreamReader(p.inputStream))
                  } catch (_: Exception) {
                      try {
                          val pRoot = Runtime.getRuntime().exec(arrayOf("su", "-c", "logcat -d -t 800"))
                          reader = BufferedReader(InputStreamReader(pRoot.inputStream))
                      } catch (_: Exception) {}
                  }

                  if (reader != null) {
                      try {
                          var shown = 0
                          while (true) {
                              val line = reader.readLine() ?: break
                              if (isSystemNoise(line)) continue

                              val interesting = isSaleMarker(line) || findDeviceIdFromLogLine(line) != null ||
                                  line.contains("zjhttp", true) || line.contains("ylapi", true) ||
                                  extractDrinkName(line) != null || extractPrice(line) != null

                              if (interesting) {
                                  sb.append(if (line.length > 220) line.substring(0, 220) + "..." else line).append("\n")
                                  if (++shown >= 40) break
                              }
                          }
                          if (shown == 0) sb.append("Событий приготовления в буфере logcat пока нет.\n")
                      } catch (e: Exception) { sb.append("Ошибка logcat: ").append(e.message).append("\n") }
                  } else {
                      sb.append("Logcat недоступен в данной сессии.\n")
                  }

                  sb.append("\n=== КОНЕЦ ОТЧЕТА ===")
                  return sb.toString()
              }
          }
          EOF

          cat > $P/AgentService.kt << 'EOF'
          package com.coffee.telemetry

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import android.provider.Settings
          import androidx.core.app.NotificationCompat
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import org.eclipse.paho.client.mqttv3.*
          import org.eclipse.paho.client.mqttv3.persist.MemoryPersistence
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.util.UUID
          import java.util.concurrent.Executors
          import java.util.concurrent.ScheduledExecutorService
          import java.util.concurrent.TimeUnit

          class AgentService : Service() {

              private val broker = "tcp://broker.hivemq.com:1883"
              private var client: MqttClient? = null
              private val gson = Gson()
              private var wakeLock: PowerManager.WakeLock? = null
              private var sched: ScheduledExecutorService? = null
              
              private val loopExecutor = Executors.newSingleThreadExecutor()
              private val logcatExecutor = Executors.newSingleThreadExecutor()
              private val commandExecutor = Executors.newCachedThreadPool()

              private var lastSaleTs = 0L
              private var pendingName = ""
              private var pendingPrice = 0
              private var pendingMetaTs = 0L
              private var lastOrderId = ""

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  val ch = "cofferno_agent_ch"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                      getSystemService(NotificationManager::class.java)
                          ?.createNotificationChannel(NotificationChannel(ch, "Агент Cofferno", NotificationManager.IMPORTANCE_LOW))
                  val n = NotificationCompat.Builder(this, ch)
                      .setContentTitle("Cofferno LV-307")
                      .setContentText("Служба телеметрии и учета продаж А+Б")
                      .setSmallIcon(R.drawable.ic_app_icon).setOngoing(true).build()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q)
                      startForeground(101, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  else startForeground(101, n)

                  wakeLock = (getSystemService(Context.POWER_SERVICE) as PowerManager)
                      .newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Cofferno:Wake")
                  wakeLock?.acquire(86400000L)

                  try {
                      val id = LeVendingProbe.findDeviceId(this)
                      if (id.isNotBlank()) {
                          val p = prefs()
                          if (p.getString("custom_serial", "").isNullOrBlank())
                              p.edit().putString("custom_serial", id).apply()
                      }
                  } catch (_: Exception) {}

                  startAgentLoop()
                  startSaleInterceptor()
              }

              private fun prefs() = getSharedPreferences("cofferno_agent", Context.MODE_PRIVATE)

              private fun getMachineSerial(): String {
                  val c = prefs().getString("custom_serial", "") ?: ""
                  if (c.isNotBlank()) return c.trim().lowercase().replace(Regex("[^a-z0-9_-]"), "")
                  val d = prefs().getString("levending_device_id", "") ?: ""
                  if (d.isNotBlank()) return d.trim().lowercase().replace(Regex("[^a-z0-9_-]"), "")
                  return (Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: "lv307_unit")
                      .trim().lowercase().replace(Regex("[^a-z0-9_-]"), "")
              }

              private fun resolveDeviceId(): String {
                  val a = prefs().getString("levending_device_id", "") ?: ""
                  return if (a.isNotBlank()) a else prefs().getString("custom_serial", "") ?: ""
              }

              private fun loadDrinks(): MutableList<DrinkItem> {
                  val json = prefs().getString("drinks_json", "")
                  if (!json.isNullOrEmpty()) try {
                      val t = object : TypeToken<MutableList<DrinkItem>>() {}.type
                      val l: MutableList<DrinkItem>? = gson.fromJson(json, t)
                      if (l != null) return l
                  } catch (_: Exception) {}
                  return mutableListOf()
              }

              private fun saveDrinks(list: List<DrinkItem>) {
                  prefs().edit().putString("drinks_json", gson.toJson(list)).apply()
              }

              private fun registerDrinkSale(name: String, price: Int) {
                  val drinks = loadDrinks()
                  val found = drinks.firstOrNull { it.name.equals(name, ignoreCase = true) }
                  val finalPrice = if (price > 0) price else found?.price ?: 0

                  if (found != null) {
                      found.count++
                      if (finalPrice > 0) found.price = finalPrice
                  } else {
                      drinks.add(DrinkItem(drinks.size, name, 1, finalPrice, 0))
                  }
                  saveDrinks(drinks)
                  prefs().edit().putString("last_sale_name", name).putInt("last_sale_price", finalPrice)
                      .putLong("last_sale_at", System.currentTimeMillis()).apply()
                  sendHeartbeat()
              }

              private fun startSaleInterceptor() {
                  logcatExecutor.execute {
                      try {
                          val r = BufferedReader(InputStreamReader(
                              Runtime.getRuntime().exec(arrayOf("logcat", "-v", "time")).inputStream))
                          while (wakeLock?.isHeld == true) {
                              val line = r.readLine() ?: break
                              val now = System.currentTimeMillis()

                              LeVendingProbe.findDeviceIdFromLogLine(line)?.let { dev ->
                                  val p = prefs()
                                  val cleanDev = dev.trim().lowercase().replace(Regex("[^a-z0-9_-]"), "")
                                  if (p.getString("levending_device_id", "") != cleanDev) {
                                      val ed = p.edit().putString("levending_device_id", cleanDev)
                                      if (p.getString("custom_serial", "").isNullOrBlank()) ed.putString("custom_serial", cleanDev)
                                      ed.apply()
                                  }
                              }

                              if (line.contains("ZJHTTP", true) || line.contains("ylapi", true) ||
                                  line.contains("MakeDrink", true) || line.contains("AloneDropCup", true)) {
                                  LeVendingProbe.extractDrinkName(line)?.let { pendingName = it; pendingMetaTs = now }
                                  LeVendingProbe.extractPrice(line)?.let { pendingPrice = it; pendingMetaTs = now }
                              }

                              val orderId = LeVendingProbe.extractOrderId(line)
                              val apiSale = LeVendingProbe.isApiSaleSuccess(line)
                              val actSale = LeVendingProbe.isPrimarySaleMarker(line) || LeVendingProbe.isDropCupMarker(line)

                              if (apiSale || actSale) {
                                  val dupOrder = !orderId.isNullOrBlank() && orderId == lastOrderId
                                  val coolDown = now - lastSaleTs <= 20000L
                                  if (!dupOrder && !coolDown) {
                                      lastSaleTs = now
                                      if (!orderId.isNullOrBlank()) lastOrderId = orderId

                                      val fresh = (now - pendingMetaTs) < 120000L
                                      val drink = if (fresh && pendingName.isNotBlank()) pendingName else "Напиток"
                                      val price = if (fresh && pendingPrice > 0) pendingPrice else 0
                                      registerDrinkSale(drink, price)
                                  }
                              }
                          }
                      } catch (_: Exception) {}
                  }
              }

              private fun startAgentLoop() {
                  loopExecutor.execute {
                      while (wakeLock?.isHeld == true) {
                          try {
                              if (client?.isConnected != true) {
                                  try { client?.disconnect(); client?.close() } catch (_: Exception) {}
                                  val sn = getMachineSerial()
                                  val clientId = "Ag_" + UUID.randomUUID().toString().replace("-", "").take(15)
                                  client = MqttClient(broker, clientId, MemoryPersistence())
                                  val opt = MqttConnectOptions().apply { isAutomaticReconnect = true; connectionTimeout = 15; keepAliveInterval = 30 }
                                  client!!.connect(opt)
                                  client!!.subscribe("cofferno/$sn/cmd", 0)
                                  client!!.setCallback(object : MqttCallback {
                                      override fun connectionLost(c: Throwable?) {}
                                      override fun messageArrived(t: String?, m: MqttMessage?) {
                                          val cmd = m?.toString()?.trim() ?: return
                                          when (cmd) {
                                              "RESET_COUNTERS" -> {
                                                  saveDrinks(mutableListOf())
                                                  prefs().edit()
                                                      .remove("last_sale_name")
                                                      .remove("last_sale_price")
                                                      .remove("last_sale_at")
                                                      .apply()
                                                  sendHeartbeat()
                                              }
                                              "REQUEST_UPDATE" -> sendHeartbeat()
                                              "REBOOT_MACHINE" -> try { Runtime.getRuntime().exec(arrayOf("su", "-c", "reboot")) } catch (_: Exception) {}
                                              "SCAN_LOGS" -> {
                                                  commandExecutor.execute {
                                                      try {
                                                          val ackMsg = "⏳ Автомат [$sn]: собираю и упаковываю логи, подождите..."
                                                          client?.publish("cofferno/$sn/logs", MqttMessage(ackMsg.toByteArray(Charsets.UTF_8)).apply { qos = 0 })

                                                          val rawLogs = LeVendingProbe.fullScan(this@AgentService)
                                                          val capped = if (rawLogs.length > 3800) {
                                                              rawLogs.substring(0, 3700) + "\n\n[Внимание! Часть логов обрезана для бесперебойной передачи]"
                                                          } else rawLogs

                                                          client?.publish("cofferno/$sn/logs", MqttMessage(capped.toByteArray(Charsets.UTF_8)).apply { qos = 0 })
                                                      } catch (ex: Exception) {
                                                          val err = "Ошибка сбора логов на автомате: ${ex.message}"
                                                          try {
                                                              client?.publish("cofferno/$sn/logs", MqttMessage(err.toByteArray(Charsets.UTF_8)).apply { qos = 0 })
                                                          } catch (_: Exception) {}
                                                      }
                                                  }
                                              }
                                          }
                                      }
                                      override fun deliveryComplete(t: IMqttDeliveryToken?) {}
                                  })
                                  sched?.shutdownNow()
                                  sched = Executors.newSingleThreadScheduledExecutor()
                                  sched!!.scheduleAtFixedRate(Runnable { sendHeartbeat() }, 0, 4, TimeUnit.SECONDS)
                              }
                          } catch (_: Exception) {}
                          Thread.sleep(5000)
                      }
                  }
              }

              private fun sendHeartbeat() {
                  try {
                      if (client?.isConnected != true) return
                      val sn = getMachineSerial()
                      val p = prefs()
                      val pkt = TelemetryPacket(sn, 93.4, 9.2, "В норме", loadDrinks(),
                          resolveDeviceId(), p.getString("last_sale_name", "") ?: "",
                          p.getInt("last_sale_price", 0), p.getLong("last_sale_at", 0L))
                      // ФИКС КЭШИРОВАНИЯ: Сброшен флаг retained в false. Телеметрия передается строго в реальном времени!
                      client!!.publish("cofferno/$sn/data", MqttMessage(gson.toJson(pkt).toByteArray(Charsets.UTF_8)).apply { qos = 0; isRetained = false })
                  } catch (_: Exception) {}
              }

              override fun onDestroy() {
                  sched?.shutdownNow()
                  try { client?.disconnect(); client?.close() } catch (_: Exception) {}
                  wakeLock?.release()
                  super.onDestroy()
              }
          }
