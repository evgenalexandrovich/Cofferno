name: Cofferno LV-307 Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  CHAT_ID: ${{ secrets.CHAT_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Project
        run: |
          set -e
          B=app/src/main
          P=$B/java/com/coffee/telemetry
          mkdir -p $P $B/res/layout $B/res/values $B/res/menu

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Cofferno"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.coffee.telemetry'
              compileSdk 34
              defaultConfig {
                  applicationId "com.coffee.telemetry"
                  minSdk 23
                  targetSdk 34
                  versionCode 74
                  versionName "7.2.2"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              lint { abortOnError false; checkReleaseBuilds false }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          EOF

          cat > $B/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_LOGS"/>
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Cofferno LV-307"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:requestLegacyExternalStorage="true">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".AgentService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="dataSync"/>
                  <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > $B/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">Cofferno LV-307</string></resources>
          EOF

          cat > $B/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#110B09</color>
              <color name="card">#1F1613</color>
              <color name="accent">#D4A373</color>
              <color name="dark">#0A0605</color>
              <color name="white">#FFFFFF</color>
              <color name="muted">#A3928B</color>
              <color name="green">#4CAF50</color>
              <color name="yellow">#FFC107</color>
              <color name="red">#E53935</color>
              <color name="orange">#FF9800</color>
              <color name="blue">#42A5F5</color>
          </resources>
          EOF

          cat > $B/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/accent</item>
                  <item name="colorPrimaryDark">@color/dark</item>
                  <item name="colorAccent">@color/accent</item>
                  <item name="android:windowBackground">@color/bg</item>
              </style>
          </resources>
          EOF

          cat > $B/res/menu/bottom_nav.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@+id/nav_sales" android:title="Sales" android:icon="@android:drawable/ic_menu_agenda"/>
              <item android:id="@+id/nav_manage" android:title="Manage" android:icon="@android:drawable/ic_menu_manage"/>
              <item android:id="@+id/nav_agent" android:title="Agent" android:icon="@android:drawable/ic_menu_preferences"/>
          </menu>
          EOF

          cat > $B/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg">

              <LinearLayout
                  android:id="@+id/header"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:background="@color/card"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:padding="12dp"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent">

                  <LinearLayout
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:orientation="vertical">
                      <TextView
                          android:id="@+id/tv_header_title"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Cofferno LV-307"
                          android:textColor="@color/white"
                          android:textSize="17sp"
                          android:textStyle="bold" />
                      <TextView
                          android:id="@+id/tv_status"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Connecting..."
                          android:textColor="@color/yellow"
                          android:textSize="11sp" />
                      <TextView
                          android:id="@+id/tv_active_machine"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="All machines"
