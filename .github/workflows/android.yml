          import android.content.*
          import android.os.Build
          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context?, intent: Intent?) {
                  val a = intent?.action ?: return
                  if (a != Intent.ACTION_BOOT_COMPLETED && a != "android.intent.action.QUICKBOOT_POWERON") return
                  val ctx = context ?: return
                  if (!ctx.getSharedPreferences("cofferno_agent", Context.MODE_PRIVATE).getBoolean("agent_active", false)) return
                  val i = Intent(ctx, AgentService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ctx.startForegroundService(i) else ctx.startService(i)
              }
          }
