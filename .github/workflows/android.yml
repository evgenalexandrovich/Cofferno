                  val tvSt = findViewById<TextView>(R.id.tv_agent_status)
                  sw.isChecked = agentPrefs.getBoolean("agent_active", false)
                  tvSt.text = if (sw.isChecked) "Service ON" else "Stopped"
                  sw.setOnCheckedChangeListener { _, on ->
                      agentPrefs.edit().putBoolean("agent_active", on).apply()
                      if (on) {
                          tvSt.text = "Starting..."
                          val i = Intent(this, AgentService::class.java)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i)
                          else startService(i)
                          mainHandler.postDelayed({ moveTaskToBack(true) }, 800L)
                      } else {
                          stopService(Intent(this, AgentService::class.java))
                          tvSt.text = "Stopped"
                      }
                  }

                  findViewById<Button>(R.id.btn_scan_coffeenet).setOnClickListener {
                      tvLogs.text = "Scanning..."
                      tvLogs.scrollTo(0, 0)
                      Executors.newSingleThreadExecutor().execute {
                          val result = LeVendingProbe.fullScan(this@MainActivity)
                          runOnUiThread {
                              tvLogs.text = result
                              tvLogs.scrollTo(0, 0)
                              refreshDeviceIdUi()
                          }
                      }
                  }

                  Executors.newSingleThreadExecutor().execute {
                      LeVendingProbe.findDeviceId(this@MainActivity)
                      runOnUiThread { refreshDeviceIdUi() }
                  }

                  reconnectMqtt()
                  mainHandler.post(watchdog)
              }

              private fun refreshDeviceIdUi() {
                  val id = getSharedPreferences("cofferno_agent", Context.MODE_PRIVATE)
                      .getString("levending_device_id", "") ?: ""
                  findViewById<TextView>(R.id.tv_detected_device_id).text =
                      if (id.isBlank()) "not found" else id
              }

              private fun refreshAgentSaleInfo() {
                  val p = getSharedPreferences("cofferno_agent", Context.MODE_PRIVATE)
                  val name = p.getString("last_sale_name", "") ?: ""
                  val price = p.getInt("last_sale_price", 0)
                  val at = p.getLong("last_sale_at", 0L)
                  val tv = findViewById<TextView>(R.id.tv_last_sale)
                  if (at == 0L) {
                      tv.text = "Last sale: -"
                  } else {
                      val t = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date(at))
                      tv.text = "Last sale: $name | $price | $t"
                  }
              }

              private fun updateHeaderActiveMachine() {
                  val tv = findViewById<TextView>(R.id.tv_active_machine)
                  if (selectedFilterSerial == "ALL") {
                      tv.text = "All machines"
                  } else {
                      tv.text = getMachineName(selectedFilterSerial) + " (" + selectedFilterSerial + ")"
                  }
              }

              private fun renderFilterChips() {
                  val container = findViewById<LinearLayout>(R.id.ll_filter_chips)
                  container.removeAllViews()
                  addChip(container, "ALL", "ALL")
                  for (sn in getSavedMachines()) {
                      addChip(container, getMachineName(sn), sn)
                  }
              }

              private fun addChip(container: LinearLayout, label: String, serial: String) {
                  val isSel = selectedFilterSerial == serial
                  val btn = Button(this)
                  btn.text = label
                  btn.textSize = 12f
                  btn.setBackgroundColor(if (isSel) col(R.color.accent) else col(R.color.card))
                  btn.setTextColor(if (isSel) col(R.color.dark) else col(R.color.white))
                  btn.setOnClickListener {
                      selectedFilterSerial = serial
                      if (serial != "ALL") currentSelectedSerial = serial
                      updateHeaderActiveMachine()
                      renderFilterChips()
                      renderMachineSelectorList()
                      renderSalesUi()
                  }
                  val lp = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.WRAP_CONTENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  )
                  lp.setMargins(0, 0, 12, 0)
                  container.addView(btn, lp)
              }

              private fun renderMachineSelectorList() {
                  val container = findViewById<LinearLayout>(R.id.ll_machine_selector)
                  container.removeAllViews()
                  val machines = getSavedMachines()
                  if (machines.isEmpty()) {
                      val tv = TextView(this)
                      tv.text = "Add device id"
                      tv.setTextColor(col(R.color.muted))
                      container.addView(tv)
                      return
                  }
                  for (sn in machines) {
                      val sel = sn == currentSelectedSerial
                      val btn = Button(this)
                      btn.text = getMachineName(sn) + " [" + sn + "]"
                      btn.setBackgroundColor(if (sel) col(R.color.accent) else col(R.color.card))
                      btn.setTextColor(if (sel) col(R.color.dark) else col(R.color.white))
                      btn.textSize = 12f
                      btn.setOnClickListener {
                          currentSelectedSerial = sn
                          renderMachineSelectorList()
                      }
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                      lp.setMargins(0, 4, 0, 4)
                      container.addView(btn, lp)
                  }
              }

              private fun reconnectMqtt() {
                  Executors.newSingleThreadExecutor().execute {
                      while (true) {
                          try {
                              val need = mqttClient == null || mqttClient?.isConnected != true
                              if (need) {
                                  val cid = "Phone_" + (System.currentTimeMillis() % 100000L)
                                  mqttClient = MqttClient(broker, cid, MemoryPersistence())
                                  val options = MqttConnectOptions()
                                  options.isAutomaticReconnect = true
                                  options.connectionTimeout = 15
                                  options.keepAliveInterval = 30
                                  mqttClient!!.connect(options)
                                  mqttClient!!.setCallback(object : MqttCallback {
                                      override fun connectionLost(cause: Throwable?) {
                                          isMqttConnected = false
                                      }
                                      override fun messageArrived(topic: String?, message: MqttMessage?) {
                                          try {
                                              val json = message?.toString() ?: return
                                              val packet = gson.fromJson(json, TelemetryPacket::class.java)
                                              machinePackets[packet.serial] = packet
                                              lastMsgTime = System.currentTimeMillis()
                                              if (packet.deviceId.isNotBlank()) {
                                                  getSharedPreferences("cofferno_agent", Context.MODE_PRIVATE)
                                                      .edit()
                                                      .putString("levending_device_id", packet.deviceId)
                                                      .apply()
                                              }
                                              runOnUiThread {
                                                  renderSalesUi()
                                                  renderCostInputs(packet)
                                                  refreshDeviceIdUi()
                                              }
                                          } catch (e: Exception) {
                                              // ignore
                                          }
                                      }
                                      override fun deliveryComplete(token: IMqttDeliveryToken?) {}
                                  })
                                  mqttClient!!.subscribe("cofferno/+/data", 1)
                                  isMqttConnected = true
                              }
                          } catch (e: Exception) {
                              isMqttConnected = false
                          }
                          try {
                              Thread.sleep(5000L)
                          } catch (e: Exception) {
                              // ignore
                          }
                      }
                  }
              }

              private fun sendMachineCmd(serial: String, cmd: String) {
                  Executors.newSingleThreadExecutor().execute {
                      try {
                          if (serial.isNotEmpty() && mqttClient != null && mqttClient!!.isConnected) {
                              val msg = MqttMessage(cmd.toByteArray())
                              msg.qos = 1
                              mqttClient!!.publish("cofferno/$serial/cmd", msg)
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              private fun renderSalesUi() {
                  val drinksContainer = findViewById<LinearLayout>(R.id.ll_drinks_container)
                  val tvSummaryTitle = findViewById<TextView>(R.id.tv_summary_title)
                  drinksContainer.removeAllViews()

                  val packets = ArrayList<TelemetryPacket>()
                  if (selectedFilterSerial == "ALL") {
                      tvSummaryTitle.text = "Revenue ALL"
                      packets.addAll(machinePackets.values)
                  } else {
                      tvSummaryTitle.text = getMachineName(selectedFilterSerial)
                      val one = machinePackets[selectedFilterSerial]
                      if (one != null) packets.add(one)
                  }

                  if (packets.isEmpty()) {
                      val tv = TextView(this)
                      tv.text = "No data. Enable agent and make a sale."
                      tv.setTextColor(col(R.color.muted))
                      drinksContainer.addView(tv)
                      findViewById<TextView>(R.id.tv_total_revenue).text = "0"
                      findViewById<TextView>(R.id.tv_total_profit).text = "0"
                      findViewById<TextView>(R.id.tv_total_cups).text = "Cups: 0"
                      return
                  }

                  val map = LinkedHashMap<String, MergedDrink>()
                  var rev = 0
                  var prof = 0
                  var cups = 0
                  for (p in packets) {
                      for (d in p.drinks) {
                          val cost = getDrinkCost(d.name)
                          val existing = map[d.name]
                          if (existing == null) {
                              map[d.name] = MergedDrink(d.name, d.count, d.price, cost)
                          } else {
                              existing.count = existing.count + d.count
                          }
                      }
                  }
                  for (d in map.values) {
                      val r = d.count * d.price
                      val pr = d.count * (d.price - d.cost)
                      rev += r
                      prof += pr
                      cups += d.count
                      val card = MaterialCardView(this)
                      card.setCardBackgroundColor(col(R.color.card))
                      card.radius = 16f
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                      lp.setMargins(0, 0, 12, 12)
                      card.layoutParams = lp
                      val colLay = LinearLayout(this)
                      colLay.orientation = LinearLayout.VERTICAL
                      colLay.setPadding(24, 20, 24, 20)
                      val t1 = TextView(this)
                      t1.text = d.name + " x " + d.count
                      t1.setTextColor(col(R.color.white))
                      t1.textSize = 15f
                      val t2 = TextView(this)
                      t2.text = "price " + d.price + " cost " + d.cost + " rev " + r + " profit " + pr
                      t2.setTextColor(col(R.color.muted))
                      t2.textSize = 12f
                      colLay.addView(t1)
                      colLay.addView(t2)
                      card.addView(colLay)
                      drinksContainer.addView(card)
                  }
                  findViewById<TextView>(R.id.tv_total_revenue).text = "" + rev
                  findViewById<TextView>(R.id.tv_total_profit).text = "" + prof
                  findViewById<TextView>(R.id.tv_total_cups).text = "Cups: " + cups
              }

              private fun renderCostInputs(packet: TelemetryPacket) {
                  val box = findViewById<LinearLayout>(R.id.ll_costs_container)
                  if (box.childCount > 0) return
                  for (d in packet.drinks) {
                      val row = LinearLayout(this)
                      row.orientation = LinearLayout.HORIZONTAL
                      row.setPadding(0, 6, 0, 6)
                      val tv = TextView(this)
                      tv.text = d.name
                      tv.setTextColor(col(R.color.white))
                      tv.layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      val et = EditText(this)
                      et.setText("" + getDrinkCost(d.name))
                      et.setTextColor(col(R.color.accent))
                      et.inputType = android.text.InputType.TYPE_CLASS_NUMBER
                      et.tag = d.name
                      et.layoutParams = LinearLayout.LayoutParams(160, LinearLayout.LayoutParams.WRAP_CONTENT)
                      row.addView(tv)
                      row.addView(et)
                      box.addView(row)
                  }
              }

              private fun saveAllCostsFromInputs() {
                  val box = findViewById<LinearLayout>(R.id.ll_costs_container)
                  val ed = getSharedPreferences("cofferno_costs", Context.MODE_PRIVATE).edit()
                  var i = 0
                  while (i < box.childCount) {
                      val row = box.getChildAt(i) as? LinearLayout
                      if (row != null) {
                          val et = row.getChildAt(1) as? EditText
                          if (et != null) {
                              val name = et.tag as? String
                              if (name != null) {
                                  val v = et.text.toString().toIntOrNull() ?: 40
                                  ed.putInt("cost_$name", v)
                              }
                          }
                      }
                      i++
                  }
                  ed.apply()
              }

              private fun getDrinkCost(n: String): Int {
                  return getSharedPreferences("cofferno_costs", Context.MODE_PRIVATE).getInt("cost_$n", 40)
              }

              private fun getSavedMachines(): List<String> {
                  val raw = getSharedPreferences("cofferno_app", Context.MODE_PRIVATE)
                      .getString("machines_list", "") ?: ""
                  if (raw.isBlank()) return emptyList()
                  return raw.split(",").filter { it.isNotBlank() }
              }

              private fun saveMachines(list: List<String>) {
                  getSharedPreferences("cofferno_app", Context.MODE_PRIVATE).edit()
                      .putString("machines_list", list.distinct().joinToString(","))
                      .apply()
              }

              private fun getMachineName(serial: String): String {
                  val n = getSharedPreferences("cofferno_names", Context.MODE_PRIVATE)
                      .getString("name_$serial", "") ?: ""
                  return if (n.isNotBlank()) n else "LE $serial"
              }

              private fun saveMachineName(serial: String, name: String) {
                  getSharedPreferences("cofferno_names", Context.MODE_PRIVATE).edit()
                      .putString("name_$serial", name)
                      .apply()
              }
          }
