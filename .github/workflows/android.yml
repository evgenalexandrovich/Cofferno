          # TelemetryData.kt
          cat << 'EOF' > $PKG/TelemetryData.kt
          package com.coffee.telemetry

          data class TelemetryData(
              val temp: Double,
              val pressure: Double,
              val coffee: Int,
              val water: Int,
              val cups: Int,
              val totalCups: Int,
              val totalMoney: Int,
              val status: String,
              val timestamp: Long = System.currentTimeMillis()
          )
          EOF

          # TelemetryAgentService.kt
          cat << 'EOF' > $PKG/TelemetryAgentService.kt
          package com.coffee.telemetry

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import androidx.core.app.NotificationCompat
          import com.google.gson.Gson
          import org.eclipse.paho.client.mqttv3.*
          import org.eclipse.paho.client.mqttv3.persist.MemoryPersistence
          import java.util.UUID
          import java.util.concurrent.Executors
          import java.util.concurrent.ScheduledExecutorService
          import java.util.concurrent.TimeUnit

          class TelemetryAgentService : Service() {

              private val brokerUrl = "tcp://broker.emqx.io:1883"
              private val topicTelemetry = "cofferno/lv307/telemetry"
              private val topicCommands = "cofferno/lv307/commands"
              
              private var mqttClient: MqttClient? = null
              private val gson = Gson()
              private var wakeLock: PowerManager.WakeLock? = null
              private var scheduler: ScheduledExecutorService? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  startForegroundNotification()

                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Cofferno:AgentWakeLock")
                  wakeLock?.acquire(24 * 60 * 60 * 1000L) // держим процессор активным

                  connectAndStartTelemetry()
              }

              private fun startForegroundNotification() {
                  val channelId = "cofferno_agent_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "Cofferno LV-307 Agent",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val manager = getSystemService(NotificationManager::class.java)
                      manager?.createNotificationChannel(channel)
                  }

                  val notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("☕ Cofferno LV-307: Агент активен")
                      .setContentText("Трансляция телеметрии и прием команд...")
                      .setSmallIcon(android.R.drawable.stat_notify_sync)
                      .setOngoing(true)
                      .build()

                  startForeground(101, notification)
              }

              private fun connectAndStartTelemetry() {
                  Executors.newSingleThreadExecutor().execute {
                      try {
                          val clientId = "LV307_Machine_" + UUID.randomUUID().toString().substring(0, 6)
                          mqttClient = MqttClient(brokerUrl, clientId, MemoryPersistence())
                          val options = MqttConnectOptions().apply {
                              isAutomaticReconnect = true
                              isCleanSession = true
                              connectionTimeout = 10
                              keepAliveInterval = 20
                          }

                          mqttClient?.setCallback(object : MqttCallback {
                              override fun connectionLost(cause: Throwable?) {}
                              override fun messageArrived(topic: String?, message: MqttMessage?) {
                                  // Получена команда от смартфона
                              }
                              override fun deliveryComplete(token: IMqttDeliveryToken?) {}
                          })

                          mqttClient?.connect(options)
                          mqttClient?.subscribe(topicCommands, 1)

                          // Запуск регулярной отправки телеметрии
                          scheduler = Executors.newSingleThreadScheduledExecutor()
                          scheduler?.scheduleAtFixedRate({
                              sendTelemetry()
                          }, 0, 3, TimeUnit.SECONDS)

                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              private fun sendTelemetry() {
                  try {
                      if (mqttClient?.isConnected == true) {
                          val data = TelemetryData(
                              temp = 93.2,
                              pressure = 9.0,
                              coffee = 85,
                              water = 92,
                              cups = 78,
                              totalCups = 154,
                              totalMoney = 27720,
                              status = "Готов к работе"
                          )
                          val json = gson.toJson(data)
                          val msg = MqttMessage(json.toByteArray()).apply {
                              qos = 1
                              isRetained = true // RETAINED = TRUE решает проблему со статусом смартфона!
                          }
                          mqttClient?.publish(topicTelemetry, msg)
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  scheduler?.shutdownNow()
                  try { mqttClient?.disconnect() } catch (e: Exception) {}
                  wakeLock?.release()
              }
          }
          EOF

          # BootReceiver.kt
          cat << 'EOF' > $PKG/BootReceiver.kt
          package com.coffee.telemetry

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED || intent.action == "android.intent.action.QUICKBOOT_POWERON") {
                      val prefs = context.getSharedPreferences("cofferno_prefs", Context.MODE_PRIVATE)
                      val isAgentEnabled = prefs.getBoolean("agent_enabled", false)

                      if (isAgentEnabled) {
                          val serviceIntent = Intent(context, TelemetryAgentService::class.java)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              context.startForegroundService(serviceIntent)
                          } else {
                              context.startService(serviceIntent)
                          }
                      }
                  }
              }
          }
          EOF

          # MainActivity.kt
          cat << 'EOF' > $PKG/MainActivity.kt
          package com.coffee.telemetry

          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import com.google.android.material.bottomnavigation.BottomNavigationView
          import com.google.android.material.switchmaterial.SwitchMaterial
          import com.google.gson.Gson
          import org.eclipse.paho.client.mqttv3.*
          import org.eclipse.paho.client.mqttv3.persist.MemoryPersistence
          import java.util.UUID
          import java.util.concurrent.Executors

          class MainActivity : AppCompatActivity() {

              private val brokerUrl = "tcp://broker.emqx.io:1883"
              private val topicTelemetry = "cofferno/lv307/telemetry"
              private val topicCommands = "cofferno/lv307/commands"

              private var mqttClient: MqttClient? = null
              private val gson = Gson()
              private var lastMessageTime = 0L
              private val watchdogHandler = Handler(Looper.getMainLooper())

              private val watchdogRunnable = object : Runnable {
                  override fun run() {
                      val tvBadge = findViewById<TextView>(R.id.tv_machine_status_badge)
                      if (System.currentTimeMillis() - lastMessageTime > 8000) { // если нет ответа 8 сек
                          tvBadge.text = "🔴 Аппарат оффлайн"
                          tvBadge.setTextColor(getColor(R.color.status_red))
                      } else {
                          tvBadge.text = "🟢 Аппарат онлайн | В сети"
                          tvBadge.setTextColor(getColor(R.color.status_green))
                      }
                      watchdogHandler.postDelayed(this, 2000)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val prefs = getSharedPreferences("cofferno_prefs", Context.MODE_PRIVATE)

                  val layoutDashboard = findViewById<LinearLayout>(R.id.layout_dashboard)
                  val layoutControl = findViewById<LinearLayout>(R.id.layout_control)
                  val layoutAgent = findViewById<LinearLayout>(R.id.layout_agent)
                  val bottomNav = findViewById<BottomNavigationView>(R.id.bottom_navigation)
                  val switchAgent = findViewById<SwitchMaterial>(R.id.switch_agent)

                  bottomNav.setOnItemSelectedListener { item ->
                      layoutDashboard.visibility = if (item.itemId == R.id.nav_dashboard) View.VISIBLE else View.GONE
                      layoutControl.visibility = if (item.itemId == R.id.nav_control) View.VISIBLE else View.GONE
                      layoutAgent.visibility = if (item.itemId == R.id.nav_agent) View.VISIBLE else View.GONE
                      true
                  }

                  // Восстановление состояния переключателя
                  val isAgentRunning = prefs.getBoolean("agent_enabled", false)
                  switchAgent.isChecked = isAgentRunning

                  switchAgent.setOnCheckedChangeListener { _, isChecked ->
                      prefs.edit().putBoolean("agent_enabled", isChecked).apply()
                      val serviceIntent = Intent(this, TelemetryAgentService::class.java)

                      if (isChecked) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              startForegroundService(serviceIntent)
                          } else {
                              startService(serviceIntent)
                          }
                          Toast.makeText(this, "Служба запущена! Сворачиваемся в фон...", Toast.LENGTH_SHORT).show()
                          
                          // Автоматическое сворачивание приложения в фон
                          Handler(Looper.getMainLooper()).postDelayed({
                              moveTaskToBack(true)
                          }, 1200)
                      } else {
                          stopService(serviceIntent)
                          Toast.makeText(this, "Служба остановлена", Toast.LENGTH_SHORT).show()
                      }
                  }

                  // Кнопки управления
                  findViewById<Button>(R.id.btn_send_flush).setOnClickListener { sendCommand("FLUSH") }
                  findViewById<Button>(R.id.btn_send_test).setOnClickListener { sendCommand("TEST_CUP") }
                  findViewById<Button>(R.id.btn_send_lock).setOnClickListener { sendCommand("TOGGLE_LOCK") }

                  // Подключение смартфона к MQTT
                  connectPhoneMqtt()
                  watchdogHandler.post(watchdogRunnable)
              }

              private fun connectPhoneMqtt() {
                  Executors.newSingleThreadExecutor().execute {
                      try {
                          val clientId = "Phone_" + UUID.randomUUID().toString().substring(0, 6)
                          mqttClient = MqttClient(brokerUrl, clientId, MemoryPersistence())
                          val options = MqttConnectOptions().apply {
                              isAutomaticReconnect = true
                              isCleanSession = true
                              connectionTimeout = 10
                          }

                          mqttClient?.setCallback(object : MqttCallback {
                              override fun connectionLost(cause: Throwable?) {}
                              override fun messageArrived(topic: String?, message: MqttMessage?) {
                                  if (topic == topicTelemetry) {
                                      lastMessageTime = System.currentTimeMillis()
                                      val json = message?.toString() ?: return
                                      runOnUiThread { updateUi(json) }
                                  }
                              }
                              override fun deliveryComplete(token: IMqttDeliveryToken?) {}
                          })

                          mqttClient?.connect(options)
                          mqttClient?.subscribe(topicTelemetry, 1)

                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              private fun sendCommand(cmd: String) {
                  Executors.newSingleThreadExecutor().execute {
                      try {
                          val msg = MqttMessage(cmd.toByteArray()).apply { qos = 1 }
                          mqttClient?.publish(topicCommands, msg)
                          runOnUiThread {
                              Toast.makeText(this, "Команда '$cmd' отправлена", Toast.LENGTH_SHORT).show()
                          }
                      } catch (e: Exception) {
                          runOnUiThread {
                              Toast.makeText(this, "Ошибка отправки", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
              }

              private fun updateUi(json: String) {
                  try {
                      val data = gson.fromJson(json, TelemetryData::class.java)
                      findViewById<TextView>(R.id.tv_temp).text = "${data.temp}°C"
                      findViewById<TextView>(R.id.tv_pressure).text = "${data.pressure} Bar"
                      findViewById<TextView>(R.id.tv_status_mode).text = data.status

                      findViewById<TextView>(R.id.lbl_coffee).text = "Зерновой кофе: ${data.coffee}%"
                      findViewById<ProgressBar>(R.id.pb_coffee).progress = data.coffee

                      findViewById<TextView>(R.id.lbl_water).text = "Вода в баке: ${data.water}%"
                      findViewById<ProgressBar>(R.id.pb_water).progress = data.water

                      findViewById<TextView>(R.id.lbl_cups).text = "Стаканы: ${data.cups} шт"
                      findViewById<ProgressBar>(R.id.pb_cups).progress = data.cups

                      findViewById<TextView>(R.id.tv_sales_cups).text = "${data.totalCups} порций"
                      findViewById<TextView>(R.id.tv_sales_money).text = "${data.totalMoney} ₽"
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  watchdogHandler.removeCallbacks(watchdogRunnable)
                  try { mqttClient?.disconnect() } catch (e: Exception) {}
              }
          }
          EOF

