          echo "Project generated OK"

      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Send APK
        if: success()
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          curl -F chat_id="${{ env.CHAT_ID }}" \
               -F document=@"$APK" \
               -F caption="Cofferno 7.2.2 A+B DeviceID" \
               "https://api.telegram.org/bot${{ env.BOT_TOKEN }}/sendDocument"

      - name: Send compile errors to Telegram
        if: failure()
        run: |
          {
            echo "Cofferno BUILD FAILED"
            echo "---- e: lines ----"
            grep -E "^e: |error:|FAILED|What went wrong" build.log | head -n 80 || true
            echo "---- tail ----"
            tail -n 40 build.log || true
          } > errors.txt
          python3 - << 'PY'
          import urllib.parse, urllib.request, os
          text = open("errors.txt","r",errors="ignore").read()[:3500]
          token = os.environ.get("BOT_TOKEN", "")
          chat = os.environ.get("CHAT_ID", "")
          if token and chat:
              data = urllib.parse.urlencode({"chat_id": chat, "text": text}).encode()
              urllib.request.urlopen(f"https://api.telegram.org/bot{token}/sendMessage", data=data)
          PY
