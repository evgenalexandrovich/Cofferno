                  }
                  val tvRemote = findViewById<TextView>(R.id.tv_remote_logs_output)
                  findViewById<Button>(R.id.btn_remote_scan_logs).setOnClickListener {
                      if (currentSerial.isEmpty()) { Toast.makeText(this, "Выберите автомат", Toast.LENGTH_SHORT).show(); return@setOnClickListener }
                      tvRemote.text = "⏳ Запрос отчёта [$currentSerial]..."
                      cmd(currentSerial, "SCAN_LOGS")
                  }
                  findViewById<Button>(R.id.btn_copy_remote_logs).setOnClickListener {
                      val cm = getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("logs", tvRemote.text.toString()))
                      Toast.makeText(this, "Скопировано", Toast.LENGTH_SHORT).show()
                  }
                  findViewById<Button>(R.id.btn_save_all_costs).setOnClickListener { saveCosts(); renderSales() }
                  findViewById<Button>(R.id.btn_reset_counters).setOnClickListener {
                      if (currentSerial.isEmpty()) return@setOnClickListener
                      AlertDialog.Builder(this).setTitle("Сброс").setMessage("Очистить счётчики?")
                          .setPositiveButton("Да") { _, _ ->
                              cmd(currentSerial, "RESET_COUNTERS")
                              packets.remove(currentSerial); lastSeenMap.remove(currentSerial); renderSales()
                          }.setNegativeButton("Нет", null).show()
                  }
                  findViewById<Button>(R.id.btn_remote_reboot).setOnClickListener { cmd(currentSerial, "REBOOT_MACHINE") }
                  findViewById<Button>(R.id.btn_remote_flush).setOnClickListener { cmd(currentSerial, "FLUSH") }
                  findViewById<Button>(R.id.btn_remote_lock).setOnClickListener { cmd(currentSerial, "TOGGLE_LOCK") }

                  val ap = getSharedPreferences("cofferno_agent", MODE_PRIVATE)
                  val et = findViewById<EditText>(R.id.et_agent_serial)
                  val s = ap.getString("custom_serial", "") ?: ""
                  val d = ap.getString("levending_device_id", "") ?: ""
                  et.setText(if (s.isNotEmpty()) s else if (d.isNotEmpty()) d else Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID))
                  findViewById<Button>(R.id.btn_save_agent_serial).setOnClickListener {
                      val sn = et.text.toString().trim().lowercase()
                      if (sn.isNotEmpty()) ap.edit().putString("custom_serial", sn).apply()
                  }
                  val sw = findViewById<SwitchMaterial>(R.id.switch_agent)
                  val tvSt = findViewById<TextView>(R.id.tv_agent_status)
                  sw.isChecked = ap.getBoolean("agent_active", false)
                  tvSt.text = if (sw.isChecked) "Служба запущена" else "Остановлена"
                  sw.setOnCheckedChangeListener { _, on ->
                      ap.edit().putBoolean("agent_active", on).apply()
                      if (on) {
                          tvSt.text = "Запуск..."
                          val i = Intent(this, AgentService::class.java)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i) else startService(i)
                          handler.postDelayed({ moveTaskToBack(true) }, 800)
                      } else {
                          stopService(Intent(this, AgentService::class.java)); tvSt.text = "Остановлена"
                      }
                  }
                  val tvL = findViewById<TextView>(R.id.tv_coffeenet_logs)
                  findViewById<Button>(R.id.btn_scan_coffeenet).setOnClickListener {
                      tvL.text = "Сканирование..."
                      Executors.newSingleThreadExecutor().execute {
                          val r = LeVendingProbe.fullScan(this)
                          runOnUiThread { tvL.text = r; refreshDevUi() }
                      }
                  }
                  reconnectMqtt()
                  handler.post(object : Runnable {
                      override fun run() {
                          val tv = findViewById<TextView>(R.id.tv_status)
                          val saved = getSavedMachines()
                          val now = System.currentTimeMillis()
                          val online = saved.count { (now - (lastSeenMap[it] ?: 0L)) < 15000L }
                          when {
                              saved.isEmpty() -> { tv.text = "Нет автоматов"; tv.setTextColor(col(R.color.muted)) }
                              !isMqttConnected -> { tv.text = "MQTT..."; tv.setTextColor(col(R.color.yellow)) }
                              online == 0 -> { tv.text = "Офлайн (0/${saved.size})"; tv.setTextColor(col(R.color.red)) }
                              else -> { tv.text = "В сети | $online/${saved.size}"; tv.setTextColor(col(R.color.green)) }
                          }
                          val p = getSharedPreferences("cofferno_agent", MODE_PRIVATE)
                          val at = p.getLong("last_sale_at", 0L)
                          val pr = p.getInt("last_sale_price", 0)
                          findViewById<TextView>(R.id.tv_last_sale).text = if (at == 0L) "Посл. продажа: -"
                          else "Посл.: ${p.getString("last_sale_name","")} | ${if (pr>0) "$pr ₽" else "цена?"} | ${SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date(at))}"
                          handler.postDelayed(this, 2000)
                      }
                  })
              }

              private fun refreshDevUi() {
                  val id = getSharedPreferences("cofferno_agent", MODE_PRIVATE).getString("levending_device_id", "") ?: ""
                  findViewById<TextView>(R.id.tv_detected_device_id).text = if (id.isBlank()) "не найден" else id
              }
              private fun updateHeader() {
                  val m = getSavedMachines()
                  findViewById<TextView>(R.id.tv_active_machine).text = when {
                      m.isEmpty() -> "Нет автоматов"
                      selectedFilter == "ALL" -> "Все (${m.size})"
                      else -> "${getName(selectedFilter)} ($selectedFilter)"
                  }
              }
              private fun renderChips() {
                  val c = findViewById<LinearLayout>(R.id.ll_filter_chips); c.removeAllViews()
                  val m = getSavedMachines(); if (m.isEmpty()) return
                  fun chip(label: String, sn: String) {
                      val b = Button(this).apply {
                          text = label; textSize = 12f
                          setBackgroundColor(if (selectedFilter == sn) col(R.color.accent) else col(R.color.card))
                          setTextColor(if (selectedFilter == sn) col(R.color.dark) else col(R.color.white))
                          setOnClickListener {
                              selectedFilter = sn; if (sn != "ALL") currentSerial = sn
                              updateHeader(); renderChips(); renderSelector(); renderSales()
                          }
                      }
                      c.addView(b, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { setMargins(0,0,12,0) })
                  }
                  chip("ВСЕ", "ALL"); m.forEach { chip(getName(it), it) }
              }
              private fun renderSelector() {
                  val c = findViewById<LinearLayout>(R.id.ll_machine_selector); c.removeAllViews()
                  getSavedMachines().forEach { sn ->
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      val b = Button(this).apply {
                          text = "${getName(sn)} [$sn]"; textSize = 12f
                          setBackgroundColor(if (sn == currentSerial) col(R.color.accent) else col(R.color.card))
                          setTextColor(if (sn == currentSerial) col(R.color.dark) else col(R.color.white))
                          setOnClickListener { currentSerial = sn; renderSelector() }
                          layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      }
                      val del = Button(this).apply {
                          text = "X"; setBackgroundColor(col(R.color.red)); setTextColor(col(R.color.white))
                          setOnClickListener {
                              val l = getSavedMachines().toMutableList(); l.remove(sn)
                              getSharedPreferences("cofferno_app", MODE_PRIVATE).edit().putString("machines_list", l.joinToString(",")).apply()
                              packets.remove(sn); lastSeenMap.remove(sn)
                              if (currentSerial == sn) currentSerial = getSavedMachines().firstOrNull() ?: ""
                              updateHeader(); renderChips(); renderSelector(); renderSales()
                          }
                      }
                      row.addView(b); row.addView(del); c.addView(row)
                  }
              }
              private fun addMachine(sn: String) {
                  val s = sn.trim().lowercase().replace(Regex("[^a-z0-9_-]"), "")
                  val l = getSavedMachines().toMutableList()
                  if (!l.contains(s)) { l.add(s); getSharedPreferences("cofferno_app", MODE_PRIVATE).edit().putString("machines_list", l.joinToString(",")).apply() }
                  currentSerial = s; updateHeader(); renderChips(); renderSelector()
              }
              private fun reconnectMqtt() {
                  Executors.newSingleThreadExecutor().execute {
                      while (true) {
                          try {
                              if (mqttClient?.isConnected != true) {
                                  try { mqttClient?.disconnect(); mqttClient?.close() } catch (_: Exception) {}
                                  mqttClient = MqttClient(broker, "Ph_" + UUID.randomUUID().toString().replace("-","").take(12), MemoryPersistence())
                                  mqttClient!!.setCallback(object : MqttCallback {
                                      override fun connectionLost(c: Throwable?) { isMqttConnected = false }
                                      override fun messageArrived(topic: String?, message: MqttMessage?) {
                                          try {
                                              val t = topic ?: return
                                              val payload = String(message?.payload ?: ByteArray(0), Charsets.UTF_8)
                                              val parts = t.split("/"); if (parts.size < 3) return
                                              val sn = parts[1].trim().lowercase()
                                              if (t.endsWith("/logs")) {
                                                  runOnUiThread {
                                                      if (currentSerial.isEmpty() || sn == currentSerial)
                                                          findViewById<TextView>(R.id.tv_remote_logs_output).text = payload
                                                  }
                                              } else if (t.endsWith("/data")) {
                                                  val p = gson.fromJson(payload, TelemetryPacket::class.java)
                                                  val pSn = p.serial.trim().lowercase()
                                                  packets[pSn] = p
                                                  if (message?.isRetained != true) lastSeenMap[pSn] = System.currentTimeMillis()
                                                  runOnUiThread { renderSales(); renderCostsFromAll() }
                                              }
                                          } catch (_: Exception) {}
                                      }
                                      override fun deliveryComplete(t: IMqttDeliveryToken?) {}
                                  })
                                  mqttClient!!.connect(MqttConnectOptions().apply { isAutomaticReconnect = true; connectionTimeout = 15; keepAliveInterval = 30 })
                                  isMqttConnected = true
                                  mqttClient!!.subscribe("cofferno/+/data", 0)
                                  mqttClient!!.subscribe("cofferno/+/logs", 0)
                              }
                          } catch (_: Exception) { isMqttConnected = false }
                          Thread.sleep(5000)
                      }
                  }
              }
              private fun cmd(sn: String, c: String) {
                  val s = sn.trim().lowercase()
                  Executors.newSingleThreadExecutor().execute {
                      try {
                          if (s.isNotEmpty() && mqttClient?.isConnected == true)
                              mqttClient!!.publish("cofferno/$s/cmd", MqttMessage(c.toByteArray(Charsets.UTF_8)).apply { qos = 0 })
                      } catch (_: Exception) {}
                  }
              }
              private fun renderSales() {
                  val dc = findViewById<LinearLayout>(R.id.ll_drinks_container); dc.removeAllViews()
                  val machines = getSavedMachines()
                  if (machines.isEmpty()) {
                      findViewById<TextView>(R.id.tv_total_revenue).text = "0 ₽"
                      findViewById<TextView>(R.id.tv_total_profit).text = "0 ₽"
                      findViewById<TextView>(R.id.tv_total_cups).text = "Стаканов: 0"
                      return
                  }
                  val pk = if (selectedFilter == "ALL") packets.filterKeys { machines.contains(it) }.values.toList()
                  else listOfNotNull(packets[selectedFilter.lowercase()])
                  if (pk.isEmpty() || pk.all { it.drinks.isEmpty() }) {
                      dc.addView(TextView(this).apply {
                          text = "Продаж нет. На автомате: служба агента ВКЛ + сделайте продажу."
                          setTextColor(col(R.color.muted)); textSize = 13f
                      })
                      findViewById<TextView>(R.id.tv_total_revenue).text = "0 ₽"
                      findViewById<TextView>(R.id.tv_total_profit).text = "0 ₽"
                      findViewById<TextView>(R.id.tv_total_cups).text = "Стаканов: 0"
                      return
                  }
                  val map = linkedMapOf<String, MergedDrink>(); var rev = 0; var prof = 0; var cups = 0
                  pk.forEach { p -> p.drinks.forEach { d ->
                      val cost = getCost(d.name)
                      val e = map[d.name]
                      if (e == null) map[d.name] = MergedDrink(d.name, d.count, d.price, cost) else e.count += d.count
                  }}
                  map.values.forEach { d ->
                      val r = d.count * d.price; val pr = d.count * (d.price - d.cost)
                      rev += r; prof += pr; cups += d.count
                      val card = MaterialCardView(this).apply {
                          setCardBackgroundColor(col(R.color.card)); radius = 16f
                          layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { setMargins(0,0,0,12) }
                      }
                      val ll = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(24,20,24,20) }
                      ll.addView(TextView(this).apply { text = "${d.name} — ${d.count} шт."; setTextColor(col(R.color.white)); textSize = 15f; setTypeface(null, android.graphics.Typeface.BOLD) })
                      ll.addView(TextView(this).apply { text = "Цена: ${d.price} ₽ • Себ.: ${d.cost} ₽ • Выр.: $r ₽ • Приб.: $pr ₽"; setTextColor(col(R.color.muted)); textSize = 12f })
                      card.addView(ll); dc.addView(card)
                  }
                  findViewById<TextView>(R.id.tv_total_revenue).text = "$rev ₽"
                  findViewById<TextView>(R.id.tv_total_profit).text = "$prof ₽ (прибыль)"
                  findViewById<TextView>(R.id.tv_total_cups).text = "Стаканов: $cups шт."
              }
              private fun renderCostsFromAll() {
                  val b = findViewById<LinearLayout>(R.id.ll_costs_container); b.removeAllViews()
                  val empty = findViewById<TextView>(R.id.tv_costs_empty)
                  val names = linkedSetOf<String>()
                  packets.filterKeys { getSavedMachines().contains(it) }.values.forEach { p -> p.drinks.forEach { names.add(it.name) } }
                  if (names.isEmpty()) { empty.visibility = View.VISIBLE; return }
                  empty.visibility = View.GONE
                  names.forEach { name ->
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(0,6,0,6) }
                      row.addView(TextView(this).apply { text = name; setTextColor(col(R.color.white)); layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f) })
                      row.addView(EditText(this).apply {
                          setText("${getCost(name)}"); setTextColor(col(R.color.accent)); inputType = android.text.InputType.TYPE_CLASS_NUMBER; tag = name
                          layoutParams = LinearLayout.LayoutParams(160, LinearLayout.LayoutParams.WRAP_CONTENT)
                      })
                      b.addView(row)
                  }
              }
              private fun saveCosts() {
                  val b = findViewById<LinearLayout>(R.id.ll_costs_container)
                  val ed = getSharedPreferences("cofferno_costs", MODE_PRIVATE).edit()
                  for (i in 0 until b.childCount) {
                      val row = b.getChildAt(i) as? LinearLayout ?: continue
                      val et = row.getChildAt(1) as? EditText ?: continue
                      val n = et.tag as? String ?: continue
                      ed.putInt("cost_$n", et.text.toString().toIntOrNull() ?: 0)
                  }
                  ed.apply()
              }
              private fun getCost(n: String) = getSharedPreferences("cofferno_costs", MODE_PRIVATE).getInt("cost_$n", 0)
              private fun getSavedMachines() = (getSharedPreferences("cofferno_app", MODE_PRIVATE).getString("machines_list","") ?: "")
                  .split(",").map { it.trim().lowercase() }.filter { it.isNotBlank() }
              private fun getName(s: String): String {
                  val n = getSharedPreferences("cofferno_names", MODE_PRIVATE).getString("name_$s", "") ?: ""
                  return if (n.isNotBlank()) n else "Автомат $s"
              }
          }
          EOF

          echo "OK v7.5.2 no-root"

      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cofferno-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Telegram APK
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          [ -z "$BOT_TOKEN" ] && exit 0
          curl -s -X POST -F chat_id="$CHAT_ID" -F document=@"$APK" \
            -F caption="Cofferno v7.5.2 NO-ROOT" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
