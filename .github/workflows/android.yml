                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="📟 Настройка блока Cofferno LV-307" android:textColor="@color/white"
                                      android:textSize="16sp" android:textStyle="bold" android:layout_marginBottom="8dp"/>
                                  
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="Задайте реальный заводской серийный номер аппарата:"
                                      android:textColor="@color/muted" android:textSize="12sp" android:layout_marginBottom="4dp"/>
                                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:orientation="horizontal">
                                      <EditText android:id="@+id/et_agent_serial" android:layout_width="0dp"
                                          android:layout_height="wrap_content" android:layout_weight="1"
                                          android:hint="Напр. LV307-8841" android:textColor="@color/white"
                                          android:textColorHint="@color/muted" android:textSize="13sp"/>
                                      <Button android:id="@+id/btn_save_agent_serial" android:layout_width="wrap_content"
                                          android:layout_height="wrap_content" android:text="Сохранить"
                                          android:backgroundTint="@color/accent" android:textColor="@color/dark"
                                          android:layout_marginStart="8dp"/>
                                  </LinearLayout>

                                  <com.google.android.material.switchmaterial.SwitchMaterial
                                      android:id="@+id/switch_agent" android:layout_width="match_parent"
                                      android:layout_height="wrap_content" android:text="Фоновая служба телеметрии"
                                      android:textColor="@color/white" android:layout_marginTop="16dp"/>
                                  <TextView android:id="@+id/tv_agent_status" android:layout_width="match_parent"
                                      android:layout_height="wrap_content" android:text="Остановлена"
