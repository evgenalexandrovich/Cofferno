name: Cofferno LV-307 Build

on:
  push:
  workflow_dispatch:

env:
  BOT_TOKEN: "8923730105:AAFgMSUgh63L_1Xuad839ex4fXZmTpFR1_Q"
  CHAT_ID: "864227156"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Project
        run: |
          B=app/src/main
          P=$B/java/com/coffee/telemetry
          mkdir -p $P $B/res/layout $B/res/values $B/res/menu

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Cofferno"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.coffee.telemetry'
              compileSdk 34
              defaultConfig {
                  applicationId "com.coffee.telemetry"
                  minSdk 23
                  targetSdk 34
                  versionCode 62
                  versionName "6.2-RESET-FIXED"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              lint { abortOnError false; checkReleaseBuilds false }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          EOF

          cat << 'EOF' > $B/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Cofferno LV-307"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".AgentService" android:enabled="true" android:exported="false"/>
                  <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > $B/res/values/strings.xml
          <resources><string name="app_name">Cofferno LV-307</string></resources>
          EOF

          cat << 'EOF' > $B/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#110B09</color>
              <color name="card">#1F1613</color>
              <color name="accent">#D4A373</color>
              <color name="dark">#0A0605</color>
              <color name="white">#FFFFFF</color>
              <color name="muted">#A3928B</color>
              <color name="green">#4CAF50</color>
              <color name="yellow">#FFC107</color>
              <color name="red">#E53935</color>
              <color name="blue">#42A5F5</color>
          </resources>
          EOF

          cat << 'EOF' > $B/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/accent</item>
                  <item name="colorPrimaryDark">@color/dark</item>
                  <item name="colorAccent">@color/accent</item>
                  <item name="android:windowBackground">@color/bg</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > $B/res/menu/bottom_nav.xml
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@+id/nav_sales" android:title="Продажи" android:icon="@android:drawable/ic_menu_view"/>
              <item android:id="@+id/nav_manage" android:title="Управление" android:icon="@android:drawable/ic_menu_manage"/>
              <item android:id="@+id/nav_agent" android:title="Аппарат" android:icon="@android:drawable/ic_menu_preferences"/>
          </menu>
          EOF

          cat << 'EOF' > $B/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg">

              <LinearLayout
                  android:id="@+id/header"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@color/card"
                  android:padding="14dp"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  app:layout_constraintTop_toTopOf="parent">
                  <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1" android:orientation="vertical">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="☕ Cofferno LV-307" android:textColor="@color/white"
                          android:textSize="17sp" android:textStyle="bold"/>
                      <TextView android:id="@+id/tv_status" android:layout_width="wrap_content"
                          android:layout_height="wrap_content" android:text="● Подключение..."
                          android:textColor="@color/yellow" android:textSize="11sp"/>
                      <TextView android:id="@+id/tv_serial" android:layout_width="wrap_content"
                          android:layout_height="wrap_content" android:text="S/N: Не выбран"
                          android:textColor="@color/accent" android:textSize="11sp" android:textStyle="bold"/>
                  </LinearLayout>
              </LinearLayout>

              <ScrollView android:layout_width="match_parent" android:layout_height="0dp"
                  android:fillViewport="true"
                  app:layout_constraintTop_toBottomOf="@id/header"
                  app:layout_constraintBottom_toTopOf="@id/bottom_nav">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:orientation="vertical" android:padding="12dp">

                      <!-- TAB 1: ПРОДАЖИ -->
                      <LinearLayout android:id="@+id/tab_sales" android:layout_width="match_parent"
                          android:layout_height="wrap_content" android:orientation="vertical">

                          <com.google.android.material.card.MaterialCardView
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              app:cardBackgroundColor="@color/card" app:cardCornerRadius="12dp"
                              android:layout_marginBottom="12dp">
                              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:orientation="vertical" android:padding="16dp">
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="💰 Итого за смену" android:textColor="@color/white"
                                      android:textSize="15sp" android:textStyle="bold" android:layout_marginBottom="8dp"/>
                                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:orientation="horizontal" android:weightSum="2">
                                      <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                                          android:layout_weight="1" android:orientation="vertical">
                                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                              android:text="Выручка" android:textColor="@color/muted" android:textSize="11sp"/>
                                          <TextView android:id="@+id/tv_total_revenue" android:layout_width="wrap_content"
                                              android:layout_height="wrap_content" android:text="0 ₽"
                                              android:textColor="@color/accent" android:textSize="20sp" android:textStyle="bold"/>
                                      </LinearLayout>
                                      <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                                          android:layout_weight="1" android:orientation="vertical">
                                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                              android:text="Чистая прибыль" android:textColor="@color/muted" android:textSize="11sp"/>
                                          <TextView android:id="@+id/tv_total_profit" android:layout_width="wrap_content"
                                              android:layout_height="wrap_content" android:text="0 ₽"
                                              android:textColor="@color/green" android:textSize="20sp" android:textStyle="bold"/>
                                      </LinearLayout>
                                  </LinearLayout>
                                  <TextView android:id="@+id/tv_total_cups" android:layout_width="wrap_content"
                                      android:layout_height="wrap_content" android:text="Всего порций: 0"
                                      android:textColor="@color/muted" android:textSize="12sp" android:layout_marginTop="6dp"/>
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>

                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:text="📊 Разбивка по напиткам" android:textColor="@color/white"
                              android:textSize="14sp" android:textStyle="bold" android:layout_marginBottom="8dp"/>

                          <!-- Drink 1: Эспрессо -->
                          <com.google.android.material.card.MaterialCardView
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              app:cardBackgroundColor="@color/card" app:cardCornerRadius="10dp"
                              android:layout_marginBottom="8dp">
                              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:orientation="horizontal" android:padding="12dp" android:gravity="center_vertical">
                                  <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                                      android:layout_weight="1" android:orientation="vertical">
                                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                          android:text="☕ Эспрессо" android:textColor="@color/white"
                                          android:textSize="14sp" android:textStyle="bold"/>
                                      <TextView android:id="@+id/tv_d1_info" android:layout_width="wrap_content"
                                          android:layout_height="wrap_content" android:text="0 шт × 0 ₽"
                                          android:textColor="@color/muted" android:textSize="11sp"/>
                                  </LinearLayout>
                                  <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:orientation="vertical" android:gravity="end">
                                      <TextView android:id="@+id/tv_d1_revenue" android:layout_width="wrap_content"
                                          android:layout_height="wrap_content" android:text="0 ₽"
                                          android:textColor="@color/accent" android:textSize="14sp" android:textStyle="bold"/>
                                      <TextView android:id="@+id/tv_d1_profit" android:layout_width="wrap_content"
                                          android:layout_height="wrap_content" android:text="+0 ₽"
                                          android:textColor="@color/green" android:textSize="11sp"/>
                                  </LinearLayout>
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>

                          <!-- Drink 2: Капучино -->
                          <com.google.android.material.card.MaterialCardView
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              app:cardBackgroundColor="@color/card" app:cardCornerRadius="10dp"
                              android:layout_marginBottom="8dp">
                              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:orientation="horizontal" android:padding="12dp" android:gravity="center_vertical">
                                  <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                                      android:layout_weight="1" android:orientation="vertical">
                                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                          android:text="🥛 Капучино" android:textColor="@color/white"
                                          android:textSize="14sp" android:textStyle="bold"/>
                                      <TextView android:id="@+id/tv_d2_info" android:layout_width="wrap_content"
                                          android:layout_height="wrap_content" android:text="0 шт × 0 ₽"
                                          android:textColor="@color/muted" android:textSize="11sp"/>
                                  </LinearLayout>
                                  <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:orientation="vertical" android:gravity="end">
                                      <TextView android:id="@+id/tv_d2_revenue" android:layout_width="wrap_content"
                                          android:layout_height="wrap_content" android:text="0 ₽"
                                          android:textColor="@color/accent" android:textSize="14sp" android:textStyle="bold"/>
                                      <TextView android:id="@+id/tv_d2_profit" android:layout_width="wrap_content"
                                          android:layout_height="wrap_content" android:text="+0 ₽"
                                          android:textColor="@color/green" android:textSize="11sp"/>
                                  </LinearLayout>
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>

                          <!-- Drink 3: Латте -->
                          <com.google.android.material.card.MaterialCardView
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              app:cardBackgroundColor="@color/card" app:cardCornerRadius="10dp"
                              android:layout_marginBottom="8dp">
                              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:orientation="horizontal" android:padding="12dp" android:gravity="center_vertical">
                                  <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                                      android:layout_weight="1" android:orientation="vertical">
                                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                          android:text="🍵 Латте" android:textColor="@color/white"
                                          android:textSize="14sp" android:textStyle="bold"/>
                                      <TextView android:id="@+id/tv_d3_info" android:layout_width="wrap_content"
                                          android:layout_height="wrap_content" android:text="0 шт × 0 ₽"
                                          android:textColor="@color/muted" android:textSize="11sp"/>
                                  </LinearLayout>
                                  <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:orientation="vertical" android:gravity="end">
                                      <TextView android:id="@+id/tv_d3_revenue" android:layout_width="wrap_content"
                                          android:layout_height="wrap_content" android:text="0 ₽"
                                          android:textColor="@color/accent" android:textSize="14sp" android:textStyle="bold"/>
                                      <TextView android:id="@+id/tv_d3_profit" android:layout_width="wrap_content"
                                          android:layout_height="wrap_content" android:text="+0 ₽"
                                          android:textColor="@color/green" android:textSize="11sp"/>
                                  </LinearLayout>
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>

                          <!-- Drink 4: Американо -->
                          <com.google.android.material.card.MaterialCardView
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              app:cardBackgroundColor="@color/card" app:cardCornerRadius="10dp"
                              android:layout_marginBottom="8dp">
                              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:orientation="horizontal" android:padding="12dp" android:gravity="center_vertical">
                                  <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                                      android:layout_weight="1" android:orientation="vertical">
                                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                          android:text="🫗 Американо" android:textColor="@color/white"
                                          android:textSize="14sp" android:textStyle="bold"/>
                                      <TextView android:id="@+id/tv_d4_info" android:layout_width="wrap_content"
                                          android:layout_height="wrap_content" android:text="0 шт × 0 ₽"
                                          android:textColor="@color/muted" android:textSize="11sp"/>
                                  </LinearLayout>
                                  <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:orientation="vertical" android:gravity="end">
                                      <TextView android:id="@+id/tv_d4_revenue" android:layout_width="wrap_content"
                                          android:layout_height="wrap_content" android:text="0 ₽"
                                          android:textColor="@color/accent" android:textSize="14sp" android:textStyle="bold"/>
                                      <TextView android:id="@+id/tv_d4_profit" android:layout_width="wrap_content"
                                          android:layout_height="wrap_content" android:text="+0 ₽"
                                          android:textColor="@color/green" android:textSize="11sp"/>
                                  </LinearLayout>
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>
                      </LinearLayout>

                      <!-- TAB 2: УПРАВЛЕНИЕ -->
                      <LinearLayout android:id="@+id/tab_manage" android:layout_width="match_parent"
                          android:layout_height="wrap_content" android:orientation="vertical" android:visibility="gone">

                          <!-- Add Machine -->
                          <com.google.android.material.card.MaterialCardView
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              app:cardBackgroundColor="@color/card" app:cardCornerRadius="12dp"
                              android:layout_marginBottom="12dp">
                              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:orientation="vertical" android:padding="16dp">
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="🔗 Добавить аппарат по S/N" android:textColor="@color/white"
                                      android:textSize="15sp" android:textStyle="bold" android:layout_marginBottom="8dp"/>
                                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:orientation="horizontal">
                                      <EditText android:id="@+id/et_serial" android:layout_width="0dp"
                                          android:layout_height="wrap_content" android:layout_weight="1"
                                          android:hint="Вставьте S/N машины" android:textColor="@color/white"
                                          android:textColorHint="@color/muted" android:textSize="13sp"
                                          android:inputType="text" android:maxLines="1"/>
                                      <Button android:id="@+id/btn_add" android:layout_width="wrap_content"
                                          android:layout_height="wrap_content" android:text="+"
                                          android:backgroundTint="@color/accent" android:textColor="@color/dark"
                                          android:layout_marginStart="8dp"/>
                                  </LinearLayout>
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="Список аппаратов (нажмите для выбора):"
                                      android:textColor="@color/muted" android:textSize="11sp" android:layout_marginTop="8dp"/>
                                  <LinearLayout android:id="@+id/ll_machines_list" android:layout_width="match_parent"
                                      android:layout_height="wrap_content" android:orientation="vertical"
                                      android:layout_marginTop="4dp"/>
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>

                          <!-- Cost Settings -->
                          <com.google.android.material.card.MaterialCardView
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              app:cardBackgroundColor="@color/card" app:cardCornerRadius="12dp"
                              android:layout_marginBottom="12dp">
                              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:orientation="vertical" android:padding="16dp">
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="📉 Себестоимость напитков (₽/шт)" android:textColor="@color/white"
                                      android:textSize="15sp" android:textStyle="bold" android:layout_marginBottom="8dp"/>
                                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:orientation="horizontal" android:layout_marginBottom="6dp">
                                      <TextView android:layout_width="0dp" android:layout_height="wrap_content"
                                          android:layout_weight="1" android:text="Эспрессо" android:textColor="@color/muted" android:textSize="13sp"/>
                                      <EditText android:id="@+id/et_cost1" android:layout_width="80dp"
                                          android:layout_height="wrap_content" android:inputType="number"
                                          android:text="35" android:textColor="@color/white" android:textSize="13sp" android:gravity="center"/>
                                  </LinearLayout>
                                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:orientation="horizontal" android:layout_marginBottom="6dp">
                                      <TextView android:layout_width="0dp" android:layout_height="wrap_content"
                                          android:layout_weight="1" android:text="Капучино" android:textColor="@color/muted" android:textSize="13sp"/>
                                      <EditText android:id="@+id/et_cost2" android:layout_width="80dp"
                                          android:layout_height="wrap_content" android:inputType="number"
                                          android:text="55" android:textColor="@color/white" android:textSize="13sp" android:gravity="center"/>
                                  </LinearLayout>
                                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:orientation="horizontal" android:layout_marginBottom="6dp">
                                      <TextView android:layout_width="0dp" android:layout_height="wrap_content"
                                          android:layout_weight="1" android:text="Латте" android:textColor="@color/muted" android:textSize="13sp"/>
                                      <EditText android:id="@+id/et_cost3" android:layout_width="80dp"
                                          android:layout_height="wrap_content" android:inputType="number"
                                          android:text="60" android:textColor="@color/white" android:textSize="13sp" android:gravity="center"/>
                                  </LinearLayout>
                                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:orientation="horizontal" android:layout_marginBottom="10dp">
                                      <TextView android:layout_width="0dp" android:layout_height="wrap_content"
                                          android:layout_weight="1" android:text="Американо" android:textColor="@color/muted" android:textSize="13sp"/>
                                      <EditText android:id="@+id/et_cost4" android:layout_width="80dp"
                                          android:layout_height="wrap_content" android:inputType="number"
                                          android:text="30" android:textColor="@color/white" android:textSize="13sp" android:gravity="center"/>
                                  </LinearLayout>
                                  <Button android:id="@+id/btn_save_cost" android:layout_width="match_parent"
                                      android:layout_height="wrap_content" android:text="💾 Сохранить себестоимость"
                                      android:backgroundTint="@color/accent" android:textColor="@color/dark"/>
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>

                          <!-- Actions -->
                          <com.google.android.material.card.MaterialCardView
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              app:cardBackgroundColor="@color/card" app:cardCornerRadius="12dp">
                              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:orientation="vertical" android:padding="16dp">
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="⚙️ Команды выбранному аппарату" android:textColor="@color/white"
                                      android:textSize="15sp" android:textStyle="bold" android:layout_marginBottom="12dp"/>
                                  <Button android:id="@+id/btn_reset" android:layout_width="match_parent"
                                      android:layout_height="wrap_content" android:text="🔄 Обнулить счётчики продаж"
                                      android:backgroundTint="@color/yellow" android:textColor="@color/dark"
                                      android:layout_marginBottom="8dp"/>
                                  <Button android:id="@+id/btn_flush" android:layout_width="match_parent"
                                      android:layout_height="wrap_content" android:text="💧 Промывка гидросистемы"
                                      android:backgroundTint="@color/blue" android:textColor="@color/white"
                                      android:layout_marginBottom="8dp"/>
                                  <Button android:id="@+id/btn_lock" android:layout_width="match_parent"
                                      android:layout_height="wrap_content" android:text="🔒 Заблокировать аппарат"
                                      android:backgroundTint="@color/red" android:textColor="@color/white"/>
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>
                      </LinearLayout>

                      <!-- TAB 3: АГЕНТ -->
                      <LinearLayout android:id="@+id/tab_agent" android:layout_width="match_parent"
