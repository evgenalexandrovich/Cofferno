              var cost: Int = 40
          )

          data class TelemetryPacket(
              val serial: String,
              val temp: Double,
              val pressure: Double,
              val status: String,
              val drinks: MutableList<DrinkItem>,
              val deviceId: String = "",
              val lastSaleName: String = "",
