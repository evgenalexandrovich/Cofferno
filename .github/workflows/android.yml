          # TelemetryAgentService.kt (Служба аппарата с защитой от сбоев)
          cat << 'EOF' > $PKG/TelemetryAgentService.kt
          package com.coffee.telemetry

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import androidx.core.app.NotificationCompat
          import com.google.gson.Gson
          import org.eclipse.paho.client.mqttv3.*
          import org.eclipse.paho.client.mqttv3.persist.MemoryPersistence
          import java.util.UUID
          import java.util.concurrent.Executors
          import java.util.concurrent.ScheduledExecutorService
          import java.util.concurrent.TimeUnit

          class TelemetryAgentService : Service() {

              private val brokerUrl = "tcp://broker.hivemq.com:1883"
              private val topicTelemetry = "cofferno/lv307_864227156/telemetry"
              private val topicCommands = "cofferno/lv307_864227156/commands"
              
              private var mqttClient: MqttClient? = null
              private val gson = Gson()
              private var wakeLock: PowerManager.WakeLock? = null
              private var scheduler: ScheduledExecutorService? = null
              private val executor = Executors.newSingleThreadExecutor()

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  startForegroundNotification()

                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Cofferno:AgentWakeLock")
                  wakeLock?.acquire(24 * 60 * 60 * 1000L)

                  startMqttLoop()
              }

              private fun startForegroundNotification() {
                  val channelId = "cofferno_agent_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "Cofferno LV-307 Agent",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val manager = getSystemService(NotificationManager::class.java)
                      manager?.createNotificationChannel(channel)
                  }

                  val notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("☕ Cofferno LV-307: Агент активен")
                      .setContentText("Трансляция телеметрии в облако...")
                      .setSmallIcon(android.R.drawable.stat_notify_sync)
                      .setOngoing(true)
                      .build()

                  startForeground(101, notification)
              }

              private fun startMqttLoop() {
                  executor.execute {
                      while (wakeLock?.isHeld == true) {
                          try {
                              if (mqttClient == null || mqttClient?.isConnected == false) {
                                  val clientId = "LV307_Host_" + UUID.randomUUID().toString().substring(0, 6)
                                  mqttClient = MqttClient(brokerUrl, clientId, MemoryPersistence())
                                  val options = MqttConnectOptions().apply {
                                      isAutomaticReconnect = true
                                      isCleanSession = true
                                      connectionTimeout = 15
                                      keepAliveInterval = 30
                                  }
                                  mqttClient?.connect(options)
                                  mqttClient?.subscribe(topicCommands, 1)

                                  // Запуск отправки
                                  scheduler?.shutdownNow()
                                  scheduler = Executors.newSingleThreadScheduledExecutor()
                                  scheduler?.scheduleAtFixedRate({
                                      sendTelemetry()
                                  }, 0, 3, TimeUnit.SECONDS)
                              }
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                          try { Thread.sleep(5000) } catch (e: Exception) {}
                      }
                  }
              }

              private fun sendTelemetry() {
                  try {
                      if (mqttClient?.isConnected == true) {
                          val data = TelemetryData(
                              temp = 93.4,
                              pressure = 9.1,
                              coffee = 84,
                              water = 95,
                              cups = 80,
                              totalCups = 162,
                              totalMoney = 29160,
                              status = "Готов к выдаче"
                          )
                          val json = gson.toJson(data)
                          val msg = MqttMessage(json.toByteArray()).apply {
                              qos = 1
                              isRetained = true
                          }
                          mqttClient?.publish(topicTelemetry, msg)
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  scheduler?.shutdownNow()
                  try { mqttClient?.disconnect() } catch (e: Exception) {}
                  wakeLock?.release()
              }
