          cat << 'EOF' > $P/LeVendingProbe.kt
          package com.coffee.telemetry

          import android.content.Context
          import android.os.Environment
          import java.io.BufferedReader
          import java.io.File
          import java.io.InputStreamReader
          import java.util.regex.Pattern

          object LeVendingProbe {

              private val deviceIdPatterns = listOf(
                  Pattern.compile("deviceid=([0-9]{6,18})", Pattern.CASE_INSENSITIVE),
                  Pattern.compile("deviceId=([0-9]{6,18})", Pattern.CASE_INSENSITIVE),
                  Pattern.compile("device_id[=:]([0-9]{6,18})", Pattern.CASE_INSENSITIVE),
                  Pattern.compile("ylapi\\.levending\\.net\\S*deviceid=([0-9]{6,18})", Pattern.CASE_INSENSITIVE)
              )

              private val pricePatterns = listOf(
                  Pattern.compile("(?i)(?:price|amount|money|pay|sum|total)\\D{0,12}(\\d{2,5})"),
                  Pattern.compile("(\\d{2,5})\\s*(?:RUB|CNY|rub)")
              )

              private val drinkNames = listOf(
                  "Espresso", "Americano", "Cappuccino", "Latte", "Macchiato",
                  "Flat White", "Mocha", "Chocolate", "Cocoa", "Tea", "Ristretto", "Lungo",
                  "Espresso", "Amerikano", "Kapuchino", "Latte", "Shokolad", "Chaj"
              )

              fun findDeviceIdFromLogLine(line: String): String? {
                  for (p in deviceIdPatterns) {
                      val m = p.matcher(line)
                      if (m.find()) {
                          val g = m.group(1)
                          if (g != null && g.isNotBlank()) return g
                      }
                  }
                  return null
              }

              fun findDeviceId(context: Context): String {
                  val prefs = context.getSharedPreferences("cofferno_agent", Context.MODE_PRIVATE)
                  val saved = prefs.getString("levending_device_id", "") ?: ""
                  if (saved.isNotBlank()) return saved

                  val fromLog = scrapeDeviceIdFromLogcat()
                  if (fromLog != null) {
                      prefs.edit().putString("levending_device_id", fromLog).apply()
                      return fromLog
                  }
                  val fromFiles = scrapeDeviceIdFromFiles()
                  if (fromFiles != null) {
                      prefs.edit().putString("levending_device_id", fromFiles).apply()
                      return fromFiles
                  }
                  return ""
              }

              fun scrapeDeviceIdFromLogcat(): String? {
                  return try {
                      val process = Runtime.getRuntime().exec(arrayOf("logcat", "-d", "-t", "800"))
                      val reader = BufferedReader(InputStreamReader(process.inputStream))
                      while (true) {
                          val line = reader.readLine() ?: break
                          val id = findDeviceIdFromLogLine(line)
                          if (id != null) return id
                      }
                      null
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun scrapeDeviceIdFromFiles(): String? {
                  val root = Environment.getExternalStorageDirectory()
                  val roots = listOf(
                      File(root, "Android/data/com.le.vmcoffeestandard"),
                      File(root, "Android/data/com.levending.ylpush"),
                      File(root, "Download")
                  )
                  for (r in roots) {
                      val found = walkTextForDeviceId(r, 0)
                      if (found != null) return found
                  }
                  return null
              }

              private fun walkTextForDeviceId(f: File, depth: Int): String? {
                  if (depth > 3 || !f.exists()) return null
                  try {
                      if (f.isFile && f.length() < 2000000L) {
                          val name = f.name.lowercase()
                          val ok = name.endsWith(".json") || name.endsWith(".txt") || name.endsWith(".cfg") ||
                              name.endsWith(".xml") || name.endsWith(".log") || name.endsWith(".ini") ||
                              name.endsWith(".properties")
                          if (ok) {
                              val text = f.readText()
                              for (line in text.lineSequence()) {
                                  val id = findDeviceIdFromLogLine(line)
                                  if (id != null) return id
                              }
                          }
                      } else if (f.isDirectory) {
                          val children = f.listFiles() ?: return null
                          for (child in children) {
                              val id = walkTextForDeviceId(child, depth + 1)
                              if (id != null) return id
                          }
                      }
                  } catch (e: Exception) {
                      // ignore
                  }
                  return null
              }

              fun isSaleMarker(line: String): Boolean {
                  return line.contains("MakeDrinkVideoActivity") ||
                      line.contains("AloneDropCupActivity") ||
                      line.contains("MakeDrinkPresenter") ||
                      line.contains("MakeDrinkActivity") ||
                      (line.contains("PayActivity") && (line.contains("START") || line.contains("Displayed")))
              }

              fun isPrimarySaleMarker(line: String): Boolean {
                  return line.contains("MakeDrinkVideoActivity") &&
                      (line.contains("START") || line.contains("Displayed") || line.contains("cmp="))
              }

              fun extractDrinkName(line: String): String? {
                  for (d in drinkNames) {
                      if (line.contains(d, ignoreCase = true)) return normalizeDrinkName(d)
                  }
                  val p = Pattern.compile(
                      "(?i)(?:product(?:Name)?|drink(?:Name)?|recipe(?:Name)?|goods(?:Name)?)\\s*[=:]\\s*([\\w \\-]{2,40})"
                  )
                  val m = p.matcher(line)
                  if (m.find()) {
                      val g = m.group(1)
                      if (g != null) return g.trim()
                  }
                  return null
              }

              fun extractPrice(line: String): Int? {
                  for (p in pricePatterns) {
                      val m = p.matcher(line)
                      if (m.find()) {
                          val g = m.group(1) ?: continue
                          val v = g.toIntOrNull() ?: continue
                          if (v in 10..2000) return v
                      }
                  }
                  return null
              }

              private fun normalizeDrinkName(raw: String): String {
                  val x = raw.lowercase()
                  return when {
                      x.contains("espresso") || x.contains("espreso") -> "Espresso"
                      x.contains("americano") || x.contains("amerikano") -> "Americano"
                      x.contains("capp") || x.contains("kapuch") -> "Cappuccino"
                      x.contains("latte") -> "Latte"
                      x.contains("flat") -> "Flat White"
                      x.contains("choco") || x.contains("cocoa") || x.contains("shokolad") -> "Chocolate"
                      x.contains("mocha") -> "Mocha"
                      x.contains("tea") || x.contains("chaj") -> "Tea"
                      else -> raw
                  }
              }

              fun fullScan(context: Context): String {
                  val sb = StringBuilder()
                  sb.append("=== SCAN LEVENDING 7.2.1 ===\n")
                  val dev = findDeviceId(context)
                  sb.append("Device ID: ").append(if (dev.isBlank()) "NOT FOUND" else dev).append("\n\n")

                  sb.append("--- APPS ---\n")
                  try {
                      val pkgs = context.packageManager.getInstalledPackages(0).filter {
                          val n = it.packageName.lowercase()
                          n.contains("le.") || n.contains("vending") || n.contains("coffee") || n.contains("ylpush")
                      }
                      for (p in pkgs) sb.append(" * ").append(p.packageName).append("\n")
                  } catch (e: Exception) {
                      sb.append(e.message).append("\n")
                  }

                  sb.append("\n--- FOLDERS ---\n")
                  val root = Environment.getExternalStorageDirectory()
                  val paths = listOf(
                      "Download",
                      "Android/data/com.le.vmcoffeestandard",
                      "Android/data/com.le.vmcoffeestandard/files",
                      "Android/data/com.levending.ylpush",
                      "Android/data/com.levending.ylpush/files"
                  )
                  for (rel in paths) {
                      val f = File(root, rel)
                      if (f.exists()) {
                          sb.append("DIR ").append(f.absolutePath).append("\n")
                          val files = f.listFiles()
                          if (files != null) {
                              for (child in files.take(30)) {
                                  sb.append("  - ").append(child.name).append(" (").append(child.length()).append(" b)\n")
                              }
                          }
                      }
                  }

                  sb.append("\n--- LOGCAT ---\n")
                  var saleHits = 0
                  var shown = 0
                  try {
                      val process = Runtime.getRuntime().exec(arrayOf("logcat", "-d", "-t", "500"))
                      val reader = BufferedReader(InputStreamReader(process.inputStream))
                      while (true) {
                          val line = reader.readLine() ?: break
                          val interesting = isSaleMarker(line) ||
                              findDeviceIdFromLogLine(line) != null ||
                              line.contains("ylapi.levending") ||
                              line.contains("vmcoffee", ignoreCase = true) ||
                              extractDrinkName(line) != null ||
                              extractPrice(line) != null
                          if (interesting) {
                              if (isSaleMarker(line)) saleHits++
                              sb.append(line.take(200)).append("\n")
                              shown++
                              if (shown >= 90) break
                          }
                      }
                  } catch (e: Exception) {
                      sb.append("logcat error: ").append(e.message).append("\n")
                  }
                  sb.append("\nSale markers: ").append(saleHits).append("\n=== END ===\n")
                  return sb.toString()
              }
          }
