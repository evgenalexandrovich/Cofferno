          package com.coffee.telemetry

          import android.content.Context
          import android.os.Environment
          import java.io.BufferedReader
          import java.io.File
          import java.io.InputStreamReader
          import java.util.regex.Pattern

          /**
           * Поиск device id, маркеров продажи, имени/цены в logcat и файлах LeVending.
           */
          object LeVendingProbe {

              // deviceid=00000010546 | deviceId=... | "deviceid":"..."
              private val deviceIdPatterns = listOf(
                  Pattern.compile("deviceid=([0-9]{6,18})", Pattern.CASE_INSENSITIVE),
                  Pattern.compile("deviceId=([0-9]{6,18})", Pattern.CASE_INSENSITIVE),
                  Pattern.compile("\"deviceid\"\\s*:\\s*\"?([0-9]{6,18})\"?", Pattern.CASE_INSENSITIVE),
                  Pattern.compile("device_id[=:]\\s*([0-9]{6,18})", Pattern.CASE_INSENSITIVE),
                  Pattern.compile("ylapi\\.levending\\.net[^\\s]*deviceid=([0-9]{6,18})", Pattern.CASE_INSENSITIVE)
              )

              private val pricePatterns = listOf(
                  Pattern.compile("(?i)(?:price|amount|money|pay|sum|total|cost)\\D{0,12}(\\d{2,5})"),
                  Pattern.compile("(\\d{2,5})\\s*(?:руб|₽|RUB|yuan|CNY)")
              )

              private val drinkNames = listOf(
                  "Эспрессо", "Espresso", "Doppio",
                  "Американо", "Americano",
                  "Капучино", "Cappuccino", "Capuccino",
                  "Латте", "Latte", "Latte Macchiato", "Латте Макиато",
                  "Флэт Уайт", "Flat White", "FlatWhite",
                  "Мокачино", "Mochaccino", "Mocha",
                  "Горячий шоколад", "Chocolate", "Cocoa", "Какао",
                  "Чай", "Tea", "Green Tea", "Ristretto", "Lungo",
                  "Macchiato", "Макиато", "Raf", "Раф"
              )

              fun findDeviceIdFromLogLine(line: String): String? {
                  for (p in deviceIdPatterns) {
                      val m = p.matcher(line)
                      if (m.find()) return m.group(1)
                  }
                  return null
              }

              fun findDeviceId(context: Context): String {
                  // 1) уже сохранённый
                  val prefs = context.getSharedPreferences("cofferno_agent", Context.MODE_PRIVATE)
                  val saved = prefs.getString("levending_device_id", "") ?: ""
                  if (saved.isNotBlank()) return saved

                  // 2) logcat
                  val fromLog = scrapeDeviceIdFromLogcat()
                  if (fromLog != null) {
                      prefs.edit().putString("levending_device_id", fromLog).apply()
                      return fromLog
                  }

                  // 3) файлы Android/data
                  val fromFiles = scrapeDeviceIdFromFiles()
                  if (fromFiles != null) {
                      prefs.edit().putString("levending_device_id", fromFiles).apply()
                      return fromFiles
                  }
                  return ""
              }

              fun scrapeDeviceIdFromLogcat(): String? {
                  return try {
                      val process = Runtime.getRuntime().exec(arrayOf("logcat", "-d", "-t", "800"))
                      val reader = BufferedReader(InputStreamReader(process.inputStream))
                      var line: String?
                      while (reader.readLine().also { line = it } != null) {
                          val id = findDeviceIdFromLogLine(line ?: continue)
                          if (id != null) return id
                      }
                      null
                  } catch (_: Exception) { null }
              }

              private fun scrapeDeviceIdFromFiles(): String? {
                  val roots = listOf(
                      File(Environment.getExternalStorageDirectory(), "Android/data/com.le.vmcoffeestandard"),
                      File(Environment.getExternalStorageDirectory(), "Android/data/com.levending.ylpush"),
                      File(Environment.getExternalStorageDirectory(), "Download")
                  )
                  for (root in roots) {
                      val found = walkTextForDeviceId(root, 0)
                      if (found != null) return found
                  }
                  return null
              }

              private fun walkTextForDeviceId(f: File, depth: Int): String? {
                  if (depth > 3 || !f.exists()) return null
                  try {
                      if (f.isFile && f.length() < 2_000_000) {
                          val name = f.name.lowercase()
                          if (name.endsWith(".json") || name.endsWith(".txt") || name.endsWith(".cfg") ||
                              name.endsWith(".xml") || name.endsWith(".log") || name.endsWith(".ini") ||
                              name.endsWith(".properties") || !name.contains(".")) {
                              val text = f.readText()
                              for (line in text.lineSequence()) {
                                  val id = findDeviceIdFromLogLine(line)
                                  if (id != null) return id
                              }
                          }
                      } else if (f.isDirectory) {
                          f.listFiles()?.forEach { child ->
                              val id = walkTextForDeviceId(child, depth + 1)
                              if (id != null) return id
                          }
                      }
                  } catch (_: Exception) {}
                  return null
              }

              fun isSaleMarker(line: String): Boolean {
                  val l = line
                  return l.contains("MakeDrinkVideoActivity") ||
                      l.contains("AloneDropCupActivity") ||
                      l.contains("MakeDrinkPresenter") ||
                      (l.contains("PayActivity") && (l.contains("START") || l.contains("Displayed"))) ||
                      l.contains("MakeDrinkActivity")
              }

              /** Сильный маркер — старт видео приготовления (1 продажа) */
              fun isPrimarySaleMarker(line: String): Boolean {
                  return line.contains("MakeDrinkVideoActivity") &&
                      (line.contains("START") || line.contains("Displayed") || line.contains("cmp="))
              }

              fun extractDrinkName(line: String): String? {
                  for (d in drinkNames) {
                      if (line.contains(d, ignoreCase = true)) return normalizeDrinkName(d)
                  }
                  // productName=... / drinkName=... / recipe=...
                  val p = Pattern.compile("(?i)(?:product(?:Name)?|drink(?:Name)?|recipe(?:Name)?|goods(?:Name)?|title)\\s*[=:]\\s*([\\wА-Яа-яЁё \\-]{2,40})")
                  val m = p.matcher(line)
                  if (m.find()) return m.group(1)?.trim()
                  return null
              }

              fun extractPrice(line: String): Int? {
                  for (p in pricePatterns) {
                      val m = p.matcher(line)
                      if (m.find()) {
                          val v = m.group(1)?.toIntOrNull() ?: continue
                          if (v in 10..2000) return v
                      }
                  }
                  return null
              }

              private fun normalizeDrinkName(raw: String): String {
                  val x = raw.lowercase()
                  return when {
                      x.contains("espresso") || x.contains("эспрессо") -> "Эспрессо"
                      x.contains("americano") || x.contains("американо") -> "Американо"
                      x.contains("capp") || x.contains("капуч") -> "Капучино"
                      x.contains("latte") || x.contains("латте") -> "Латте"
                      x.contains("flat") || x.contains("флэт") || x.contains("флет") -> "Флэт Уайт"
                      x.contains("choco") || x.contains("шоколад") || x.contains("cocoa") || x.contains("какао") -> "Горячий шоколад"
                      x.contains("mocha") || x.contains("мока") -> "Мокачино"
                      x.contains("tea") || x.contains("чай") -> "Чай"
                      else -> raw
                  }
              }

              fun fullScan(context: Context): String {
                  val sb = StringBuilder()
                  sb.append("=== СКАН LEVENDING 7.2 ===\n")
                  sb.append("Время: ${java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss").format(java.util.Date())}\n\n")

                  val dev = findDeviceId(context)
                  sb.append("Device ID: ${if (dev.isBlank()) "НЕ НАЙДЕН (сделайте продажу/откройте настройки LE)" else dev}\n\n")

                  sb.append("--- ПРИЛОЖЕНИЯ ---\n")
                  try {
                      val pkgs = context.packageManager.getInstalledPackages(0).filter {
                          val n = it.packageName.lowercase()
                          n.contains("le.") || n.contains("vending") || n.contains("coffee") || n.contains("ylpush")
                      }
                      pkgs.forEach { sb.append(" • ${it.packageName}\n") }
                  } catch (e: Exception) { sb.append("${e.message}\n") }

                  sb.append("\n--- ПАПКИ ---\n")
                  val paths = listOf(
                      "Download",
                      "Android/data/com.le.vmcoffeestandard",
                      "Android/data/com.le.vmcoffeestandard/files",
                      "Android/data/com.levending.ylpush",
                      "Android/data/com.levending.ylpush/files"
                  )
                  val root = Environment.getExternalStorageDirectory()
                  for (rel in paths) {
                      val f = File(root, rel)
                      if (f.exists()) {
                          sb.append("📁 ${f.absolutePath}\n")
                          f.listFiles()?.take(30)?.forEach { child ->
                              sb.append("   - ${child.name} (${child.length()} b)\n")
                          }
                      }
                  }

                  sb.append("\n--- LOGCAT (sale/device) ---\n")
                  var saleHits = 0
                  var shown = 0
                  try {
                      val process = Runtime.getRuntime().exec(arrayOf("logcat", "-d", "-t", "500"))
                      val reader = BufferedReader(InputStreamReader(process.inputStream))
                      while (true) {
                          val line = reader.readLine() ?: break
                          val interesting = isSaleMarker(line) || findDeviceIdFromLogLine(line) != null ||
                              line.contains("ylapi.levending") || line.contains("coffeeliib") ||
                              line.contains("vmcoffee", ignoreCase = true) ||
                              extractDrinkName(line) != null || extractPrice(line) != null
                          if (interesting) {
                              if (isSaleMarker(line)) saleHits++
                              sb.append("📝 ${line.take(200)}\n")
                              shown++
                              if (shown >= 90) break
                          }
                      }
                  } catch (e: Exception) { sb.append("logcat: ${e.message}\n") }

                  sb.append("\nМаркеров продажи в выборке: $saleHits\n")
                  sb.append("=== КОНЕЦ ===\n")
                  return sb.toString()
              }
          }
          EOF

          cat << 'EOF' > $P/AgentService.kt
          package com.coffee.telemetry

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import android.provider.Settings
          import androidx.core.app.NotificationCompat
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import org.eclipse.paho.client.mqttv3.*
          import org.eclipse.paho.client.mqttv3.persist.MemoryPersistence
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.util.concurrent.Executors
          import java.util.concurrent.ScheduledExecutorService
          import java.util.concurrent.TimeUnit

          class AgentService : Service() {
              private val broker = "tcp://broker.hivemq.com:1883"
              private var client: MqttClient? = null
              private val gson = Gson()
              private var wakeLock: PowerManager.WakeLock? = null
              private var sched: ScheduledExecutorService? = null
              private val exec = Executors.newSingleThreadExecutor()
              private val logcatExec = Executors.newSingleThreadExecutor()

              @Volatile private var lastSaleTs = 0L
              @Volatile private var pendingName: String? = null
              @Volatile private var pendingPrice: Int? = null
              @Volatile private var pendingNameTs = 0L

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  val ch = "cofferno_agent_ch"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      getSystemService(NotificationManager::class.java)?.createNotificationChannel(
                          NotificationChannel(ch, "Agent Service", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
                  val notification = NotificationCompat.Builder(this, ch)
                      .setContentTitle("☕ Cofferno LV-307")
                      .setContentText("LeVending: учёт продаж A+B")
                      .setSmallIcon(android.R.drawable.stat_notify_sync)
                      .setOngoing(true)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(101, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  } else {
                      startForeground(101, notification)
                  }

                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Cofferno:Wake")
                  wakeLock?.acquire(24 * 60 * 60 * 1000L)

                  // авто-device id при старте
                  try {
                      val id = LeVendingProbe.findDeviceId(this)
                      if (id.isNotBlank()) {
                          val prefs = getSharedPreferences("cofferno_agent", Context.MODE_PRIVATE)
                          if (prefs.getString("custom_serial", "").isNullOrBlank()) {
                              prefs.edit().putString("custom_serial", id).apply()
                          }
                      }
                  } catch (_: Exception) {}

                  startAgentLoop()
                  startSaleInterceptor()
              }

              private fun prefs() = getSharedPreferences("cofferno_agent", Context.MODE_PRIVATE)

              private fun getMachineSerial(): String {
                  val custom = prefs().getString("custom_serial", "") ?: ""
                  if (custom.isNotBlank()) return custom.trim().lowercase()
                  val dev = prefs().getString("levending_device_id", "") ?: ""
                  if (dev.isNotBlank()) return dev.trim().lowercase()
                  return (Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: "lv307_unit").trim().lowercase()
              }

              private fun getDeviceId(): String {
                  return prefs().getString("levending_device_id", "")
                      ?: prefs().getString("custom_serial", "")
                      ?: ""
              }

              private fun loadDrinks(): MutableList<DrinkItem> {
                  val json = prefs().getString("drinks_json", "")
                  if (!json.isNullOrEmpty()) {
                      try {
                          val list: MutableList<DrinkItem>? =
                              gson.fromJson(json, object : TypeToken<MutableList<DrinkItem>>() {}.type)
                          if (list != null) return list
                      } catch (_: Exception) {}
                  }
                  return mutableListOf(
                      DrinkItem(0, "Эспрессо", 0, 120, 35),
                      DrinkItem(1, "Капучино", 0, 180, 55),
                      DrinkItem(2, "Латте", 0, 200, 60),
                      DrinkItem(3, "Американо", 0, 130, 30),
                      DrinkItem(4, "Флэт Уайт", 0, 190, 55),
                      DrinkItem(5, "Горячий шоколад", 0, 160, 45),
                      DrinkItem(6, "Напиток (LeVending)", 0, 150, 40)
                  )
              }

              private fun saveDrinks(list: List<DrinkItem>) {
                  prefs().edit().putString("drinks_json", gson.toJson(list)).apply()
              }

              private fun registerDrinkSale(drinkName: String, price: Int) {
                  val drinks = loadDrinks()
                  val existing = drinks.find { it.name.equals(drinkName, ignoreCase = true) }
                  if (existing != null) {
                      existing.count += 1
                      if (price > 0) existing.price = price
                  } else {
                      drinks.add(DrinkItem(drinks.size, drinkName, 1, if (price > 0) price else 150, 40))
                  }
                  saveDrinks(drinks)
                  prefs().edit()
                      .putString("last_sale_name", drinkName)
                      .putInt("last_sale_price", if (price > 0) price else 150)
                      .putLong("last_sale_at", System.currentTimeMillis())
                      .apply()
                  sendHeartbeat()
              }

              /**
               * A: продажа по MakeDrinkVideoActivity (антидубль 45 сек)
               * B: рядом копит name/price из соседних строк logcat
               */
              private fun startSaleInterceptor() {
                  logcatExec.execute {
                      try {
                          Runtime.getRuntime().exec("logcat -c")
                          val process = Runtime.getRuntime().exec(arrayOf("logcat", "-v", "time"))
                          val reader = BufferedReader(InputStreamReader(process.inputStream))
                          while (wakeLock?.isHeld == true) {
                              val line = reader.readLine() ?: break

                              // Device ID на лету
                              val dev = LeVendingProbe.findDeviceIdFromLogLine(line)
                              if (dev != null) {
                                  val p = prefs()
                                  if (p.getString("levending_device_id", "") != dev) {
                                      p.edit().putString("levending_device_id", dev).apply()
                                      if (p.getString("custom_serial", "").isNullOrBlank()) {
                                          p.edit().putString("custom_serial", dev).apply()
                                      }
                                  }
                              }

                              // B: кэш имени/цены из любых строк
                              val n = LeVendingProbe.extractDrinkName(line)
                              if (n != null) {
                                  pendingName = n
                                  pendingNameTs = System.currentTimeMillis()
                              }
                              val pr = LeVendingProbe.extractPrice(line)
                              if (pr != null) {
                                  pendingPrice = pr
                                  pendingNameTs = System.currentTimeMillis()
                              }

                              // A: факт продажи
                              if (LeVendingProbe.isPrimarySaleMarker(line) ||
                                  (line.contains("AloneDropCupActivity") && line.contains("Displayed"))
                              ) {
                                  val now = System.currentTimeMillis()
                                  if (now - lastSaleTs > 45_000L) {
                                      lastSaleTs = now
                                      val nameFresh = (now - pendingNameTs) < 120_000L
                                      val drink = if (nameFresh) pendingName ?: "Напиток (LeVending)" else "Напиток (LeVending)"
                                      val price = if (nameFresh) pendingPrice ?: 150 else 150
                                      registerDrinkSale(drink, price)
                                      // не сбрасываем name сразу — иногда цена приходит чуть позже
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              private fun resetCounters() {
                  val list = loadDrinks()
                  for (d in list) d.count = 0
                  saveDrinks(list)
              }

              private fun rebootDevice() {
                  try {
                      Runtime.getRuntime().exec(arrayOf("su", "-c", "reboot"))
                  } catch (_: Exception) {
                      try {
                          (getSystemService(Context.POWER_SERVICE) as PowerManager).reboot(null)
                      } catch (_: Exception) {}
                  }
              }

              private fun startAgentLoop() {
                  exec.execute {
                      while (wakeLock?.isHeld == true) {
                          try {
                              if (client == null || client?.isConnected == false) {
                                  val sn = getMachineSerial()
                                  client = MqttClient(broker, "Host_${sn}_${System.currentTimeMillis() % 1000L}", MemoryPersistence())
                                  val options = MqttConnectOptions().apply {
                                      isAutomaticReconnect = true
                                      connectionTimeout = 15
                                      keepAliveInterval = 30
                                  }
                                  client?.connect(options)
                                  client?.subscribe("cofferno/$sn/cmd", 1)
                                  client?.setCallback(object : MqttCallback {
                                      override fun connectionLost(cause: Throwable?) {}
                                      override fun messageArrived(topic: String?, message: MqttMessage?) {
                                          when (message?.toString()?.trim()) {
                                              "RESET_COUNTERS" -> { resetCounters(); sendHeartbeat() }
                                              "REQUEST_UPDATE" -> sendHeartbeat()
                                              "REBOOT_MACHINE" -> rebootDevice()
                                          }
                                      }
                                      override fun deliveryComplete(token: IMqttDeliveryToken?) {}
                                  })
                                  sched?.shutdownNow()
                                  sched = Executors.newSingleThreadScheduledExecutor()
                                  sched?.scheduleAtFixedRate({ sendHeartbeat() }, 0L, 3L, TimeUnit.SECONDS)
                              }
                          } catch (e: Exception) { e.printStackTrace() }
                          try { Thread.sleep(5000L) } catch (_: Exception) {}
                      }
                  }
              }

              private fun sendHeartbeat() {
                  try {
                      if (client?.isConnected != true) return
                      val sn = getMachineSerial()
                      val drinks = loadDrinks()
                      val p = prefs()
                      val packet = TelemetryPacket(
                          serial = sn,
                          temp = 93.4,
                          pressure = 9.2,
                          status = "LeVending OK",
                          drinks = drinks,
                          deviceId = getDeviceId(),
                          lastSaleName = p.getString("last_sale_name", "") ?: "",
                          lastSalePrice = p.getInt("last_sale_price", 0),
                          lastSaleAt = p.getLong("last_sale_at", 0L)
                      )
                      val msg = MqttMessage(gson.toJson(packet).toByteArray()).apply {
                          qos = 1
                          isRetained = true
                      }
                      client?.publish("cofferno/$sn/data", msg)
                  } catch (e: Exception) { e.printStackTrace() }
              }

              override fun onDestroy() {
                  sched?.shutdownNow()
                  try { client?.disconnect() } catch (_: Exception) {}
                  wakeLock?.release()
                  super.onDestroy()
              }
          }
