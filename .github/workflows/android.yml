              private fun addMachineAndSelect(sn: String) {
                  val s = sn.trim().lowercase().replace(Regex("[^a-z0-9_-]"), "")
                  val l = getSavedMachines().toMutableList()
                  if (!l.contains(s)) { l.add(s); saveMachines(l) }
                  currentSerial = s
                  updateHeader(); renderChips(); renderSelector()
              }

              private fun removeMachine(sn: String) {
                  val s = sn.trim().lowercase().replace(Regex("[^a-z0-9_-]"), "")
                  val l = getSavedMachines().toMutableList(); l.remove(s); saveMachines(l)
                  getSharedPreferences("cofferno_names", Context.MODE_PRIVATE).edit().remove("name_$s").apply()
                  packets.remove(s)
                  lastSeenMap.remove(s)
                  if (currentSerial == s) currentSerial = getSavedMachines().firstOrNull() ?: ""
                  if (selectedFilter == s) selectedFilter = "ALL"
                  updateHeader(); renderChips(); renderSelector(); renderSales(); renderCostsFromAll()
                  Toast.makeText(this, "Автомат [$s] удалён", Toast.LENGTH_SHORT).show()
              }

              private fun reconnectMqtt() {
                  Executors.newSingleThreadExecutor().execute {
                      while (true) {
                          try {
                              if (mqttClient?.isConnected != true) {
                                  try { mqttClient?.disconnect(); mqttClient?.close() } catch (_: Exception) {}
                                  val phoneClientId = "Ph_" + UUID.randomUUID().toString().replace("-", "").take(15)
                                  mqttClient = MqttClient(broker, phoneClientId, MemoryPersistence())
                                  mqttClient!!.setCallback(object : MqttCallback {
                                      override fun connectionLost(c: Throwable?) { isMqttConnected = false }
                                      override fun messageArrived(topic: String?, message: MqttMessage?) {
                                          try {
                                              val t = topic ?: return
                                              val payload = String(message?.payload ?: ByteArray(0), Charsets.UTF_8)
                                              val parts = t.split("/")
                                              if (parts.size < 3) return
                                              val sn = parts[1].trim().lowercase()

                                              if (t.endsWith("/logs")) {
                                                  runOnUiThread {
                                                      if (currentSerial.isEmpty() || sn == currentSerial.lowercase()) {
                                                          val tvRemoteL = findViewById<TextView>(R.id.tv_remote_logs_output)
                                                          tvRemoteL.text = payload
                                                          tvRemoteL.scrollTo(0, 0)
                                                          if (!payload.startsWith("⏳")) {
                                                              Toast.makeText(this@MainActivity, "Логи получены!", Toast.LENGTH_SHORT).show()
                                                          }
                                                      }
                                                  }
                                              } else if (t.endsWith("/data")) {
                                                  val p = gson.fromJson(payload, TelemetryPacket::class.java)
                                                  val pSn = p.serial.trim().lowercase()
                                                  packets[pSn] = p
                                                  
                                                  // ФИКС ОНЛАЙНА: Отмечаем автомат "активным" только если сообщение свежее (не пришло из кэша брокера)
                                                  if (message != null && !message.isRetained) {
                                                      lastSeenMap[pSn] = System.currentTimeMillis()
                                                  }
                                                  
                                                  runOnUiThread { renderSales(); renderCostsFromAll(); refreshDevUi() }
                                              }
                                          } catch (_: Exception) {}
                                      }
                                      override fun deliveryComplete(t: IMqttDeliveryToken?) {}
                                  })
                                  mqttClient!!.connect(MqttConnectOptions().apply { isAutomaticReconnect = true; connectionTimeout = 15; keepAliveInterval = 30 })
                                  isMqttConnected = true

                                  mqttClient!!.subscribe("cofferno/+/data", 0)
                                  mqttClient!!.subscribe("cofferno/+/logs", 0)
                              }
                          } catch (_: Exception) { isMqttConnected = false }
                          Thread.sleep(5000)
                      }
                  }
              }

              private fun cmd(sn: String, c: String) {
                  val s = sn.trim().lowercase().replace(Regex("[^a-z0-9_-]"), "")
                  Executors.newSingleThreadExecutor().execute {
                      try { if (s.isNotEmpty() && mqttClient?.isConnected == true) mqttClient!!.publish("cofferno/$s/cmd", MqttMessage(c.toByteArray(Charsets.UTF_8)).apply { qos = 0 }) } catch (_: Exception) {}
                  }
              }

              private fun renderSales() {
                  val dc = findViewById<LinearLayout>(R.id.ll_drinks_container); dc.removeAllViews()
                  val machines = getSavedMachines()

                  if (machines.isEmpty()) {
                      findViewById<TextView>(R.id.tv_summary_title).text = "Общая выручка"
                      dc.addView(TextView(this).apply { text = "Добавьте автомат во вкладке «Управление» для начала работы."; setTextColor(col(R.color.muted)); textSize = 13f })
                      findViewById<TextView>(R.id.tv_total_revenue).text = "0 ₽"
                      findViewById<TextView>(R.id.tv_total_profit).text = "0 ₽"
                      findViewById<TextView>(R.id.tv_total_cups).text = "Стаканов: 0 шт."
                      return
                  }

                  val pk = if (selectedFilter == "ALL") {
                      findViewById<TextView>(R.id.tv_summary_title).text = "Выручка: ВСЕ АВТОМАТЫ"
                      packets.filterKeys { machines.contains(it) }.values.toList()
                  } else {
                      val filter = selectedFilter.lowercase()
                      findViewById<TextView>(R.id.tv_summary_title).text = "Выручка: ${getName(filter)}"
                      packets[filter]?.let { listOf(it) } ?: emptyList()
                  }

                  if (pk.isEmpty() || pk.all { it.drinks.isEmpty() }) {
                      dc.addView(TextView(this).apply { text = "Продаж пока нет. Включите службу агента на автомате и дождитесь первой выдачи напитка."; setTextColor(col(R.color.muted)); textSize = 13f })
                      findViewById<TextView>(R.id.tv_total_revenue).text = "0 ₽"
                      findViewById<TextView>(R.id.tv_total_profit).text = "0 ₽"
                      findViewById<TextView>(R.id.tv_total_cups).text = "Стаканов: 0 шт."
                      return
                  }

                  val map = linkedMapOf<String, MergedDrink>(); var rev = 0; var prof = 0; var cups = 0
                  pk.forEach { p -> p.drinks.forEach { d ->
                      val cost = getCost(d.name); val e = map[d.name]
                      if (e == null) map[d.name] = MergedDrink(d.name, d.count, d.price, cost) else e.count += d.count
                  } }
                  map.values.forEach { d ->
                      val r = d.count * d.price; val pr = d.count * (d.price - d.cost)
                      rev += r; prof += pr; cups += d.count
                      val card = MaterialCardView(this).apply { setCardBackgroundColor(col(R.color.card)); radius = 16f; layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { setMargins(0, 0, 12, 12) } }
                      val ll = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(24, 20, 24, 20) }
                      ll.addView(TextView(this).apply { text = "${d.name} — ${d.count} шт."; setTextColor(col(R.color.white)); textSize = 15f; setTypeface(null, android.graphics.Typeface.BOLD) })
                      ll.addView(TextView(this).apply { text = "Цена: ${d.price} ₽ • Себ.: ${d.cost} ₽ • Выр.: $r ₽ • Приб.: $pr ₽"; setTextColor(col(R.color.muted)); textSize = 12f; setPadding(0, 4, 0, 0) })
                      card.addView(ll); dc.addView(card)
                  }
                  findViewById<TextView>(R.id.tv_total_revenue).text = "$rev ₽"
                  findViewById<TextView>(R.id.tv_total_profit).text = "$prof ₽ (прибыль)"
                  findViewById<TextView>(R.id.tv_total_cups).text = "Стаканов: $cups шт."
              }

              private fun renderCostsFromAll() {
                  val b = findViewById<LinearLayout>(R.id.ll_costs_container); b.removeAllViews()
                  val empty = findViewById<TextView>(R.id.tv_costs_empty)
                  val names = linkedSetOf<String>()
                  val machines = getSavedMachines()
                  packets.filterKeys { machines.contains(it) }.values.forEach { p -> p.drinks.forEach { names.add(it.name) } }
                  if (names.isEmpty()) { empty.visibility = View.VISIBLE; return }
                  empty.visibility = View.GONE
                  names.forEach { name ->
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(0, 6, 0, 6) }
                      row.addView(TextView(this).apply { text = name; setTextColor(col(R.color.white)); layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f) })
                      row.addView(EditText(this).apply { setText("${getCost(name)}"); setTextColor(col(R.color.accent)); inputType = android.text.InputType.TYPE_CLASS_NUMBER; tag = name; layoutParams = LinearLayout.LayoutParams(160, LinearLayout.LayoutParams.WRAP_CONTENT) })
                      b.addView(row)
                  }
              }

              private fun saveCosts() {
                  val b = findViewById<LinearLayout>(R.id.ll_costs_container)
                  val ed = getSharedPreferences("cofferno_costs", Context.MODE_PRIVATE).edit()
                  for (i in 0 until b.childCount) {
                      val row = b.getChildAt(i) as? LinearLayout ?: continue
                      val et = row.getChildAt(1) as? EditText ?: continue
                      val n = et.tag as? String ?: continue
                      ed.putInt("cost_$n", et.text.toString().toIntOrNull() ?: 0)
                  }; ed.apply()
              }

              private fun getCost(n: String) = getSharedPreferences("cofferno_costs", Context.MODE_PRIVATE).getInt("cost_$n", 0)
              private fun getSavedMachines() = (getSharedPreferences("cofferno_app", Context.MODE_PRIVATE).getString("machines_list", "") ?: "").split(",").map { it.trim().lowercase().replace(Regex("[^a-z0-9_-]"), "") }.filter { it.isNotBlank() }
              private fun saveMachines(l: List<String>) { getSharedPreferences("cofferno_app", Context.MODE_PRIVATE).edit().putString("machines_list", l.map { it.trim().lowercase().replace(Regex("[^a-z0-9_-]"), "") }.distinct().joinToString(",")).apply() }
              private fun getName(s: String): String { val key = s.trim().lowercase().replace(Regex("[^a-z0-9_-]"), ""); val n = getSharedPreferences("cofferno_names", Context.MODE_PRIVATE).getString("name_$key", "") ?: ""; return if (n.isNotBlank()) n else "Автомат $s" }
              private fun saveName(s: String, n: String) { val key = s.trim().lowercase().replace(Regex("[^a-z0-9_-]"), ""); getSharedPreferences("cofferno_names", Context.MODE_PRIVATE).edit().putString("name_$key", n).apply() }
          }
          EOF

          echo "Project generated OK"

      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cofferno-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

      - name: Send APK to Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::warning::BOT_TOKEN or CHAT_ID secrets are not set!"
            exit 0
          fi
          RESPONSE=$(curl -s -X POST \
            -F chat_id="$CHAT_ID" \
            -F document=@"$APK" \
            -F caption="☕ Cofferno LV-307 v7.4.7 (Сборка $(date +'%d.%m %H:%M'))" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument")
          echo "$RESPONSE"
          if echo "$RESPONSE" | grep -q '"ok":true'; then echo "✅ Sent!"; else echo "::error::Telegram failed"; exit 1; fi

      - name: Send errors to Telegram
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python3 - << 'PY'
          import urllib.parse, urllib.request, os
          log = ""
          if os.path.exists("build.log"):
              with open("build.log", "r", errors="ignore") as f:
                  lines = f.readlines()
              err = [l for l in lines if any(k in l for k in ["e: ", "FAILURE:", "What went wrong", "error:"])]
              log = "".join(err[-50:] if err else lines[-60:])
          text = f"❌ Сборка Cofferno v7.4.7 завершилась ошибкой\n\n{log}"[:4000]
          token = os.environ.get("BOT_TOKEN", "")
          chat = os.environ.get("CHAT_ID", "")
          if token and chat:
              data = urllib.parse.urlencode({"chat_id": chat, "text": text}).encode()
              try:
                  urllib.request.urlopen(f"https://api.telegram.org/bot{token}/sendMessage", data=data)
              except Exception as e:
                  print(f"Telegram error: {e}")
          PY
