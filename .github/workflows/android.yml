name: Final Build Delivery

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Telegram - Step 1 (Start)
        run: |
          curl -s -X POST "https://api.telegram.org/bot8923730105:AAFuh0THsvEYvzQCXXtpD_e715WfIZoTaaU/sendMessage" \
            -d "chat_id=864227156" \
            -d "text=🚀 Шаг 1: Файлы проекта созданы. Начинаю настройку системы..."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Project Files
        run: |
          # Создаем структуру папок принудительно
          mkdir -p app/src/main/java/com/coffee/telemetry
          mkdir -p app/src/main/res/values

          # 1. Настройки проекта
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx3072m
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "LV307Telemetry"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2'; classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22" }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # 2. Модуль приложения
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'

          android {
              namespace 'com.coffee.telemetry'
              compileSdk 34
              defaultConfig {
                  applicationId "com.coffee.telemetry"
                  minSdk 21
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          EOF

          # 3. Манифест
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <application android:allowBackup="true" android:icon="@android:drawable/ic_dialog_info" android:label="LV307 Telemetry" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
                  <service android:name=".LV307Service" android:enabled="true" android:exported="false"/>
                  <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter></receiver>
              </application>
          </manifest>
          EOF

          # 4. Код приложения (полная версия)
          cat << 'EOF' > app/src/main/java/com/coffee/telemetry/MainActivity.kt
          package com.coffee.telemetry
          import android.app.Service
          import android.content.*
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.os.*
          import android.text.InputType
          import android.view.*
          import android.widget.*
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import org.eclipse.paho.client.mqttv3.*
          import org.eclipse.paho.client.mqttv3.persist.MemoryPersistence
          import java.text.SimpleDateFormat
          import java.util.*

          data class DrinkConfig(var name: String = "", var sellPrice: Int = 0, var costPrice: Int = 0)
          data class SaleRecord(var drink: String = "", var sellPrice: Int = 0, var costPrice: Int = 0, var ts: Long = 0L)
          data class MachineInfo(var serial: String = "", var isOnline: Boolean = false, var errorCode: String = "0", var errorMsg: String = "OK", var lastDrink: String = "—", var lastUpdate: String = "—")
          data class RemoteCommand(val action: String = "", val value: Int = 0, val stringValue: String = "")

          class Storage(ctx: Context) {
              private val sp = ctx.getSharedPreferences("lv307_data", Context.MODE_PRIVATE)
              private val gson = Gson()
              fun saveUser(l: String, p: String) { sp.edit().putString("user_login", l).putString("user_pass", p).apply() }
              fun getLogin(): String = sp.getString("user_login", "") ?: ""
              fun getPass(): String = sp.getString("user_pass", "") ?: ""
              fun isLoggedIn(): Boolean = getLogin().isNotEmpty()
              fun addMachine(s: String) {
                  val list = getMachines().toMutableList()
                  if (!list.contains(s)) { list.add(s); sp.edit().putString("machines", gson.toJson(list)).apply() }
              }
              fun getMachines(): List<String> {
                  val json = sp.getString("machines", "[]") ?: "[]"
                  return gson.fromJson(json, object : TypeToken<ArrayList<String>>() {}.type) ?: emptyList()
              }
              fun saveDrinks(s: String, d: List<DrinkConfig>) { sp.edit().putString("drinks_$s", gson.toJson(d)).apply() }
              fun getDrinks(s: String): List<DrinkConfig> {
                  val json = sp.getString("drinks_$s", "") ?: ""
                  if (json.isEmpty()) return listOf(DrinkConfig("Кофе", 150, 30))
                  return gson.fromJson(json, object : TypeToken<ArrayList<DrinkConfig>>() {}.type)
              }
              fun addSale(s: String, r: SaleRecord) {
                  val list = getSales(s).toMutableList(); list.add(r)
                  sp.edit().putString("sales_$s", gson.toJson(list)).apply()
              }
              fun getSales(s: String): List<SaleRecord> {
                  val json = sp.getString("sales_$s", "[]") ?: "[]"
                  return gson.fromJson(json, object : TypeToken<ArrayList<SaleRecord>>() {}.type) ?: emptyList()
              }
              fun saveMachineInfo(s: String, i: MachineInfo) { sp.edit().putString("info_$s", gson.toJson(i)).apply() }
              fun getMachineInfo(s: String): MachineInfo {
                  val json = sp.getString("info_$s", "") ?: ""
                  return if (json.isEmpty()) MachineInfo(serial = s) else gson.fromJson(json, MachineInfo::class.java)
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(ctx: Context?, intent: Intent?) {
                  if (intent?.action == Intent.ACTION_BOOT_COMPLETED) ctx?.startService(Intent(ctx, LV307Service::class.java))
              }
          }

          class LV307Service : Service() {
              private var mqtt: MqttClient? = null
              private val gson = Gson()
              private var serial = "LV307_DEF"
              private var data = MachineInfo()
              override fun onStartCommand(i: Intent?, f: Int, s: Int): Int {
                  serial = i?.getStringExtra("serial") ?: "LV307_001"
                  data.serial = serial
                  connect()
                  return START_STICKY
              }
              override fun onBind(intent: Intent?) = null
              private fun connect() {
                  Thread {
                      try {
                          mqtt = MqttClient("tcp://broker.hivemq.com:1883", "SVC_"+serial, MemoryPersistence())
                          mqtt?.setCallback(object : MqttCallbackExtended {
                              override fun connectComplete(r: Boolean, s: String?) { mqtt?.subscribe("vending/$serial/commands", 1); send() }
                              override fun connectionLost(c: Throwable?) {}
                              override fun deliveryComplete(t: IMqttDeliveryToken?) {}
                              override fun messageArrived(t: String?, m: MqttMessage?) {
                                  val cmd = gson.fromJson(String(m?.payload ?: byteArrayOf()), RemoteCommand::class.java)
                                  if(cmd.action == "SIM_SALE") { data.lastDrink = cmd.stringValue }
                                  send()
                              }
                          })
                          mqtt?.connect(MqttConnectOptions().apply { isAutomaticReconnect=true; isCleanSession=true })
                      } catch (e: Exception) {}
                  }.start()
              }
              private fun send() {
                  data.isOnline = true
                  data.lastUpdate = SimpleDateFormat("HH:mm:ss").format(Date())
                  try { mqtt?.publish("vending/$serial/telemetry", MqttMessage(gson.toJson(data).toByteArray()).apply { qos=1 }) } catch(e: Exception) {}
              }
          }

          class MainActivity : AppCompatActivity() {
              private lateinit var db: Storage
              private var mqtt: MqttClient? = null
              private val gson = Gson()
              private val colPrimary = Color.parseColor("#6F4E37")

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  db = Storage(this)
                  if (db.isLoggedIn()) showDashboard() else showLogin()
              }

              private fun showLogin() {
                  val root = LinearLayout(this).apply { orientation=LinearLayout.VERTICAL; setPadding(50,100,50,50); setBackgroundColor(Color.parseColor("#F5F0EB")) }
                  val title = TextView(this).apply { text="☕ LV307 TELEMETRY"; textSize=24f; setTextColor(colPrimary); gravity=Gravity.CENTER; setTypeface(null, Typeface.BOLD) }
                  val login = EditText(this).apply { hint="Логин" }
                  val pass = EditText(this).apply { hint="Пароль"; inputType=InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD }
                  val btn = Button(this).apply { text="ВОЙТИ / РЕГИСТРАЦИЯ"; setBackgroundColor(colPrimary); setTextColor(Color.WHITE) }
                  btn.setOnClickListener {
                      if (login.text.isNotEmpty()) { db.saveUser(login.text.toString(), pass.text.toString()); showDashboard() }
                  }
                  root.addView(title); root.addView(login); root.addView(pass); root.addView(btn)
                  setContentView(root)
              }

              private fun showDashboard() {
                  val root = LinearLayout(this).apply { orientation=LinearLayout.VERTICAL; setPadding(40,40,40,40); setBackgroundColor(Color.parseColor("#F5F0EB")) }
                  val title = TextView(this).apply { text="Мои автоматы"; textSize=20f; setTextColor(Color.BLACK); setPadding(0,0,0,20) }
                  root.addView(title)
                  db.getMachines().forEach { s ->
                      val btn = Button(this).apply { text = "Автомат: $s" }
                      root.addView(btn)
                  }
                  val addBtn = Button(this).apply { text = "+ Добавить машину" }
                  addBtn.setOnClickListener {
                      val input = EditText(this); input.hint = "Серийный номер"
                      AlertDialog.Builder(this).setTitle("Новая машина").setView(input).setPositiveButton("Добавить") { _,_ ->
                          db.addMachine(input.text.toString()); showDashboard()
                      }.show()
                  }
                  val setupBtn = Button(this).apply { text = "Установить на эту кофемашину"; setBackgroundColor(Color.BLACK); setTextColor(Color.WHITE) }
                  setupBtn.setOnClickListener { 
                      startService(Intent(this, LV307Service::class.java).putExtra("serial", "LV307_TEST"))
                      Toast.makeText(this, "Сервис запущен!", Toast.LENGTH_LONG).show()
                      finish()
                  }
                  root.addView(addBtn); root.addView(setupBtn)
                  setContentView(root)
              }
          }
          EOF

      - name: Telegram - Step 2 (Build)
        run: |
          curl -s -X POST "https://api.telegram.org/bot8923730105:AAFuh0THsvEYvzQCXXtpD_e715WfIZoTaaU/sendMessage" \
            -d "chat_id=864227156" \
            -d "text=⚙️ Шаг 2: Начинаю компиляцию APK. Это займет около 2-3 минут. Не выключайте Telegram..."

      - name: Build with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Telegram - Step 3 (Upload)
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot8923730105:AAFuh0THsvEYvzQCXXtpD_e715WfIZoTaaU/sendMessage" \
            -d "chat_id=864227156" \
            -d "text=📦 Шаг 3: Сборка успешно завершена! Загружаю файл APK..."
          
          curl -F chat_id="864227156" \
               -F document=@app/build/outputs/apk/debug/app-debug.apk \
               -F caption="✅ LV307 Telemetry v3.0 готова! Установите файл на смартфон или автомат." \
               https://api.telegram.org/bot8923730105:AAFuh0THsvEYvzQCXXtpD_e715WfIZoTaaU/sendDocument

      - name: Telegram - Error Report
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot8923730105:AAFuh0THsvEYvzQCXXtpD_e715WfIZoTaaU/sendMessage" \
            -d "chat_id=864227156" \
            -d "text=❌ Ошибка при сборке! Проверьте логи на GitHub. Скорее всего, закончилась память или ошибка в коде."
