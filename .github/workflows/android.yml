                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@color/card"
                  android:padding="14dp"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  app:layout_constraintTop_toTopOf="parent">
                  <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1" android:orientation="vertical">
                      <TextView android:id="@+id/tv_header_title" android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="☕ Cofferno LV-307" android:textColor="@color/white"
                          android:textSize="17sp" android:textStyle="bold"/>
                      <TextView android:id="@+id/tv_status" android:layout_width="wrap_content"
                          android:layout_height="wrap_content" android:text="● Подключение к серверу..."
                          android:textColor="@color/yellow" android:textSize="11sp"/>
                      <TextView android:id="@+id/tv_active_machine" android:layout_width="wrap_content"
                          android:layout_height="wrap_content" android:text="Автомат: Не выбран"
