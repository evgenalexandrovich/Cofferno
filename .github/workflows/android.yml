name: Deliver Telegram APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Start
        run: |
          curl -s -X POST "https://api.telegram.org/bot8923730105:AAGxhDICR3BtkaKeDOo2WiZE3OrdS_qiYk4/sendMessage" \
            -d "chat_id=864227156" \
            -d "text=🚀 Сборка заложена в контейнер. Начинаю компиляцию APK (около 1.5-2 минут)..."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Clean Project Files
        run: |
          mkdir -p app/src/main/java/com/coffee/telemetry
          mkdir -p app/src/main/res/values

          # Settings
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LV307Telemetry"
          include ':app'
          EOF

          # Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          # Properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          # App build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.coffee.telemetry'
              compileSdk 34

              defaultConfig {
                  applicationId "com.coffee.telemetry"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.google.code.gson:gson:2.10.1'
              implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
          }
          EOF

          # Manifest
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_dialog_info"
                  android:label="LV307 Telemetry"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/coffee/telemetry/MainActivity.kt
          package com.coffee.telemetry

          import android.graphics.Color
          import android.graphics.Typeface
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(60, 100, 60, 60)
                      setBackgroundColor(Color.parseColor("#F5F0EB"))
                  }

                  val title = TextView(this).apply {
                      text = "☕ LV307 TELEMETRY"
                      textSize = 26f
                      setTextColor(Color.parseColor("#6F4E37"))
                      gravity = Gravity.CENTER
                      setTypeface(null, Typeface.BOLD)
                  }

                  val subtitle = TextView(this).apply {
                      text = "\nПриложение успешно скомпилировано!\n\nГотово к работе с автоматом LV307."
                      textSize = 16f
                      setTextColor(Color.DKGRAY)
                      gravity = Gravity.CENTER
                  }

                  val btn = Button(this).apply {
                      text = "ПРОВЕРИТЬ СВЯЗЬ"
                      setBackgroundColor(Color.parseColor("#6F4E37"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          Toast.makeText(this@MainActivity, "Связь OK!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  root.addView(title)
                  root.addView(subtitle)
                  root.addView(btn)

                  setContentView(root)
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt

      - name: Send APK to Telegram
        if: success()
        run: |
          curl -F chat_id="864227156" \
               -F document=@app/build/outputs/apk/debug/app-debug.apk \
               -F caption="✅ Твой готовый APK файл для кофемашины LV307 и смартфона!" \
               https://api.telegram.org/bot8923730105:AAGxhDICR3BtkaKeDOo2WiZE3OrdS_qiYk4/sendDocument

      - name: Send Precise Error Telegram
        if: failure()
        run: |
          ERR_LINE=$(grep -i -E "error|failure|e:" build_log.txt | head -n 5 | tr '\n' ' ' | tr -d '"')
          curl -s -X POST "https://api.telegram.org/bot8923730105:AAGxhDICR3BtkaKeDOo2WiZE3OrdS_qiYk4/sendMessage" \
            -d "chat_id=864227156" \
            -d "text=❌ Ошибка сборки: $ERR_LINE"
