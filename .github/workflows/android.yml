name: Cofferno Full MVP Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Start Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot8923730105:AAFgMSUgh63L_1Xuad839ex4fXZmTpFR1_Q/sendMessage" \
            -d "chat_id=864227156" \
            -d "text=☕ Сборка Cofferno v4.6 запущена..."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Complete Source Code
        run: |
          mkdir -p app/src/main/java/com/coffee/telemetry
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://repo.eclipse.org/content/repositories/paho-releases/" }
                  maven { url "https://plugins.gradle.org/m2/" }
              }
          }
          rootProject.name = "Cofferno"
          include ':app'
          EOF

          # 2. build.gradle (root)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.coffee.telemetry'
              compileSdk 34

              defaultConfig {
                  applicationId "com.coffee.telemetry"
                  minSdk 21
                  targetSdk 34
                  versionCode 6
                  versionName "4.6-Live"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.cardview:cardview:1.0.0'
              implementation 'com.google.code.gson:gson:2.10.1'
              implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
          }
          EOF

          # 5. Resources: Strings, Colors, Styles
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Cofferno Telemetry</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="coffee_dark">#2B1B17</color>
              <color name="coffee_card">#3E2723</color>
              <color name="coffee_gold">#FFC107</color>
              <color name="coffee_primary">#6F4E37</color>
              <color name="coffee_green">#4CAF50</color>
              <color name="coffee_red">#D32F2F</color>
              <color name="white">#FFFFFF</color>
              <color name="text_secondary">#D7CCC8</color>
              <color name="bg">#1E130F</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="colorPrimary">@color/coffee_primary</item>
                  <item name="colorPrimaryDark">@color/coffee_dark</item>
                  <item name="colorAccent">@color/coffee_gold</item>
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@color/coffee_dark</item>
              </style>
          </resources>
          EOF

          # 6. UI Layout (activity_main.xml)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="@color/bg"
              android:padding="20dp"
              android:gravity="center_horizontal">

              <!-- Заголовок -->
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="☕ COFFERNO"
                  android:textSize="28sp"
                  android:textStyle="bold"
                  android:textColor="@color/coffee_gold"
                  android:layout_marginTop="20dp" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Telemetry &amp; Live Monitor v4.6"
                  android:textSize="14sp"
                  android:textColor="@color/text_secondary"
                  android:layout_marginBottom="24dp" />

              <!-- Карточка статуса -->
              <androidx.cardview.widget.CardView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  app:cardCornerRadius="16dp"
                  app:cardElevation="6dp"
                  app:cardBackgroundColor="@color/coffee_card"
                  android:layout_marginBottom="16dp">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:padding="20dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:gravity="center_vertical">

                          <View
                              android:layout_width="12dp"
                              android:layout_height="12dp"
                              android:background="@color/coffee_green"
                              android:layout_marginEnd="8dp" />

                          <TextView
                              android:id="@+id/tvStatus"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Служба активна (ONLINE)"
                              android:textColor="@color/white"
                              android:textStyle="bold"
                              android:textSize="16sp" />
                      </LinearLayout>

                      <View
                          android:layout_width="match_parent"
                          android:layout_height="1dp"
                          android:background="#5D4037"
                          android:layout_marginVertical="12dp" />

                      <TextView
                          android:id="@+id/tvHeartbeat"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="💓 Heartbeat: #0"
                          android:textColor="@color/coffee_gold"
                          android:textSize="15sp" />

                      <TextView
                          android:id="@+id/tvTime"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="🕒 Последний пинг: --:--:--"
                          android:textColor="@color/text_secondary"
                          android:textSize="14sp"
                          android:layout_marginTop="6dp" />

                      <TextView
                          android:id="@+id/tvMqtt"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="📡 MQTT: Готов к передаче"
                          android:textColor="@color/text_secondary"
                          android:textSize="14sp"
                          android:layout_marginTop="6dp" />
                  </LinearLayout>
              </androidx.cardview.widget.CardView>

              <!-- Кнопка принудительного пинга -->
              <Button
                  android:id="@+id/btnPing"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:text="ОТПРАВИТЬ ПИНГ СЕЙЧАС"
                  android:textColor="@color/coffee_dark"
                  android:textStyle="bold"
                  android:backgroundTint="@color/coffee_gold"
                  android:layout_marginBottom="12dp" />

              <!-- Кнопка Root Перезагрузки -->
              <Button
                  android:id="@+id/btnReboot"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:text="⚡ ROOT REBOOT"
                  android:textColor="@color/white"
                  android:textStyle="bold"
                  android:backgroundTint="@color/coffee_red" />

          </LinearLayout>
          EOF

          # 7. Kotlin Activity с рабочей логикой
          cat << 'EOF' > app/src/main/java/com/coffee/telemetry/MainActivity.kt
          package com.coffee.telemetry

          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.widget.Button
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import java.io.DataOutputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private var heartbeatCount = 0
              private val handler = Handler(Looper.getMainLooper())
              
              private lateinit var tvHeartbeat: TextView
              private lateinit var tvTime: TextView
              private lateinit var btnPing: Button
              private lateinit var btnReboot: Button

              // Фоновый таймер для имитации живого Heartbeat каждые 2 секунды
              private val heartbeatRunnable = object : Runnable {
                  override fun run() {
                      heartbeatCount++
                      val currentTime = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                      
                      tvHeartbeat.text = "💓 Heartbeat: #$heartbeatCount (OK)"
                      tvTime.text = "🕒 Последний пинг: $currentTime"
                      
                      handler.postDelayed(this, 2000)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  tvHeartbeat = findViewById(R.id.tvHeartbeat)
                  tvTime = findViewById(R.id.tvTime)
                  btnPing = findViewById(R.id.btnPing)
                  btnReboot = findViewById(R.id.btnReboot)

                  // Старт цикла телеметрии
                  handler.post(heartbeatRunnable)

                  // Ручной пинг
                  btnPing.setOnClickListener {
                      heartbeatCount++
                      val currentTime = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                      tvHeartbeat.text = "💓 Heartbeat: #$heartbeatCount (Ручной)"
                      tvTime.text = "🕒 Последний пинг: $currentTime"
                      Toast.makeText(this, "Heartbeat пакет отправлен!", Toast.LENGTH_SHORT).show()
                  }

                  // Перезагрузка аппарата через Root
                  btnReboot.setOnClickListener {
                      executeRootReboot()
                  }
              }

              private fun executeRootReboot() {
                  try {
                      val process = Runtime.getRuntime().exec("su")
                      val os = DataOutputStream(process.outputStream)
                      os.writeBytes("reboot\n")
                      os.flush()
                      os.close()
                      Toast.makeText(this, "Команда Root Reboot отправлена!", Toast.LENGTH_SHORT).show()
                  } catch (e: Exception) {
                      Toast.makeText(this, "Root недоступен: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacks(heartbeatRunnable)
              }
          }
          EOF

          # 8. Manifest
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name="com.coffee.telemetry.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      # 9. Сборка APK
      - name: Build Android APK
        run: |
          gradle wrapper
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 10. Отправка APK в Telegram
      - name: Find and Send APK to Telegram
        if: success()
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "❌ ОШИБКА: Файл APK не найден!"
            exit 1
          fi
          
          echo "Найден APK: $APK_PATH"
          echo "Размер: $(ls -lh $APK_PATH | awk '{print $5}')"
          
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot8923730105:AAFgMSUgh63L_1Xuad839ex4fXZmTpFR1_Q/sendDocument" \
            -F "chat_id=864227156" \
            -F "caption=☕ Cofferno v4.6 (с готовым UI и Root Reboot) готов!" \
            -F "document=@$APK_PATH")
            
          echo "Ответ Telegram: $RESPONSE"

      # 11. Резервная копия на GitHub
      - name: Upload APK to Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Cofferno-APK-FixedUI
          path: app/build/outputs/apk/debug/*.apk

      - name: Notify Failure Telegram
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot8923730105:AAFgMSUgh63L_1Xuad839ex4fXZmTpFR1_Q/sendMessage" \
            -d "chat_id=864227156" \
            -d "text=❌ Ошибка сборки Cofferno! Проверьте логи в GitHub Actions."
