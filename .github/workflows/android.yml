          # MainActivity.kt
          cat << 'EOF' > $P/MainActivity.kt
          package com.coffee.telemetry

          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import com.google.android.material.bottomnavigation.BottomNavigationView
          import com.google.android.material.card.MaterialCardView
          import com.google.android.material.switchmaterial.SwitchMaterial
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import org.eclipse.paho.client.mqttv3.*
          import org.eclipse.paho.client.mqttv3.persist.MemoryPersistence
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.Executors

          data class MergedDrink(
              val name: String,
              var count: Int,
              val price: Int,
              val cost: Int
          )

          class MainActivity : AppCompatActivity() {
              private val broker = "tcp://broker.hivemq.com:1883"
              private var mqttClient: MqttClient? = null
              private val gson = Gson()
              private var lastMsgTime = 0L
              private var isMqttConnected = false
              
              private var selectedFilterSerial = "ALL"
              private var currentSelectedSerial = ""
              
              private val machinePackets = ConcurrentHashMap<String, TelemetryPacket>()
              private val mainHandler = Handler(Looper.getMainLooper())

              private val watchdog = object : Runnable {
                  override fun run() {
                      val tvStatus = findViewById<TextView>(R.id.tv_status)
                      when {
                          !isMqttConnected -> {
                              tvStatus.text = "● Подключение к серверу MQTT..."
                              tvStatus.setTextColor(c(R.color.yellow))
                          }
                          System.currentTimeMillis() - lastMsgTime > 9000 -> {
                              tvStatus.text = "🔴 Аппараты оффлайн (Ожидание)"
                              tvStatus.setTextColor(c(R.color.red))
                          }
                          else -> {
                              val activeCount = machinePackets.size
                              tvStatus.text = "🟢 Онлайн | Связь с $activeCount апп."
                              tvStatus.setTextColor(c(R.color.green))
                          }
                      }
                      mainHandler.postDelayed(this, 2000)
                  }
              }

              private fun c(id: Int) = ContextCompat.getColor(this, id)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val tabSales = findViewById<LinearLayout>(R.id.tab_sales)
                  val tabManage = findViewById<LinearLayout>(R.id.tab_manage)
                  val tabAgent = findViewById<LinearLayout>(R.id.tab_agent)

                  findViewById<BottomNavigationView>(R.id.bottom_nav).setOnItemSelectedListener {
                      tabSales.visibility = if (it.itemId == R.id.nav_sales) View.VISIBLE else View.GONE
                      tabManage.visibility = if (it.itemId == R.id.nav_manage) View.VISIBLE else View.GONE
                      tabAgent.visibility = if (it.itemId == R.id.nav_agent) View.VISIBLE else View.GONE
                      true
                  }

                  val machines = getSavedMachines()
                  if (machines.isNotEmpty()) {
                      currentSelectedSerial = machines[0]
                  }

                  updateHeaderActiveMachine()
                  renderFilterChips()
                  renderMachineSelectorList()

                  findViewById<Button>(R.id.btn_refresh_top).setOnClickListener {
                      if (selectedFilterSerial == "ALL") {
                          for (sn in getSavedMachines()) { sendMachineCmd(sn, "REQUEST_UPDATE") }
                      } else {
                          sendMachineCmd(selectedFilterSerial, "REQUEST_UPDATE")
                      }
                      Toast.makeText(this, "🔄 Запрос актуальных данных...", Toast.LENGTH_SHORT).show()
                  }

                  findViewById<Button>(R.id.btn_add_machine).setOnClickListener {
                      val sn = findViewById<EditText>(R.id.et_new_serial).text.toString().trim().lowercase()
                      if (sn.isNotEmpty()) {
                          val list = getSavedMachines().toMutableList()
                          if (!list.contains(sn)) {
                              list.add(sn)
                              saveMachines(list)
                              currentSelectedSerial = sn
                              renderFilterChips()
                              renderMachineSelectorList()
                              reconnectMqtt()
                              Toast.makeText(this, "Аппарат $sn добавлен", Toast.LENGTH_SHORT).show()
                          }
                          findViewById<EditText>(R.id.et_new_serial).text.clear()
                      }
                  }

                  findViewById<Button>(R.id.btn_save_name).setOnClickListener {
                      val newName = findViewById<EditText>(R.id.et_custom_name).text.toString().trim()
                      if (currentSelectedSerial.isNotEmpty() && newName.isNotEmpty()) {
                          saveMachineName(currentSelectedSerial, newName)
                          updateHeaderActiveMachine()
                          renderFilterChips()
                          renderMachineSelectorList()
                          findViewById<EditText>(R.id.et_custom_name).text.clear()
                          Toast.makeText(this, "Имя аппарата сохранено", Toast.LENGTH_SHORT).show()
                      }
                  }

                  findViewById<Button>(R.id.btn_save_all_costs).setOnClickListener {
                      saveAllCostsFromInputs()
                      Toast.makeText(this, "Себестоимость сохранена!", Toast.LENGTH_SHORT).show()
                      renderSalesUi()
                  }

                  findViewById<Button>(R.id.btn_reset_counters).setOnClickListener {
                      if (currentSelectedSerial.isEmpty()) {
                          Toast.makeText(this, "Выберите аппарат!", Toast.LENGTH_SHORT).show()
                      } else {
                          sendMachineCmd(currentSelectedSerial, "RESET_COUNTERS")
                          Toast.makeText(this, "Счетчики $currentSelectedSerial обнулены!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  findViewById<Button>(R.id.btn_remote_reboot).setOnClickListener {
                      if (currentSelectedSerial.isEmpty()) {
                          Toast.makeText(this, "Выберите аппарат!", Toast.LENGTH_SHORT).show()
                      } else {
                          sendMachineCmd(currentSelectedSerial, "REBOOT_MACHINE")
                          Toast.makeText(this, "⚡ Команда перезагрузки отправлена", Toast.LENGTH_SHORT).show()
                      }
                  }

                  findViewById<Button>(R.id.btn_remote_flush).setOnClickListener {
                      sendMachineCmd(currentSelectedSerial, "FLUSH")
                      Toast.makeText(this, "Промывка запущена", Toast.LENGTH_SHORT).show()
                  }
                  findViewById<Button>(R.id.btn_remote_lock).setOnClickListener {
                      sendMachineCmd(currentSelectedSerial, "TOGGLE_LOCK")
                      Toast.makeText(this, "Команда блокировки отправлена", Toast.LENGTH_SHORT).show()
                  }

                  val agentPrefs = getSharedPreferences("cofferno_agent", Context.MODE_PRIVATE)
                  val etAgentSn = findViewById<EditText>(R.id.et_agent_serial)
                  val savedAgentSn = agentPrefs.getString("custom_serial", "") ?: ""
                  val fallbackSn = Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: "unit_1"
                  etAgentSn.setText(if (savedAgentSn.isNotEmpty()) savedAgentSn else fallbackSn)

                  findViewById<Button>(R.id.btn_save_agent_serial).setOnClickListener {
                      val snToSave = etAgentSn.text.toString().trim().lowercase()
                      if (snToSave.isNotEmpty()) {
                          agentPrefs.edit().putString("custom_serial", snToSave).apply()
                          Toast.makeText(this, "Заводской S/N сохранен: $snToSave", Toast.LENGTH_LONG).show()
                      }
                  }

                  val swAgent = findViewById<SwitchMaterial>(R.id.switch_agent)
                  val tvAgentStatus = findViewById<TextView>(R.id.tv_agent_status)
                  swAgent.isChecked = agentPrefs.getBoolean("agent_active", false)
                  tvAgentStatus.text = if (swAgent.isChecked) "🟢 Служба активна" else "Остановлена"

                  swAgent.setOnCheckedChangeListener { _, isActive ->
                      agentPrefs.edit().putBoolean("agent_active", isActive).apply()
                      if (isActive) {
                          tvAgentStatus.text = "🟢 Запуск службы..."
                          val i = Intent(this, AgentService::class.java)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i)
                          else startService(i)
                          mainHandler.postDelayed({ moveTaskToBack(true) }, 1000)
                      } else {
                          stopService(Intent(this, AgentService::class.java))
                          tvAgentStatus.text = "Остановлена"
                      }
                  }

                  findViewById<Button>(R.id.btn_scan_coffeenet).setOnClickListener {
                      val tvLogs = findViewById<TextView>(R.id.tv_coffeenet_logs)
                      tvLogs.text = "Выполняется глубокое сканирование CoffeeNet..."
                      Executors.newSingleThreadExecutor().execute {
                          val result = CoffeeNetReader.scanCoffeeNetEnvironment(this)
                          runOnUiThread { tvLogs.text = result }
                      }
                  }

                  reconnectMqtt()
                  mainHandler.post(watchdog)
              }

              private fun updateHeaderActiveMachine() {
                  val tvActive = findViewById<TextView>(R.id.tv_active_machine)
                  if (selectedFilterSerial == "ALL") {
                      tvActive.text = "Режим: 🌐 Вся сеть (Все аппараты)"
                  } else {
                      val name = getMachineName(selectedFilterSerial)
                      tvActive.text = "Режим: ☕ $name ($selectedFilterSerial)"
                  }
              }

              private fun renderFilterChips() {
                  val container = findViewById<LinearLayout>(R.id.ll_filter_chips)
                  container.removeAllViews()

                  val machines = getSavedMachines()

                  val btnAll = Button(this).apply {
                      val isSel = (selectedFilterSerial == "ALL")
                      text = "🌐 Все аппараты"
                      textSize = 12f
                      setBackgroundColor(if (isSel) c(R.color.accent) else c(R.color.card))
                      setTextColor(if (isSel) c(R.color.dark) else c(R.color.white))
                      setOnClickListener {
                          selectedFilterSerial = "ALL"
                          updateHeaderActiveMachine()
                          renderFilterChips()
                          renderSalesUi()
                      }
                  }
                  val lpAll = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  lpAll.setMargins(0, 0, 12, 0)
                  container.addView(btnAll, lpAll)

                  for (sn in machines) {
                      val customName = getMachineName(sn)
                      val btn = Button(this).apply {
                          val isSel = (selectedFilterSerial == sn)
                          text = "☕ $customName"
                          textSize = 12f
                          setBackgroundColor(if (isSel) c(R.color.accent) else c(R.color.card))
                          setTextColor(if (isSel) c(R.color.dark) else c(R.color.white))
                          setOnClickListener {
                              selectedFilterSerial = sn
                              currentSelectedSerial = sn
                              updateHeaderActiveMachine()
                              renderFilterChips()
                              renderMachineSelectorList()
                              renderSalesUi()
                          }
                      }
                      val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      lp.setMargins(0, 0, 12, 0)
                      container.addView(btn, lp)
                  }
              }

              private fun renderMachineSelectorList() {
                  val machines = getSavedMachines()
                  val container = findViewById<LinearLayout>(R.id.ll_machine_selector)
                  container.removeAllViews()

                  if (machines.isEmpty()) {
                      val tv = TextView(this).apply {
                          text = "Нет добавленных аппаратов. Введите S/N выше."
                          setTextColor(c(R.color.muted))
                          textSize = 12f
                          setPadding(0, 8, 0, 8)
                      }
                      container.addView(tv)
                  } else {
                      for (sn in machines) {
                          val customName = getMachineName(sn)
                          val isSelected = (sn == currentSelectedSerial)
                          val btn = Button(this).apply {
                              text = if (isSelected) "✅ $customName (S/N: $sn)" else "• $customName (S/N: $sn)"
                              setBackgroundColor(if (isSelected) c(R.color.accent) else c(R.color.card))
                              setTextColor(if (isSelected) c(R.color.dark) else c(R.color.white))
                              textSize = 12f
                              setOnClickListener {
                                  currentSelectedSerial = sn
                                  updateHeaderActiveMachine()
                                  renderMachineSelectorList()
                                  Toast.makeText(this@MainActivity, "Выбран для команд: $customName", Toast.LENGTH_SHORT).show()
                              }
                          }
                          val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                          lp.setMargins(0, 4, 0, 4)
                          container.addView(btn, lp)
                      }
                  }
              }

              private fun reconnectMqtt() {
                  Executors.newSingleThreadExecutor().execute {
                      while (true) {
                          try {
                              if (mqttClient == null || mqttClient?.isConnected == false) {
                                  val clientId = "Phone_" + (System.currentTimeMillis() % 100000)
                                  mqttClient = MqttClient(broker, clientId, MemoryPersistence())
                                  val options = MqttConnectOptions().apply {
                                      isAutomaticReconnect = true
                                      connectionTimeout = 15
                                      keepAliveInterval = 30
                                  }
                                  mqttClient?.connect(options)
                                  mqttClient?.setCallback(object : MqttCallback {
                                      override fun connectionLost(cause: Throwable?) { isMqttConnected = false }
                                      override fun messageArrived(topic: String?, message: MqttMessage?) {
                                          val json = message?.toString() ?: return
                                          try {
                                              val packet = gson.fromJson(json, TelemetryPacket::class.java)
                                              machinePackets[packet.serial] = packet
                                              lastMsgTime = System.currentTimeMillis()
                                              runOnUiThread {
                                                  renderSalesUi()
                                                  renderCostInputs(packet)
                                              }
                                          } catch (e: Exception) {}
                                      }
                                      override fun deliveryComplete(token: IMqttDeliveryToken?) {}
                                  })

                                  mqttClient?.subscribe("cofferno/+/data", 1)
                                  isMqttConnected = true
                              }
                          } catch (e: Exception) { isMqttConnected = false }
                          try { Thread.sleep(5000) } catch (e: Exception) {}
                      }
                  }
              }

              private fun sendMachineCmd(serial: String, cmd: String) {
                  Executors.newSingleThreadExecutor().execute {
                      try {
                          if (serial.isNotEmpty() && mqttClient?.isConnected == true) {
                              mqttClient?.publish("cofferno/$serial/cmd", MqttMessage(cmd.toByteArray()).apply { qos = 1 })
                          }
                      } catch (e: Exception) { e.printStackTrace() }
                  }
              }

              private fun renderSalesUi() {
                  val drinksContainer = findViewById<LinearLayout>(R.id.ll_drinks_container)
                  val tvSummaryTitle = findViewById<TextView>(R.id.tv_summary_title)
                  drinksContainer.removeAllViews()

                  val packetsToDisplay = if (selectedFilterSerial == "ALL") {
                      tvSummaryTitle.text = "💰 Выручка и прибыль (Все аппараты)"
                      machinePackets.values.toList()
                  } else {
                      val name = getMachineName(selectedFilterSerial)
                      tvSummaryTitle.text = "💰 Выручка и прибыль: $name"
                      listOfNotNull(machinePackets[selectedFilterSerial])
                  }

                  if (packetsToDisplay.isEmpty()) {
                      val tvEmpty = TextView(this).apply {
                          text = "Ожидание поступления данных от CoffeeNet..."
                          setTextColor(c(R.color.muted))
                          textSize = 13f
                          setPadding(16, 24, 16, 24)
                      }
                      drinksContainer.addView(tvEmpty)
                      findViewById<TextView>(R.id.tv_total_revenue).text = "0 ₽"
                      findViewById<TextView>(R.id.tv_total_profit).text = "0 ₽"
                      findViewById<TextView>(R.id.tv_total_cups).text = "Всего напитков: 0 порций"
                      return
                  }

                  val aggregatedDrinks = LinkedHashMap<String, MergedDrink>()
                  var totalRevenue = 0
                  var totalProfit = 0
                  var totalCups = 0

                  for (packet in packetsToDisplay) {
                      for (d in packet.drinks) {
                          val cost = getDrinkCost(d.name)
                          val existing = aggregatedDrinks[d.name]
                          if (existing == null) {
                              aggregatedDrinks[d.name] = MergedDrink(d.name, d.count, d.price, cost)
                          } else {
                              existing.count += d.count
                          }
                      }
                  }

                  for ((_, d) in aggregatedDrinks) {
                      val rev = d.count * d.price
                      val profit = d.count * (d.price - d.cost)

                      totalRevenue += rev
                      totalProfit += profit
                      totalCups += d.count

                      val card = MaterialCardView(this).apply {
                          setCardBackgroundColor(c(R.color.card))
                          radius = 16f
                          val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                          lp.setMargins(0, 0, 0, 16)
                          layoutParams = lp

                          val row = LinearLayout(this@MainActivity).apply {
                              orientation = LinearLayout.HORIZONTAL
                              setPadding(28, 24, 28, 24)
                              weightSum = 2f

                              val left = LinearLayout(this@MainActivity).apply {
                                  orientation = LinearLayout.VERTICAL
                                  layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.2f)
                                  
                                  val tvName = TextView(this@MainActivity).apply {
                                      text = "☕ ${d.name}"
                                      setTextColor(c(R.color.white))
                                      textSize = 15f
                                      setTypeface(null, android.graphics.Typeface.BOLD)
                                  }
                                  val tvDetail = TextView(this@MainActivity).apply {
                                      text = "${d.count} порций × ${d.price} ₽ (Себес: ${d.cost} ₽)"
                                      setTextColor(c(R.color.muted))
                                      textSize = 11f
                                  }
                                  addView(tvName)
                                  addView(tvDetail)
                              }

                              val right = LinearLayout(this@MainActivity).apply {
                                  orientation = LinearLayout.VERTICAL
                                  gravity = android.view.Gravity.END
                                  layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 0.8f)

                                  val tvRev = TextView(this@MainActivity).apply {
                                      text = "$rev ₽"
                                      setTextColor(c(R.color.accent))
                                      textSize = 15f
                                      setTypeface(null, android.graphics.Typeface.BOLD)
                                  }
                                  val tvProf = TextView(this@MainActivity).apply {
                                      text = "+$profit ₽"
                                      setTextColor(if (profit >= 0) c(R.color.green) else c(R.color.red))
                                      textSize = 12f
                                  }
                                  addView(tvRev)
                                  addView(tvProf)
                              }

                              addView(left)
                              addView(right)
                          }
                          addView(row)
                      }
                      drinksContainer.addView(card)
                  }

                  findViewById<TextView>(R.id.tv_total_revenue).text = "$totalRevenue ₽"
                  findViewById<TextView>(R.id.tv_total_profit).text = "$totalProfit ₽"
                  findViewById<TextView>(R.id.tv_total_cups).text = "Всего напитков: $totalCups порций"
              }

              private fun renderCostInputs(packet: TelemetryPacket) {
                  val container = findViewById<LinearLayout>(R.id.ll_costs_container)
                  if (container.childCount > 0) return

                  for (d in packet.drinks) {
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          setPadding(0, 6, 0, 6)
                          gravity = android.view.Gravity.CENTER_VERTICAL

                          val tv = TextView(this@MainActivity).apply {
                              text = "${d.name} (${d.price} ₽)"
                              setTextColor(c(R.color.white))
                              textSize = 13f
                              layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                          }

                          val etCost = EditText(this@MainActivity).apply {
                              hint = "Себес ₽"
                              setText(getDrinkCost(d.name).toString())
                              setTextColor(c(R.color.accent))
                              textSize = 13f
                              inputType = android.text.InputType.TYPE_CLASS_NUMBER
                              tag = d.name
                              layoutParams = LinearLayout.LayoutParams(160, LinearLayout.LayoutParams.WRAP_CONTENT)
                          }
                          addView(tv)
                          addView(etCost)
                      }
                      container.addView(row)
                  }
              }

              private fun saveAllCostsFromInputs() {
                  val container = findViewById<LinearLayout>(R.id.ll_costs_container)
                  val prefs = getSharedPreferences("cofferno_costs", Context.MODE_PRIVATE).edit()
                  for (i in 0 until container.childCount) {
                      val row = container.getChildAt(i) as? LinearLayout
                      val et = row?.getChildAt(1) as? EditText
                      val drinkName = et?.tag as? String
                      val costVal = et?.text.toString().toIntOrNull() ?: 35
                      if (!drinkName.isNullOrEmpty()) {
                          prefs.putInt("cost_$drinkName", costVal)
                      }
                  }
                  prefs.apply()
              }

              private fun getDrinkCost(drinkName: String): Int {
                  return getSharedPreferences("cofferno_costs", Context.MODE_PRIVATE).getInt("cost_$drinkName", 40)
              }

              private fun getSavedMachines(): List<String> {
                  val raw = getSharedPreferences("cofferno_app", Context.MODE_PRIVATE).getString("machines_list", "") ?: ""
                  return if (raw.isBlank()) emptyList() else raw.split(",").filter { it.isNotBlank() }
              }

              private fun saveMachines(list: List<String>) {
                  getSharedPreferences("cofferno_app", Context.MODE_PRIVATE)
                      .edit().putString("machines_list", list.distinct().joinToString(",")).apply()
              }

              private fun getMachineName(serial: String): String {
                  val name = getSharedPreferences("cofferno_names", Context.MODE_PRIVATE).getString("name_$serial", "") ?: ""
                  return if (name.isNotBlank()) name else "LV-307 ($serial)"
              }

              private fun saveMachineName(serial: String, name: String) {
                  getSharedPreferences("cofferno_names", Context.MODE_PRIVATE)
                      .edit().putString("name_$serial", name).apply()
              }
          }
          EOF

      # 1. Сборка проекта через Gradle
      - name: Build APK with Gradle
        run: |
          gradle assembleDebug --stacktrace

      # 2. Отправка собранного APK в Telegram
      - name: Send APK to Telegram
        if: success()
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "Файл найден: $APK_PATH. Отправляем в Telegram..."
            curl -F chat_id="${{ env.CHAT_ID }}" \
                 -F document=@"$APK_PATH" \
                 -F caption="☕ <b>Сборка Cofferno LV-307 готова!</b>%0AВерсия: <code>7.0-COFFEENET</code>" \
                 -F parse_mode="HTML" \
                 "https://api.telegram.org/bot${{ env.BOT_TOKEN }}/sendDocument"
          else
            echo "Ошибка: APK файл не найден по пути $APK_PATH"
            exit 1
          fi

      # 3. Отправка сообщения, если сборка провалилась
      - name: Send Failure Alert to Telegram
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_TOKEN }}/sendMessage" \
               -d "chat_id=${{ env.CHAT_ID }}" \
               -d "text=❌ <b>Ошибка сборки Cofferno LV-307!</b> Проверьте логи в GitHub Actions." \
               -d "parse_mode=HTML"
