          # ---------- MainActivity.kt ----------
          cat > $P/MainActivity.kt << 'EOF'
          package com.coffee.telemetry

          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.text.method.ScrollingMovementMethod
          import android.view.MotionEvent
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import com.google.android.material.bottomnavigation.BottomNavigationView
          import com.google.android.material.card.MaterialCardView
          import com.google.android.material.switchmaterial.SwitchMaterial
          import com.google.gson.Gson
          import org.eclipse.paho.client.mqttv3.*
          import org.eclipse.paho.client.mqttv3.persist.MemoryPersistence
          import java.text.SimpleDateFormat
          import java.util.*
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.Executors

          class MainActivity : AppCompatActivity() {

              private val broker = "tcp://broker.hivemq.com:1883"
              private var mqttClient: MqttClient? = null
              private val gson = Gson()
              private var lastMsgTime = 0L
              private var isMqttConnected = false
              private var selectedFilter = "ALL"
              private var currentSerial = ""
              private val packets = ConcurrentHashMap<String, TelemetryPacket>()
              private val handler = Handler(Looper.getMainLooper())

              private fun col(id: Int) = ContextCompat.getColor(this, id)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val tS = findViewById<LinearLayout>(R.id.tab_sales)
                  val tM = findViewById<LinearLayout>(R.id.tab_manage)
                  val tA = findViewById<LinearLayout>(R.id.tab_agent)
                  findViewById<BottomNavigationView>(R.id.bottom_nav).setOnItemSelectedListener {
                      tS.visibility = if (it.itemId == R.id.nav_sales) View.VISIBLE else View.GONE
                      tM.visibility = if (it.itemId == R.id.nav_manage) View.VISIBLE else View.GONE
                      tA.visibility = if (it.itemId == R.id.nav_agent) View.VISIBLE else View.GONE
                      true
                  }

                  val m = getSavedMachines()
                  if (m.isNotEmpty()) currentSerial = m[0]
                  updateHeader(); renderChips(); renderSelector()

                  val tvL = findViewById<TextView>(R.id.tv_coffeenet_logs)
                  tvL.movementMethod = ScrollingMovementMethod.getInstance()
                  tvL.setOnTouchListener { v, e ->
                      v.parent.requestDisallowInterceptTouchEvent(true)
                      if (e.action == MotionEvent.ACTION_UP || e.action == MotionEvent.ACTION_CANCEL)
                          v.parent.requestDisallowInterceptTouchEvent(false)
                      false
                  }

                  refreshDevUi()

                  findViewById<Button>(R.id.btn_detect_device_id).setOnClickListener {
                      Toast.makeText(this, "Поиск Device ID...", Toast.LENGTH_SHORT).show()
                      Executors.newSingleThreadExecutor().execute {
                          getSharedPreferences("cofferno_agent", Context.MODE_PRIVATE).edit().remove("levending_device_id").apply()
                          val id = LeVendingProbe.findDeviceId(this@MainActivity)
                          runOnUiThread { refreshDevUi(); Toast.makeText(this@MainActivity, if (id.isBlank()) "ID не найден" else "Найден ID: $id", Toast.LENGTH_LONG).show() }
                      }
                  }

                  findViewById<Button>(R.id.btn_use_device_id).setOnClickListener {
                      val id = getSharedPreferences("cofferno_agent", Context.MODE_PRIVATE).getString("levending_device_id", "") ?: ""
                      if (id.isBlank()) { Toast.makeText(this, "Сначала выполните поиск", Toast.LENGTH_SHORT).show(); return@setOnClickListener }
                      getSharedPreferences("cofferno_agent", Context.MODE_PRIVATE).edit().putString("custom_serial", id).apply()
                      findViewById<EditText>(R.id.et_agent_serial).setText(id)
                      val l = getSavedMachines().toMutableList(); if (!l.contains(id)) { l.add(id); saveMachines(l) }
                      currentSerial = id; renderChips(); renderSelector(); reconnectMqtt()
                      Toast.makeText(this, "Серийный номер: $id", Toast.LENGTH_LONG).show()
                  }

                  findViewById<Button>(R.id.btn_refresh_top).setOnClickListener {
                      if (selectedFilter == "ALL") getSavedMachines().forEach { cmd(it, "REQUEST_UPDATE") }
                      else cmd(selectedFilter, "REQUEST_UPDATE")
                  }

                  findViewById<Button>(R.id.btn_add_machine).setOnClickListener {
                      val sn = findViewById<EditText>(R.id.et_new_serial).text.toString().trim().lowercase()
