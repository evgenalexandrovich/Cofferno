name: Cofferno LV-307 Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [agent, operator]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Project
        env:
          ROLE: ${{ matrix.role }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          set -euo pipefail

          ROLE="${ROLE}"
          if [ "$ROLE" = "agent" ]; then
            APP_ID="com.coffee.telemetry.agent"
            APP_LABEL="Cofferno Agent"
            VER_NAME="7.5.5-agent"
            VER_CODE=975
            IS_AGENT="true"
          else
            APP_ID="com.coffee.telemetry.operator"
            APP_LABEL="Cofferno Operator"
            VER_NAME="7.5.5-operator"
            VER_CODE=976
            IS_AGENT="false"
          fi

          BT="${BOT_TOKEN:-}"
          CI="${CHAT_ID:-}"
          if [ -z "$BT" ] || [ -z "$CI" ]; then
            echo "::warning::BOT_TOKEN or CHAT_ID empty — set GitHub Actions secrets"
            BT="MISSING_BOT_TOKEN"
            CI="0"
          fi
          # escape for Kotlin string literals
          BT_ESC=$(printf '%s' "$BT" | sed 's/\\/\\\\/g; s/"/\\"/g')
          CI_ESC=$(printf '%s' "$CI" | sed 's/\\/\\\\/g; s/"/\\"/g')

          B=app/src/main
          P=$B/java/com/coffee/telemetry
          rm -rf app build .gradle settings.gradle build.gradle gradle.properties 2>/dev/null || true
          mkdir -p "$P" "$B/res/layout" "$B/res/values" "$B/res/menu" "$B/res/drawable"

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Cofferno"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=false
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          EOF

          # ВАЖНО: переменные подставляются shell'ом; IS_AGENT уже true/false
          cat > app/build.gradle << EOF
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.coffee.telemetry'
              compileSdk 34
              defaultConfig {
                  applicationId "${APP_ID}"
                  minSdk 23
                  targetSdk 34
                  versionCode ${VER_CODE}
                  versionName "${VER_NAME}"
                  buildConfigField "String", "APP_ROLE", "\\"${ROLE}\\""
                  buildConfigField "boolean", "IS_AGENT", "${IS_AGENT}"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              buildFeatures { buildConfig true }
              lint { abortOnError false; checkReleaseBuilds false }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          EOF

          cat > "$B/AndroidManifest.xml" << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_LOGS"/>
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_app_icon"
                  android:label="${APP_LABEL}"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:supportsRtl="false"
                  android:requestLegacyExternalStorage="true">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".AgentService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="dataSync"/>
                  <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > "$B/res/values/strings.xml" << EOF
          <resources><string name="app_name">${APP_LABEL}</string></resources>
          EOF

          cat > "$B/res/values/colors.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#110B09</color>
              <color name="card">#1F1613</color>
              <color name="accent">#D4A373</color>
              <color name="dark">#0A0605</color>
              <color name="white">#FFFFFF</color>
              <color name="muted">#A3928B</color>
              <color name="green">#4CAF50</color>
              <color name="yellow">#FFC107</color>
              <color name="red">#E53935</color>
              <color name="orange">#FF9800</color>
              <color name="blue">#42A5F5</color>
          </resources>
          EOF

          cat > "$B/res/values/styles.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/accent</item>
                  <item name="colorPrimaryDark">@color/dark</item>
                  <item name="colorAccent">@color/accent</item>
                  <item name="android:windowBackground">@color/bg</item>
              </style>
          </resources>
          EOF

          cat > "$B/res/drawable/ic_app_icon.xml" << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp" android:height="48dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#D4A373" android:pathData="M20,3H4v10c0,2.21 1.79,4 4,4h6c2.21,0 4,-1.79 4,-4v-3h2c1.1,0 2,-0.9 2,-2V5c0,-1.1 -0.9,-2 -2,-2zm0,5h-2V5h2v3zM4,19h16v2H4z"/>
          </vector>
          EOF
          cat > "$B/res/drawable/ic_nav_sales.xml" << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M19,3H5c-1.1,0 -2,0.9 -2,2v14c0,1.1 0.9,2 2,2h14c1.1,0 2,-0.9 2,-2V5c0,-1.1 -0.9,-2 -2,-2zm-7,14H6v-2h6v2zm4,-4H6v-2h10v2zm0,-4H6V7h10v2z"/>
          </vector>
          EOF
          cat > "$B/res/drawable/ic_nav_manage.xml" << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M3,13h8V3H3v10zm0,8h8v-6H3v6zm10,0h8V11h-8v10zm0,-18v6h8V3h-8z"/>
          </vector>
          EOF
          cat > "$B/res/drawable/ic_nav_agent.xml" << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M12,1L3,5v6c0,5.55 3.84,10.74 9,12 5.16,-1.26 9,-6.45 9,-12V5l-9,-4zm0,10.99h7c-0.53,4.12 -3.28,7.79 -7,8.94V12H5V6.3l7,-3.11v8.8z"/>
          </vector>
          EOF

          cat > "$B/res/menu/bottom_nav.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@+id/nav_sales" android:title="Продажи" android:icon="@drawable/ic_nav_sales"/>
              <item android:id="@+id/nav_manage" android:title="Управление" android:icon="@drawable/ic_nav_manage"/>
              <item android:id="@+id/nav_agent" android:title="Агент" android:icon="@drawable/ic_nav_agent"/>
          </menu>
          EOF

          cat > "$B/res/layout/activity_main.xml" << 'LEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="@color/bg" android:layoutDirection="ltr">
              <LinearLayout android:id="@+id/header" android:layout_width="0dp" android:layout_height="wrap_content"
                  android:background="@color/card" android:gravity="center_vertical" android:orientation="horizontal" android:padding="12dp"
                  app:layout_constraintTop_toTopOf="parent" app:layout_constraintStart_toStartOf="parent" app:layout_constraintEnd_toEndOf="parent">
                  <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical">
                      <TextView android:id="@+id/tv_header_title" android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="Cofferno" android:textColor="@color/white" android:textSize="17sp" android:textStyle="bold"/>
                      <TextView android:id="@+id/tv_status" android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="..." android:textColor="@color/yellow" android:textSize="11sp"/>
                      <TextView android:id="@+id/tv_active_machine" android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="" android:textColor="@color/accent" android:textSize="11sp"/>
                  </LinearLayout>
                  <Button android:id="@+id/btn_refresh_top" android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:backgroundTint="@color/card" android:text="Обновить" android:textColor="@color/accent" android:textSize="12sp"
                      app:strokeColor="@color/accent" app:strokeWidth="1dp"/>
              </LinearLayout>
              <ScrollView android:id="@+id/main_scroll" android:layout_width="0dp" android:layout_height="0dp" android:fillViewport="true"
                  app:layout_constraintTop_toBottomOf="@id/header" app:layout_constraintBottom_toTopOf="@id/bottom_nav"
                  app:layout_constraintStart_toStartOf="parent" app:layout_constraintEnd_toEndOf="parent">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="12dp">
                      <LinearLayout android:id="@+id/tab_sales" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical">
                          <HorizontalScrollView android:layout_width="match_parent" android:layout_height="wrap_content" android:scrollbars="none">
                              <LinearLayout android:id="@+id/ll_filter_chips" android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="horizontal"/>
                          </HorizontalScrollView>
                          <com.google.android.material.card.MaterialCardView android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:layout_marginTop="12dp" app:cardBackgroundColor="@color/card" app:cardCornerRadius="12dp">
                              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="16dp">
                                  <TextView android:id="@+id/tv_summary_title" android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="Выручка" android:textColor="@color/white" android:textStyle="bold"/>
                                  <TextView android:id="@+id/tv_total_revenue" android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="0 ₽" android:textColor="@color/accent" android:textSize="22sp" android:textStyle="bold"/>
                                  <TextView android:id="@+id/tv_total_profit" android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="0 ₽" android:textColor="@color/green"/>
                                  <TextView android:id="@+id/tv_total_cups" android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="Стаканов: 0" android:textColor="@color/muted" android:textSize="12sp"/>
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>
                          <LinearLayout android:id="@+id/ll_drinks_container" android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:orientation="vertical" android:layout_marginTop="8dp"/>
                      </LinearLayout>
                      <LinearLayout android:id="@+id/tab_manage" android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:orientation="vertical" android:visibility="gone">
                          <com.google.android.material.card.MaterialCardView android:layout_width="match_parent" android:layout_height="wrap_content"
                              app:cardBackgroundColor="@color/card" app:cardCornerRadius="12dp">
                              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="16dp">
                                  <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="ID автомата (без нулей: 10546)"
                                      android:textColor="@color/accent" android:textStyle="bold"/>
                                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="8dp">
                                      <EditText android:id="@+id/et_new_serial" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"
                                          android:hint="10546" android:inputType="number" android:textColor="@color/white" android:textColorHint="@color/muted"/>
                                      <Button android:id="@+id/btn_add_machine" android:layout_width="wrap_content" android:layout_height="wrap_content"
                                          android:text="+" android:backgroundTint="@color/accent" android:textColor="@color/dark"/>
                                  </LinearLayout>
                                  <LinearLayout android:id="@+id/ll_machine_selector" android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:orientation="vertical" android:layout_marginTop="8dp"/>
                                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="8dp">
                                      <EditText android:id="@+id/et_custom_name" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"
                                          android:hint="Имя" android:textColor="@color/white" android:textColorHint="@color/muted"/>
                                      <Button android:id="@+id/btn_save_name" android:layout_width="wrap_content" android:layout_height="wrap_content"
                                          android:text="OK" android:backgroundTint="@color/card" android:textColor="@color/white" app:strokeWidth="1dp" app:strokeColor="@color/accent"/>
                                  </LinearLayout>
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>
                          <Button android:id="@+id/btn_remote_scan_logs" android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:layout_marginTop="12dp" android:backgroundTint="@color/blue" android:text="Отчёт → Telegram" android:textColor="@color/white"/>
                          <Button android:id="@+id/btn_copy_remote_logs" android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:layout_marginTop="8dp" android:backgroundTint="@color/card" android:text="Копировать MQTT" android:textColor="@color/white"/>
                          <TextView android:id="@+id/tv_remote_logs_output" android:layout_width="match_parent" android:layout_height="160dp"
                              android:layout_marginTop="8dp" android:background="#000" android:padding="8dp" android:textColor="#0F0" android:textSize="10sp"
                              android:textDirection="ltr" android:textIsSelectable="true" android:text="..."/>
                          <LinearLayout android:id="@+id/ll_costs_container" android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:orientation="vertical" android:layout_marginTop="12dp"/>
                          <TextView android:id="@+id/tv_costs_empty" android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:text="Себестоимость после продаж" android:textColor="@color/muted"/>
                          <Button android:id="@+id/btn_save_all_costs" android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:layout_marginTop="8dp" android:backgroundTint="@color/accent" android:text="Сохранить себестоимость" android:textColor="@color/dark"/>
                          <Button android:id="@+id/btn_reset_counters" android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:layout_marginTop="8dp" android:backgroundTint="@color/yellow" android:text="Сброс счётчиков" android:textColor="@color/dark"/>
                          <Button android:id="@+id/btn_remote_reboot" android:layout_width="match_parent" android:layout_height="wrap_content" android:visibility="gone"/>
                          <Button android:id="@+id/btn_remote_flush" android:layout_width="match_parent" android:layout_height="wrap_content" android:visibility="gone"/>
                          <Button android:id="@+id/btn_remote_lock" android:layout_width="match_parent" android:layout_height="wrap_content" android:visibility="gone"/>
                      </LinearLayout>
                      <LinearLayout android:id="@+id/tab_agent" android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:orientation="vertical" android:visibility="gone">
                          <com.google.android.material.card.MaterialCardView android:layout_width="match_parent" android:layout_height="wrap_content"
                              app:cardBackgroundColor="@color/card" app:cardCornerRadius="12dp">
                              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="16dp">
                                  <TextView android:id="@+id/tv_role_banner" android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:text="ROLE" android:textColor="@color/orange" android:textStyle="bold"/>
                                  <TextView android:id="@+id/tv_detected_device_id" android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:layout_marginTop="8dp" android:text="—" android:textColor="@color/accent" android:textSize="22sp" android:textStyle="bold"/>
                                  <Button android:id="@+id/btn_detect_device_id" android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:layout_marginTop="8dp" android:backgroundTint="@color/blue" android:text="Определить ID" android:textColor="@color/white"/>
                                  <Button android:id="@+id/btn_use_device_id" android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:layout_marginTop="8dp" android:backgroundTint="@color/green" android:text="ID как S/N" android:textColor="@color/white"/>
                                  <EditText android:id="@+id/et_agent_serial" android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:layout_marginTop="8dp" android:hint="S/N" android:textColor="@color/white" android:textColorHint="@color/muted"/>
                                  <Button android:id="@+id/btn_save_agent_serial" android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:layout_marginTop="8dp" android:backgroundTint="@color/accent" android:text="Сохранить S/N" android:textColor="@color/dark"/>
                                  <com.google.android.material.switchmaterial.SwitchMaterial android:id="@+id/switch_agent"
                                      android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="12dp"
                                      android:text="Служба агента" android:textColor="@color/white"/>
                                  <TextView android:id="@+id/tv_agent_status" android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:text="—" android:textColor="@color/yellow"/>
                                  <TextView android:id="@+id/tv_last_sale" android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:text="—" android:textColor="@color/muted"/>
                                  <TextView android:id="@+id/tv_tg_status" android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:text="TG" android:textColor="@color/muted" android:textSize="11sp"/>
                                  <Button android:id="@+id/btn_scan_coffeenet" android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:layout_marginTop="12dp" android:backgroundTint="@color/blue" android:text="Скан logcat + Telegram" android:textColor="@color/white"/>
                                  <TextView android:id="@+id/tv_coffeenet_logs" android:layout_width="match_parent" android:layout_height="320dp"
                                      android:layout_marginTop="8dp" android:background="#000" android:padding="8dp" android:textColor="#0F0"
                                      android:textSize="10sp" android:textDirection="ltr" android:textIsSelectable="true" android:gravity="top|start"/>
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>
                      </LinearLayout>
                  </LinearLayout>
              </ScrollView>
              <com.google.android.material.bottomnavigation.BottomNavigationView android:id="@+id/bottom_nav"
                  android:layout_width="0dp" android:layout_height="wrap_content" android:background="@color/card"
                  app:menu="@menu/bottom_nav" app:itemIconTint="@color/accent" app:itemTextColor="@color/white"
                  app:layout_constraintBottom_toBottomOf="parent" app:layout_constraintStart_toStartOf="parent" app:layout_constraintEnd_toEndOf="parent"/>
          </androidx.constraintlayout.widget.ConstraintLayout>
          LEOF

          cat > "$P/Constants.kt" << EOF
          package com.coffee.telemetry
          object Constants {
              const val BOT_TOKEN = "${BT_ESC}"
              const val CHAT_ID = "${CI_ESC}"
              const val MQTT_BROKER = "tcp://broker.hivemq.com:1883"
              const val MQTT_BROKER_FALLBACK = "tcp://broker.emqx.io:1883"
          }
          EOF

          cat > "$P/Models.kt" << 'EOF'
          package com.coffee.telemetry
          data class DrinkItem(val id: Int, var name: String, var count: Int, var price: Int, var cost: Int = 0)
          data class TelemetryPacket(
              val serial: String,
              val temp: Double = 0.0,
              val pressure: Double = 0.0,
              val status: String = "",
              val drinks: MutableList<DrinkItem> = mutableListOf(),
              val deviceId: String = "",
              val lastSaleName: String = "",
              val lastSalePrice: Int = 0,
              val lastSaleAt: Long = 0L,
              val timestamp: Long = System.currentTimeMillis()
          )
          data class MergedDrink(val name: String, var count: Int, val price: Int, val cost: Int)
          EOF

          cat > "$P/IdUtil.kt" << 'EOF'
          package com.coffee.telemetry
          object IdUtil {
              fun normalize(raw: String?): String {
                  if (raw.isNullOrBlank()) return ""
                  val c = raw.trim().lowercase().replace(Regex("[^a-z0-9_-]"), "")
                  if (c.isEmpty()) return ""
                  if (c.all { it.isDigit() }) {
                      val s = c.trimStart('0')
                      return if (s.isEmpty()) "0" else s
                  }
                  return c
              }
          }
          EOF

          cat > "$P/Telegram.kt" << 'EOF'
          package com.coffee.telemetry
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          object Telegram {
              fun configured(): Boolean =
                  Constants.BOT_TOKEN.isNotBlank() &&
                  Constants.BOT_TOKEN != "MISSING_BOT_TOKEN" &&
                  Constants.CHAT_ID.isNotBlank() && Constants.CHAT_ID != "0"
              fun send(text: String): Boolean {
                  if (!configured()) return false
                  var ok = true
                  for (c in text.chunked(3500)) {
