name: Deliver APK to Telegram

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Telegram Start Notification
        run: |
          curl -s -X POST "https://api.telegram.org/bot8923730105:AAGxhDICR3BtkaKeDOo2WiZE3OrdS_qiYk4/sendMessage" \
            -d "chat_id=864227156" \
            -d "text=🚀 Процесс пошел! Начинаю сборку твоего APK. Обычно это занимает 2-3 минуты..."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Project Structure
        run: |
          mkdir -p app/src/main/java/com/coffee/telemetry
          mkdir -p app/src/main/res/values

          # 1. settings.gradle
          cat > settings.gradle << 'EOF'
          rootProject.name = "LV307Telemetry"
          include ':app'
          EOF

          # 2. Root build.gradle
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { 
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # 3. gradle.properties
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          # 4. app/build.gradle
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'

          android {
              namespace 'com.coffee.telemetry'
              compileSdk 34
              defaultConfig {
                  applicationId "com.coffee.telemetry"
                  minSdk 21
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          EOF

          # 5. Strings.xml
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">LV307 Telemetry</string>
          </resources>
          EOF

          # 6. AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <application android:allowBackup="true" android:label="LV307 Telemetry" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. MainActivity.kt (Logic)
          cat > app/src/main/java/com/coffee/telemetry/MainActivity.kt << 'EOF'
          package com.coffee.telemetry

          import android.content.*
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.*
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import org.eclipse.paho.client.mqttv3.*
          import org.eclipse.paho.client.mqttv3.persist.MemoryPersistence
          import java.util.*

          data class Drink(var name: String = "", var sellPrice: Int = 0, var costPrice: Int = 0)
          data class Sale(var drink: String = "", var price: Int = 0, var cost: Int = 0, var ts: Long = 0)
          data class Machine(var serial: String = "", var status: String = "Офлайн")

          class MainActivity : AppCompatActivity() {
              private val gson = Gson()
              private val spName = "lv307_prefs"
              
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences(spName, Context.MODE_PRIVATE)
                  if (prefs.getString("user", null) == null) showLogin() else showDash()
              }

              private fun showLogin() {
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(60, 100, 60, 60)
                      setBackgroundColor(Color.parseColor("#F5F0EB"))
                  }
                  val head = TextView(this).apply { text = "☕ LV307 TELEMETRY"; textSize = 26f; setTextColor(Color.parseColor("#6F4E37")); gravity = Gravity.CENTER }
                  val user = EditText(this).apply { hint = "Логин" }
                  val pass = EditText(this).apply { hint = "Пароль"; inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD }
                  val btn = Button(this).apply { text = "ВОЙТИ / РЕГИСТРАЦИЯ" }
                  btn.setOnClickListener {
                      if (user.text.isNotEmpty()) {
                          getSharedPreferences(spName, Context.MODE_PRIVATE).edit().putString("user", user.text.toString()).apply()
                          showDash()
                      }
                  }
                  layout.addView(head); layout.addView(user); layout.addView(pass); layout.addView(btn)
                  setContentView(layout)
              }

              private fun showDash() {
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 60, 40, 40)
                      setBackgroundColor(Color.parseColor("#F5F0EB"))
                  }
                  val title = TextView(this).apply { text = "Мои автоматы"; textSize = 22f; setTextColor(Color.BLACK) }
                  val btnAdd = Button(this).apply { text = "+ ДОБАВИТЬ МАШИНУ" }
                  btnAdd.setOnClickListener {
                      val input = EditText(this); input.hint = "Серийный номер"
                      AlertDialog.Builder(this).setTitle("Новая машина").setView(input).setPositiveButton("ОК") { _, _ ->
                          Toast.makeText(this, "Машина ${input.text} добавлена", Toast.LENGTH_SHORT).show()
                      }.show()
                  }
                  layout.addView(title); layout.addView(btnAdd)
                  setContentView(layout)
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Send APK to Telegram
        if: success()
        run: |
          curl -F chat_id="864227156" \
               -F document=@app/build/outputs/apk/debug/app-debug.apk \
               -F caption="✅ Твой APK готов! Устанавливай и пользуйся." \
               https://api.telegram.org/bot8923730105:AAGxhDICR3BtkaKeDOo2WiZE3OrdS_qiYk4/sendDocument

      - name: Notify Error
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot8923730105:AAGxhDICR3BtkaKeDOo2WiZE3OrdS_qiYk4/sendMessage" \
            -d "chat_id=864227156" \
            -d "text=❌ Произошла ошибка при сборке. Я проверю код еще раз."
