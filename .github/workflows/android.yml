name: Cofferno LV-307 Build

on:
  push:
  workflow_dispatch:

env:
  BOT_TOKEN: "8923730105:AAFgMSUgh63L_1Xuad839ex4fXZmTpFR1_Q"
  CHAT_ID: "864227156"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Project Files
        run: |
          B=app/src/main
          P=$B/java/com/coffee/telemetry
          mkdir -p $P $B/res/layout $B/res/values $B/res/menu

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Cofferno"
          include ':app'
          EOF

          # root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          # gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.coffee.telemetry'
              compileSdk 34
              defaultConfig {
                  applicationId "com.coffee.telemetry"
                  minSdk 23
                  targetSdk 34
                  versionCode 70
                  versionName "7.0-COFFEENET"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              lint { abortOnError false; checkReleaseBuilds false }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > $B/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_LOGS"/>
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Cofferno LV-307"
                  android:theme="@style/AppTheme"
                  android:requestLegacyExternalStorage="true"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".AgentService" android:enabled="true" android:exported="false"/>
                  <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # strings.xml, colors.xml, styles.xml
          cat << 'EOF' > $B/res/values/strings.xml
          <resources><string name="app_name">Cofferno LV-307</string></resources>
          EOF

          cat << 'EOF' > $B/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#110B09</color>
              <color name="card">#1F1613</color>
              <color name="accent">#D4A373</color>
              <color name="dark">#0A0605</color>
              <color name="white">#FFFFFF</color>
              <color name="muted">#A3928B</color>
              <color name="green">#4CAF50</color>
              <color name="yellow">#FFC107</color>
              <color name="red">#E53935</color>
              <color name="orange">#FF9800</color>
              <color name="blue">#42A5F5</color>
          </resources>
          EOF

          cat << 'EOF' > $B/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/accent</item>
                  <item name="colorPrimaryDark">@color/dark</item>
                  <item name="colorAccent">@color/accent</item>
                  <item name="android:windowBackground">@color/bg</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > $B/res/menu/bottom_nav.xml
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@+id/nav_sales" android:title="Продажи" android:icon="@android:drawable/ic_menu_view"/>
              <item android:id="@+id/nav_manage" android:title="Управление" android:icon="@android:drawable/ic_menu_manage"/>
              <item android:id="@+id/nav_agent" android:title="Аппарат" android:icon="@android:drawable/ic_menu_preferences"/>
          </menu>
          EOF

          # activity_main.xml
          cat << 'EOF' > $B/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg">

              <!-- Top Header -->
              <LinearLayout
                  android:id="@+id/header"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@color/card"
                  android:padding="12dp"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  app:layout_constraintTop_toTopOf="parent">

                  <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1" android:orientation="vertical">
                      <TextView android:id="@+id/tv_header_title" android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="☕ Cofferno LV-307" android:textColor="@color/white"
                          android:textSize="17sp" android:textStyle="bold"/>
                      <TextView android:id="@+id/tv_status" android:layout_width="wrap_content"
                          android:layout_height="wrap_content" android:text="● Подключение..."
                          android:textColor="@color/yellow" android:textSize="11sp"/>
                      <TextView android:id="@+id/tv_active_machine" android:layout_width="wrap_content"
                          android:layout_height="wrap_content" android:text="Режим: Вся сеть (Все аппараты)"
                          android:textColor="@color/accent" android:textSize="11sp"/>
                  </LinearLayout>

                  <Button
                      android:id="@+id/btn_refresh_top"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="🔄 Обновить"
                      android:textSize="12sp"
                      android:backgroundTint="@color/card"
                      app:strokeColor="@color/accent"
                      app:strokeWidth="1dp"
                      android:textColor="@color/accent"/>
              </LinearLayout>

              <!-- Main Scrollable Area -->
              <ScrollView android:layout_width="match_parent" android:layout_height="0dp"
                  android:fillViewport="true"
                  app:layout_constraintTop_toBottomOf="@id/header"
                  app:layout_constraintBottom_toTopOf="@id/bottom_nav">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:orientation="vertical" android:padding="12dp">

                      <!-- TAB 1: ПРОДАЖИ -->
                      <LinearLayout android:id="@+id/tab_sales" android:layout_width="match_parent"
                          android:layout_height="wrap_content" android:orientation="vertical">

                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:text="Фильтр по аппаратам:" android:textColor="@color/muted"
                              android:textSize="12sp" android:layout_marginBottom="6dp"/>

                          <HorizontalScrollView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:scrollbars="none"
                              android:layout_marginBottom="12dp">
                              <LinearLayout
                                  android:id="@+id/ll_filter_chips"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:orientation="horizontal"/>
                          </HorizontalScrollView>

                          <!-- Summary Card -->
                          <com.google.android.material.card.MaterialCardView
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              app:cardBackgroundColor="@color/card" app:cardCornerRadius="12dp"
                              android:layout_marginBottom="12dp">
                              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:orientation="vertical" android:padding="16dp">
                                  <TextView android:id="@+id/tv_summary_title" android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="💰 Выручка и прибыль (Все аппараты)" android:textColor="@color/white"
                                      android:textSize="15sp" android:textStyle="bold" android:layout_marginBottom="8dp"/>
                                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:orientation="horizontal" android:weightSum="2">
                                      <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                                          android:layout_weight="1" android:orientation="vertical">
                                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                              android:text="Выручка" android:textColor="@color/muted" android:textSize="11sp"/>
                                          <TextView android:id="@+id/tv_total_revenue" android:layout_width="wrap_content"
                                              android:layout_height="wrap_content" android:text="0 ₽"
                                              android:textColor="@color/accent" android:textSize="20sp" android:textStyle="bold"/>
                                      </LinearLayout>
                                      <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                                          android:layout_weight="1" android:orientation="vertical">
                                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                              android:text="Чистая прибыль" android:textColor="@color/muted" android:textSize="11sp"/>
                                          <TextView android:id="@+id/tv_total_profit" android:layout_width="wrap_content"
                                              android:layout_height="wrap_content" android:text="0 ₽"
                                              android:textColor="@color/green" android:textSize="20sp" android:textStyle="bold"/>
                                      </LinearLayout>
                                  </LinearLayout>
                                  <TextView android:id="@+id/tv_total_cups" android:layout_width="wrap_content"
                                      android:layout_height="wrap_content" android:text="Всего напитков: 0 порций"
                                      android:textColor="@color/muted" android:textSize="12sp" android:layout_marginTop="6dp"/>
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>

                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:text="📊 Продажи по напиткам (Онлайн)" android:textColor="@color/white"
                              android:textSize="14sp" android:textStyle="bold" android:layout_marginBottom="8dp"/>

                          <LinearLayout android:id="@+id/ll_drinks_container" android:layout_width="match_parent"
                              android:layout_height="wrap_content" android:orientation="vertical"/>
                      </LinearLayout>

                      <!-- TAB 2: УПРАВЛЕНИЕ -->
                      <LinearLayout android:id="@+id/tab_manage" android:layout_width="match_parent"
                          android:layout_height="wrap_content" android:orientation="vertical" android:visibility="gone">

                          <!-- 1. Мои кофемашины -->
                          <com.google.android.material.card.MaterialCardView
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              app:cardBackgroundColor="@color/card" app:cardCornerRadius="12dp"
                              android:layout_marginBottom="12dp">
                              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:orientation="vertical" android:padding="16dp">
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="☕ Управление сетью аппаратов" android:textColor="@color/white"
                                      android:textSize="15sp" android:textStyle="bold" android:layout_marginBottom="8dp"/>
                                  
                                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:orientation="horizontal">
                                      <EditText android:id="@+id/et_new_serial" android:layout_width="0dp"
                                          android:layout_height="wrap_content" android:layout_weight="1"
                                          android:hint="S/N аппарата" android:textColor="@color/white"
                                          android:textColorHint="@color/muted" android:textSize="13sp"
                                          android:inputType="text"/>
                                      <Button android:id="@+id/btn_add_machine" android:layout_width="wrap_content"
                                          android:layout_height="wrap_content" android:text="Добавить"
                                          android:backgroundTint="@color/accent" android:textColor="@color/dark"
                                          android:layout_marginStart="8dp"/>
                                  </LinearLayout>

                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="Список подключенных аппаратов:"
                                      android:textColor="@color/muted" android:textSize="11sp" android:layout_marginTop="10dp"/>
                                  
                                  <LinearLayout android:id="@+id/ll_machine_selector" android:layout_width="match_parent"
                                      android:layout_height="wrap_content" android:orientation="vertical"
                                      android:layout_marginTop="4dp"/>

                                  <LinearLayout android:id="@+id/layout_rename" android:layout_width="match_parent"
                                      android:layout_height="wrap_content" android:orientation="horizontal"
                                      android:layout_marginTop="12dp">
                                      <EditText android:id="@+id/et_custom_name" android:layout_width="0dp"
                                          android:layout_height="wrap_content" android:layout_weight="1"
                                          android:hint="Имя (напр. ТЦ Аура 2 этаж)" android:textColor="@color/white"
                                          android:textColorHint="@color/muted" android:textSize="13sp"/>
                                      <Button android:id="@+id/btn_save_name" android:layout_width="wrap_content"
                                          android:layout_height="wrap_content" android:text="✏️ Задать имя"
                                          android:backgroundTint="@color/card" app:strokeColor="@color/accent" app:strokeWidth="1dp"
                                          android:textColor="@color/white" android:layout_marginStart="8dp"/>
                                  </LinearLayout>
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>

                          <!-- 2. Настройка себестоимости -->
                          <com.google.android.material.card.MaterialCardView
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              app:cardBackgroundColor="@color/card" app:cardCornerRadius="12dp"
                              android:layout_marginBottom="12dp">
                              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:orientation="vertical" android:padding="16dp">
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="📉 Настройка себестоимости напитков" android:textColor="@color/white"
                                      android:textSize="15sp" android:textStyle="bold" android:layout_marginBottom="6dp"/>
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="Укажите себестоимость ингредиентов для расчета чистой прибыли:"
                                      android:textColor="@color/muted" android:textSize="11sp" android:layout_marginBottom="10dp"/>

                                  <LinearLayout android:id="@+id/ll_costs_container" android:layout_width="match_parent"
                                      android:layout_height="wrap_content" android:orientation="vertical"/>

                                  <Button android:id="@+id/btn_save_all_costs" android:layout_width="match_parent"
                                      android:layout_height="wrap_content" android:text="💾 Сохранить себестоимость"
                                      android:backgroundTint="@color/accent" android:textColor="@color/dark"
                                      android:layout_marginTop="10dp"/>
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>

                          <!-- 3. Команды аппарату -->
                          <com.google.android.material.card.MaterialCardView
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              app:cardBackgroundColor="@color/card" app:cardCornerRadius="12dp">
                              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:orientation="vertical" android:padding="16dp">
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="⚙️ Команды выбранному аппарату" android:textColor="@color/white"
                                      android:textSize="15sp" android:textStyle="bold" android:layout_marginBottom="12dp"/>
                                  
                                  <Button android:id="@+id/btn_reset_counters" android:layout_width="match_parent"
                                      android:layout_height="wrap_content" android:text="🔄 Обнулить счётчики продаж"
                                      android:backgroundTint="@color/yellow" android:textColor="@color/dark"
                                      android:layout_marginBottom="8dp"/>

                                  <Button android:id="@+id/btn_remote_reboot" android:layout_width="match_parent"
                                      android:layout_height="wrap_content" android:text="⚡ Перезагрузить кофемашину"
                                      android:backgroundTint="@color/orange" android:textColor="@color/white"
                                      android:layout_marginBottom="8dp"/>

                                  <Button android:id="@+id/btn_remote_flush" android:layout_width="match_parent"
                                      android:layout_height="wrap_content" android:text="💧 Принудительная промывка"
                                      android:backgroundTint="@color/blue" android:textColor="@color/white"
                                      android:layout_marginBottom="8dp"/>

                                  <Button android:id="@+id/btn_remote_lock" android:layout_width="match_parent"
                                      android:layout_height="wrap_content" android:text="🔒 Заблокировать автомат"
                                      android:backgroundTint="@color/red" android:textColor="@color/white"/>
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>
                      </LinearLayout>

                      <!-- TAB 3: АГЕНТ АППАРАТА (CoffeeNet Scanner) -->
                      <LinearLayout android:id="@+id/tab_agent" android:layout_width="match_parent"
                          android:layout_height="wrap_content" android:orientation="vertical" android:visibility="gone">
                          
                          <com.google.android.material.card.MaterialCardView
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              app:cardBackgroundColor="@color/card" app:cardCornerRadius="12dp"
                              android:layout_marginBottom="12dp">
                              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:orientation="vertical" android:padding="16dp">
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="📟 Настройка блока Cofferno LV-307" android:textColor="@color/white"
                                      android:textSize="16sp" android:textStyle="bold" android:layout_marginBottom="8dp"/>
                                  
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="Задайте реальный заводской серийный номер аппарата:"
                                      android:textColor="@color/muted" android:textSize="12sp" android:layout_marginBottom="4dp"/>
                                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                      android:orientation="horizontal">
                                      <EditText android:id="@+id/et_agent_serial" android:layout_width="0dp"
                                          android:layout_height="wrap_content" android:layout_weight="1"
                                          android:hint="Напр. LV307-8841" android:textColor="@color/white"
                                          android:textColorHint="@color/muted" android:textSize="13sp"/>
                                      <Button android:id="@+id/btn_save_agent_serial" android:layout_width="wrap_content"
                                          android:layout_height="wrap_content" android:text="Сохранить"
                                          android:backgroundTint="@color/accent" android:textColor="@color/dark"
                                          android:layout_marginStart="8dp"/>
                                  </LinearLayout>

                                  <com.google.android.material.switchmaterial.SwitchMaterial
                                      android:id="@+id/switch_agent" android:layout_width="match_parent"
                                      android:layout_height="wrap_content" android:text="Фоновая служба телеметрии"
                                      android:textColor="@color/white" android:layout_marginTop="16dp"/>
                                  <TextView android:id="@+id/tv_agent_status" android:layout_width="match_parent"
                                      android:layout_height="wrap_content" android:text="Остановлена"
                                      android:textColor="@color/yellow" android:textSize="12sp" android:layout_marginTop="4dp"/>
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>

                          <com.google.android.material.card.MaterialCardView
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              app:cardBackgroundColor="@color/card" app:cardCornerRadius="12dp">
                              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:orientation="vertical" android:padding="16dp">
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="🔍 Диагностика ПО CoffeeNet" android:textColor="@color/white"
                                      android:textSize="16sp" android:textStyle="bold" android:layout_marginBottom="4dp"/>
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="Проверка обнаружения базы данных и логов CoffeeNet на автомате:"
                                      android:textColor="@color/muted" android:textSize="12sp" android:layout_marginBottom="10dp"/>

                                  <Button android:id="@+id/btn_scan_coffeenet" android:layout_width="match_parent"
                                      android:layout_height="wrap_content" android:text="🔎 Сканировать файлы CoffeeNet"
                                      android:backgroundTint="@color/blue" android:textColor="@color/white"/>

                                  <TextView android:id="@+id/tv_coffeenet_logs" android:layout_width="match_parent"
                                      android:layout_height="180dp" android:background="#000000" android:padding="8dp"
                                      android:text="Нажмите 'Сканировать файлы CoffeeNet' для проверки..."
                                      android:textColor="#00FF66" android:textSize="11sp" android:layout_marginTop="10dp"/>
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>

                      </LinearLayout>

                  </LinearLayout>
              </ScrollView>

              <!-- Bottom Navigation -->
              <com.google.android.material.bottomnavigation.BottomNavigationView
                  android:id="@+id/bottom_nav" android:layout_width="0dp" android:layout_height="wrap_content"
                  android:background="@color/card" app:itemIconTint="@color/accent"
                  app:itemTextColor="@color/white" app:menu="@menu/bottom_nav"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintBottom_toBottomOf="parent"/>
          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

          # Models.kt
          cat << 'EOF' > $P/Models.kt
          package com.coffee.telemetry

          data class DrinkItem(
              val id: Int,
              var name: String,
              var count: Int,
              var price: Int,
              var cost: Int = 40
          )

          data class TelemetryPacket(
              val serial: String,
              val temp: Double,
              val pressure: Double,
              val status: String,
              val drinks: MutableList<DrinkItem>,
              val timestamp: Long = System.currentTimeMillis()
          )
          EOF

          # CoffeeNetReader.kt
          cat << 'EOF' > $P/CoffeeNetReader.kt
          package com.coffee.telemetry

          import android.content.Context
          import android.database.sqlite.SQLiteDatabase
          import android.os.Environment
          import java.io.BufferedReader
          import java.io.File
          import java.io.InputStreamReader

          object CoffeeNetReader {

              fun scanCoffeeNetEnvironment(context: Context): String {
                  val sb = StringBuilder()
                  sb.append("=== СКАНИРОВАНИЕ COFFEENET ===\n")

                  try {
                      val pm = context.packageManager
                      val packages = pm.getInstalledPackages(0)
                      val coffeePackages = packages.filter { 
                          it.packageName.contains("coffee", ignoreCase = true) || 
                          it.packageName.contains("yinhe", ignoreCase = true) ||
                          it.packageName.contains("jetinno", ignoreCase = true) ||
                          it.packageName.contains("vending", ignoreCase = true)
                      }
                      sb.append("Найдено приложений кофейни: ${coffeePackages.size}\n")
                      for (p in coffeePackages) {
                          sb.append(" • Пакет: ${p.packageName}\n")
                      }
                  } catch (e: Exception) {
                      sb.append("Ошибка сканирования пакетов: ${e.message}\n")
                  }

                  val possiblePaths = listOf(
                      File(Environment.getExternalStorageDirectory(), "CoffeeNet"),
                      File(Environment.getExternalStorageDirectory(), "coffeebar"),
                      File(Environment.getExternalStorageDirectory(), "Android/data/com.coffeenet"),
                      File(Environment.getExternalStorageDirectory(), "Download"),
                      File("/data/data/com.coffeenet/databases")
                  )

                  sb.append("\nПоиск папок и баз данных:\n")
                  for (dir in possiblePaths) {
                      if (dir.exists()) {
                          sb.append("📁 Найдена папка: ${dir.absolutePath}\n")
                          dir.listFiles()?.forEach { file ->
                              sb.append("   - ${file.name} (${file.length()} b)\n")
                          }
                      }
                  }

                  sb.append("\nПроверка системных логов CoffeeNet:\n")
                  try {
                      val process = Runtime.getRuntime().exec("logcat -d -t 100")
                      val reader = BufferedReader(InputStreamReader(process.inputStream))
                      var line: String?
                      var count = 0
                      while (reader.readLine().also { line = it } != null) {
                          if (line?.contains("coffee", ignoreCase = true) == true || line?.contains("order", ignoreCase = true) == true) {
                              sb.append("📝 ${line?.take(60)}...\n")
                              count++
                              if (count > 5) break
                          }
                      }
                      if (count == 0) sb.append("Логи CoffeeNet в фоновом буфере пока пусты.\n")
                  } catch (e: Exception) {
                      sb.append("Чтение логов недоступно без Root: ${e.message}\n")
                  }

                  sb.append("\n=== СКАНИРОВАНИЕ ЗАВЕРШЕНО ===")
                  return sb.toString()
              }
          }
