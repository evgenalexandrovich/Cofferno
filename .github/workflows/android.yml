          import android.provider.Settings
          import androidx.core.app.NotificationCompat
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import org.eclipse.paho.client.mqttv3.IMqttDeliveryToken
          import org.eclipse.paho.client.mqttv3.MqttCallback
          import org.eclipse.paho.client.mqttv3.MqttClient
          import org.eclipse.paho.client.mqttv3.MqttConnectOptions
          import org.eclipse.paho.client.mqttv3.MqttMessage
          import org.eclipse.paho.client.mqttv3.persist.MemoryPersistence
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.util.concurrent.Executors
          import java.util.concurrent.ScheduledExecutorService
          import java.util.concurrent.TimeUnit

          class AgentService : Service() {

              private val broker = "tcp://broker.hivemq.com:1883"
              private var client: MqttClient? = null
              private val gson = Gson()
              private var wakeLock: PowerManager.WakeLock? = null
              private var sched: ScheduledExecutorService? = null
              private val exec = Executors.newSingleThreadExecutor()
              private val logExec = Executors.newSingleThreadExecutor()

              private var lastSaleTs = 0L
              private var pendingName: String = ""
              private var pendingPrice: Int = 0
              private var pendingMetaTs = 0L

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  val channelId = "cofferno_agent_ch"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val nm = getSystemService(NotificationManager::class.java)
                      nm?.createNotificationChannel(
                          NotificationChannel(channelId, "Agent", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
                  val notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("Cofferno LV-307")
                      .setContentText("Sales service A+B")
                      .setSmallIcon(android.R.drawable.stat_notify_sync)
                      .setOngoing(true)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(101, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  } else {
                      startForeground(101, notification)
                  }

                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Cofferno:Wake")
                  wakeLock?.acquire(24L * 60L * 60L * 1000L)

                  try {
                      val id = LeVendingProbe.findDeviceId(this)
                      if (id.isNotBlank()) {
                          val p = prefs()
                          val custom = p.getString("custom_serial", "") ?: ""
                          if (custom.isBlank()) {
                              p.edit().putString("custom_serial", id).apply()
                          }
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }

                  startAgentLoop()
                  startSaleInterceptor()
              }

              private fun prefs() = getSharedPreferences("cofferno_agent", Context.MODE_PRIVATE)

              private fun getMachineSerial(): String {
                  val custom = prefs().getString("custom_serial", "") ?: ""
                  if (custom.isNotBlank()) return custom.trim().lowercase()
                  val dev = prefs().getString("levending_device_id", "") ?: ""
                  if (dev.isNotBlank()) return dev.trim().lowercase()
                  val androidId = Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID)
                  return (androidId ?: "lv307_unit").trim().lowercase()
              }

              private fun getDeviceId(): String {
                  val a = prefs().getString("levending_device_id", "") ?: ""
                  if (a.isNotBlank()) return a
                  return prefs().getString("custom_serial", "") ?: ""
              }

              private fun loadDrinks(): MutableList<DrinkItem> {
                  val json = prefs().getString("drinks_json", "")
                  if (json != null && json.isNotEmpty()) {
                      try {
                          val type = object : TypeToken<MutableList<DrinkItem>>() {}.type
                          val list: MutableList<DrinkItem>? = gson.fromJson(json, type)
                          if (list != null) return list
                      } catch (e: Exception) {
                          // ignore
                      }
                  }
                  val list = ArrayList<DrinkItem>()
                  list.add(DrinkItem(0, "Espresso", 0, 120, 35))
                  list.add(DrinkItem(1, "Cappuccino", 0, 180, 55))
                  list.add(DrinkItem(2, "Latte", 0, 200, 60))
                  list.add(DrinkItem(3, "Americano", 0, 130, 30))
                  list.add(DrinkItem(4, "Flat White", 0, 190, 55))
                  list.add(DrinkItem(5, "Chocolate", 0, 160, 45))
                  list.add(DrinkItem(6, "Drink (LeVending)", 0, 150, 40))
                  return list
              }

              private fun saveDrinks(list: List<DrinkItem>) {
                  prefs().edit().putString("drinks_json", gson.toJson(list)).apply()
              }

              private fun registerDrinkSale(drinkName: String, price: Int) {
                  val drinks = loadDrinks()
                  val finalPrice = if (price > 0) price else 150
                  var found: DrinkItem? = null
                  for (d in drinks) {
                      if (d.name.equals(drinkName, ignoreCase = true)) {
                          found = d
                          break
                      }
                  }
                  if (found != null) {
                      found.count = found.count + 1
                      if (price > 0) found.price = price
                  } else {
                      drinks.add(DrinkItem(drinks.size, drinkName, 1, finalPrice, 40))
                  }
                  saveDrinks(drinks)
                  prefs().edit()
                      .putString("last_sale_name", drinkName)
                      .putInt("last_sale_price", finalPrice)
                      .putLong("last_sale_at", System.currentTimeMillis())
                      .apply()
                  sendHeartbeat()
              }

              private fun startSaleInterceptor() {
                  logExec.execute {
                      try {
                          Runtime.getRuntime().exec(arrayOf("logcat", "-c"))
                          val process = Runtime.getRuntime().exec(arrayOf("logcat", "-v", "time"))
                          val reader = BufferedReader(InputStreamReader(process.inputStream))
                          while (wakeLock != null && wakeLock!!.isHeld) {
                              val line = reader.readLine()
                              if (line == null) break

                              val dev = LeVendingProbe.findDeviceIdFromLogLine(line)
                              if (dev != null) {
                                  val p = prefs()
                                  val old = p.getString("levending_device_id", "") ?: ""
                                  if (old != dev) {
                                      val ed = p.edit().putString("levending_device_id", dev)
                                      val custom = p.getString("custom_serial", "") ?: ""
                                      if (custom.isBlank()) {
                                          ed.putString("custom_serial", dev)
                                      }
                                      ed.apply()
                                  }
                              }

                              val n = LeVendingProbe.extractDrinkName(line)
                              if (n != null) {
                                  pendingName = n
                                  pendingMetaTs = System.currentTimeMillis()
                              }
                              val pr = LeVendingProbe.extractPrice(line)
                              if (pr != null) {
                                  pendingPrice = pr
                                  pendingMetaTs = System.currentTimeMillis()
                              }

                              val hit = LeVendingProbe.isPrimarySaleMarker(line) ||
                                  LeVendingProbe.isDropCupMarker(line)
                              if (hit) {
                                  val now = System.currentTimeMillis()
                                  if (now - lastSaleTs > 45000L) {
                                      lastSaleTs = now
                                      val fresh = (now - pendingMetaTs) < 120000L
                                      val drink = if (fresh && pendingName.isNotBlank()) pendingName else "Drink (LeVending)"
                                      val price = if (fresh && pendingPrice > 0) pendingPrice else 150
                                      registerDrinkSale(drink, price)
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              private fun resetCounters() {
                  val list = loadDrinks()
                  for (d in list) {
                      d.count = 0
                  }
                  saveDrinks(list)
              }

              private fun rebootDevice() {
                  try {
                      Runtime.getRuntime().exec(arrayOf("su", "-c", "reboot"))
                  } catch (e: Exception) {
                      try {
                          val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                          pm.reboot(null)
                      } catch (e2: Exception) {
                          e2.printStackTrace()
                      }
                  }
              }

              private fun startAgentLoop() {
                  exec.execute {
                      while (wakeLock != null && wakeLock!!.isHeld) {
                          try {
                              val connected = client != null && client!!.isConnected
                              if (!connected) {
                                  val sn = getMachineSerial()
                                  val id = "Host_" + sn + "_" + (System.currentTimeMillis() % 1000L)
                                  client = MqttClient(broker, id, MemoryPersistence())
                                  val options = MqttConnectOptions()
                                  options.isAutomaticReconnect = true
                                  options.connectionTimeout = 15
                                  options.keepAliveInterval = 30
                                  client!!.connect(options)
                                  client!!.subscribe("cofferno/$sn/cmd", 1)
                                  client!!.setCallback(object : MqttCallback {
                                      override fun connectionLost(cause: Throwable?) {}
                                      override fun messageArrived(topic: String?, message: MqttMessage?) {
                                          val cmd = message?.toString()?.trim() ?: return
                                          if (cmd == "RESET_COUNTERS") {
                                              resetCounters()
                                              sendHeartbeat()
                                          } else if (cmd == "REQUEST_UPDATE") {
                                              sendHeartbeat()
                                          } else if (cmd == "REBOOT_MACHINE") {
                                              rebootDevice()
                                          }
                                      }
                                      override fun deliveryComplete(token: IMqttDeliveryToken?) {}
                                  })
                                  if (sched != null) sched!!.shutdownNow()
                                  sched = Executors.newSingleThreadScheduledExecutor()
                                  sched!!.scheduleAtFixedRate(
                                      Runnable { sendHeartbeat() },
                                      0L,
                                      3L,
                                      TimeUnit.SECONDS
                                  )
                              }
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                          try {
                              Thread.sleep(5000L)
                          } catch (e: Exception) {
                              // ignore
                          }
                      }
                  }
              }

              private fun sendHeartbeat() {
                  try {
                      if (client == null || !client!!.isConnected) return
                      val sn = getMachineSerial()
                      val drinks = loadDrinks()
                      val p = prefs()
                      val packet = TelemetryPacket(
                          sn,
                          93.4,
                          9.2,
                          "LeVending OK",
                          drinks,
                          getDeviceId(),
                          p.getString("last_sale_name", "") ?: "",
                          p.getInt("last_sale_price", 0),
                          p.getLong("last_sale_at", 0L)
                      )
                      val msg = MqttMessage(gson.toJson(packet).toByteArray())
                      msg.qos = 1
                      msg.isRetained = true
                      client!!.publish("cofferno/$sn/data", msg)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              override fun onDestroy() {
                  if (sched != null) sched!!.shutdownNow()
                  try {
                      if (client != null) client!!.disconnect()
                  } catch (e: Exception) {
                      // ignore
                  }
                  if (wakeLock != null) wakeLock!!.release()
                  super.onDestroy()
              }
          }
