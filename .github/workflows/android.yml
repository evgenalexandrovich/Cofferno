name: Cofferno LV-307 Full Telemetry Build

on:
  push:
  workflow_dispatch:

env:
  BOT_TOKEN: "8923730105:AAFgMSUgh63L_1Xuad839ex4fXZmTpFR1_Q"
  CHAT_ID: "864227156"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Requests
        run: pip install requests

      - name: Notify Start
        run: |
          python3 - << 'EOF'
          import os, requests
          requests.post(
              f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage",
              json={"chat_id": os.environ["CHAT_ID"],
                    "text": "☕ Cofferno LV-307: Сборка началась..."}
          )
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Project Files
        run: |
          BASE=app/src/main
          PKG=$BASE/java/com/coffee/telemetry
          mkdir -p $PKG $BASE/res/layout $BASE/res/values $BASE/res/menu

          # === settings.gradle ===
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Cofferno"
          include ':app'
          EOF

          # === build.gradle (root) ===
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          # === gradle.properties ===
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF

          # === app/build.gradle ===
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.coffee.telemetry'
              compileSdk 34
              defaultConfig {
                  applicationId "com.coffee.telemetry"
                  minSdk 21
                  targetSdk 34
                  versionCode 50
                  versionName "5.0-LV307"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              buildFeatures { viewBinding true }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          EOF

          # === AndroidManifest.xml ===
          cat << 'EOF' > $BASE/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # === strings.xml ===
          cat << 'EOF' > $BASE/res/values/strings.xml
          <resources>
              <string name="app_name">Cofferno LV-307</string>
              <string name="status_ready">Аппарат готов к работе</string>
          </resources>
          EOF

          # === colors.xml ===
          cat << 'EOF' > $BASE/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#1E130F</color>
              <color name="coffee_dark">#2B1B17</color>
              <color name="coffee_primary">#6F4E37</color>
              <color name="coffee_gold">#FFC107</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          # === styles.xml ===
          cat << 'EOF' > $BASE/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/coffee_primary</item>
                  <item name="colorPrimaryDark">@color/coffee_dark</item>
                  <item name="colorAccent">@color/coffee_gold</item>
                  <item name="android:windowBackground">@color/bg</item>
              </style>
          </resources>
          EOF

          # === bottom_nav.xml ===
          cat << 'EOF' > $BASE/res/menu/bottom_nav.xml
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@+id/nav_dashboard" android:title="Дашборд" android:icon="@android:drawable/ic_menu_view"/>
              <item android:id="@+id/nav_settings" android:title="Настройки" android:icon="@android:drawable/ic_menu_preferences"/>
          </menu>
          EOF

          # === activity_main.xml ===
          cat << 'EOF' > $BASE/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout 
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="@string/status_ready"
                  android:textColor="@color/white"
                  android:textSize="20sp"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent" />

              <com.google.android.material.bottomnavigation.BottomNavigationView
                  android:id="@+id/bottom_navigation"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  app:menu="@menu/bottom_nav"
                  app:layout_constraintBottom_toBottomOf="parent"/>
          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

          # === MainActivity.kt ===
          cat << 'EOF' > $PKG/MainActivity.kt
          package com.coffee.telemetry

          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
              }
          }
          EOF

      - name: Build APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Send APK to Telegram
        if: success()
        run: |
          python3 - << 'EOF'
          import os, requests

          token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]
          apk_path = "app/build/outputs/apk/debug/app-debug.apk"

          if os.path.exists(apk_path):
              url = f"https://api.telegram.org/bot{token}/sendDocument"
              with open(apk_path, "rb") as file:
                  response = requests.post(
                      url,
                      data={"chat_id": chat_id, "caption": "✅ Сборка успешна!\n📱 Cofferno LV-307 v5.0 (Debug APK)"},
                      files={"document": file}
                  )
              print("Telegram Response:", response.json())
          else:
              print("Ошибка: Файл APK не найден по пути:", apk_path)
              exit(1)
          EOF

      - name: Notify Failure
        if: failure()
        run: |
          python3 - << 'EOF'
          import os, requests
          requests.post(
              f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage",
              json={"chat_id": os.environ["CHAT_ID"],
                    "text": "❌ Ошибка компиляции Cofferno LV-307. Проверьте логи GitHub Actions."}
          )
          EOF
