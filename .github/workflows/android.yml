                  findViewById<Button>(R.id.btn_reset_counters).setOnClickListener {
                      if (currentSerial.isEmpty()) return@setOnClickListener
                      AlertDialog.Builder(this).setMessage("Reset $currentSerial?")
                          .setPositiveButton("Yes") { _, _ ->
                              packets[currentSerial] = TelemetryPacket(currentSerial)
                              cmd(currentSerial, "RESET_COUNTERS"); sales(); costs()
                          }.setNegativeButton("No", null).show()
                  }
                  val ap = getSharedPreferences("cofferno_agent", MODE_PRIVATE)
                  val et = findViewById<EditText>(R.id.et_agent_serial)
                  et.setText(IdUtil.normalize(ap.getString("custom_serial", "")).ifBlank {
                      IdUtil.normalize(ap.getString("levending_device_id", ""))
                  }.ifBlank { IdUtil.normalize(Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID)) })
                  findViewById<Button>(R.id.btn_save_agent_serial).setOnClickListener {
                      val s = IdUtil.normalize(et.text.toString()); ap.edit().putString("custom_serial", s).apply(); et.setText(s)
                  }
                  val sw = findViewById<SwitchMaterial>(R.id.switch_agent)
                  val st = findViewById<TextView>(R.id.tv_agent_status)
                  if (BuildConfig.IS_AGENT && !ap.contains("agent_active")) ap.edit().putBoolean("agent_active", true).apply()
                  sw.isChecked = ap.getBoolean("agent_active", BuildConfig.IS_AGENT)
                  sw.visibility = if (BuildConfig.IS_AGENT) View.VISIBLE else View.GONE
                  st.text = if (!BuildConfig.IS_AGENT) "No service on operator" else if (sw.isChecked) "ON" else "OFF"
                  sw.setOnCheckedChangeListener { _, on ->
                      ap.edit().putBoolean("agent_active", on).apply()
                      if (on) {
                          val i = Intent(this, AgentService::class.java)
                          if (Build.VERSION.SDK_INT >= 26) startForegroundService(i) else startService(i)
                          st.text = "ON"
                          if (BuildConfig.IS_AGENT) handler.postDelayed({ moveTaskToBack(true) }, 400)
                      } else { stopService(Intent(this, AgentService::class.java)); st.text = "OFF" }
                  }
                  if (BuildConfig.IS_AGENT && sw.isChecked) {
                      val i = Intent(this, AgentService::class.java)
                      if (Build.VERSION.SDK_INT >= 26) startForegroundService(i) else startService(i)
                  }
                  findViewById<Button>(R.id.btn_scan_coffeenet).setOnClickListener {
                      val tv = findViewById<TextView>(R.id.tv_coffeenet_logs)
                      tv.text = "..."
                      Executors.newSingleThreadExecutor().execute {
                          val r = LeVendingProbe.fullScan(this)
                          Telegram.send("Local scan\n$r")
                          runOnUiThread { tv.text = r }
                      }
                  }
                  Executors.newSingleThreadExecutor().execute {
                      val id = LeVendingProbe.findDeviceId(this)
                      runOnUiThread { findViewById<TextView>(R.id.tv_detected_device_id).text = id.ifBlank { "—" } }
                  }
                  if (!BuildConfig.IS_AGENT) reconnectMqtt()
                  handler.post(object : Runnable {
                      override fun run() {
                          val tv = findViewById<TextView>(R.id.tv_status)
                          if (BuildConfig.IS_AGENT) {
                              tv.text = if (Telegram.configured()) "Agent TG OK" else "Agent no TG secrets"
                              tv.setTextColor(col(R.color.green))
                          } else {
                              val m = getMachines()
                              val now = System.currentTimeMillis()
                              val on = m.count { now - (lastSeen[it] ?: 0L) < 20000L }
                              when {
                                  !mqttOk -> { tv.text = "MQTT..."; tv.setTextColor(col(R.color.yellow)) }
                                  m.isEmpty() -> { tv.text = "Add ID"; tv.setTextColor(col(R.color.muted)) }
                                  on == 0 -> { tv.text = "Offline 0/${m.size}"; tv.setTextColor(col(R.color.red)) }
                                  else -> { tv.text = "Online $on/${m.size}"; tv.setTextColor(col(R.color.green)) }
                              }
                          }
                          handler.postDelayed(this, 2000)
                      }
                  })
              }
              private fun migrateMachines() {
                  val raw = getSharedPreferences("cofferno_app", MODE_PRIVATE).getString("machines_list", "") ?: ""
                  val n = raw.split(",").map { IdUtil.normalize(it) }.filter { it.isNotBlank() }.distinct()
                  getSharedPreferences("cofferno_app", MODE_PRIVATE).edit().putString("machines_list", n.joinToString(",")).apply()
              }
              private fun reconnectMqtt() {
                  Executors.newSingleThreadExecutor().execute {
                      var bi = 0
                      val brokers = arrayOf(Constants.MQTT_BROKER, Constants.MQTT_BROKER_FALLBACK)
                      while (true) {
                          try {
                              if (mqtt?.isConnected != true) {
                                  try { mqtt?.disconnect(); mqtt?.close() } catch (_: Exception) {}
                                  val br = brokers[bi++ % brokers.size]
                                  mqtt = MqttClient(br, "Op" + UUID.randomUUID().toString().take(10), MemoryPersistence())
                                  mqtt!!.setCallback(object : MqttCallback {
                                      override fun connectionLost(c: Throwable?) { mqttOk = false }
                                      override fun messageArrived(topic: String?, message: MqttMessage?) {
                                          try {
                                              val t = topic ?: return
                                              val payload = String(message?.payload ?: ByteArray(0), Charsets.UTF_8)
                                              val sn = IdUtil.normalize(t.split("/").getOrNull(1) ?: return)
                                              if (t.endsWith("/logs")) runOnUiThread {
                                                  findViewById<TextView>(R.id.tv_remote_logs_output).text = payload
                                              } else if (t.endsWith("/data")) {
                                                  val p = gson.fromJson(payload, TelemetryPacket::class.java)
                                                  val id = IdUtil.normalize(p.serial)
                                                  packets[id] = p.copy(serial = id)
                                                  if (message?.isRetained != true) lastSeen[id] = System.currentTimeMillis()
                                                  runOnUiThread { sales(); costs() }
                                              }
                                          } catch (_: Exception) {}
                                      }
                                      override fun deliveryComplete(t: IMqttDeliveryToken?) {}
                                  })
                                  mqtt!!.connect(MqttConnectOptions().apply { isAutomaticReconnect = true; connectionTimeout = 20 })
                                  mqtt!!.subscribe("cofferno/+/data", 1)
                                  mqtt!!.subscribe("cofferno/+/logs", 1)
                                  mqttOk = true
                              }
                          } catch (_: Exception) { mqttOk = false }
                          Thread.sleep(4000)
                      }
                  }
              }
              private fun cmd(sn: String, c: String) {
                  val s = IdUtil.normalize(sn)
                  Executors.newSingleThreadExecutor().execute {
                      try {
                          mqtt?.takeIf { it.isConnected }?.publish("cofferno/$s/cmd", MqttMessage(c.toByteArray(Charsets.UTF_8)).apply { qos = 1 })
                      } catch (_: Exception) {}
                  }
              }
              private fun addMachine(raw: String) {
                  val s = IdUtil.normalize(raw); if (s.isEmpty()) return
                  val l = getMachines().toMutableList()
                  if (!l.contains(s)) {
                      l.add(s)
                      getSharedPreferences("cofferno_app", MODE_PRIVATE).edit().putString("machines_list", l.joinToString(",")).apply()
                  }
                  currentSerial = s; updateHeader(); chips(); selector()
              }
              private fun updateHeader() {
                  val m = getMachines()
                  findViewById<TextView>(R.id.tv_active_machine).text = when {
                      m.isEmpty() -> "no machines"
                      selectedFilter == "ALL" -> "all (${m.size})"
                      else -> "${name(selectedFilter)} ($selectedFilter)"
                  }
              }
              private fun chips() {
                  val c = findViewById<LinearLayout>(R.id.ll_filter_chips); c.removeAllViews()
                  val m = getMachines(); if (m.isEmpty()) return
                  fun chip(lab: String, sn: String) {
                      c.addView(Button(this).apply {
                          text = lab; textSize = 12f
                          setBackgroundColor(if (selectedFilter == sn) col(R.color.accent) else col(R.color.card))
                          setTextColor(if (selectedFilter == sn) col(R.color.dark) else col(R.color.white))
                          setOnClickListener {
                              selectedFilter = sn; if (sn != "ALL") currentSerial = sn
                              updateHeader(); chips(); selector(); sales()
                          }
                      })
                  }
                  chip("ALL", "ALL"); m.forEach { chip(name(it), it) }
              }
              private fun selector() {
                  val c = findViewById<LinearLayout>(R.id.ll_machine_selector); c.removeAllViews()
                  getMachines().forEach { sn ->
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      row.addView(Button(this).apply {
                          text = "${name(sn)} [$sn]"; textSize = 12f
                          layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                          setBackgroundColor(if (sn == currentSerial) col(R.color.accent) else col(R.color.card))
                          setTextColor(if (sn == currentSerial) col(R.color.dark) else col(R.color.white))
                          setOnClickListener { currentSerial = sn; selector() }
                      })
                      row.addView(Button(this).apply {
                          text = "X"; setBackgroundColor(col(R.color.red)); setTextColor(col(R.color.white))
                          setOnClickListener {
                              val l = getMachines().toMutableList().also { it.remove(sn) }
                              getSharedPreferences("cofferno_app", MODE_PRIVATE).edit().putString("machines_list", l.joinToString(",")).apply()
                              packets.remove(sn); lastSeen.remove(sn)
                              if (currentSerial == sn) currentSerial = getMachines().firstOrNull() ?: ""
                              updateHeader(); chips(); selector(); sales()
                          }
                      })
                      c.addView(row)
                  }
              }
              private fun sales() {
                  val dc = findViewById<LinearLayout>(R.id.ll_drinks_container); dc.removeAllViews()
                  val m = getMachines()
                  val pk = if (selectedFilter == "ALL") packets.filterKeys { m.contains(it) }.values else listOfNotNull(packets[selectedFilter])
                  var rev = 0; var prof = 0; var cups = 0
                  val map = linkedMapOf<String, MergedDrink>()
                  pk.forEach { p -> p.drinks.forEach { d ->
                      val cost = getCost(d.name)
                      val e = map[d.name]
                      if (e == null) map[d.name] = MergedDrink(d.name, d.count, d.price, cost) else e.count += d.count
                  }}
                  map.values.forEach { d ->
                      val r = d.count * d.price; val pr = d.count * (d.price - d.cost)
                      rev += r; prof += pr; cups += d.count
                      dc.addView(TextView(this).apply {
                          text = "${d.name} x${d.count} @${d.price} = $r (profit $pr)"
                          setTextColor(col(R.color.white)); setPadding(0, 10, 0, 10)
                      })
                  }
                  findViewById<TextView>(R.id.tv_total_revenue).text = "$rev"
                  findViewById<TextView>(R.id.tv_total_profit).text = "$prof profit"
                  findViewById<TextView>(R.id.tv_total_cups).text = "Cups: $cups"
              }
              private fun costs() {
                  val b = findViewById<LinearLayout>(R.id.ll_costs_container); b.removeAllViews()
                  val empty = findViewById<TextView>(R.id.tv_costs_empty)
                  val names = linkedSetOf<String>()
                  packets.values.forEach { p -> p.drinks.forEach { names.add(it.name) } }
                  empty.visibility = if (names.isEmpty()) View.VISIBLE else View.GONE
                  names.forEach { n ->
                      b.addView(EditText(this).apply {
                          hint = n; setText(getCost(n).toString()); tag = n
                          setTextColor(col(R.color.accent)); setHintTextColor(col(R.color.muted))
                      })
                  }
              }
              private fun saveCosts() {
                  val b = findViewById<LinearLayout>(R.id.ll_costs_container)
                  val ed = getSharedPreferences("cofferno_costs", MODE_PRIVATE).edit()
                  for (i in 0 until b.childCount) {
                      val et = b.getChildAt(i) as? EditText ?: continue
                      ed.putInt("cost_${et.tag}", et.text.toString().toIntOrNull() ?: 0)
                  }
                  ed.apply()
              }
              private fun getCost(n: String) = getSharedPreferences("cofferno_costs", MODE_PRIVATE).getInt("cost_$n", 0)
              private fun getMachines() =
                  (getSharedPreferences("cofferno_app", MODE_PRIVATE).getString("machines_list", "") ?: "")
                      .split(",").map { IdUtil.normalize(it) }.filter { it.isNotBlank() }.distinct()
              private fun name(s: String) =
                  getSharedPreferences("cofferno_names", MODE_PRIVATE).getString("name_$s", null) ?: "M $s"
          }
          EOF

          echo "OK role=$ROLE app=$APP_ID isAgent=$IS_AGENT"
          test -f app/build.gradle
          grep -n "IS_AGENT" app/build.gradle
          grep -n "applicationId" app/build.gradle

      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cofferno-${{ matrix.role }}-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Telegram APK
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ]; then
            echo "No secrets for send"; exit 0
          fi
          curl -s -X POST -F chat_id="$CHAT_ID" -F document=@"$APK" \
            -F caption="Cofferno 7.5.5 ${{ matrix.role }}" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" || true
