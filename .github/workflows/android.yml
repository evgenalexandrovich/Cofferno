name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Full Project
        run: |
          cat << 'ENDFILE' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          ENDFILE

          cat << 'ENDFILE' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LV307Telemetry"
          include ':app'
          ENDFILE

          cat << 'ENDFILE' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          ENDFILE

          mkdir -p app/src/main/java/com/coffee/telemetry
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'ENDFILE' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.coffee.telemetry'
              compileSdk 34
              defaultConfig {
                  applicationId "com.coffee.telemetry"
                  minSdk 21
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          ENDFILE

          cat << 'ENDFILE' > app/src/main/res/values/colors.xml
          <resources>
              <color name="coffee_primary">#6F4E37</color>
              <color name="coffee_dark">#3E2723</color>
              <color name="coffee_accent">#FF8F00</color>
              <color name="success">#2E7D32</color>
              <color name="error">#D32F2F</color>
              <color name="bg">#F5F0EB</color>
              <color name="card">#FFFFFF</color>
              <color name="text_main">#212121</color>
              <color name="text_sec">#757575</color>
          </resources>
          ENDFILE

          cat << 'ENDFILE' > app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="colorPrimary">@color/coffee_primary</item>
                  <item name="colorPrimaryDark">@color/coffee_dark</item>
                  <item name="colorAccent">@color/coffee_accent</item>
                  <item name="android:windowBackground">@color/bg</item>
              </style>
          </resources>
          ENDFILE

          cat << 'ENDFILE' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">LV307 Telemetry</string>
          </resources>
          ENDFILE

          cat << 'ENDFILE' > app/src/main/res/drawable/ic_coffee_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF"
                  android:pathData="M34,46 L34,74 C34,82 42,82 42,82 L62,82 C70,82 70,74 70,74 L70,46 Z"/>
              <path android:fillColor="#00000000"
                  android:strokeColor="#FFFFFF" android:strokeWidth="4"
                  android:pathData="M70,52 C84,52 84,62 84,62 C84,72 70,72 70,72"/>
              <path android:fillColor="#00000000"
                  android:strokeColor="#FFFFFF" android:strokeWidth="3"
                  android:pathData="M44,40 C46,32 44,24 44,24"/>
              <path android:fillColor="#00000000"
                  android:strokeColor="#FFFFFF" android:strokeWidth="3"
                  android:pathData="M52,38 C54,28 52,20 52,20"/>
              <path android:fillColor="#00000000"
                  android:strokeColor="#FFFFFF" android:strokeWidth="3"
                  android:pathData="M60,40 C62,32 60,24 60,24"/>
          </vector>
          ENDFILE

          cat << 'ENDFILE' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/coffee_primary"/>
              <foreground android:drawable="@drawable/ic_coffee_foreground"/>
          </adaptive-icon>
          ENDFILE

          cat << 'ENDFILE' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/coffee_primary"/>
              <foreground android:drawable="@drawable/ic_coffee_foreground"/>
          </adaptive-icon>
          ENDFILE

          cat << 'ENDFILE' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".LV307Service" android:enabled="true" android:exported="false"/>
                  <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter>
                  </receiver>
              </application>
          </manifest>
          ENDFILE

          cat << 'ENDFILE' > app/src/main/java/com/coffee/telemetry/DataLayer.kt
          package com.coffee.telemetry

          import android.content.Context
          import android.content.SharedPreferences
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken

          data class DrinkConfig(var name: String = "", var sellPrice: Int = 0, var costPrice: Int = 0)
          data class SaleRecord(var drink: String = "", var sellPrice: Int = 0, var costPrice: Int = 0, var ts: Long = 0L)
          data class MachineInfo(var serial: String = "", var isOnline: Boolean = false, var errorCode: String = "0", var errorMsg: String = "OK", var lastDrink: String = "—", var lastUpdate: String = "—")

          class Storage(ctx: Context) {
              private val sp: SharedPreferences = ctx.getSharedPreferences("lv307_data", Context.MODE_PRIVATE)
              private val gson = Gson()

              fun saveUser(login: String, pass: String) { sp.edit().putString("user_login", login).putString("user_pass", pass).apply() }
              fun getLogin(): String = sp.getString("user_login", "") ?: ""
              fun getPass(): String = sp.getString("user_pass", "") ?: ""
              fun isLoggedIn(): Boolean = getLogin().isNotEmpty()

              fun addMachine(serial: String) {
                  val list = getMachines().toMutableList()
                  if (!list.contains(serial)) { list.add(serial); sp.edit().putString("machines", gson.toJson(list)).apply() }
              }
              fun removeMachine(serial: String) {
                  val list = getMachines().toMutableList(); list.remove(serial)
                  sp.edit().putString("machines", gson.toJson(list)).apply()
              }
              fun getMachines(): List<String> {
                  val json = sp.getString("machines", "[]") ?: "[]"
                  return gson.fromJson(json, object : TypeToken<List<String>>(){}.type) ?: emptyList()
              }

              fun saveDrinks(serial: String, drinks: List<DrinkConfig>) { sp.edit().putString("drinks_$serial", gson.toJson(drinks)).apply() }
              fun getDrinks(serial: String): List<DrinkConfig> {
                  val json = sp.getString("drinks_$serial", "") ?: ""
                  if (json.isEmpty()) return defaultDrinks()
                  return gson.fromJson(json, object : TypeToken<List<DrinkConfig>>(){}.type) ?: defaultDrinks()
              }
              fun defaultDrinks(): List<DrinkConfig> = listOf(
                  DrinkConfig("Эспрессо", 120, 25), DrinkConfig("Американо", 130, 28),
                  DrinkConfig("Капучино", 160, 35), DrinkConfig("Латте", 170, 38),
                  DrinkConfig("Горячий шоколад", 150, 30), DrinkConfig("Чай", 100, 15)
              )

              fun addSale(serial: String, sale: SaleRecord) {
                  val list = getSales(serial).toMutableList(); list.add(sale)
                  sp.edit().putString("sales_$serial", gson.toJson(list)).apply()
              }
              fun getSales(serial: String): List<SaleRecord> {
                  val json = sp.getString("sales_$serial", "[]") ?: "[]"
                  return gson.fromJson(json, object : TypeToken<List<SaleRecord>>(){}.type) ?: emptyList()
              }
              fun clearSales(serial: String) { sp.edit().remove("sales_$serial").apply() }

              fun saveMachineInfo(serial: String, info: MachineInfo) { sp.edit().putString("info_$serial", gson.toJson(info)).apply() }
              fun getMachineInfo(serial: String): MachineInfo {
                  val json = sp.getString("info_$serial", "") ?: ""
                  return if (json.isEmpty()) MachineInfo(serial = serial) else gson.fromJson(json, MachineInfo::class.java)
              }
          }
          ENDFILE

          cat << 'ENDFILE' > app/src/main/java/com/coffee/telemetry/LV307Service.kt
          package com.coffee.telemetry

          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.IBinder
          import com.google.gson.Gson
          import org.eclipse.paho.client.mqttv3.*
          import org.eclipse.paho.client.mqttv3.persist.MemoryPersistence
          import java.text.SimpleDateFormat
          import java.util.*

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(ctx: Context?, intent: Intent?) {
                  if (intent?.action == Intent.ACTION_BOOT_COMPLETED)
                      ctx?.startService(Intent(ctx, LV307Service::class.java))
              }
          }

          class LV307Service : Service() {
              private var mqtt: MqttClient? = null
              private val gson = Gson()
              private var serial = "LV307_001"
              private var data = MachineInfo()

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  serial = intent?.getStringExtra("serial") ?: "LV307_001"
                  data.serial = serial
                  connectMqtt()
                  return START_STICKY
              }
              override fun onBind(i: Intent?): IBinder? = null

              private fun connectMqtt() {
                  Thread {
                      try {
                          mqtt = MqttClient("tcp://broker.hivemq.com:1883", "SVC_${serial}_${UUID.randomUUID().toString().take(5)}", MemoryPersistence())
                          mqtt?.setCallback(object : MqttCallbackExtended {
                              override fun connectComplete(r: Boolean, s: String?) {
                                  mqtt?.subscribe("vending/$serial/commands", 1)
                                  sendTelemetry()
                              }
                              override fun connectionLost(c: Throwable?) {}
                              override fun deliveryComplete(t: IMqttDeliveryToken?) {}
                              override fun messageArrived(topic: String?, msg: MqttMessage?) {
                                  handleCmd(gson.fromJson(String(msg?.payload ?: byteArrayOf()), RemoteCommand::class.java))
                              }
                          })
                          mqtt?.connect(MqttConnectOptions().apply { isAutomaticReconnect = true; isCleanSession = true })
                      } catch (e: Exception) { e.printStackTrace() }
                  }.start()
              }

              private fun handleCmd(cmd: RemoteCommand) {
                  when (cmd.action) {
                      "RESET_ERRORS" -> { data.errorCode = "0"; data.errorMsg = "OK" }
                      "REBOOT" -> try { Runtime.getRuntime().exec("reboot") } catch (_: Exception) {}
                      "SIM_SALE" -> { data.lastDrink = cmd.stringValue.ifEmpty { "Капучино" } }
                      "SIM_ERR" -> { data.errorCode = cmd.stringValue; data.errorMsg = "Ошибка ${cmd.stringValue}" }
                  }
                  sendTelemetry()
              }

              private fun sendTelemetry() {
                  data.isOnline = true
                  data.lastUpdate = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                  Thread {
                      try {
                          mqtt?.publish("vending/$serial/telemetry", MqttMessage(gson.toJson(data).toByteArray()).apply { qos = 1 })
                      } catch (_: Exception) {}
                  }.start()
              }
          }

          data class RemoteCommand(val action: String = "", val value: Int = 0, val stringValue: String = "")
          ENDFILE

          cat << 'ENDFILE' > app/src/main/java/com/coffee/telemetry/MainActivity.kt
          package com.coffee.telemetry

          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import com.google.gson.Gson
          import org.eclipse.paho.client.mqttv3.*
          import org.eclipse.paho.client.mqttv3.persist.MemoryPersistence
          import java.util.*

          class MainActivity : AppCompatActivity() {

              private lateinit var db: Storage
              private var mqtt: MqttClient? = null
              private val gson = Gson()
              private val C = object {
                  val primary = Color.parseColor("#6F4E37")
                  val dark = Color.parseColor("#3E2723")
                  val accent = Color.parseColor("#FF8F00")
                  val green = Color.parseColor("#2E7D32")
                  val red = Color.parseColor("#D32F2F")
                  val bg = Color.parseColor("#F5F0EB")
                  val card = Color.WHITE
                  val text = Color.parseColor("#212121")
                  val sec = Color.parseColor("#757575")
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  db = Storage(this)
                  if (db.isLoggedIn()) showRoleSelection() else showLogin()
              }

              // --- UI HELPERS ---
              private fun mkBtn(text: String, color: Int, onClick: () -> Unit): Button {
                  return Button(this).apply {
                      this.text = text; setTextColor(Color.WHITE)
                      background = GradientDrawable().apply { setColor(color); cornerRadius = 16f }
                      setPadding(32, 24, 32, 24); textSize = 15f
                      setOnClickListener { onClick() }
                  }
              }
              private fun mkCard(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(28, 24, 28, 24)
                      background = GradientDrawable().apply { setColor(C.card); cornerRadius = 20f }
                      elevation = 4f
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setMargins(0, 0, 0, 16) }
                  }
              }
              private fun mkLabel(text: String, size: Float = 13f, color: Int = C.sec, bold: Boolean = false): TextView {
                  return TextView(this).apply {
                      this.text = text; textSize = size; setTextColor(color)
                      if (bold) setTypeface(null, Typeface.BOLD)
                  }
              }
              private fun mkInput(hint: String, isPass: Boolean = false): EditText {
                  return EditText(this).apply {
                      this.hint = hint; setPadding(24, 20, 24, 20); textSize = 15f
                      background = GradientDrawable().apply { setColor(Color.parseColor("#EEEEEE")); cornerRadius = 12f }
                      if (isPass) inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setMargins(0, 0, 0, 16) }
                  }
              }
              private fun rootLayout(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(36, 48, 36, 36)
                      setBackgroundColor(C.bg)
                  }
              }

              // --- LOGIN ---
              private fun showLogin() {
                  val root = rootLayout()
                  root.addView(mkLabel("☕ LV307 TELEMETRY", 26f, C.dark, true).apply { gravity = Gravity.CENTER })
                  root.addView(mkLabel("Система мониторинга кофемашин", 14f, C.sec).apply { gravity = Gravity.CENTER; setPadding(0, 0, 0, 48) })
                  val login = mkInput("Логин")
                  val pass = mkInput("Пароль", true)
                  root.addView(login); root.addView(pass)
                  root.addView(mkBtn("ВОЙТИ", C.primary) {
                      if (login.text.toString() == db.getLogin() && pass.text.toString() == db.getPass()) showRoleSelection()
                      else Toast.makeText(this, "Неверный логин или пароль", Toast.LENGTH_SHORT).show()
                  })
                  root.addView(mkBtn("РЕГИСТРАЦИЯ", C.accent) {
                      if (login.text.isNotEmpty() && pass.text.isNotEmpty()) {
                          db.saveUser(login.text.toString(), pass.text.toString())
                          Toast.makeText(this, "Аккаунт создан!", Toast.LENGTH_SHORT).show()
                          showRoleSelection()
                      }
                  })
                  setContentView(root)
              }

              // --- ROLE SELECTION ---
              private fun showRoleSelection() {
                  val root = rootLayout()
                  root.addView(mkLabel("☕ LV307", 24f, C.dark, true).apply { gravity = Gravity.CENTER })
                  root.addView(mkLabel("Добро пожаловать, ${db.getLogin()}", 14f, C.sec).apply { gravity = Gravity.CENTER; setPadding(0, 0, 0, 40) })
                  root.addView(mkBtn("УСТАНОВИТЬ НА КОФЕМАШИНУ", C.dark) { showMachineSetup() })
                  root.addView(mkBtn("ОТКРЫТЬ ПУЛЬТ ОПЕРАТОРА", C.green) { showDashboard() })
                  root.addView(mkBtn("ВЫЙТИ", C.sec) { db.saveUser("", ""); showLogin() })
                  setContentView(root)
              }

              // --- MACHINE SETUP ---
              private fun showMachineSetup() {
                  val root = rootLayout()
                  root.addView(mkLabel("Установка на кофемашину", 20f, C.dark, true))
                  root.addView(mkLabel("Введите серийный номер автомата:", 14f, C.sec).apply { setPadding(0, 16, 0, 16) })
                  val serialInput = mkInput("Например: LV307-A1B2C3")
                  root.addView(serialInput)
                  root.addView(mkBtn("ЗАПУСТИТЬ СЕРВИС", C.primary) {
                      val s = serialInput.text.toString().trim()
                      if (s.isNotEmpty()) {
                          db.addMachine(s)
                          startService(Intent(this, LV307Service::class.java).putExtra("serial", s))
                          Toast.makeText(this, "Сервис запущен для $s", Toast.LENGTH_LONG).show()
                          finish()
                      }
                  })
                  root.addView(mkBtn("← НАЗАД", C.sec) { showRoleSelection() })
                  setContentView(root)
              }

              // --- DASHBOARD (список машин) ---
              private fun showDashboard() {
                  val scroll = ScrollView(this).apply { setBackgroundColor(C.bg) }
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(28, 40, 28, 28) }
                  scroll.addView(root)

                  root.addView(mkLabel("☕ Мои автоматы", 22f, C.dark, true))
                  root.addView(mkLabel("Нажмите на автомат для подробной статистики", 13f, C.sec).apply { setPadding(0, 4, 0, 24) })

                  val machines = db.getMachines()
                  if (machines.isEmpty()) {
                      root.addView(mkLabel("Нет добавленных автоматов.\nНажмите «+» чтобы добавить.", 15f, C.sec).apply { gravity = Gravity.CENTER; setPadding(0, 60, 0, 60) })
                  } else {
                      machines.forEach { serial ->
                          val info = db.getMachineInfo(serial)
                          val sales = db.getSales(serial)
                          val todayRev = sales.filter { isToday(it.ts) }.sumOf { it.sellPrice }
                          val todayProfit = sales.filter { isToday(it.ts) }.sumOf { it.sellPrice - it.costPrice }
                          val todayCups = sales.filter { isToday(it.ts) }.size

                          val card = mkCard()
                          val statusColor = if (info.errorCode != "0") C.red else if (info.isOnline) C.green else C.sec
                          val statusText = if (info.errorCode != "0") info.errorMsg else if (info.isOnline) "Онлайн" else "Офлайн"

                          card.addView(LinearLayout(this).apply {
                              orientation = LinearLayout.HORIZONTAL
                              addView(mkLabel(serial, 17f, C.dark, true).apply { layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f) })
                              addView(mkLabel("● $statusText", 13f, statusColor, true))
                          })
                          card.addView(mkLabel("Сегодня: $todayCups чашек | $todayRev ₽ | Прибыль: $todayProfit ₽", 13f, C.sec).apply { setPadding(0, 8, 0, 0) })
                          card.setOnClickListener { showMachineDetail(serial) }
                          root.addView(card)
                      }
                  }

                  root.addView(mkBtn("+ ДОБАВИТЬ АВТОМАТ", C.accent) {
                      val input = mkInput("Серийный номер автомата")
                      AlertDialog.Builder(this).setTitle("Новый автомат").setView(input)
                          .setPositiveButton("Добавить") { _, _ ->
                              val s = input.text.toString().trim()
                              if (s.isNotEmpty()) { db.addMachine(s); showDashboard() }
                          }.setNegativeButton("Отмена", null).show()
                  })
                  root.addView(mkBtn("← НАЗАД", C.sec) { showRoleSelection() })
                  setContentView(scroll)
                  connectMqttForDashboard(machines)
              }

              // --- MACHINE DETAIL (дашборд + статистика) ---
              private fun showMachineDetail(serial: String) {
                  val scroll = ScrollView(this).apply { setBackgroundColor(C.bg) }
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(28, 40, 28, 28) }
                  scroll.addView(root)

                  val info = db.getMachineInfo(serial)
                  val sales = db.getSales(serial)
                  val drinks = db.getDrinks(serial)

                  val todaySales = sales.filter { isToday(it.ts) }
                  val weekSales = sales.filter { isThisWeek(it.ts) }
                  val monthSales = sales.filter { isThisMonth(it.ts) }

                  fun calcStats(list: List<SaleRecord>): Triple<Int, Int, Int> {
                      val rev = list.sumOf { it.sellPrice }
                      val profit = list.sumOf { it.sellPrice - it.costPrice }
                      return Triple(list.size, rev, profit)
                  }

                  val (tCups, tRev, tProfit) = calcStats(todaySales)
                  val (wCups, wRev, wProfit) = calcStats(weekSales)
                  val (mCups, mRev, mProfit) = calcStats(monthSales)

                  // Header
                  val statusColor = if (info.errorCode != "0") C.red else C.green
                  root.addView(mkLabel(serial, 22f, C.dark, true))
                  root.addView(mkLabel(if (info.errorCode != "0") "⚠ ${info.errorMsg}" else "● Онлайн — работает штатно", 14f, statusColor, true).apply { setPadding(0, 4, 0, 24) })

                  // Stats cards
                  fun addStatCard(title: String, cups: Int, rev: Int, profit: Int) {
                      val card = mkCard()
                      card.addView(mkLabel(title, 14f, C.primary, true))
                      card.addView(LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL; setPadding(0, 12, 0, 0)
                          addView(LinearLayout(this@MainActivity).apply {
                              orientation = LinearLayout.VERTICAL; layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                              addView(mkLabel("$cups", 22f, C.dark, true).apply { gravity = Gravity.CENTER })
                              addView(mkLabel("чашек", 11f, C.sec).apply { gravity = Gravity.CENTER })
                          })
                          addView(LinearLayout(this@MainActivity).apply {
                              orientation = LinearLayout.VERTICAL; layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                              addView(mkLabel("$rev ₽", 22f, C.dark, true).apply { gravity = Gravity.CENTER })
                              addView(mkLabel("выручка", 11f, C.sec).apply { gravity = Gravity.CENTER })
                          })
                          addView(LinearLayout(this@MainActivity).apply {
                              orientation = LinearLayout.VERTICAL; layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                              addView(mkLabel("$profit ₽", 22f, C.green, true).apply { gravity = Gravity.CENTER })
                              addView(mkLabel("прибыль", 11f, C.sec).apply { gravity = Gravity.CENTER })
                          })
                      })
                      root.addView(card)
                  }

                  addStatCard("СЕГОДНЯ", tCups, tRev, tProfit)
                  addStatCard("ЭТА НЕДЕЛЯ", wCups, wRev, wProfit)
                  addStatCard("ЭТОТ МЕСЯЦ", mCups, mRev, mProfit)

                  // Drink breakdown
                  root.addView(mkLabel("РАЗБИВКА ПО НАПИТКАМ (сегодня)", 14f, C.primary, true).apply { setPadding(0, 16, 0, 8) })
                  val drinkStats = todaySales.groupBy { it.drink }
                  if (drinkStats.isEmpty()) {
                      root.addView(mkLabel("Продаж пока нет", 13f, C.sec))
                  } else {
                      val card = mkCard()
                      drinkStats.forEach { (name, list) ->
                          val cnt = list.size
                          val rev = list.sumOf { it.sellPrice }
                          val prof = list.sumOf { it.sellPrice - it.costPrice }
                          card.addView(mkLabel("$name: $cnt шт | $rev ₽ | +$prof ₽", 13f, C.text))
                      }
                      root.addView(card)
                  }

                  // Buttons
                  root.addView(mkBtn("СБРОСИТЬ ОШИБКИ", C.primary) { sendCmd(serial, RemoteCommand("RESET_ERRORS")); Toast.makeText(this, "Команда отправлена", Toast.LENGTH_SHORT).show() })
                  root.addView(mkBtn("ПЕРЕЗАГРУЗИТЬ АВТОМАТ", C.red) { sendCmd(serial, RemoteCommand("REBOOT")); Toast.makeText(this, "Перезагрузка...", Toast.LENGTH_SHORT).show() })
                  root.addView(mkBtn("НАСТРОЙКА НАПИТКОВ И ЦЕН", C.accent) { showDrinkSettings(serial) })

                  // Sim buttons
                  root.addView(mkLabel("СИМУЛЯЦИЯ (для теста)", 12f, C.sec).apply { setPadding(0, 24, 0, 8) })
                  root.addView(mkBtn("Имитировать продажу", C.green) {
                      val d = drinks.random()
                      val sale = SaleRecord(d.name, d.sellPrice, d.costPrice, System.currentTimeMillis())
                      db.addSale(serial, sale)
                      sendCmd(serial, RemoteCommand("SIM_SALE", stringValue = d.name))
                      showMachineDetail(serial)
                  })
                  root.addView(mkBtn("Имитировать ошибку E01", C.red) { sendCmd(serial, RemoteCommand("SIM_ERR", stringValue = "E01")) })

                  root.addView(mkBtn("УДАЛИТЬ АВТОМАТ", Color.GRAY) {
                      AlertDialog.Builder(this).setTitle("Удалить $serial?").setMessage("Все данные будут удалены.")
                          .setPositiveButton("Удалить") { _, _ -> db.removeMachine(serial); showDashboard() }
                          .setNegativeButton("Отмена", null).show()
                  })
                  root.addView(mkBtn("← К СПИСКУ", C.sec) { showDashboard() })
                  setContentView(scroll)
              }

              // --- DRINK SETTINGS ---
              private fun showDrinkSettings(serial: String) {
                  val scroll = ScrollView(this).apply { setBackgroundColor(C.bg) }
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(28, 40, 28, 28) }
                  scroll.addView(root)

                  root.addView(mkLabel("Напитки: $serial", 20f, C.dark, true))
                  root.addView(mkLabel("Укажите цену продажи и себестоимость", 13f, C.sec).apply { setPadding(0, 4, 0, 20) })

                  val drinks = db.getDrinks(serial).toMutableList()
                  val priceInputs = mutableListOf<EditText>()
                  val costInputs = mutableListOf<EditText>()

                  drinks.forEach { d ->
                      val card = mkCard()
                      card.addView(mkLabel(d.name, 15f, C.dark, true))
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(0, 8, 0, 0) }
                      val pIn = EditText(this).apply {
                          hint = "Цена"; setText(d.sellPrice.toString()); inputType = InputType.TYPE_CLASS_NUMBER
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply { setMargins(0, 0, 8, 0) }
                      }
                      val cIn = EditText(this).apply {
                          hint = "Себест."; setText(d.costPrice.toString()); inputType = InputType.TYPE_CLASS_NUMBER
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      }
                      row.addView(pIn); row.addView(cIn)
                      card.addView(row)
                      root.addView(card)
                      priceInputs.add(pIn); costInputs.add(cIn)
                  }

                  root.addView(mkBtn("СОХРАНИТЬ", C.green) {
                      drinks.forEachIndexed { i, d ->
                          d.sellPrice = priceInputs[i].text.toString().toIntOrNull() ?: d.sellPrice
                          d.costPrice = costInputs[i].text.toString().toIntOrNull() ?: d.costPrice
                      }
                      db.saveDrinks(serial, drinks)
                      Toast.makeText(this, "Цены сохранены!", Toast.LENGTH_SHORT).show()
                      showMachineDetail(serial)
                  })
                  root.addView(mkBtn("← НАЗАД", C.sec) { showMachineDetail(serial) })
                  setContentView(scroll)
              }

